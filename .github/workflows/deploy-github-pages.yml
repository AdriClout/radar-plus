name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # (2026-08-30) L'étape « Inject public report token » a été retirée :
      # elle publiait le secret RADAR_REPORT_DISPATCH_TOKEN en clair dans
      # shared-menu.js sur radarplus.org. Le signalement passe désormais par
      # le Worker proxy (workers/report-issue/), sans secret côté client.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # L'API Pages retourne parfois « Deployment failed, try again later » de
      # façon transitoire (observé le 2026-07-02 : ~50 % des deploys, échec
      # serveur en ~15 s). On tente jusqu'à 3 fois avant de déclarer l'échec.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause avant 2e tentative
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (2e tentative)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause avant 3e tentative
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (3e tentative)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Vérifier qu'une tentative de deploy a réussi
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" != "success" ] \
             && [ "${{ steps.deployment_retry1.outcome }}" != "success" ] \
             && [ "${{ steps.deployment_retry2.outcome }}" != "success" ]; then
            echo "::error::Aucune tentative de déploiement Pages n'a réussi."
            exit 1
          fi

      - name: Alerte Slack en cas d'échec
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL absent — échec non notifié (ajouter le secret pour activer les alertes)"
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' --data \
            "{\"text\":\":rotating_light: radar-plus — échec de \`${{ github.workflow }}\` : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
