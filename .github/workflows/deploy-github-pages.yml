name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RADAR_REPORT_DISPATCH_TOKEN: ${{ secrets.RADAR_REPORT_DISPATCH_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Inject public report token in built assets
        shell: bash
        run: |
          if [ -z "${RADAR_REPORT_DISPATCH_TOKEN}" ]; then
            echo "RADAR_REPORT_DISPATCH_TOKEN not set; report submit stays offline"
            exit 0
          fi

          node - <<'NODE'
          const fs = require('fs');
          const path = 'site/assets/js/shared-menu.js';
          const placeholder = '__RADAR_REPORT_DISPATCH_TOKEN__';
          const token = process.env.RADAR_REPORT_DISPATCH_TOKEN || '';
          if (!token) process.exit(0);

          const src = fs.readFileSync(path, 'utf8');
          if (!src.includes(placeholder)) {
            throw new Error('Placeholder not found in shared-menu.js');
          }

          const out = src.replace(placeholder, token);
          fs.writeFileSync(path, out, 'utf8');
          console.log('Report token injected in shared-menu.js');
          NODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # L'API Pages retourne parfois « Deployment failed, try again later » de
      # façon transitoire (observé le 2026-07-02 : ~50 % des deploys, échec
      # serveur en ~15 s). On tente jusqu'à 3 fois avant de déclarer l'échec.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause avant 2e tentative
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (2e tentative)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause avant 3e tentative
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (3e tentative)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Vérifier qu'une tentative de deploy a réussi
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" != "success" ] \
             && [ "${{ steps.deployment_retry1.outcome }}" != "success" ] \
             && [ "${{ steps.deployment_retry2.outcome }}" != "success" ]; then
            echo "::error::Aucune tentative de déploiement Pages n'a réussi."
            exit 1
          fi
