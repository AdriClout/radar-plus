name: Refresh News Ticker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-ticker
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-ticker-v1-${{ hashFiles('pipeline/build_ticker.R') }}
          restore-keys: r-ticker-v1-

      - name: Install R packages
        run: |
          install.packages(
            c("jsonlite", "dplyr", "purrr", "readr"),
            repos = "https://cloud.r-project.org",
            INSTALL_opts = c("--no-help", "--no-html", "--no-docs")
          )
        shell: Rscript {0}

      - name: Fetch ticker source data (Athena)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          AWS_DEFAULT_REGION: ca-central-1
        run: |
          pip install boto3 --quiet
          python3 pipeline/fetch_ticker_data.py

      - name: Build ticker.json
        run: Rscript pipeline/build_ticker.R

      - name: Vérifier les JSON produits
        run: |
          set -euo pipefail
          for f in ticker; do
            test -s "site/${f}.json"
            jq -e '.meta.generated_at' "site/${f}.json" >/dev/null
          done

      # Les JSON générés ne vivent plus dans git (chantier 5, #52) : ils sont
      # publiés dans le bucket R2 « radar-plus-data » et le site les lit à
      # l'adresse RADAR_DATA_BASE (site/assets/js/config.js). Aucun commit,
      # aucun déploiement : rafraîchir les données ne touche pas au code.
      - name: Publier les JSON dans R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in ticker; do
            npx --yes wrangler@4 r2 object put "radar-plus-data/${f}.json" \
              --file "site/${f}.json" \
              --content-type application/json \
              --cache-control "public, max-age=60" \
              --remote
          done

      - name: Validate live ticker is updated
        env:
          RADAR_DATA_BASE: https://pub-c15b38c656dc4ffdb6048d644e6e6d16.r2.dev
        run: |
          set -euo pipefail
          # Collation bytewise déterministe pour la comparaison lexicale ISO 8601 (revue Copilot)
          export LC_ALL=C
          expected_ticker="$(jq -r '.meta.generated_at' site/ticker.json)"
          echo "Expected ticker.json meta.generated_at: ${expected_ticker}"

          for attempt in $(seq 1 30); do
            live_ticker="$(curl -fsS --connect-timeout 5 --max-time 15 "${RADAR_DATA_BASE}/ticker.json?v=${attempt}-$(date +%s)" | jq -r '.meta.generated_at // empty' || true)"
            echo "Attempt ${attempt}/30 -> ticker: ${live_ticker:-<indisponible>}"
            # Un run concurrent peut avoir publié une version PLUS RÉCENTE : live >= attendu suffit
            # (comparaison lexicale ISO 8601). Le ?v= contourne le cache CDN.
            if [ -n "${live_ticker}" ] && [ ! "${live_ticker}" \< "${expected_ticker}" ]; then
              echo "Live ticker is in sync (>= expected)."
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for ${RADAR_DATA_BASE} to serve refreshed ticker.json"
          exit 1
