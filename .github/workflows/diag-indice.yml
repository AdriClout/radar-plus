name: Diagnostic indice spec v1 (lecture seule)

# Lance à la main. Lit le datamart DEV, imprime le diagnostic dans le journal.
# Ne commite rien, ne déploie rien. Refs #48.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          install.packages(c("dplyr", "readr"), repos = "https://cloud.r-project.org",
                           INSTALL_opts = c("--no-help", "--no-html", "--no-docs"))
        shell: Rscript {0}

      - name: Fetch Athena data (DEV, Python boto3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          AWS_DEFAULT_REGION: ca-central-1
        run: |
          pip install boto3 --quiet
          python3 pipeline/fetch_data.py

      - name: Diagnostic
        run: Rscript pipeline/diag_indice.R
