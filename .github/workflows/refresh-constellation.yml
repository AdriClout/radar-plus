name: Refresh Constellation Data

on:
  schedule:
    # Les raffineurs RADAR_SALIENT_INDEX (:42) et RADAR_HEADLINE_OF_HEADLINES (:46) tournent
    # à minuit, 4h, 8h, 12h, 16h, 20h heure locale Montréal (DST géré par EventBridge).
    # Les datamarts étant prêts avant, on déclenche à :00 pour ces mêmes heures.
    #   Été  EDT (UTC-4) : minuit/4h/8h/12h/16h/20h Mtl → 04:00/08:00/12:00/16:00/20:00/00:00 UTC
    #   Hiver EST (UTC-5) : minuit/4h/8h/12h/16h/20h Mtl → 05:00/09:00/13:00/17:00/21:00/01:00 UTC
    # En dehors de la bonne saison, le run trouve des données déjà à jour → pas de commit → exit rapide.
    - cron: '0 4,8,12,16,20,0 * * *'  # EDT (été, UTC-4)
    - cron: '0 5,9,13,17,21,1 * * *'  # EST (hiver, UTC-5)
  workflow_dispatch:

concurrency:
  group: refresh-constellation
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Validate GH_PAT secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret is missing or empty. Push will fail due to branch protection."
            exit 1
          fi
          echo "GH_PAT secret is set."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-constellation-v3-${{ hashFiles('pipeline/build_data.R', 'pipeline/build_events.R') }}
          restore-keys: r-constellation-v3-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev jq

      - name: Install R packages
        run: |
          install.packages(
            c("jsonlite", "dplyr", "purrr", "tidyr", "stringr", "readr", "igraph"),
            repos = "https://cloud.r-project.org",
            INSTALL_opts = c("--no-help", "--no-html", "--no-docs")
          )
        shell: Rscript {0}

      - name: Fetch Athena data (Python boto3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          AWS_DEFAULT_REGION: ca-central-1
        run: |
          pip install boto3 --quiet
          python3 pipeline/fetch_data.py

      - name: Build constellation data (R)
        run: Rscript pipeline/build_data.R

      - name: Build events data (R)
        run: Rscript pipeline/build_events.R

      - name: Build classement index (Python)
        run: python3 pipeline/build_classement.py

      - name: Contrôle de schéma des JSON générés
        run: python3 pipeline/check_schema.py site/graph.json site/timeseries.json site/articles.json site/monitor_input.json site/events.json site/classement.json

      - name: Commit & push updated data
        id: commit_data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git add site/graph.json site/timeseries.json site/articles.json site/monitor_input.json site/events.json site/classement.json
          if git diff --staged --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh constellation data"
            git pull --rebase origin main
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      # NOTE : pas de déclenchement explicite du deploy ici. Le push (fait avec GH_PAT,
      # donc déclencheur de workflows) active déjà deploy-github-pages.yml via son
      # trigger `on: push` (paths site/**). Un dispatch explicite créerait un run
      # jumeau qui se fait canceller (concurrency github-pages) et provoque des
      # échecs « Deployment failed, try again later ». Si un jour le push repasse
      # sur GITHUB_TOKEN (qui ne déclenche pas de workflows), rétablir le dispatch.

      - name: Validate live site is updated
        if: steps.commit_data.outputs.updated == 'true'
        run: |
          set -euo pipefail

          # Collation bytewise déterministe pour la comparaison lexicale ISO 8601 (revue Copilot)
          export LC_ALL=C

          expected_graph="$(jq -r '.meta.generated_at' site/graph.json)"
          expected_timeseries="$(jq -r '.meta.generated_at' site/timeseries.json)"

          echo "Expected graph.json meta.generated_at: ${expected_graph}"
          echo "Expected timeseries.json meta.generated_at: ${expected_timeseries}"

          for attempt in $(seq 1 30); do
            live_graph="$(curl -fsS --connect-timeout 5 --max-time 15 https://radarplus.org/graph.json | jq -r '.meta.generated_at // empty' || true)"
            live_timeseries="$(curl -fsS --connect-timeout 5 --max-time 15 https://radarplus.org/timeseries.json | jq -r '.meta.generated_at // empty' || true)"

            echo "Attempt ${attempt}/30 -> graph: ${live_graph:-<indisponible>} | timeseries: ${live_timeseries:-<indisponible>}"

            # Un déploiement Pages concurrent (cancel-in-progress) peut servir une version
            # PLUS RÉCENTE que la nôtre : live >= attendu suffit (comparaison lexicale ISO 8601).
            if [ -n "${live_graph}" ] && [ ! "${live_graph}" \< "${expected_graph}" ] \
               && [ -n "${live_timeseries}" ] && [ ! "${live_timeseries}" \< "${expected_timeseries}" ]; then
              echo "Live site data is in sync (>= expected)."
              exit 0
            fi

            sleep 20
          done

          echo "Timed out waiting for radarplus.org to serve the refreshed JSON files."
          exit 1

      - name: Alerte Slack en cas d'échec
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL absent — échec non notifié (ajouter le secret pour activer les alertes)"
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' --data \
            "{\"text\":\":rotating_light: radar-plus — échec de \`${{ github.workflow }}\` : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
