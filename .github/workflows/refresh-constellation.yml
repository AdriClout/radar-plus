name: Refresh Constellation Data

on:
  schedule:
    # Les raffineurs RADAR_SALIENT_INDEX (:42) et RADAR_HEADLINE_OF_HEADLINES (:46) tournent
    # à minuit, 4h, 8h, 12h, 16h, 20h heure locale Montréal (DST géré par EventBridge).
    # Les datamarts étant prêts avant, on déclenche à :00 pour ces mêmes heures.
    #   Été  EDT (UTC-4) : minuit/4h/8h/12h/16h/20h Mtl → 04:00/08:00/12:00/16:00/20:00/00:00 UTC
    #   Hiver EST (UTC-5) : minuit/4h/8h/12h/16h/20h Mtl → 05:00/09:00/13:00/17:00/21:00/01:00 UTC
    # En dehors de la bonne saison, le run trouve des données déjà à jour → pas de commit → exit rapide.
    - cron: '0 4,8,12,16,20,0 * * *'  # EDT (été, UTC-4)
    - cron: '0 5,9,13,17,21,1 * * *'  # EST (hiver, UTC-5)
  workflow_dispatch:

concurrency:
  group: refresh-constellation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    # Image épinglée : les paquets R compilés sont mis en cache, et un changement
    # d'image (ubuntu-latest a bougé le 24 oct. 2026) casse les binaires (stringi
    # cherchait libicui18n.so.74). La clé de cache porte aussi l'empreinte de l'image.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Empreinte de l'image du runner (pour la clé de cache)
        id: img
        run: |
          icu="$(find /usr/lib/x86_64-linux-gnu -maxdepth 1 -name 'libicui18n.so.*' 2>/dev/null | sort | head -1 | sed 's/.*so\.//')"
          echo "id=$(lsb_release -rs)-icu${icu:-none}-R4.4" >> "$GITHUB_OUTPUT"
          echo "Empreinte : $(lsb_release -rs)-icu${icu:-none}-R4.4"

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-constellation-v4-${{ steps.img.outputs.id }}-${{ hashFiles('pipeline/build_data.R') }}
          restore-keys: r-constellation-v4-${{ steps.img.outputs.id }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev jq

      - name: Install R packages
        run: |
          install.packages(
            c("jsonlite", "dplyr", "purrr", "tidyr", "stringr", "readr", "igraph"),
            repos = "https://cloud.r-project.org",
            INSTALL_opts = c("--no-help", "--no-html", "--no-docs")
          )
        shell: Rscript {0}

      - name: Fetch Athena data (Python boto3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          AWS_DEFAULT_REGION: ca-central-1
        run: |
          pip install boto3 --quiet
          python3 pipeline/fetch_data.py

      - name: Build constellation data (R)
        run: Rscript pipeline/build_data.R

      - name: Vérifier les JSON produits
        run: |
          set -euo pipefail
          for f in graph timeseries articles monitor_input; do
            test -s "site/${f}.json"
            jq -e '.meta.generated_at' "site/${f}.json" >/dev/null
          done

      # Les JSON générés ne vivent plus dans git (chantier 5, #52) : ils sont
      # publiés dans le bucket R2 « radar-plus-data » et le site les lit à
      # l'adresse RADAR_DATA_BASE (site/assets/js/config.js). Aucun commit,
      # aucun déploiement : rafraîchir les données ne touche pas au code.
      - name: Publier les JSON dans R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in graph timeseries articles monitor_input; do
            npx --yes wrangler@4 r2 object put "radar-plus-data/${f}.json" \
              --file "site/${f}.json" \
              --content-type application/json \
              --cache-control "public, max-age=300" \
              --remote
          done

      # Sorties v2 découpées (chantier 7, #59) : synchronisation des fichiers
      # modifiés seulement, via l'API S3 de R2. Sautée tant que les secrets
      # R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY ne sont pas posés.
      - name: Publier les sorties v2 dans R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "::warning::Secrets R2 absents : sorties v2 non publiées"
            exit 0
          fi
          python3 pipeline/publish_r2.py pipeline/out_r2 --prefix ""

      - name: Archiver les sorties v2 (lancement manuel seulement)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: out_r2
          path: pipeline/out_r2
          retention-days: 3

      - name: Validate live site is updated
        env:
          RADAR_DATA_BASE: https://data.radarplus.org
        run: |
          set -euo pipefail

          # Collation bytewise déterministe pour la comparaison lexicale ISO 8601 (revue Copilot)
          export LC_ALL=C

          expected_graph="$(jq -r '.meta.generated_at' site/graph.json)"
          expected_timeseries="$(jq -r '.meta.generated_at' site/timeseries.json)"

          echo "Expected graph.json meta.generated_at: ${expected_graph}"
          echo "Expected timeseries.json meta.generated_at: ${expected_timeseries}"

          for attempt in $(seq 1 30); do
            live_graph="$(curl -fsS --connect-timeout 5 --max-time 15 "${RADAR_DATA_BASE}/graph.json?v=${attempt}-$(date +%s)" | jq -r '.meta.generated_at // empty' || true)"
            live_timeseries="$(curl -fsS --connect-timeout 5 --max-time 15 "${RADAR_DATA_BASE}/timeseries.json?v=${attempt}-$(date +%s)" | jq -r '.meta.generated_at // empty' || true)"

            echo "Attempt ${attempt}/30 -> graph: ${live_graph:-<indisponible>} | timeseries: ${live_timeseries:-<indisponible>}"

            # Un run concurrent peut avoir publié une version PLUS RÉCENTE : live >= attendu suffit
            # (comparaison lexicale ISO 8601). Le ?v= contourne le cache CDN.
            if [ -n "${live_graph}" ] && [ ! "${live_graph}" \< "${expected_graph}" ] \
               && [ -n "${live_timeseries}" ] && [ ! "${live_timeseries}" \< "${expected_timeseries}" ]; then
              echo "Live site data is in sync (>= expected)."
              exit 0
            fi

            sleep 20
          done

          echo "Timed out waiting for ${RADAR_DATA_BASE} to serve the refreshed JSON files."
          exit 1
