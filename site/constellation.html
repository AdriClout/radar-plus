<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Constellation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/shared-menu.css" />
  <link rel="stylesheet" href="./assets/css/shared-ticker.css" />
  <script src="./assets/js/force-graph.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #00000f; font-family: 'Space Mono', 'SF Mono', monospace; overflow: hidden; height: 100vh; width: 100vw; }
    #constellation-bg {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 40%, rgba(62,98,198,0.17), rgba(5,10,36,0.05) 52%, rgba(0,0,15,0) 72%);
    }
    #constellation-bg::before,
    #constellation-bg::after {
      content: ''; position: absolute; inset: 0;
    }
    #constellation-bg::before {
      background-image:
        radial-gradient(circle at 12% 18%, rgba(170,200,255,0.34) 0 1.2px, transparent 1.4px),
        radial-gradient(circle at 28% 42%, rgba(150,188,255,0.28) 0 1px, transparent 1.2px),
        radial-gradient(circle at 62% 26%, rgba(160,196,255,0.3) 0 1px, transparent 1.2px),
        radial-gradient(circle at 79% 38%, rgba(140,180,255,0.26) 0 1px, transparent 1.2px),
        radial-gradient(circle at 38% 74%, rgba(170,205,255,0.24) 0 0.9px, transparent 1.1px),
        radial-gradient(circle at 86% 76%, rgba(170,205,255,0.2) 0 0.8px, transparent 1px);
      opacity: 0.55;
    }
    #constellation-bg::after {
      background: repeating-radial-gradient(circle at 50% 52%, rgba(85,135,255,0.12) 0 1px, rgba(85,135,255,0) 1px 11px);
      opacity: 0.34;
    }
    #graph { position: absolute; inset: 0; z-index: 1; }
    /* ========== PANNEAU GAUCHE (calque sur evolution.html) ========== */
    #left-panel {
      position: absolute; top: 0; left: 0; bottom: calc(var(--ticker-height, 44px) + 12px);
      width: 280px;
      display: flex; flex-direction: column; gap: 0;
      padding: 18px 14px 14px;
      background: linear-gradient(to right, rgba(0,0,15,0.96) 80%, transparent);
      z-index: 20; pointer-events: all;
      overflow: hidden;
    }
    #cst-titlebar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 22px;
    }
    #cst-logo {
      flex: 0 0 auto;
      display: inline-flex; align-items: center;
      width: 36px; height: 36px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    #cst-logo:hover { transform: scale(1.06); }
    #cst-logo:focus-visible { outline: 2px solid rgba(120,170,255,0.6); outline-offset: 3px; border-radius: 4px; }
    #cst-logo svg { width: 100%; height: 100%; display: block; }
    #cst-logo .rp-r { fill: rgba(195, 220, 255, 0.92); }
    #cst-logo .rp-plus { fill: #dde64a; animation: rpPulse 1.6s ease-in-out infinite; transform-origin: 70% 30%; }
    @keyframes rpPulse {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px rgba(221,230,74,0.55)); }
      50%      { opacity: 0.45; filter: drop-shadow(0 0 1px rgba(221,230,74,0.10)); }
    }
    #cst-title {
      font-family: 'Orbitron', 'Space Mono', monospace;
      font-size: 16px;
      letter-spacing: 2.5px;
      color: rgba(195, 220, 255, 0.92);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(90,140,255,0.36), 0 0 26px rgba(70,110,230,0.22);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
    }
    .lpanel-section {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 14px;
    }
    .lpanel-section#top10-section { flex: 1; min-height: 0; overflow: hidden; }
    .lpanel-label {
      font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase;
      color: rgba(100,140,200,0.45); padding-left: 1px;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    #country-tabs { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: all; }
    #mode-tabs { display: flex; gap: 4px; flex-wrap: wrap; pointer-events: all; }
    .tab {
      padding: 5px 14px; border: 1px solid rgba(100,150,255,0.3); border-radius: 3px;
      background: rgba(10,20,50,0.6); color: #7090c0; font-size: 11px;
      letter-spacing: 1.5px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .tab:hover  { border-color: rgba(100,150,255,0.7); color: #a0c0ff; }
    .tab.active { background: rgba(40,80,180,0.4); border-color: rgba(120,180,255,0.8); color: #d0e8ff; box-shadow: 0 0 12px rgba(80,130,255,0.3); }
    #tooltip {
      position: absolute; pointer-events: none;
      background: rgba(2,4,20,0.96); border: 1px solid rgba(80,120,255,0.35);
      border-radius: 4px; padding: 10px 14px; font-size: 12px; line-height: 1.6;
      display: none; z-index: 20; max-width: 220px;
    }
    #tooltip .n { color: #e8f4ff; font-weight: bold; font-size: 13px; }
    #tooltip .s { color: #6090e0; }
    #tooltip .m { color: #408060; }
    #controls {
      position: absolute; bottom: calc(var(--ticker-height, 44px) + 4px); left: 280px; right: 0;
      padding: 16px 24px 20px;
      background: linear-gradient(to top, rgba(0,0,15,0.96) 70%, transparent);
      z-index: 10;
    }
    #period-label { text-align: center; font-size: 13px; letter-spacing: 1px; color: #506080; margin-bottom: 10px; }
    #period-label span { color: #90b8e8; }
    #slider-row { display: flex; align-items: center; gap: 14px; }
    #play-btn {
      background: none; border: 1px solid rgba(100,150,255,0.35); border-radius: 3px;
      color: #6080a0; font-size: 14px; padding: 4px 10px; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    #play-btn:hover  { border-color: rgba(120,180,255,0.8); color: #b0d0ff; }
    #play-btn.playing { color: #ff8080; border-color: rgba(255,100,100,0.5); }
    #timeline {
      flex: 1; -webkit-appearance: none; height: 2px;
      background: linear-gradient(to right, rgba(60,100,200,0.6), rgba(100,60,200,0.6));
      outline: none; border-radius: 2px; cursor: pointer;
    }
    #timeline::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: #7090ff; box-shadow: 0 0 10px rgba(80,120,255,1), 0 0 20px rgba(80,120,255,0.5); cursor: pointer;
    }
    #speed-btn {
      background: none; border: 1px solid rgba(100,150,255,0.2); border-radius: 3px;
      color: #405060; font-size: 10px; padding: 4px 8px; cursor: pointer; flex-shrink: 0; transition: all 0.2s;
    }
    #speed-btn:hover { color: #7090b0; }
    #top10-country {
      font-family: 'Orbitron', 'Space Mono', monospace;
      font-size: 11px;
      color: rgba(200, 224, 255, 0.85);
      letter-spacing: 1.4px;
    }
    #top10-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    /* ── Période (calque sur evolution.html) ── */
    #window-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .win-btn {
      flex: 1 1 calc(50% - 2px);
      min-width: 0;
      padding: 5px 10px;
      border: 1px solid rgba(100,150,255,0.25);
      border-radius: 3px;
      background: rgba(10,20,50,0.5);
      color: rgba(140,180,220,0.85);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.2px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      text-align: center;
    }
    .win-btn:hover  { border-color: rgba(120,170,255,0.55); color: rgba(180,210,255,0.95); }
    .win-btn.active { border-color: rgba(120,180,255,0.75); background: rgba(30,60,150,0.40); color: #d0e8ff; box-shadow: 0 0 8px rgba(80,130,255,0.2); }
    #window-meta {
      font-size: 9px;
      letter-spacing: 0.7px;
      color: rgba(100,140,200,0.55);
      margin-top: 6px;
      padding-left: 1px;
    }

    /* ── Hot 10 row — calque exact sur evolution.html ── */
    .rleg-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      border: 1px solid rgba(90,130,250,0.14);
      border-radius: 5px;
      background: rgba(8,18,48,0.50);
      padding: 5px 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .rleg-item:hover, .rleg-item.hovered {
      border-color: rgba(145,182,255,0.55);
      background: rgba(20,36,86,0.65);
    }
    .rleg-item.focused {
      border-color: rgba(186,211,255,0.88);
      background: rgba(40,70,150,0.40);
      box-shadow: 0 0 8px rgba(90,135,255,0.28);
    }
    .rleg-item.tracked {
      border-color: rgba(120,200,255,0.65);
      background: rgba(18,52,90,0.55);
    }
    .rleg-item.dimmed { opacity: 0.40; }
    .rleg-swatch {
      width: 11px; height: 11px; border-radius: 50%;
      flex-shrink: 0; margin-top: 2px;
      background: rgba(120,160,220,0.55);
    }
    .rleg-swatch.level-watch    { background: rgba(255,210,90,0.85); box-shadow: 0 0 6px rgba(255,210,90,0.45); }
    .rleg-swatch.level-alert    { background: rgba(255,143,92,0.92); box-shadow: 0 0 6px rgba(255,143,92,0.5); }
    .rleg-swatch.level-strong   { background: rgba(255,110,110,0.95); box-shadow: 0 0 8px rgba(255,110,110,0.55); }
    .rleg-swatch.level-emerging { background: rgba(120,190,255,0.90); box-shadow: 0 0 6px rgba(120,190,255,0.45); }
    .rleg-rank {
      font-size: 11px;
      color: rgba(110,150,210,0.65);
      flex-shrink: 0;
      min-width: 18px;
      text-align: right;
      padding-top: 1px;
    }
    .rleg-name {
      flex: 1;
      font-size: 13px;
      color: rgba(185,215,255,0.92);
      overflow: hidden;
      white-space: normal;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .rleg-alert-badge {
      font-family: 'Orbitron', monospace;
      font-size: 7px;
      letter-spacing: 0.6px;
      padding: 1px 5px;
      border-radius: 999px;
      flex-shrink: 0;
      text-transform: uppercase;
      align-self: center;
    }
    .rleg-alert-badge.level-watch    { color: rgba(255,224,112,0.96); border: 1px solid rgba(224,196,88,0.55); background: rgba(74,60,16,0.62); }
    .rleg-alert-badge.level-alert    { color: rgba(255,186,136,0.98); border: 1px solid rgba(255,143,92,0.65); background: rgba(88,40,24,0.68); }
    .rleg-alert-badge.level-strong   { color: rgba(255,200,200,0.98); border: 1px solid rgba(255,110,110,0.72); background: rgba(98,22,28,0.72); }
    .rleg-alert-badge.level-emerging { color: rgba(160,210,255,0.96); border: 1px solid rgba(112,186,245,0.55); background: rgba(18,56,92,0.62); }
    .rleg-val {
      font-size: 12px;
      color: rgba(140,180,255,0.78);
      flex-shrink: 0;
      min-width: 38px;
      text-align: right;
      padding-top: 1px;
    }
    .rleg-delta {
      font-size: 11px;
      flex-shrink: 0;
      min-width: 32px;
      text-align: right;
      letter-spacing: 0.3px;
      padding-top: 1px;
    }
    .rleg-delta.up   { color: rgba(80,220,140,0.85); }
    .rleg-delta.down { color: rgba(255,100,100,0.80); }
    .rleg-delta.flat { color: rgba(110,150,200,0.50); }
    .rleg-delta.new-entry { color: rgba(255, 220, 60, 0.92); }
    .rleg-delta.ret-entry { color: rgba(120, 200, 255, 0.88); }
    .rleg-check {
      font-size: 11px;
      color: rgba(120,200,255,0.85);
      flex-shrink: 0;
      width: 12px;
      text-align: center;
      padding-top: 1px;
    }

    /* ── Search dropdown (calque evolution.html) ── */
    #search-wrap { display: flex; flex-direction: column; gap: 4px; pointer-events: all; width: 100%; }
    #search-results {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 140px;
      overflow-y: auto;
      margin-top: 1px;
    }
    .evo-result {
      padding: 5px 8px;
      border-radius: 3px;
      background: rgba(8,18,48,0.62);
      border: 1px solid rgba(90,130,250,0.2);
      color: rgba(170,200,255,0.9);
      font-size: 10px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .evo-result:hover {
      border-color: rgba(145,182,255,0.7);
      color: #e0f0ff;
      background: rgba(20,36,86,0.7);
    }

    /* ── Liste des objets comparés (max 2) ── */
    #compare-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .compare-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      border-radius: 4px;
      background: rgba(18,42,80,0.65);
      border: 1px solid rgba(120,180,255,0.5);
      font-size: 11px;
      color: rgba(220,235,255,0.95);
    }
    .compare-item .compare-swatch {
      width: 9px; height: 9px; border-radius: 50%;
      flex-shrink: 0;
    }
    .compare-item .compare-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .compare-item .compare-rm {
      border: none; background: none; cursor: pointer;
      color: rgba(190,90,90,0.75); font-size: 14px;
      line-height: 1; padding: 0 2px; flex-shrink: 0;
    }
    .compare-item .compare-rm:hover { color: rgba(255,120,120,0.95); }
    #compare-hint {
      font-size: 9px;
      letter-spacing: 0.4px;
      color: rgba(120,160,210,0.55);
      margin-top: 4px;
    }
    .top10-item {
      width: 100%;
      border: 1px solid rgba(90, 130, 250, 0.18);
      border-radius: 5px;
      background: rgba(8, 18, 48, 0.62);
      color: rgba(176, 206, 255, 0.95);
      text-align: left;
      padding: 7px 9px;
      cursor: pointer;
      transition: all 0.16s ease;
      font-family: 'Space Mono', 'SF Mono', monospace;
      font-size: 11px;
      line-height: 1.35;
    }
    .top10-item:hover {
      border-color: rgba(145, 182, 255, 0.75);
      background: rgba(20, 36, 86, 0.7);
      color: rgba(222, 236, 255, 1);
      transform: translateX(-2px);
    }
    .top10-item.active {
      border-color: rgba(186, 211, 255, 0.95);
      background: rgba(40, 74, 150, 0.42);
      color: rgba(239, 246, 255, 1);
      box-shadow: 0 0 10px rgba(90, 135, 255, 0.32);
    }
    .top10-rank {
      color: rgba(160, 195, 255, 0.88);
      margin-right: 8px;
      font-family: 'Orbitron', 'Space Mono', monospace;
    }
    .top10-score {
      display: block;
      color: rgba(126, 165, 245, 0.9);
      font-size: 10px;
      margin-top: 2px;
    }
    #top10-empty {
      color: rgba(104, 130, 182, 0.9);
      font-size: 11px;
      padding: 6px 2px;
    }
    #stats { display: none; }
    #focus-hint { display: none; }
    /* Slide-in panel (calque sur evolution.html, mais overlay
       transparent: on veut voir le réseau focusé en pleine clarté,
       pas dimmé). L'overlay sert seulement de zone de clic
       transparente pour fermer le panneau, pas à assombrir.
       Le panneau lui-même couvre 460px à droite — c'est suffisant
       pour signaler que la page est en mode focus. */
    #object-overlay {
      position: fixed; inset: 0; background: transparent;
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    #object-overlay.open { opacity: 1; pointer-events: auto; }
    #object-panel {
      position: fixed; top: 0; right: -460px; width: min(440px, 92vw);
      height: 100vh; z-index: 310;
      background: linear-gradient(175deg, rgba(6,12,38,0.98), rgba(3,6,20,0.99));
      border-left: 1px solid rgba(80,130,255,0.35);
      backdrop-filter: blur(20px);
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
      padding: 0;
    }
    #object-panel.open { right: 0; }
    #object-panel-header {
      position: sticky; top: 0; z-index: 2;
      background: linear-gradient(180deg, rgba(6,12,38,0.99) 80%, transparent);
      padding: 24px 24px 16px;
    }
    #object-panel-close {
      position: absolute; top: 16px; right: 16px;
      background: none; border: 1px solid rgba(80,130,255,0.35); border-radius: 4px;
      color: #cbe0ff; font-size: 18px; width: 32px; height: 32px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    #object-panel-close:hover { border-color: rgba(140,180,255,0.85); color: #fff; }
    #object-panel .h {
      font-family: 'Orbitron', sans-serif; font-size: 16px;
      color: #e8f0ff; text-transform: capitalize;
      letter-spacing: 1px; max-width: calc(100% - 50px);
      margin: 0;
    }
    #object-panel .meta {
      font-size: 11px; color: rgba(140,170,220,0.75); margin-top: 4px;
    }
    #object-panel .panel-links {
      display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap;
    }
    #object-panel .panel-link,
    #object-panel .panel-link:link,
    #object-panel .panel-link:visited {
      display: inline-flex; align-items: center;
      font-size: 10px; font-family: 'Orbitron', sans-serif; letter-spacing: 1.5px;
      color: #8ab4f8; text-decoration: none; text-transform: uppercase;
      background: rgba(80,130,255,0.08);
      border: 1px solid rgba(80,130,255,0.35); border-radius: 5px;
      padding: 6px 14px; transition: all 0.2s;
    }
    #object-panel .panel-link:hover,
    #object-panel .panel-link:focus {
      border-color: rgba(120,170,255,0.8); color: #fff;
      background: rgba(80,130,255,0.2); outline: none;
    }
    #object-panel-body { padding: 0 24px 32px; }
    #object-panel .article-item {
      display: block; padding: 14px 0;
      border-bottom: 1px solid rgba(80,130,255,0.1);
      text-decoration: none; color: #cdddf5;
      transition: all 0.2s;
    }
    #object-panel .article-item:hover { color: #fff; padding-left: 6px; }
    #object-panel .article-item-media {
      font-size: 10px; font-weight: 700; color: #8ab4f8;
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px;
    }
    #object-panel .article-item-title { font-size: 13px; line-height: 1.5; }
    #object-panel .empty {
      color: rgba(140,170,220,0.55); font-size: 12px; padding: 16px 0;
    }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #00000f; z-index: 100; }
    #loading-text { font-size: 11px; letter-spacing: 3px; color: rgba(80,120,255,0.5); text-transform: uppercase; animation: pulse 1.8s ease-in-out infinite; }
    @media (max-width: 900px) {
      #left-panel {
        width: 240px;
        padding: 14px 10px 10px;
      }
      #cst-title { font-size: 16px; letter-spacing: 3px; }
      #object-panel {
        left: 10px;
        right: 10px;
        width: auto;
        max-height: 30vh;
        bottom: calc(var(--ticker-height, 44px) + 92px);
      }
      #controls { bottom: calc(var(--ticker-height, 44px) + 2px); left: 240px; }
    }
    /* Mode tabs (Constellation/Évolution) */
    .mode-tab { padding: 5px 12px; border: 1px solid rgba(100,150,255,0.25); border-radius: 3px; background: rgba(10,20,50,0.5); color: rgba(100,140,200,0.7); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.2px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; text-decoration: none; }
    .mode-tab:hover { border-color: rgba(100,150,255,0.6); color: #a0c0ff; }
    .mode-tab.active { background: rgba(40,80,180,0.35); border-color: rgba(120,180,255,0.7); color: #d0e8ff; box-shadow: 0 0 10px rgba(80,130,255,0.25); }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
    #search-wrap { display: flex; flex-direction: column; gap: 4px; pointer-events: all; }
    #search-input {
      background: rgba(5,10,35,0.75); border: 1px solid rgba(100,150,255,0.3);
      border-radius: 3px; color: #a0c8f0; font-family: 'Space Mono','SF Mono',monospace;
      font-size: 11px; letter-spacing: 0.8px; outline: none; padding: 5px 10px;
      width: 100%; transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search-input::placeholder { color: rgba(90,120,180,0.55); }
    #search-input:focus { border-color: rgba(140,190,255,0.75); box-shadow: 0 0 10px rgba(80,130,255,0.25); color: #d0e8ff; }
    #search-status { font-size: 10px; letter-spacing: 0.8px; height: 14px; transition: color 0.2s; }
    #search-status.found    { color: #70d090; }

  </style>
</head>

<script>
(async () => {
  try {
  // ── Données ───────────────────────────────────────────────────────────────
  let graphData;
  try {
    const gRes = await fetch('./graph.json');
    if (!gRes.ok) throw new Error('graph.json: ' + gRes.statusText);
    graphData = await gRes.json();
  } catch(e) {
    const loading = document.getElementById('loading-text');
    if (window.location.protocol === 'file:') {
      loading.textContent = 'ouvrir via http://localhost (pas file://) — ex: ./run_chrome.sh';
    } else {
      loading.textContent = 'fichiers introuvables — lancer build_data.R (' + e.message + ')';
    }
    return;
  }
  let graphs  = graphData.graphs;
  let periods = graphData.meta.periods;
  const countries = graphData.meta.countries;

  const TOP_LABELS     = Number.POSITIVE_INFINITY;
  const MAX_LINKS_NODE = 5;

  // ── Couleurs ──────────────────────────────────────────────────────────────
  function sizeToT(s) { return Math.min(1, Math.log(s + 1) / Math.log(250)); }

  function nodeRGB(size) {
    const t = sizeToT(size);
    return [Math.round(160 + t*95), Math.round(190 - t*30), Math.round(255 - t*210)];
  }

  function nodeColorStr(size, hl) {
    if (hl === false) return 'rgba(25,30,60,0.5)';
    const [r,g,b] = nodeRGB(size);
    return `rgb(${r},${g},${b})`;
  }

  function linkColorStr(val, hl) {
    if (hl === false) return 'rgba(30,45,105,0.28)';
    const t = Math.min(1, Math.log((val||1)+1) / Math.log(12));
    return `rgba(${Math.round(65+t*130)},${Math.round(80+t*28)},${Math.round(210+t*45)},${(0.34+t*0.46).toFixed(2)})`;
  }

  // ── Anti-hairball ─────────────────────────────────────────────────────────
  function filterTopLinks(links, max) {
    const m = new Map();
    links.forEach(l => {
      [l.source, l.target].forEach(k => { if (!m.has(k)) m.set(k,[]); m.get(k).push(l); });
    });
    const kept = new Set();
    m.forEach(ls => { ls.sort((a,b)=>b.value-a.value); ls.slice(0,max).forEach(l=>kept.add(l)); });
    return [...kept];
  }


  function getGD(country, key) {
    const g = graphs[country]?.[key];
    if (!g) return { nodes: [], links: [] };
    const nodes = g.nodes.map(n => ({ ...n }));
    const links = g.links.map(l => ({ ...l }));
    nodes.sort((a, b) => b.size - a.size);
    nodes.forEach((n, i) => { n._rank = i; });
    return { nodes, links: filterTopLinks(links, MAX_LINKS_NODE) };
  }

  function periodConvergenceScore(country, key) {
    const g = graphs[country]?.[key];
    if (!g || !Array.isArray(g.nodes) || !g.nodes.length) return 0;

    const sizes = g.nodes.map(n => Number(n.size) || 0).sort((a, b) => b - a);
    const ultra = sizes.slice(0, 3).reduce((a, b) => a + b, 0);
    const linksStrong = (g.links || []).reduce((acc, l) => acc + Math.max(0, (Number(l.value) || 0) - 1), 0);
    const density = linksStrong / Math.max(1, g.nodes.length);

    // Score synthétique: salience ultra + convergence de cooccurrence.
    return ultra * 0.75 + linksStrong * 0.95 + density * 1.6;
  }

  function heatColor(t) {
    const tt = Math.max(0, Math.min(1, t));
    const r = Math.round(30 + tt * 130);
    const g = Math.round(50 + tt * 165);
    const b = Math.round(115 + tt * 125);
    const a = (0.30 + tt * 0.70).toFixed(2);
    return `rgba(${r},${g},${b},${a})`;
  }

  function applyTimelineHeat(country) {
    if (!periods.length) return;
    const scores = periods.map(p => periodConvergenceScore(country, p.key));
    const min = Math.min(...scores);
    const max = Math.max(...scores);
    const denom = Math.max(1e-9, max - min);
    const norm = scores.map(s => (s - min) / denom);

    if (periods.length === 1) {
      slider.style.background = `linear-gradient(to right, ${heatColor(norm[0])}, ${heatColor(norm[0])})`;
      slider.dataset.convScores = JSON.stringify(scores);
      return;
    }

    const stops = [];
    for (let i = 0; i < norm.length; i++) {
      const start = i === 0 ? 0 : ((i - 0.5) / (norm.length - 1)) * 100;
      const end = i === norm.length - 1 ? 100 : ((i + 0.5) / (norm.length - 1)) * 100;
      const c = heatColor(norm[i]);
      stops.push(`${c} ${start.toFixed(2)}%`, `${c} ${end.toFixed(2)}%`);
    }
    slider.style.background = `linear-gradient(to right, ${stops.join(',')})`;
    slider.dataset.convScores = JSON.stringify(scores);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>'"]/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  function renderArticlesPanel(node) {
    const panel   = document.getElementById('object-panel');
    const overlay = document.getElementById('object-overlay');
    const titleEl = document.getElementById('object-panel-title');
    const metaEl  = document.getElementById('object-panel-meta');
    const linksEl = document.getElementById('object-panel-links');
    const bodyEl  = document.getElementById('object-panel-body');

    if (!node) {
      panel.classList.remove('open');
      overlay.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      // On ne vide pas le contenu tout de suite pour conserver une
      // animation de sortie propre (le panneau slide à droite).
      return;
    }

    const articles = Array.isArray(node.articles) ? node.articles : [];
    titleEl.textContent = node.id;
    metaEl.textContent  = `${(Number(node.size) || 0).toFixed(2)} pts · ${node.n || 0} mentions · ${articles.length} article${articles.length > 1 ? 's' : ''}`;

    const evolutionUrl = `./evolution.html?country=${encodeURIComponent(currentCountry)}&gran=${encodeURIComponent(rankedGranularity)}&nodes=${encodeURIComponent(node.id)}&mode=tracking`;
    linksEl.innerHTML = `<a class="panel-link" href="${escapeHtml(evolutionUrl)}">Voir dans Évolution →</a>`;

    if (articles.length) {
      bodyEl.innerHTML = articles.map(a => {
        const title = escapeHtml(a.title || a.url || 'Article');
        const url   = escapeHtml(a.url || '#');
        const media = a.media_id ? `<div class="article-item-media">${escapeHtml(a.media_id)}</div>` : '';
        return `<a class="article-item" href="${url}" target="_blank" rel="noopener noreferrer">${media}<div class="article-item-title">${title}</div></a>`;
      }).join('');
    } else {
      bodyEl.innerHTML = '<div class="empty">Aucun article associé dans ce jeu de données.</div>';
    }

    panel.classList.add('open');
    overlay.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
  }

  // ── Étoiles ───────────────────────────────────────────────────────────────
  const STARS = Array.from({length: 400}, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.3 + 0.15,
    a: Math.random() * 0.45 + 0.08,
    tw: Math.random() * Math.PI * 2,
    ts: 0.003 + Math.random() * 0.007
  }));

  // ── Graphe 2D ─────────────────────────────────────────────────────────────
  const graphEl = document.getElementById('graph');
  const Graph = ForceGraph()(graphEl);
  const setIfFn = (name, value) => {
    if (typeof Graph[name] === 'function') Graph[name](value);
  };

  setIfFn('width', window.innerWidth);
  setIfFn('height', window.innerHeight);
  setIfFn('backgroundColor', '#00000f');
  // Constellation figée: pas de pan, pas de zoom, pas de drag de nœuds.
  // Le layout s'auto-cadre via zoomToFit après chaque stabilisation
  // de la simulation force (onEngineStop).
  setIfFn('enableZoomInteraction', false);
  setIfFn('enablePanInteraction', false);
  setIfFn('enableNodeDrag', false);
  // 180 ticks (~3s à 60fps) — animation longue assez pour être lue
  // comme un placement intelligent, courte assez pour ne pas faire
  // attendre. onEngineStop fige et cadre avec une transition douce.
  setIfFn('cooldownTicks', 180);
  setIfFn('onEngineStop', () => fitGraphToView(900));
  // Nœuds par défaut (cercles) — couleur + taille via API standard
  setIfFn('nodeColor', n => {
    // Couleur distincte pour les objets comparés (cyan ou rose)
    const c = compareColor(n.id);
    if (c) return c;
    return nodeColorStr(n.size, n._highlighted);
  });
  setIfFn('nodeVal', n => Math.max(4, n.size * 0.5));
  setIfFn('nodeRelSize', 3);
  setIfFn('nodeLabel', () => '');
  // Liens
  setIfFn('linkColor', l => linkColorStr(l.value, l._highlighted));
  setIfFn('linkWidth', l => l._highlighted === false ? 0.7 : Math.max(1, Math.log((l.value||1)+1) * 1.1));
  setIfFn('linkDirectionalParticles', l => (l.value||0) >= 3 ? 2 : 0);
  setIfFn('linkDirectionalParticleWidth', 2);
  setIfFn('linkDirectionalParticleSpeed', 0.005);
  setIfFn('linkDirectionalParticleColor', l => { const t=Math.min(1,Math.log((l.value||1)+1)/Math.log(12)); return `rgba(${Math.round(100+t*155)},${Math.round(100+t*100)},255,0.9)`; });
  // Amortissement: alphaDecay modéré pour une animation visible mais
  // pas trop longue, velocityDecay modéré pour des mouvements fluides
  // (avec le pré-positionnement circulaire on n'a plus besoin
  // d'amortir fortement: pas d'expulsion brutale à contenir).
  setIfFn('d3AlphaDecay', 0.022);
  setIfFn('d3VelocityDecay', 0.42);
  // Étoiles (avant) + halos de nœuds (avant le cercle par défaut)
  setIfFn('onRenderFramePre', (ctx, gs) => {
      // 1. Étoiles en coords écran
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const W = ctx.canvas.width, H = ctx.canvas.height;
      STARS.forEach(s => {
        s.tw += s.ts;
        const a = s.a * (0.55 + 0.45 * Math.sin(s.tw));
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,205,255,${a.toFixed(2)})`;
        ctx.fill();
      });
      ctx.restore();

      // 2. Halos en coords monde (dessinés avant les cercles par défaut)
      const { nodes } = Graph.graphData();
      nodes.forEach(n => {
        if (n.x == null || n._highlighted === false) return;
        const r  = 3 * Math.sqrt(Math.max(4, n.size * 0.5));
        const [nr, ng, nb] = nodeRGB(n.size);
        // Halo extérieur
        const g1 = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 4);
        g1.addColorStop(0, `rgba(${nr},${ng},${nb},0.12)`);
        g1.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(n.x, n.y, r*4, 0, Math.PI*2);
        ctx.fillStyle = g1; ctx.fill();
        // Halo intérieur
        const g2 = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 2);
        g2.addColorStop(0, `rgba(${nr},${ng},${nb},0.30)`);
        g2.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(n.x, n.y, r*2, 0, Math.PI*2);
        ctx.fillStyle = g2; ctx.fill();
      });
    });
  // Labels (après les cercles par défaut)
  // Placement intelligent du label: pour chaque nœud on choisit le
  // côté (droite/gauche) où il y a le plus d'espace par rapport au
  // centroïde local. Réduit drastiquement les chevauchements de
  // labels dans les clusters denses.
  setIfFn('onRenderFramePost', (ctx, gs) => {
      const { nodes } = Graph.graphData();
      // Centroïde global = barycentre des nœuds visibles (tous_x, tous_y).
      let cx = 0, cy = 0, cn = 0;
      for (const n of nodes) {
        if (n.x == null || n._highlighted === false) continue;
        cx += n.x; cy += n.y; cn++;
      }
      if (cn > 0) { cx /= cn; cy /= cn; }

      nodes.forEach(n => {
        if (n._rank >= TOP_LABELS || n.x == null || n._highlighted === false) return;
        const t   = sizeToT(n.size);
        const r   = 3 * Math.sqrt(Math.max(4, n.size * 0.5));
        const fs  = Math.max(2, 11 / gs);
        ctx.font  = `${fs}px 'SF Mono', monospace`;
        ctx.textBaseline = 'middle';
        const lbl = n.id;
        const tw  = ctx.measureText(lbl).width;
        const pad = 2 / gs;
        // Label à l'extérieur du centroïde: si le nœud est à gauche
        // du barycentre, on place le label à gauche; sinon à droite.
        // Ainsi les labels rayonnent vers l'extérieur du cluster, pas
        // vers son intérieur où ils écraseraient d'autres nœuds.
        const onLeft = n.x < cx;
        const ly = n.y;
        let lx, alignedX;
        if (onLeft) {
          ctx.textAlign = 'right';
          lx = n.x - r - pad * 1.5;
          alignedX = lx - tw;
        } else {
          ctx.textAlign = 'left';
          lx = n.x + r + pad * 1.5;
          alignedX = lx;
        }
        ctx.fillStyle = 'rgba(0,3,22,0.80)';
        ctx.fillRect(alignedX - pad, ly - fs / 2 - pad, tw + pad * 2, fs + pad * 2);
        ctx.fillStyle = `rgba(${Math.round(175 + t * 75)},215,255,0.92)`;
        ctx.fillText(lbl, lx, ly);
      });
    });
  setIfFn('onNodeHover', handleHover);
  setIfFn('onNodeClick', handleClick);

  // ── Forces du layout ──────────────────────────────────────────────────────
  // - charge: répulsion modérée pour démêler sans expulser.
  // - link.distance: ~65px, donne de la place entre nœuds connectés
  //   (sinon les labels se collent dans les clusters denses).
  // - collide: padding label-aware (ellipse asymétrique, plus large
  //   horizontalement car les labels sont dessinés à droite des nœuds).
  // - gentleCenter: rappel vers (0,0) — empêche les clusters
  //   disconnectés de dériver et concentre l'ensemble sur la zone
  //   visible, plutôt que de remplir l'infini.
  Graph.d3Force('charge').strength(-110);
  Graph.d3Force('link').distance(65);

  function nodeRadius(n) { return 3 * Math.sqrt(Math.max(4, n.size * 0.5)); }

  // Padding label-aware: ajoute une marge horizontale proportionnelle
  // à la longueur du label (capée à ~30px), petite marge verticale
  // constante. Empêche concrètement les labels de se chevaucher dans
  // les clusters denses, sans exploser le layout des nœuds courts.
  function labelPadX(n) {
    const labelW = (n.id || '').length * 5; // ≈ 5px/char en SF Mono 11px
    return Math.min(30, 10 + labelW * 0.18);
  }
  const LABEL_PAD_Y = 10;

  function collideForce(alpha) {
    const nodes = Graph.graphData().nodes;
    const n = nodes.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = nodes[i], b = nodes[j];
        if (a.x == null || b.x == null) continue;
        const ra = nodeRadius(a);
        const rb = nodeRadius(b);
        // Distances minimum asymétriques — plus larges en X qu'en Y
        // car les labels sont rendus horizontalement à droite du nœud.
        const minDx = ra + rb + (labelPadX(a) + labelPadX(b)) * 0.5;
        const minDy = ra + rb + LABEL_PAD_Y;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        // Test ellipse: (dx/minDx)² + (dy/minDy)² < 1 ⇒ collision.
        const ex = dx / minDx, ey = dy / minDy;
        const dEll2 = ex * ex + ey * ey;
        if (dEll2 < 1 && dEll2 > 1e-6) {
          const dEll = Math.sqrt(dEll2);
          // Push proportionnel à la pénétration dans l'ellipse.
          const push = ((1 - dEll) / 2) * alpha;
          a.x -= dx * push;
          a.y -= dy * push;
          b.x += dx * push;
          b.y += dy * push;
        }
      }
    }
  }
  Graph.d3Force('collide', collideForce);

  // Force de rappel aspect-aware: tire les nœuds vers (0,0) avec une
  // intensité plus forte en Y qu'en X, proportionnellement à
  // l'aspect ratio de la zone visible. Conséquence: le bounding box
  // du graphe s'étire horizontalement pour remplir l'écran large
  // (typiquement ~1.86:1 sur desktop landscape) plutôt que de rester
  // carré et laisser de l'espace vide à droite/gauche.
  function visibleAspect() {
    const visW = Math.max(200, window.innerWidth  - LEFT_PANEL_W - SIDE_MARGIN);
    const visH = Math.max(200, window.innerHeight - BOTTOM_OVERLAY - TOP_MARGIN);
    return visW / visH;
  }
  function aspectAwareCenter(strength) {
    return function(alpha) {
      const nodes = Graph.graphData().nodes;
      // Ratio modéré: sqrt(aspect) au lieu de aspect — sinon le rappel
      // est quadratique et le graphe déborde trop.
      const stretch = Math.sqrt(visibleAspect());
      const k = strength * alpha;
      const kx = k / stretch;
      const ky = k * stretch;
      for (const n of nodes) {
        if (n.x == null || n.y == null) continue;
        n.vx = (n.vx || 0) - n.x * kx;
        n.vy = (n.vy || 0) - n.y * ky;
      }
    };
  }
  Graph.d3Force('gentleCenter', aspectAwareCenter(0.09));

  window.addEventListener('resize', () => {
    Graph.width(window.innerWidth).height(window.innerHeight);
    fitGraphToView(0);
  });

  // ── État ──────────────────────────────────────────────────────────────────
  const urlParams = new URLSearchParams(window.location.search);
  const urlCountry = (urlParams.get('country') || '').toUpperCase();
  const urlGran    = (urlParams.get('gran') || '').toLowerCase();
  let currentCountry = countries.includes(urlCountry) ? urlCountry : countries[0];
  let focusedNode    = null;
  let lastNodeClickTs = 0;
  let playInterval   = null;
  let playSpeed      = 1500;
  const SPEEDS       = [1500, 700, 250];
  const SPEED_LABELS = ['1×', '2×', '5×'];

  // Granularité: agrège les blocs 4h en jour/semaine/mois/année et
  // navigue par créneaux à cette granularité (parité avec evolution.html).
  const GRAN_SET = ['day', 'week', 'month', 'year'];
  let rankedGranularity = GRAN_SET.includes(urlGran) ? urlGran : 'day';

  // Mois/jours FR pour les labels de slots
  const FR_MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  function periodKeyToDateStr(key) {
    return String(key || '').split('_')[0];
  }
  function dateToWeekKey(dateStr) {
    const d = new Date(`${dateStr}T00:00:00`);
    d.setDate(d.getDate() + 4 - (d.getDay() || 7));
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return `${d.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
  }
  function bucketKeyForPeriod(p, gran) {
    const ds = periodKeyToDateStr(p.key);
    if (gran === 'week')  return dateToWeekKey(ds);
    if (gran === 'month') return ds.slice(0, 7);
    if (gran === 'year')  return ds.slice(0, 4);
    return ds; // day
  }
  function labelForBucket(bucketKey, gran) {
    if (gran === 'day') {
      const [y, m, d] = bucketKey.split('-').map(Number);
      return `${d} ${FR_MONTHS[Math.max(0, (m||1)-1)]} ${y}`;
    }
    if (gran === 'week') {
      const [y, w] = bucketKey.split('-W');
      return `Semaine ${Number(w)} · ${y}`;
    }
    if (gran === 'month') {
      const [y, m] = bucketKey.split('-').map(Number);
      return `${FR_MONTHS[Math.max(0, m-1)]} ${y}`;
    }
    return bucketKey; // year
  }

  // Construit les créneaux (slots) à la granularité courante. Chaque
  // slot regroupe les périodes 4h qui tombent dans le même bucket.
  let slots = [];
  let currentSlotIdx = 0;
  function buildSlots() {
    const buckets = new Map();
    for (const p of periods) {
      const bk = bucketKeyForPeriod(p, rankedGranularity);
      if (!buckets.has(bk)) buckets.set(bk, []);
      buckets.get(bk).push(p);
    }
    slots = [...buckets.entries()].map(([bk, ps]) => ({
      key: bk,
      label: labelForBucket(bk, rankedGranularity),
      periods: ps,
      periodKeys: ps.map(p => p.key)
    }));
    currentSlotIdx = Math.max(0, slots.length - 1);
  }

  // Agrège les nodes/links de toutes les périodes 4h d'un slot:
  // - node[id]: size = somme, n = somme, alert_level = pire niveau,
  //   alert_score = max(score), articles/media_ids = union
  // - link[src→tgt]: value = somme
  // Cap au top N par granularité — au-delà le graphe devient illisible
  // (ex: une année cumule >1000 objets uniques qui forment un blob).
  // Liens aussi filtrés aux paires entre nodes retenus.
  const ALERT_RANK = { strong: 4, alert: 3, watch: 2, emerging: 1, none: 0, normal: 0 };
  const SLOT_TOP_N = { day: 30, week: 40, month: 55, year: 70 };
  function aggregateSlot(country, slot) {
    if (!slot || !slot.periodKeys.length) return { nodes: [], links: [] };
    const nodeMap = new Map();
    const linkMap = new Map();
    for (const pk of slot.periodKeys) {
      const g = graphs[country]?.[pk];
      if (!g) continue;
      for (const n of (g.nodes || [])) {
        const cur = nodeMap.get(n.id);
        if (!cur) {
          nodeMap.set(n.id, {
            id: n.id,
            size: Number(n.size) || 0,
            n: Number(n.n) || 0,
            alert_level: n.alert_level || 'none',
            alert_score: Number(n.alert_score) || null,
            alert_active: !!n.alert_active,
            articles: Array.isArray(n.articles) ? n.articles.slice() : [],
            media_ids: Array.isArray(n.media_ids) ? n.media_ids.slice() : []
          });
        } else {
          cur.size += Number(n.size) || 0;
          cur.n    += Number(n.n) || 0;
          if ((ALERT_RANK[n.alert_level] || 0) > (ALERT_RANK[cur.alert_level] || 0)) {
            cur.alert_level = n.alert_level;
          }
          if (n.alert_active) cur.alert_active = true;
          const sc = Number(n.alert_score);
          if (Number.isFinite(sc) && (cur.alert_score == null || sc > cur.alert_score)) {
            cur.alert_score = sc;
          }
          if (Array.isArray(n.articles)) cur.articles.push(...n.articles);
          if (Array.isArray(n.media_ids)) {
            const seen = new Set(cur.media_ids);
            for (const m of n.media_ids) if (!seen.has(m)) { cur.media_ids.push(m); seen.add(m); }
          }
        }
      }
      for (const l of (g.links || [])) {
        const s = (l.source && l.source.id) || l.source;
        const t = (l.target && l.target.id) || l.target;
        if (!s || !t) continue;
        const key = s < t ? `${s}|${t}` : `${t}|${s}`;
        const cur = linkMap.get(key);
        if (!cur) linkMap.set(key, { source: s, target: t, value: Number(l.value) || 0 });
        else cur.value += Number(l.value) || 0;
      }
    }
    let allSorted = [...nodeMap.values()].sort((a, b) => b.size - a.size);
    const cap = SLOT_TOP_N[rankedGranularity] || 30;
    let nodes = allSorted.slice(0, cap);
    // Force-inclut les objets en comparaison s'ils existent dans le slot
    // mais sont hors du cap — sinon ils seraient invisibles et le
    // highlight les ferait tous disparaître.
    if (typeof comparedNodes !== 'undefined' && comparedNodes && comparedNodes.size) {
      const present = new Set(nodes.map(n => n.id));
      for (const id of comparedNodes.keys()) {
        if (!present.has(id) && nodeMap.has(id)) {
          nodes.push(nodeMap.get(id));
        }
      }
    }
    nodes.forEach((n, i) => { n._rank = i; });
    const visibleIds = new Set(nodes.map(n => n.id));
    const visibleLinks = [...linkMap.values()].filter(l =>
      visibleIds.has(l.source) && visibleIds.has(l.target)
    );
    const links = filterTopLinks(visibleLinks, MAX_LINKS_NODE);
    return { nodes, links };
  }

  // Slot précédent (pour calcul des deltas dans le Hot 10).
  function prevSlotNodes(country) {
    if (currentSlotIdx <= 0) return null;
    const prev = slots[currentSlotIdx - 1];
    if (!prev) return null;
    return aggregateSlot(country, prev).nodes;
  }
  let speedIdx       = 0;

  // Auto-fit: cadre les nœuds dans la zone réellement visible (hors
  // panneau gauche, hors timeline+ticker+legende-période en bas, hors
  // marges). On calcule zoom + centre manuellement pour gérer un
  // padding asymétrique — zoomToFit ne supporte qu'un padding unique.
  // BOTTOM_OVERLAY couvre: ticker (44) + controls timeline (~80) +
  // ligne "May 08 · X objets · Y liens · convergence Z" (~30) + marge.
  const LEFT_PANEL_W   = 280;
  const BOTTOM_OVERLAY = 175;
  const TOP_MARGIN     = 60;
  const SIDE_MARGIN    = 60;

  function fitGraphToView(durationMs = 0) {
    if (typeof Graph.zoom !== 'function' || typeof Graph.centerAt !== 'function') return;
    const nodes = Graph.graphData().nodes || [];
    if (!nodes.length) return;

    // Centroïde rapide pour deviner de quel côté chaque label sera
    // dessiné (cohérent avec la logique onRenderFramePost).
    let cx0 = 0, cn = 0;
    for (const n of nodes) {
      if (!Number.isFinite(n.x)) continue;
      cx0 += n.x; cn++;
    }
    cx0 = cn ? cx0 / cn : 0;

    // Bbox étendue: chaque nœud "occupe" en X non seulement son
    // disque mais aussi son label (largeur ≈ 6px/char) du côté
    // opposé au centroïde, pour que rien ne soit clipé après fit.
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const n of nodes) {
      if (!Number.isFinite(n.x) || !Number.isFinite(n.y)) continue;
      const r = 3 * Math.sqrt(Math.max(4, (Number(n.size) || 0) * 0.5));
      const labelW = (n.id || '').length * 6 + 8;
      let nx0 = n.x - r, nx1 = n.x + r;
      if (n.x < cx0) nx0 -= labelW; else nx1 += labelW;
      const ny0 = n.y - r - 6, ny1 = n.y + r + 6;
      if (nx0 < minX) minX = nx0;
      if (nx1 > maxX) maxX = nx1;
      if (ny0 < minY) minY = ny0;
      if (ny1 > maxY) maxY = ny1;
    }
    if (!Number.isFinite(minX)) return;

    const bboxW  = Math.max(1, maxX - minX);
    const bboxH  = Math.max(1, maxY - minY);
    const bboxCx = (minX + maxX) / 2;
    const bboxCy = (minY + maxY) / 2;

    const W = window.innerWidth;
    const H = window.innerHeight;
    const visibleW = Math.max(200, W - LEFT_PANEL_W - SIDE_MARGIN);
    const visibleH = Math.max(200, H - BOTTOM_OVERLAY - TOP_MARGIN);

    // Zoom: le bbox doit tenir dans la zone visible.
    const zoom = Math.min(visibleW / bboxW, visibleH / bboxH);

    // Décalage caméra en coords-monde pour que bbox.center s'affiche
    // au centre de la zone visible (et non au centre de la window).
    const visibleCenterX = LEFT_PANEL_W + visibleW / 2;
    const visibleCenterY = TOP_MARGIN + visibleH / 2;
    const dxScreen = visibleCenterX - W / 2;
    const dyScreen = visibleCenterY - H / 2;

    Graph.zoom(zoom, durationMs);
    Graph.centerAt(bboxCx - dxScreen / zoom, bboxCy - dyScreen / zoom, durationMs);
  }

  // Cadre un nœud spécifique au centre-gauche de l'écran, en réservant
  // 460px à droite pour le panneau slide-in. Garde le zoom courant si
  // raisonnable, sinon zoome légèrement pour le focus.
  const SLIDE_PANEL_W = 460;
  function panToNodeLeftCenter(node, durationMs = 500) {
    if (!node || !Number.isFinite(node.x) || !Number.isFinite(node.y)) return;
    if (typeof Graph.zoom !== 'function' || typeof Graph.centerAt !== 'function') return;

    const W = window.innerWidth;
    const H = window.innerHeight;
    // Zone visible quand le panneau est ouvert: à gauche du panneau,
    // à droite du panneau lateral gauche.
    const visibleW = Math.max(200, W - LEFT_PANEL_W - SLIDE_PANEL_W);
    const visibleH = Math.max(200, H - BOTTOM_OVERLAY - TOP_MARGIN);
    const targetScreenX = LEFT_PANEL_W + visibleW / 2;
    const targetScreenY = TOP_MARGIN  + visibleH / 2;

    const z = (typeof Graph.zoom === 'function' && Graph.zoom()) || 1;
    const dxScreen = targetScreenX - W / 2;
    const dyScreen = targetScreenY - H / 2;
    Graph.centerAt(node.x - dxScreen / z, node.y - dyScreen / z, durationMs);
  }

  function clearFocusAndRecenter() {
    const gd = Graph.graphData();
    (gd.nodes || []).forEach(n => { n._highlighted = true; });
    (gd.links || []).forEach(l => { l._highlighted = true; });
    focusedNode = null;
    document.getElementById('focus-hint').classList.remove('visible');
    renderArticlesPanel(null);
    setTop10Active(null);
    // Réapplique le highlight de comparaison s'il y a des objets sélectionnés
    if (comparedNodes && comparedNodes.size) applyComparisonHighlight();
    fitGraphToView(500);
  }

  // Charge un slot (créneau à la granularité courante) dans le graphe.
  // Le slot est agrégé sur tous ses blocs 4h: nodes (somme size, n,
  // pire alert_level) et liens (somme value).
  function loadSlot(country, slotIdx) {
    const slot = slots[slotIdx];
    if (!slot) return;
    currentSlotIdx = slotIdx;
    const gd = aggregateSlot(country, slot);

    // Réutilise les positions précédentes pour les nœuds persistants —
    // évite de relancer un layout from-scratch entre deux slots adjacents.
    const prev = {};
    (Graph.graphData().nodes || []).forEach(n => { prev[n.id] = {x: n.x, y: n.y}; });
    gd.nodes.forEach(n => { if (prev[n.id]) Object.assign(n, prev[n.id]); });

    // Pré-positionnement elliptique modéré (stretch = sqrt(aspect) —
    // pas exagéré). Démarre cohérent avec aspectAwareCenter.
    const newNodes = gd.nodes.filter(n => !Number.isFinite(n.x) || !Number.isFinite(n.y));
    if (newNodes.length) {
      const baseR   = Math.max(80, 22 * Math.sqrt(gd.nodes.length));
      const stretch = Math.sqrt(visibleAspect());
      const rX      = baseR * stretch;
      const rY      = baseR / stretch;
      const angleStart = Math.random() * Math.PI * 2;
      newNodes.forEach((n, i) => {
        const angle = angleStart + (i / newNodes.length) * Math.PI * 2;
        n.x = rX * Math.cos(angle);
        n.y = rY * Math.sin(angle);
      });
    }

    gd.nodes.forEach(n => { n._highlighted = true; });
    gd.links.forEach(l => { l._highlighted = true; });
    focusedNode = null;
    Graph.graphData(gd);
    // Si on a des objets comparés, ré-applique le highlight.
    if (comparedNodes.size) applyComparisonHighlight();
    // Le cadrage final se fait dans onEngineStop, après stabilisation.

    document.getElementById('period-label').innerHTML =
      `<span>${escapeHtml(slot.label)}</span> &nbsp;·&nbsp; ${gd.nodes.length} objets &nbsp;·&nbsp; ${gd.links.length} liens`;

    const metaEl = document.getElementById('window-meta');
    if (metaEl) {
      const blocks = slot.periods.length;
      metaEl.textContent = `${slot.label} · ${blocks} bloc${blocks > 1 ? 's' : ''} 4h`;
    }

    renderHot10(gd, country);
    document.getElementById('focus-hint').classList.remove('visible');
    renderArticlesPanel(null);
  }

  // Récupère les états d'alerte de la PÉRIODE COURANTE (dernier bloc 4h
  // du slot affiché). Pour le Hot 10, on signale ce qui est en alerte
  // EN CE MOMENT, pas le pire niveau jamais atteint dans le slot — bien
  // plus parlant et cohérent avec evolution.html.
  function currentPeriodAlertMap(country, slot) {
    const map = new Map();
    if (!slot || !slot.periodKeys.length) return map;
    const lastKey = slot.periodKeys[slot.periodKeys.length - 1];
    const g = graphs[country]?.[lastKey];
    if (!g) return map;
    for (const n of (g.nodes || [])) {
      const lvl = n.alert_level;
      if (n.alert_active && lvl && lvl !== 'normal' && lvl !== 'none') {
        map.set(n.id, lvl);
      }
    }
    return map;
  }

  // Hot 10 — format calqué sur evolution.html (.rleg-item) avec swatch
  // coloré (selon alerte courante), valeur de saillance, delta vs slot
  // précédent.
  const ALERT_BADGE_LABELS = { strong: 'Fort', alert: 'Alerte', watch: 'Veille', emerging: 'Émerg.' };
  function renderHot10(gd, country) {
    const list = document.getElementById('top10-list');
    const countryEl = document.getElementById('top10-country');
    countryEl.textContent = country;

    const top = (gd.nodes || []).slice(0, 10);
    if (!top.length) {
      list.innerHTML = '<div id="top10-empty">Aucun objet pour ce créneau.</div>';
      return;
    }

    const alertMap = currentPeriodAlertMap(country, slots[currentSlotIdx]);
    const prevNodes = prevSlotNodes(country);
    const prevRanks = new Map();
    if (prevNodes) prevNodes.slice(0, 10).forEach((n, i) => prevRanks.set(n.id, i + 1));

    list.innerHTML = '';
    top.forEach((n, i) => {
      const lvl = alertMap.get(n.id);
      const isCompared = comparedNodes.has(n.id);
      const isFocused  = focusedNode === n.id;

      const item = document.createElement('div');
      item.className = 'rleg-item'
        + (isFocused ? ' focused' : '')
        + (isCompared ? ' tracked' : '');
      item.dataset.nodeId = n.id;

      let deltaTxt = '', deltaClass = 'flat';
      const prevRank = prevRanks.get(n.id);
      if (prevRank == null) {
        if (prevNodes && prevNodes.length) { deltaTxt = 'NVX'; deltaClass = 'new-entry'; }
      } else {
        const d = prevRank - (i + 1);
        if (d > 0)      { deltaTxt = `↑${d}`; deltaClass = 'up'; }
        else if (d < 0) { deltaTxt = `↓${Math.abs(d)}`; deltaClass = 'down'; }
        else            { deltaTxt = '='; deltaClass = 'flat'; }
      }

      const swatchClass = lvl ? `rleg-swatch level-${lvl}` : 'rleg-swatch';
      const badgeHtml = lvl
        ? `<span class="rleg-alert-badge level-${escapeHtml(lvl)}">${escapeHtml(ALERT_BADGE_LABELS[lvl] || lvl)}</span>`
        : '';
      const checkHtml = isCompared ? '<span class="rleg-check">✓</span>' : '';

      item.innerHTML =
        `<div class="${swatchClass}"></div>` +
        `<span class="rleg-rank">${i + 1}.</span>` +
        `<span class="rleg-name" title="${escapeHtml(n.id)}">${escapeHtml(n.id)}</span>` +
        badgeHtml +
        checkHtml +
        `<span class="rleg-val">${(Number(n.size) || 0).toFixed(1)}</span>` +
        `<span class="rleg-delta ${deltaClass}">${deltaTxt}</span>`;

      item.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCompared(n.id);
      });
      list.appendChild(item);
    });
  }

  function setTop10Active(nodeId) {
    document.querySelectorAll('.rleg-item').forEach(btn => {
      btn.classList.toggle('focused', !!nodeId && btn.dataset.nodeId === nodeId);
    });
  }

  function focusNodeById(nodeId) {
    const gd = Graph.graphData();
    const node = (gd.nodes || []).find(n => n.id === nodeId);
    if (!node) return;

    focusedNode = node.id;
    const nb = new Set([node.id]);
    (gd.links || []).forEach(l => {
      const s=l.source?.id??l.source, t=l.target?.id??l.target;
      if(s===node.id) nb.add(t); if(t===node.id) nb.add(s);
    });

    (gd.nodes || []).forEach(n => { n._highlighted = nb.has(n.id); });
    (gd.links || []).forEach(l => {
      const s=l.source?.id??l.source, t=l.target?.id??l.target;
      l._highlighted=(s===node.id||t===node.id);
    });

    document.getElementById('focus-name').textContent = node.id;
    document.getElementById('focus-hint').classList.add('visible');
    document.getElementById('tooltip').style.display = 'none';
    renderArticlesPanel(node);
    setTop10Active(node.id);
    // Pan le nœud focusé au centre-gauche pour libérer l'espace du
    // panneau slide-in qui occupe les 460px à droite.
    panToNodeLeftCenter(node, 500);
  }

  function handleHover(node) {
    const tt = document.getElementById('tooltip');
    if (!node || focusedNode) { tt.style.display='none'; return; }
    tt.style.display = 'block';
    tt.innerHTML = `<div class="n">${node.id}</div>
      <div class="s">saillance &nbsp;${node.size.toFixed(2)}</div>
      <div class="m">mentions &nbsp;&nbsp;${node.n}</div>
      <div class="m">articles &nbsp;&nbsp;&nbsp;${(node.articles || []).length}</div>`;
  }
  document.addEventListener('mousemove', e => {
    const tt = document.getElementById('tooltip');
    if (tt.style.display === 'block') {
      tt.style.left = Math.min(e.clientX+16, window.innerWidth-240)+'px';
      tt.style.top  = Math.min(e.clientY-10, window.innerHeight-120)+'px';
    }
  });

  function handleClick(node) {
    lastNodeClickTs = Date.now();
    if (focusedNode === node.id) {
      clearFocusAndRecenter();
    } else {
      focusNodeById(node.id);
    }
  }

  // Clic en arrière-plan du graphe: fermer le panneau + recentrer tout.
  graphEl.addEventListener('click', (e) => {
    if (!focusedNode) return;
    if (Date.now() - lastNodeClickTs < 250) return;
    clearFocusAndRecenter();
  });

  // Fermeture explicite du panneau slide-in (bouton × et clic overlay)
  const panelCloseBtn = document.getElementById('object-panel-close');
  const panelOverlay  = document.getElementById('object-overlay');
  if (panelCloseBtn) panelCloseBtn.addEventListener('click', () => clearFocusAndRecenter());
  if (panelOverlay)  panelOverlay.addEventListener('click', () => clearFocusAndRecenter());

  // Initialise les slots à la granularité courante
  buildSlots();

  const slider = document.getElementById('timeline');
  function refreshSliderRange() {
    slider.max = Math.max(0, slots.length - 1);
    slider.value = currentSlotIdx;
  }
  refreshSliderRange();
  slider.addEventListener('input', () => {
    currentSlotIdx = +slider.value;
    loadSlot(currentCountry, currentSlotIdx);
  });

  const playBtn = document.getElementById('play-btn');
  function advance() {
    if (!slots.length) return;
    currentSlotIdx = (currentSlotIdx + 1) % slots.length;
    slider.value = currentSlotIdx;
    loadSlot(currentCountry, currentSlotIdx);
  }
  function togglePlay() {
    if (playInterval) { clearInterval(playInterval); playInterval=null; playBtn.textContent='▶'; playBtn.classList.remove('playing'); }
    else { playBtn.textContent='⏸'; playBtn.classList.add('playing'); playInterval=setInterval(advance,playSpeed); }
  }
  playBtn.addEventListener('click', togglePlay);
  document.getElementById('speed-btn').addEventListener('click', () => {
    speedIdx=(speedIdx+1)%SPEEDS.length; playSpeed=SPEEDS[speedIdx];
    document.getElementById('speed-btn').textContent=SPEED_LABELS[speedIdx];
    if (playInterval) { clearInterval(playInterval); playInterval=setInterval(advance,playSpeed); }
  });

  // Boutons de granularité (Jour/Semaine/Mois/Année)
  document.querySelectorAll('.win-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.gran;
      if (!GRAN_SET.includes(g) || g === rankedGranularity) return;
      rankedGranularity = g;
      document.querySelectorAll('.win-btn').forEach(b => b.classList.toggle('active', b.dataset.gran === g));
      buildSlots();
      refreshSliderRange();
      loadSlot(currentCountry, currentSlotIdx);
    });
    btn.classList.toggle('active', btn.dataset.gran === rankedGranularity);
  });
  // ── Recherche ─────────────────────────────────────────────────────────────
  const searchInput = document.getElementById('search-input');

  // ── Comparaison max 2 objets ──────────────────────────────────────────────
  // Sélection persistante (entre slots) qui met en évidence 1 ou 2 objets
  // dans le graphe et leurs voisins, dim le reste. Couleurs distinctes
  // (cyan/rose) pour distinguer les 2 quand on en a 2.
  const COMPARE_COLORS = ['rgba(120,200,255,0.95)', 'rgba(255,120,200,0.95)'];
  const comparedNodes = new Map(); // nodeId → color slot index (0 ou 1)

  function compareColor(nodeId) {
    const idx = comparedNodes.get(nodeId);
    return idx == null ? null : COMPARE_COLORS[idx];
  }

  function toggleCompared(nodeId) {
    if (!nodeId) return;
    if (comparedNodes.has(nodeId)) {
      comparedNodes.delete(nodeId);
    } else {
      if (comparedNodes.size >= 2) {
        // Remplace le plus ancien (Map garde l'ordre d'insertion)
        const firstKey = comparedNodes.keys().next().value;
        comparedNodes.delete(firstKey);
      }
      // Trouve un slot couleur disponible
      const used = new Set(comparedNodes.values());
      const slot = used.has(0) ? 1 : 0;
      comparedNodes.set(nodeId, slot);
    }
    applyComparisonHighlight();
    renderCompareList();
    // Rerender Hot 10 pour mettre à jour les checkmarks
    renderHot10(Graph.graphData(), currentCountry);
  }

  function clearCompared() {
    comparedNodes.clear();
    applyComparisonHighlight();
    renderCompareList();
    renderHot10(Graph.graphData(), currentCountry);
  }

  // Met en évidence les nœuds comparés et leurs voisins directs;
  // dim le reste. Si aucun comparé et pas de focus, tout est highlighté.
  function applyComparisonHighlight() {
    const gd = Graph.graphData();
    if (!comparedNodes.size && !focusedNode) {
      (gd.nodes || []).forEach(n => { n._highlighted = true; });
      (gd.links || []).forEach(l => { l._highlighted = true; });
      return;
    }
    const keep = new Set(comparedNodes.keys());
    if (focusedNode) keep.add(focusedNode);
    // Ajoute les voisins directs
    (gd.links || []).forEach(l => {
      const s = l.source?.id ?? l.source;
      const t = l.target?.id ?? l.target;
      if (keep.has(s)) keep.add(t);
      if (keep.has(t)) keep.add(s);
    });
    (gd.nodes || []).forEach(n => { n._highlighted = keep.has(n.id); });
    (gd.links || []).forEach(l => {
      const s = l.source?.id ?? l.source;
      const t = l.target?.id ?? l.target;
      l._highlighted = (keep.has(s) && keep.has(t)) && (
        comparedNodes.has(s) || comparedNodes.has(t) ||
        focusedNode === s   || focusedNode === t
      );
    });
  }

  function renderCompareList() {
    const list = document.getElementById('compare-list');
    if (!list) return;
    list.innerHTML = '';
    const items = [...comparedNodes.entries()];
    items.forEach(([id, colorIdx]) => {
      const div = document.createElement('div');
      div.className = 'compare-item';
      div.innerHTML =
        `<span class="compare-swatch" style="background:${COMPARE_COLORS[colorIdx]};box-shadow:0 0 6px ${COMPARE_COLORS[colorIdx]}aa;"></span>` +
        `<span class="compare-name">${escapeHtml(id)}</span>` +
        `<button class="compare-rm" type="button" aria-label="Retirer">×</button>`;
      div.querySelector('.compare-rm').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCompared(id);
      });
      list.appendChild(div);
    });
  }

  // ── Search avec dropdown de suggestions (calque evolution.html) ──────────
  // Les suggestions couvrent TOUS les objets vus dans le pays sur la
  // période chargée (toutes périodes 4h confondues), pas seulement le
  // slot courant. Si l'objet sélectionné n'est pas dans le slot actuel,
  // on saute au slot le plus récent où il apparaît, puis on le compare.
  let _searchableCache = { country: null, ids: null };
  function getAllSearchableIds(country) {
    if (_searchableCache.country === country && _searchableCache.ids) {
      return _searchableCache.ids;
    }
    const ids = new Set();
    const cg = graphs[country] || {};
    for (const k in cg) {
      const g = cg[k];
      if (!g || !g.nodes) continue;
      for (const n of g.nodes) ids.add(n.id);
    }
    const list = [...ids].sort();
    _searchableCache = { country, ids: list };
    return list;
  }

  // Trouve le slot le plus récent où l'objet apparaît
  function findSlotIdxWithNode(country, nodeId) {
    for (let i = slots.length - 1; i >= 0; i--) {
      for (const pk of slots[i].periodKeys) {
        const g = graphs[country]?.[pk];
        if (g && (g.nodes || []).some(n => n.id === nodeId)) return i;
      }
    }
    return -1;
  }

  function renderSearchResults(q) {
    const resultsEl = document.getElementById('search-results');
    if (!resultsEl) return;
    resultsEl.innerHTML = '';
    if (!q.trim()) return;
    const ql = q.toLowerCase();
    // Pondère: matches qui commencent par la requête en premier
    const all = getAllSearchableIds(currentCountry);
    const starts = [];
    const contains = [];
    for (const id of all) {
      if (comparedNodes.has(id)) continue;
      const lo = id.toLowerCase();
      if (lo.startsWith(ql)) starts.push(id);
      else if (lo.includes(ql)) contains.push(id);
    }
    const matches = starts.concat(contains).slice(0, 10);

    // IDs présents dans le slot courant pour signaler les autres
    const inCurrentSlot = new Set((Graph.graphData().nodes || []).map(n => n.id));

    matches.forEach(id => {
      const div = document.createElement('div');
      div.className = 'evo-result';
      const inSlot = inCurrentSlot.has(id);
      div.innerHTML = inSlot
        ? escapeHtml(id)
        : `${escapeHtml(id)} <span style="color:rgba(120,160,210,0.5);font-size:9px;">↳ autre créneau</span>`;
      // mousedown au lieu de click: feu avant le blur de l'input
      div.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const input = document.getElementById('search-input');
        if (input) input.value = '';
        renderSearchResults('');
        if (!inSlot) {
          // Saute au slot le plus récent qui contient cet objet
          const targetSlot = findSlotIdxWithNode(currentCountry, id);
          if (targetSlot !== -1 && targetSlot !== currentSlotIdx) {
            currentSlotIdx = targetSlot;
            const sliderEl = document.getElementById('timeline');
            if (sliderEl) sliderEl.value = currentSlotIdx;
            // Pré-ajoute à compared AVANT loadSlot pour que loadSlot
            // applique le highlight directement sur le bon objet
            if (!comparedNodes.has(id)) {
              if (comparedNodes.size >= 2) {
                const firstKey = comparedNodes.keys().next().value;
                comparedNodes.delete(firstKey);
              }
              const used = new Set(comparedNodes.values());
              comparedNodes.set(id, used.has(0) ? 1 : 0);
            }
            loadSlot(currentCountry, currentSlotIdx);
            renderCompareList();
            return;
          }
        }
        toggleCompared(id);
      });
      resultsEl.appendChild(div);
    });
  }

  searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchInput.value = ''; renderSearchResults(''); searchInput.blur(); }
    e.stopPropagation();
  });
  // Cache les résultats quand on perd le focus (avec léger délai pour
  // permettre le clic sur une suggestion).
  searchInput.addEventListener('blur', () => {
    setTimeout(() => renderSearchResults(''), 180);
  });

  document.addEventListener('keydown', e => {
    if (document.activeElement === searchInput) return;
    if (e.key === '/') { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
    if      (e.key==='ArrowRight'){ currentSlotIdx = Math.min(currentSlotIdx + 1, slots.length - 1); slider.value = currentSlotIdx; loadSlot(currentCountry, currentSlotIdx); }
    else if (e.key==='ArrowLeft') { currentSlotIdx = Math.max(currentSlotIdx - 1, 0);                slider.value = currentSlotIdx; loadSlot(currentCountry, currentSlotIdx); }
    else if (e.key===' ')         { e.preventDefault(); togglePlay(); }
    else if (e.key==='Escape')    { if (comparedNodes.size) clearCompared(); else if (searchInput.value) { searchInput.value=''; renderSearchResults(''); } }
  });
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCountry = tab.dataset.country;
      _searchableCache = { country: null, ids: null }; // change de pays → invalide
      comparedNodes.clear();                              // pays différent → reset compare
      applyTimelineHeat(currentCountry);
      loadSlot(currentCountry, currentSlotIdx);
      renderCompareList();
    });
    tab.classList.toggle('active', tab.dataset.country === currentCountry);
  });

  // Lien Évolution: propage le pays + la granularité courants pour
  // continuité de session entre les deux vues.
  const evoLink = document.getElementById('link-evolution');
  if (evoLink) {
    evoLink.addEventListener('click', (e) => {
      e.preventDefault();
      const u = new URL(evoLink.href, window.location.href);
      u.searchParams.set('country', currentCountry);
      u.searchParams.set('gran', rankedGranularity);
      window.location.href = u.pathname + (u.search || '') + (u.hash || '');
    });
  }

  // Loading masqué tout de suite: l'utilisateur voit la simulation
  // placer les nœuds intelligemment dans l'espace, puis onEngineStop
  // cadre le tout dans la zone visible.
  document.getElementById('loading').style.display = 'none';
  applyTimelineHeat(currentCountry);
  loadSlot(currentCountry, currentSlotIdx);

  // ── Lien entrant ?node= ───────────────────────────────────────────────────
  const urlNode = urlParams.get('node');
  if (urlNode) setTimeout(() => {
    // Trouve le 1er match dans le slot courant et l'ajoute en compare
    const ql = String(urlNode).toLowerCase().trim();
    const gd = Graph.graphData();
    const m = (gd.nodes || []).find(n => n.id.toLowerCase().includes(ql));
    if (m) toggleCompared(m.id);
  }, 350);

  } catch(e) {
    document.getElementById('loading-text').textContent = 'ERREUR: ' + e.message;
    console.error(e);
  }
})();
</script>
<script src="./assets/js/shared-ticker.js"></script>
<script src="./assets/js/shared-menu.js"></script>
