<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/radar-data.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Constellation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/shared-menu.css" />
  <link rel="stylesheet" href="./assets/css/shared-ticker.css" />
  <script src="./assets/js/force-graph.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #00000f; font-family: 'Space Mono', 'SF Mono', monospace; overflow: hidden; height: 100vh; width: 100vw; }
    #constellation-bg {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 40%, rgba(62,98,198,0.17), rgba(5,10,36,0.05) 52%, rgba(0,0,15,0) 72%);
    }
    #constellation-bg::before,
    #constellation-bg::after {
      content: ''; position: absolute; inset: 0;
    }
    #constellation-bg::before {
      background-image:
        radial-gradient(circle at 12% 18%, rgba(170,200,255,0.34) 0 1.2px, transparent 1.4px),
        radial-gradient(circle at 28% 42%, rgba(150,188,255,0.28) 0 1px, transparent 1.2px),
        radial-gradient(circle at 62% 26%, rgba(160,196,255,0.3) 0 1px, transparent 1.2px),
        radial-gradient(circle at 79% 38%, rgba(140,180,255,0.26) 0 1px, transparent 1.2px),
        radial-gradient(circle at 38% 74%, rgba(170,205,255,0.24) 0 0.9px, transparent 1.1px),
        radial-gradient(circle at 86% 76%, rgba(170,205,255,0.2) 0 0.8px, transparent 1px);
      opacity: 0.55;
    }
    #constellation-bg::after {
      background: repeating-radial-gradient(circle at 50% 52%, rgba(85,135,255,0.12) 0 1px, rgba(85,135,255,0) 1px 11px);
      opacity: 0.34;
    }
    #graph { position: absolute; inset: 0; z-index: 1; }
    /* ========== PANNEAU GAUCHE (calque sur evolution.html) ========== */
    #left-panel {
      position: absolute; top: 0; left: 0; bottom: calc(var(--ticker-height, 44px) + 12px);
      width: 280px;
      display: flex; flex-direction: column; gap: 0;
      padding: 18px 14px 14px;
      background: linear-gradient(to right, rgba(0,0,15,0.96) 80%, transparent);
      z-index: 20; pointer-events: all;
      overflow: hidden;
    }
    #cst-titlebar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    #cst-title {
      font-family: 'Orbitron', 'Space Mono', monospace;
      font-size: 20px;
      letter-spacing: 2px; /* comme Évolution (sans le R+ devant), resserré pour que CONSTELLATION tienne */
      color: rgba(195, 220, 255, 0.92);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(90,140,255,0.36), 0 0 26px rgba(70,110,230,0.22);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
    }
    .lpanel-section {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 14px;
    }
    .lpanel-section#top10-section { flex: 1; min-height: 0; overflow: hidden; }
    .lpanel-label {
      font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase;
      color: rgba(100,140,200,0.45); padding-left: 1px;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    #country-tabs { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: all; }
    .tab {
      padding: 5px 14px; border: 1px solid rgba(100,150,255,0.3); border-radius: 3px;
      background: rgba(10,20,50,0.6); color: #7090c0; font-size: 11px;
      letter-spacing: 1.5px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .tab:hover  { border-color: rgba(100,150,255,0.7); color: #a0c0ff; }
    .tab.active { background: rgba(40,80,180,0.4); border-color: rgba(120,180,255,0.8); color: #d0e8ff; box-shadow: 0 0 12px rgba(80,130,255,0.3); }
    #tooltip {
      position: absolute; pointer-events: none;
      background: rgba(2,4,20,0.96); border: 1px solid rgba(80,120,255,0.35);
      border-radius: 4px; padding: 10px 14px; font-size: 12px; line-height: 1.6;
      display: none; z-index: 20; max-width: 220px;
    }
    #tooltip .n { color: #e8f4ff; font-weight: bold; font-size: 13px; }
    #tooltip .s { color: #6090e0; }
    #tooltip .m { color: #408060; }
    #controls {
      position: absolute; bottom: calc(var(--ticker-height, 44px) + 4px); left: 280px; right: 0;
      padding: 16px 24px 20px;
      background: linear-gradient(to top, rgba(0,0,15,0.96) 70%, transparent);
      z-index: 10;
    }
    #period-label { text-align: center; font-size: 13px; letter-spacing: 1px; color: #506080; margin-bottom: 10px; }
    #period-label span { color: #90b8e8; }
    #slider-row { display: flex; align-items: center; gap: 14px; }
    #prev-btn, #next-btn {
      background: none; border: 1px solid rgba(100,150,255,0.35); border-radius: 3px;
      color: #6080a0; font-size: 18px; padding: 2px 12px; cursor: pointer;
      transition: all 0.2s; flex-shrink: 0; line-height: 1.3;
      font-family: 'Space Mono', 'SF Mono', monospace;
    }
    #prev-btn:hover, #next-btn:hover { border-color: rgba(120,180,255,0.8); color: #b0d0ff; }
    #prev-btn:disabled, #next-btn:disabled { opacity: 0.32; cursor: default; }
    #prev-btn:disabled:hover, #next-btn:disabled:hover { border-color: rgba(100,150,255,0.35); color: #6080a0; }
    #timeline {
      flex: 1; -webkit-appearance: none; height: 2px;
      background: linear-gradient(to right, rgba(60,100,200,0.6), rgba(100,60,200,0.6));
      outline: none; border-radius: 2px; cursor: pointer;
    }
    #timeline::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: #7090ff; box-shadow: 0 0 10px rgba(80,120,255,1), 0 0 20px rgba(80,120,255,0.5); cursor: pointer;
    }
    #top10-country {
      font-family: 'Orbitron', 'Space Mono', monospace;
      font-size: 11px;
      color: rgba(200, 224, 255, 0.85);
      letter-spacing: 1.4px;
    }
    #top10-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    /* ── Période (calque sur evolution.html) ── */
    #window-row { display: flex; flex-wrap: wrap; gap: 4px; }
    /* Barre de filtres propre à la page, sous le menu du site, comme Évolution (Adrien, 1er nov. 2026) */
    :root { --filter-bar-h: 52px; }
    #filter-bar {
      position: absolute; top: 0; left: 0; right: 0; height: var(--filter-bar-h);
      display: flex; align-items: center; gap: 28px; padding: 0 22px;
      background: rgba(3,6,24,0.92); border-bottom: 1px solid rgba(80,130,255,0.18);
      z-index: 21; pointer-events: all; overflow: hidden;
    }
    .fbar-group { display: flex; align-items: center; gap: 10px; }
    .fbar-label { font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(100,140,200,0.55); white-space: nowrap; }
    #filter-bar #window-row { display: flex; flex-wrap: nowrap; gap: 5px; }
    #filter-bar #window-row .win-btn { flex: 0 0 auto; width: auto; padding: 6px 13px; font-size: 11px; letter-spacing: 1px; }
    #filter-bar #country-tabs .tab { padding: 6px 14px; }
    #period-nav-row { display: flex; align-items: center; gap: 12px; margin-left: auto; pointer-events: all; }
    #period-nav-row #prev-btn, #period-nav-row #next-btn { background: none; border: 1px solid rgba(100,150,255,0.3); border-radius: 3px; color: #6080a0; font-size: 16px; padding: 2px 10px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; line-height: 1.3; }
    #period-nav-row #prev-btn:hover, #period-nav-row #next-btn:hover { border-color: rgba(120,180,255,0.8); color: #b0d0ff; }
    #period-nav-row #prev-btn:disabled, #period-nav-row #next-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    #period-nav-label { font-family: 'Space Mono', monospace; text-align: center; min-width: 220px; white-space: nowrap; line-height: 1.3; }
    #period-label { display: flex; flex-direction: column; align-items: center; }
    #period-label .pn-date { font-size: 12px; letter-spacing: 1px; color: rgba(175,208,255,0.95); }
    #period-label .pn-sub { font-size: 9.5px; letter-spacing: 0.8px; color: rgba(110,150,210,0.65); }
    @media (max-width: 900px) { #filter-bar { flex-wrap: wrap; gap: 8px 18px; padding: 8px 14px; height: auto; } #period-nav-row { margin-left: 0; } }
    .cst-ev-art { display: none; margin: 4px 0 14px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(120,170,255,0.25); }
    .cst-ev-art.ok { display: block; }
    .cst-ev-art img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .cst-ev-art figcaption { font-size: 9px; color: rgba(160,190,240,0.75); padding: 5px 8px; background: rgba(2,0,16,0.6); }
    .mode-btn { padding: 8px 10px; border: 1px solid rgba(100,150,255,0.25); border-radius: 3px; background: rgba(10,20,50,0.5); color: rgba(100,140,200,0.7); font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; text-align: left; width: 100%; }
    .mode-btn:hover { border-color: rgba(100,150,255,0.6); color: #a0c0ff; }
    .mode-btn[data-mode="objects"].active { background: rgba(40,80,180,0.35); border-color: rgba(120,180,255,0.7); color: #d0e8ff; box-shadow: 0 0 10px rgba(80,130,255,0.25); }
    .mode-btn[data-mode="search"].active { background: rgba(20,72,52,0.38); border-color: rgba(80,200,140,0.65); color: rgba(140,230,185,0.95); box-shadow: 0 0 10px rgba(60,180,110,0.22); }
    /* Panneau de gauche selon le mode, comme Évolution : Événements = la liste des grandes histoires ;
       Hot 10 = la recherche puis le Hot 10 ; Recherche = la recherche et les objets suivis. */
    body.pm-events #search-section, body.pm-search #top10-section { display: none; }
    body.pm-events #top10-head, body:not(.pm-events) #events-head { display: none !important; }
    body.pm-events #events-head { display: block; }
    #mode-row { display: flex; flex-direction: column; gap: 4px; }
    .evt-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border: 1px solid rgba(90,130,250,0.18); border-radius: 5px; background: rgba(8,18,48,0.5); cursor: pointer; transition: border-color 0.15s, background 0.15s, opacity 0.15s; margin-bottom: 5px; }
    .evt-row:hover, .evt-row.focused { border-color: rgba(140,180,255,0.6); background: rgba(14,28,70,0.7); }
    .evt-rank { flex: 0 0 18px; height: 18px; border-radius: 50%; color: #00000f; font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
    .evt-main { flex: 1; min-width: 0; }
    .evt-title { font-size: 11px; line-height: 1.3; color: rgba(225,235,255,0.95); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .evt-meta { font-size: 9px; color: rgba(130,165,220,0.7); margin-top: 2px; }
    .evt-link { flex: 0 0 auto; color: rgba(140,180,255,0.7); text-decoration: none; font-size: 12px; padding: 0 2px; }
    .evt-link:hover { color: #fff; }
    .mode-btn[data-mode="events"].active { background: rgba(120,70,20,0.35); border-color: rgba(255,170,80,0.7); color: #ffe0b8; box-shadow: 0 0 10px rgba(255,160,60,0.22); }
    .win-btn {
      flex: 1 1 calc(50% - 2px);
      min-width: 0;
      padding: 5px 10px;
      border: 1px solid rgba(100,150,255,0.25);
      border-radius: 3px;
      background: rgba(10,20,50,0.5);
      color: rgba(140,180,220,0.85);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.2px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      text-align: center;
    }
    .win-btn:hover  { border-color: rgba(120,170,255,0.55); color: rgba(180,210,255,0.95); }
    .tab:disabled { opacity: 0.35; cursor: not-allowed; }
    .win-btn.active { border-color: rgba(120,180,255,0.75); background: rgba(30,60,150,0.40); color: #d0e8ff; box-shadow: 0 0 8px rgba(80,130,255,0.2); }
    #window-meta {
      font-size: 9px;
      letter-spacing: 0.7px;
      color: rgba(100,140,200,0.55);
      margin-top: 6px;
      padding-left: 1px;
    }

    /* ── Hot 10 row — calque exact sur evolution.html ── */
    .rleg-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      border: 1px solid rgba(90,130,250,0.14);
      border-radius: 5px;
      background: rgba(8,18,48,0.50);
      padding: 5px 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .rleg-item:hover, .rleg-item.hovered {
      border-color: rgba(145,182,255,0.55);
      background: rgba(20,36,86,0.65);
    }
    .rleg-item.focused {
      border-color: rgba(186,211,255,0.88);
      background: rgba(40,70,150,0.40);
      box-shadow: 0 0 8px rgba(90,135,255,0.28);
    }
    .rleg-item.tracked {
      border-color: rgba(120,200,255,0.65);
      background: rgba(18,52,90,0.55);
    }
    .rleg-item.dimmed { opacity: 0.40; }
    .rleg-swatch {
      width: 11px; height: 11px; border-radius: 50%;
      flex-shrink: 0; margin-top: 2px;
      background: rgba(120,160,220,0.55);
    }
    .rleg-swatch.level-extreme    { background: rgba(255,90,90,0.95);  box-shadow: 0 0 8px rgba(255,90,90,0.55); }
    .rleg-swatch.level-tres-eleve { background: rgba(255,160,80,0.92);  box-shadow: 0 0 6px rgba(255,160,80,0.5); }
    .rleg-swatch.level-eleve      { background: rgba(242,205,80,0.88);  box-shadow: 0 0 5px rgba(242,205,80,0.45); }
    .rleg-rank {
      font-size: 11px;
      color: rgba(110,150,210,0.65);
      flex-shrink: 0;
      min-width: 18px;
      text-align: right;
      padding-top: 1px;
    }
    .rleg-name {
      flex: 1;
      font-size: 13px;
      color: rgba(185,215,255,0.92);
      overflow: hidden;
      white-space: normal;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .rleg-alert-badge {
      font-family: 'Orbitron', monospace;
      font-size: 7px;
      letter-spacing: 0.6px;
      padding: 1px 5px;
      border-radius: 999px;
      flex-shrink: 0;
      text-transform: uppercase;
      align-self: center;
    }
    .rleg-alert-badge.level-extreme    { color: rgba(255,200,200,0.98); border: 1px solid rgba(255,110,110,0.7); background: rgba(138,29,29,0.6); }
    .rleg-alert-badge.level-tres-eleve { color: rgba(255,200,150,0.98); border: 1px solid rgba(255,160,80,0.6); background: rgba(138,72,24,0.55); }
    .rleg-alert-badge.level-eleve      { color: rgba(250,225,140,0.98); border: 1px solid rgba(242,205,80,0.55); background: rgba(122,100,32,0.50); }
    .rleg-val {
      font-size: 12px;
      color: rgba(140,180,255,0.78);
      flex-shrink: 0;
      min-width: 38px;
      text-align: right;
      padding-top: 1px;
    }
    .rleg-delta {
      font-size: 11px;
      flex-shrink: 0;
      min-width: 32px;
      text-align: right;
      letter-spacing: 0.3px;
      padding-top: 1px;
    }
    .rleg-delta.up   { color: rgba(80,220,140,0.85); }
    .rleg-delta.down { color: rgba(255,100,100,0.80); }
    .rleg-delta.flat { color: rgba(110,150,200,0.50); }
    .rleg-delta.new-entry { color: rgba(255, 220, 60, 0.92); }
    .rleg-delta.ret-entry { color: rgba(120, 200, 255, 0.88); }
    .rleg-check {
      font-size: 11px;
      color: rgba(120,200,255,0.85);
      flex-shrink: 0;
      width: 12px;
      text-align: center;
      padding-top: 1px;
    }

    /* ── Search dropdown (calque evolution.html) ── */
    #search-wrap { display: flex; flex-direction: column; gap: 4px; pointer-events: all; width: 100%; }
    #search-results {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 140px;
      overflow-y: auto;
      margin-top: 1px;
    }
    .evo-result {
      padding: 5px 8px;
      border-radius: 3px;
      background: rgba(8,18,48,0.62);
      border: 1px solid rgba(90,130,250,0.2);
      color: rgba(170,200,255,0.9);
      font-size: 10px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .evo-result:hover {
      border-color: rgba(145,182,255,0.7);
      color: #e0f0ff;
      background: rgba(20,36,86,0.7);
    }

    /* ── Liste de l'objet sélectionné ── */
    #compare-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .compare-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      border-radius: 4px;
      background: rgba(18,42,80,0.65);
      border: 1px solid rgba(120,180,255,0.5);
      font-size: 11px;
      color: rgba(220,235,255,0.95);
    }
    .compare-item .compare-swatch {
      width: 9px; height: 9px; border-radius: 50%;
      flex-shrink: 0;
    }
    .compare-item .compare-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .compare-item .compare-rm {
      border: none; background: none; cursor: pointer;
      color: rgba(190,90,90,0.75); font-size: 14px;
      line-height: 1; padding: 0 2px; flex-shrink: 0;
    }
    .compare-item .compare-rm:hover { color: rgba(255,120,120,0.95); }
    .top10-item {
      width: 100%;
      border: 1px solid rgba(90, 130, 250, 0.18);
      border-radius: 5px;
      background: rgba(8, 18, 48, 0.62);
      color: rgba(176, 206, 255, 0.95);
      text-align: left;
      padding: 7px 9px;
      cursor: pointer;
      transition: all 0.16s ease;
      font-family: 'Space Mono', 'SF Mono', monospace;
      font-size: 11px;
      line-height: 1.35;
    }
    .top10-item:hover {
      border-color: rgba(145, 182, 255, 0.75);
      background: rgba(20, 36, 86, 0.7);
      color: rgba(222, 236, 255, 1);
      transform: translateX(-2px);
    }
    .top10-item.active {
      border-color: rgba(186, 211, 255, 0.95);
      background: rgba(40, 74, 150, 0.42);
      color: rgba(239, 246, 255, 1);
      box-shadow: 0 0 10px rgba(90, 135, 255, 0.32);
    }
    .top10-rank {
      color: rgba(160, 195, 255, 0.88);
      margin-right: 8px;
      font-family: 'Orbitron', 'Space Mono', monospace;
    }
    .top10-score {
      display: block;
      color: rgba(126, 165, 245, 0.9);
      font-size: 10px;
      margin-top: 2px;
    }
    #top10-empty {
      color: rgba(104, 130, 182, 0.9);
      font-size: 11px;
      padding: 6px 2px;
    }
    #stats { display: none; }
    #focus-hint { display: none; }
    /* Slide-in panel (calque sur evolution.html, mais overlay
       transparent: on veut voir le réseau focusé en pleine clarté,
       pas dimmé). L'overlay sert seulement de zone de clic
       transparente pour fermer le panneau, pas à assombrir.
       Le panneau lui-même couvre 460px à droite — c'est suffisant
       pour signaler que la page est en mode focus. */
    #object-overlay {
      position: fixed; inset: 0; background: transparent;
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    #object-overlay.open { opacity: 1; pointer-events: auto; }
    #object-panel {
      position: fixed; top: 0; right: -460px; width: min(440px, 92vw);
      height: 100vh; z-index: 310;
      background: linear-gradient(175deg, rgba(6,12,38,0.98), rgba(3,6,20,0.99));
      border-left: 1px solid rgba(80,130,255,0.35);
      backdrop-filter: blur(20px);
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
      padding: 0;
    }
    #object-panel.open { right: 0; }
    #object-panel-header {
      position: sticky; top: 0; z-index: 2;
      background: linear-gradient(180deg, rgba(6,12,38,0.99) 80%, transparent);
      padding: 24px 24px 16px;
    }
    #object-panel-close {
      position: absolute; top: 16px; right: 16px;
      background: none; border: 1px solid rgba(80,130,255,0.35); border-radius: 4px;
      color: #cbe0ff; font-size: 18px; width: 32px; height: 32px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    #object-panel-close:hover { border-color: rgba(140,180,255,0.85); color: #fff; }
    #object-panel .h {
      font-family: 'Orbitron', sans-serif; font-size: 16px;

<script>
(async () => {
  try {
  // ── Données ───────────────────────────────────────────────────────────────
  let graphData;
  try {
    // Données découpées (#59) : la fenêtre « graph » (14 jours, liens et
    // événements) est recomposée depuis days/ et articles/ par radar-data.js.
    graphData = await window.radarData.graph();
  } catch(e) {
    const loading = document.getElementById('loading-text');
    if (window.location.protocol === 'file:') {
      loading.textContent = 'ouvrir via http://localhost (pas file://) — ex: ./run_chrome.sh';
    } else {
      loading.textContent = 'fichiers introuvables — lancer build_data.R (' + e.message + ')';
    }
    return;
  }
  let graphs  = graphData.graphs;
  let periods = graphData.meta.periods;
  const countries = graphData.meta.countries;

  const TOP_LABELS     = Number.POSITIVE_INFINITY;
  const MAX_LINKS_NODE = 5;

  // ── Couleurs ──────────────────────────────────────────────────────────────
  // Échelle RELATIVE à la période affichée (indice spec v1, borné et saturant :
  // les 30 objets d'une journée ont des cumuls proches, une échelle absolue les
  // rendrait tous égaux). sizeScale est recalculé à chaque slot chargé.
  let sizeScale = { min: 0, max: 1 };
  function updateSizeScale(nodes) {
    const v = (nodes || []).map(n => Number(n.size) || 0);
    sizeScale = v.length ? { min: Math.min(...v), max: Math.max(...v) } : { min: 0, max: 1 };
  }
  function relSize(s) {
    const span = sizeScale.max - sizeScale.min;
    if (!(span > 0)) return 1;
    return Math.max(0, Math.min(1, ((Number(s) || 0) - sizeScale.min) / span));
  }
  function sizeToT(s) { return Math.pow(relSize(s), 0.7); }
  let evScale = { min: 0, max: 1 }, obScale = { min: 0, max: 1 };
  function relIn(sc, s) { const span = sc.max - sc.min; if (!(span > 0)) return 1; return Math.max(0, Math.min(1, ((Number(s) || 0) - sc.min) / span)); }
  function scaleOf(list) { const v = list.map(n => Number(n.size) || 0); return v.length ? { min: Math.min(...v), max: Math.max(...v) } : { min: 0, max: 1 }; }
  function nodeRadius(n) {
    if (n.kind === 'event') return 10 + 15 * Math.pow(relIn(evScale, n.size), 1.1);
    if (n.kind === 'object') return 3 + 3.5 * Math.pow(relIn(obScale, n.size), 1.1);
    return 5 + 27 * Math.pow(relSize(n.size), 1.5);
  }
  // Couleurs de la carte mixte : un événement prend la couleur de son niveau (meilleure édition),
  // un objet reste un petit astre bleu pâle.
  const BAND_RGB = { aucune: [140,155,190], faible: [127,147,184], moderee: [95,168,255], elevee: [242,201,76], tres_elevee: [255,159,67], extreme: [255,77,77] };
  function kindRGB(n) { return n.kind === 'event' ? (BAND_RGB[n.band] || BAND_RGB.aucune) : [175,195,255]; }

  function nodeRGB(size) {
    const t = sizeToT(size);
    return [Math.round(160 + t*95), Math.round(190 - t*30), Math.round(255 - t*210)];
  }

  function nodeColorStr(size, hl) {
    if (hl === false) return 'rgba(25,30,60,0.5)';
    const [r,g,b] = nodeRGB(size);
    return `rgb(${r},${g},${b})`;
  }

  function linkColorStr(val, hl) {
    if (hl === false) return 'rgba(30,45,105,0.28)';
    const t = Math.min(1, Math.log((val||1)+1) / Math.log(12));
    return `rgba(${Math.round(65+t*130)},${Math.round(80+t*28)},${Math.round(210+t*45)},${(0.34+t*0.46).toFixed(2)})`;
  }

  // ── Anti-hairball ─────────────────────────────────────────────────────────
  function filterTopLinks(links, max) {
    const m = new Map();
    links.forEach(l => {
      [l.source, l.target].forEach(k => { if (!m.has(k)) m.set(k,[]); m.get(k).push(l); });
    });
    const kept = new Set();
    m.forEach(ls => { ls.sort((a,b)=>b.value-a.value); ls.slice(0,max).forEach(l=>kept.add(l)); });
    return [...kept];
  }


  function getGD(country, key) {
    const g = graphs[country]?.[key];
    if (!g) return { nodes: [], links: [] };
    const nodes = g.nodes.map(n => ({ ...n }));
    const links = g.links.map(l => ({ ...l }));
    nodes.sort((a, b) => b.size - a.size);
    nodes.forEach((n, i) => { n._rank = i; });
    return { nodes, links: filterTopLinks(links, MAX_LINKS_NODE) };
  }

  function periodConvergenceScore(country, key) {
    const g = graphs[country]?.[key];
    if (!g || !Array.isArray(g.nodes) || !g.nodes.length) return 0;

    const sizes = g.nodes.map(n => Number(n.size) || 0).sort((a, b) => b - a);
    const ultra = sizes.slice(0, 3).reduce((a, b) => a + b, 0);
    const linksStrong = (g.links || []).reduce((acc, l) => acc + Math.max(0, (Number(l.value) || 0) - 1), 0);
    const density = linksStrong / Math.max(1, g.nodes.length);

    // Score synthétique: salience ultra + convergence de cooccurrence.
    return ultra * 0.75 + linksStrong * 0.95 + density * 1.6;
  }

  function heatColor(t) {
    const tt = Math.max(0, Math.min(1, t));
    const r = Math.round(30 + tt * 130);
    const g = Math.round(50 + tt * 165);
    const b = Math.round(115 + tt * 125);
    const a = (0.30 + tt * 0.70).toFixed(2);
    return `rgba(${r},${g},${b},${a})`;
  }

  // Score de convergence d'un slot = moyenne des scores de ses blocs 4h.
  // Utilisé pour le label "convergence X.X" du créneau courant.
  function slotConvergenceScore(country, slot) {
    if (!slot || !slot.periodKeys.length) return 0;
    let sum = 0, count = 0;
    for (const pk of slot.periodKeys) {
      const c = periodConvergenceScore(country, pk);
      if (Number.isFinite(c) && c > 0) { sum += c; count++; }
    }
    return count > 0 ? sum / count : 0;
  }

  // Convergence agrégée par jour calendrier — pour la barre temporelle.
  // Indépendante de la granularité de slot: la heat reflète toujours
  // l'activité réelle dans le temps, pas le découpage Jour/Sem/Mois/Total.
  function getDailyConvergenceScores(country) {
    const byDay = new Map();
    for (const p of periods) {
      const ds = String(p.key).split('_')[0];
      const c = periodConvergenceScore(country, p.key);
      if (!Number.isFinite(c) || c <= 0) continue;
      if (!byDay.has(ds)) byDay.set(ds, { sum: 0, count: 0 });
      const e = byDay.get(ds);
      e.sum += c;
      e.count++;
    }
    return [...byDay.entries()]
      .map(([ds, { sum, count }]) => ({ date: ds, score: count ? sum / count : 0 }))
      .sort((a, b) => a.date.localeCompare(b.date))
      .map(d => d.score);
  }

  function applyTimelineHeat(country) {
    const scores = getDailyConvergenceScores(country);
    if (!scores.length) return;
    const min = Math.min(...scores);
    const max = Math.max(...scores);
    const denom = Math.max(1e-9, max - min);
    const norm = scores.map(s => (s - min) / denom);

    if (scores.length === 1) {
      slider.style.background = `linear-gradient(to right, ${heatColor(norm[0])}, ${heatColor(norm[0])})`;
      slider.dataset.convScores = JSON.stringify(scores);
      return;
    }

    const stops = [];
    for (let i = 0; i < norm.length; i++) {
      const start = i === 0 ? 0 : ((i - 0.5) / (norm.length - 1)) * 100;
      const end = i === norm.length - 1 ? 100 : ((i + 0.5) / (norm.length - 1)) * 100;
      const c = heatColor(norm[i]);
      stops.push(`${c} ${start.toFixed(2)}%`, `${c} ${end.toFixed(2)}%`);
    }
    slider.style.background = `linear-gradient(to right, ${stops.join(',')})`;
    slider.dataset.convScores = JSON.stringify(scores);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>'"]/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  function renderArticlesPanel(node) {
    const panel   = document.getElementById('object-panel');
    const overlay = document.getElementById('object-overlay');
    const titleEl = document.getElementById('object-panel-title');
    const metaEl  = document.getElementById('object-panel-meta');
    const linksEl = document.getElementById('object-panel-links');
    const bodyEl  = document.getElementById('object-panel-body');

    if (!node) {
      panel.classList.remove('open');
      overlay.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      // On ne vide pas le contenu tout de suite pour conserver une
      // animation de sortie propre (le panneau slide à droite).
      return;
    }

    if (node.kind === 'event') { renderEventPanel(node, panel, overlay, titleEl, metaEl, linksEl, bodyEl); return; }
    const articles = Array.isArray(node.articles) ? node.articles : [];
    titleEl.textContent = node.label || node.id;
    metaEl.textContent  = `${(Number(node.size) || 0).toFixed(1)} pts · ${node.n || 0} mentions · ${articles.length} article${articles.length > 1 ? 's' : ''}`;

    const evolutionUrl = `./evolution.html?country=${encodeURIComponent(currentCountry)}&gran=${encodeURIComponent(rankedGranularity)}&nodes=${encodeURIComponent(node.id)}&mode=tracking`;
    var Tcst = window.t || function(k){ return k; };
    linksEl.innerHTML = `<a class="panel-link" href="${escapeHtml(evolutionUrl)}">${escapeHtml(Tcst('object_panel.view_in_evolution'))}</a>`;

    function articleHtml(a) {
      const title = escapeHtml(a.title || a.url || 'Article');
      const url   = escapeHtml(a.url || '#');
      const media = a.media_id ? `<div class="article-item-media">${escapeHtml(a.media_id)}</div>` : '';
      return `<a class="article-item" href="${url}" target="_blank" rel="noopener noreferrer">${media}<div class="article-item-title">${title}</div></a>`;
    }

    // Articles du créneau courant
    const seenUrls = new Set();
    const currentArticlesHtml = [];
    articles.forEach(a => {
      if (a && a.url && !seenUrls.has(a.url)) {
        seenUrls.add(a.url);
        currentArticlesHtml.push(articleHtml(a));
      }
    });

    let html = currentArticlesHtml.length
      ? currentArticlesHtml.join('')
      : '<div class="empty">' + escapeHtml(Tcst('object_panel.no_articles_period')) + '</div>';

    // Section "Précédemment": parcourt les slots antérieurs au courant,
    // récupère les articles de cet objet (dédupliqués par URL globalement).
    const prevGroups = [];
    for (let si = currentSlotIdx - 1; si >= 0 && prevGroups.length < 8; si--) {
      const prevSlot = slots[si];
      if (!prevSlot) continue;
      const fresh = [];
      for (const pk of prevSlot.periodKeys) {
        const g = graphs[currentCountry]?.[pk];
        if (!g) continue;
        const pn = (g.nodes || []).find(n => n.id === node.id);
        if (!pn || !Array.isArray(pn.articles)) continue;
        for (const a of pn.articles) {
          if (a && a.url && !seenUrls.has(a.url)) {
            seenUrls.add(a.url);
            fresh.push(a);
          }
        }
      }
      if (fresh.length) {
        prevGroups.push({ label: prevSlot.label, articles: fresh });
      }
    }

    if (prevGroups.length) {
      html += '<div class="article-section-header">' + escapeHtml(Tcst('object_panel.previous_section')) + '</div>';
      prevGroups.forEach(g => {
        html += `<div class="article-period-label">${escapeHtml(g.label)}</div>`;
        html += g.articles.map(articleHtml).join('');
      });
    }

    bodyEl.innerHTML = html;

    panel.classList.add('open');
    overlay.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
  }

  // ── Étoiles ───────────────────────────────────────────────────────────────
  const STARS = Array.from({length: 400}, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.3 + 0.15,
    a: Math.random() * 0.45 + 0.08,
    tw: Math.random() * Math.PI * 2,
    ts: 0.003 + Math.random() * 0.007
  }));

  // ── Graphe 2D ─────────────────────────────────────────────────────────────
  const graphEl = document.getElementById('graph');
  const Graph = ForceGraph()(graphEl);
  const setIfFn = (name, value) => {
    if (typeof Graph[name] === 'function') Graph[name](value);
  };

  setIfFn('width', window.innerWidth);
  setIfFn('height', window.innerHeight);
  setIfFn('backgroundColor', '#00000f');
  // Constellation explorable: zoom et pan activés (avec bornes), drag
  // des nœuds désactivé (on ne veut pas que l'utilisateur casse le
  // layout). minZoom 0.4 et maxZoom 6 → l'utilisateur peut zoomer
  // jusqu'à 6× pour inspecter de près, et dézoomer modérément avant
  // que ce ne devienne illisible. Le fit (onEngineStop) recadre
  // automatiquement à chaque changement de slot.
  setIfFn('enableZoomInteraction', true);
  setIfFn('enablePanInteraction', true);
  setIfFn('enableNodeDrag', false);
  setIfFn('minZoom', 0.4);
  setIfFn('maxZoom', 6);
  // 180 ticks (~3s à 60fps) — animation longue assez pour être lue
  // comme un placement intelligent, courte assez pour ne pas faire
  // attendre. onEngineStop fige et cadre avec une transition douce.
  setIfFn('cooldownTicks', 180);
  setIfFn('onEngineStop', () => fitGraphToView(900));
  // Nœuds par défaut (cercles) — couleur + taille via API standard
  setIfFn('nodeColor', n => {
    // Couleur distincte pour les objets comparés (cyan ou rose)
    const c = compareColor(n.id);
    if (c) return c;

    Graph.graphData(gd);
    // Si on a des objets comparés, ré-applique le highlight.
    if (comparedNodes.size) applyComparisonHighlight();
    // Le cadrage final se fait dans onEngineStop, après stabilisation.

    // Convergence du créneau (cohérente avec la heat de la timeline)
    const convAvg = slotConvergenceScore(country, slot);
    var Tlbl = window.t || function(k){ return k; };
    const edTxt = slot.periods.length + ' ' + escapeHtml(Tlbl(slot.periods.length > 1 ? 'constellation.editions' : 'constellation.edition'));
    if (viewMode === 'events') document.getElementById('period-label').innerHTML =
      `<span class="pn-date">${escapeHtml(slot.label)}</span><span class="pn-sub">${edTxt} · ${gd.nEvents} ${escapeHtml(Tlbl(gd.nEvents === 1 ? 'constellation.event' : 'constellation.events'))} · ${gd.nObjects} ${escapeHtml(Tlbl('common.objects'))}</span>`;
    else document.getElementById('period-label').innerHTML =
      `<span class="pn-date">${escapeHtml(slot.label)}</span><span class="pn-sub">${edTxt} · ${gd.nodes.length} ${escapeHtml(gd.nodes.length === 1 ? Tlbl('common.object') : Tlbl('common.objects'))} · ${gd.links.length} ${escapeHtml(Tlbl('common.links'))} · ${escapeHtml(Tlbl('common.convergence'))} ${convAvg.toFixed(1)}</span>`;

    const metaEl = document.getElementById('window-meta');
    if (metaEl) {
      const blocks = slot.periods.length;
      metaEl.textContent = `${slot.label} · ${blocks} ${(window.t || (k => k))(blocks > 1 ? 'constellation.editions' : 'constellation.edition')}`;
    }

    if (viewMode === 'events') renderEventsList(gd); else renderHot10(gd, country);
    document.getElementById('focus-hint').classList.remove('visible');
    renderArticlesPanel(null);
  }

  // Récupère les états d'alerte de la PÉRIODE COURANTE (dernier bloc 4h
  // du slot affiché). Pour le Hot 10, on signale ce qui est en alerte
  // EN CE MOMENT, pas le pire niveau jamais atteint dans le slot — bien
  // plus parlant et cohérent avec evolution.html.
  function currentPeriodAlertMap(country, slot) {
    const map = new Map();
    if (!slot || !slot.periodKeys.length) return map;
    const lastKey = slot.periodKeys[slot.periodKeys.length - 1];
    const g = graphs[country]?.[lastKey];
    if (!g) return map;
    for (const n of (g.nodes || [])) {
      const lvl = deriveLevel(country, Number(n.size));
      if (lvl !== 'none') map.set(n.id, lvl);
    }
    return map;
  }

  // Hot 10 — format calqué sur evolution.html (.rleg-item) avec swatch
  // coloré (selon alerte courante), valeur de saillance, delta vs slot
  // précédent.
  const ALERT_BADGE_LABELS = (function() {
    const out = {};
    ['extreme','tres_eleve'].forEach(function(k) { // plus de niveau « élevé » (Adrien, 31 oct. 2026)
      const v = window.t ? window.t('alertes.level_short.' + k) : null;
      out[k] = (v && v !== 'alertes.level_short.' + k) ? v : k;
    });
    return out;
  })();
  function renderHot10(gd, country) {
    const list = document.getElementById('top10-list');
    const countryEl = document.getElementById('top10-country');
    countryEl.textContent = country;

    const top = (gd.nodes || []).slice(0, 10);
    if (!top.length) {
      list.innerHTML = '<div id="top10-empty">' + escapeHtml((window.t || function(k){return k;})('constellation.no_objects')) + '</div>';
      return;
    }

    const alertMap = currentPeriodAlertMap(country, slots[currentSlotIdx]);
    const prevNodes = prevSlotNodes(country);
    const prevRanks = new Map();
    if (prevNodes) prevNodes.slice(0, 10).forEach((n, i) => prevRanks.set(n.id, i + 1));

    list.innerHTML = '';
    top.forEach((n, i) => {
      const lvl = alertMap.get(n.id);
      const isCompared = comparedNodes.has(n.id);
      const isFocused  = focusedNode === n.id;

      const item = document.createElement('div');
      item.className = 'rleg-item'
        + (isFocused ? ' focused' : '')
        + (isCompared ? ' tracked' : '');
      item.dataset.nodeId = n.id;

      let deltaTxt = '', deltaClass = 'flat';
      const prevRank = prevRanks.get(n.id);
      if (prevRank == null) {
        if (prevNodes && prevNodes.length) { deltaTxt = 'NVX'; deltaClass = 'new-entry'; }
      } else {
        const d = prevRank - (i + 1);
        if (d > 0)      { deltaTxt = `↑${d}`; deltaClass = 'up'; }
        else if (d < 0) { deltaTxt = `↓${Math.abs(d)}`; deltaClass = 'down'; }
        else            { deltaTxt = '='; deltaClass = 'flat'; }
      }

      const lvlCss = lvl ? lvl.replace(/_/g, '-') : null;
      const swatchClass = lvlCss ? `rleg-swatch level-${lvlCss}` : 'rleg-swatch';
      const badgeHtml = lvl
        ? `<span class="rleg-alert-badge level-${escapeHtml(lvlCss)}">${escapeHtml(ALERT_BADGE_LABELS[lvl] || lvl)}</span>`
        : '';
      const checkHtml = isCompared ? '<span class="rleg-check">✓</span>' : '';

      item.innerHTML =
        `<div class="${swatchClass}"></div>` +
        `<span class="rleg-rank">${i + 1}.</span>` +
        `<span class="rleg-name" title="${escapeHtml(n.id)}">${escapeHtml(n.id)}</span>` +
        badgeHtml +
        checkHtml +
        `<span class="rleg-val">${(Number(n.size) || 0).toFixed(1)}</span>` +
        `<span class="rleg-delta ${deltaClass}">${deltaTxt}</span>`;

      item.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCompared(n.id);
      });
      list.appendChild(item);
    });
  }

  function setTop10Active(nodeId) {
    document.querySelectorAll('.rleg-item').forEach(btn => {
      btn.classList.toggle('focused', !!nodeId && btn.dataset.nodeId === nodeId);
    });
  }

  function focusNodeById(nodeId) {
    const gd = Graph.graphData();
    const node = (gd.nodes || []).find(n => n.id === nodeId);
    if (!node) return;

    focusedNode = node.id;
    const nb = new Set([node.id]);
    (gd.links || []).forEach(l => {
      const s=l.source?.id??l.source, t=l.target?.id??l.target;
      if(s===node.id) nb.add(t); if(t===node.id) nb.add(s);
    });

    (gd.nodes || []).forEach(n => { n._highlighted = nb.has(n.id); });
    (gd.links || []).forEach(l => {
      const s=l.source?.id??l.source, t=l.target?.id??l.target;
      l._highlighted=(s===node.id||t===node.id);
    });

    document.getElementById('focus-name').textContent = node.label || node.id;
    document.getElementById('focus-hint').classList.add('visible');
    document.getElementById('tooltip').style.display = 'none';
    renderArticlesPanel(node);
    setTop10Active(node.id);
    // Pan le nœud focusé au centre-gauche pour libérer l'espace du
    // panneau slide-in qui occupe les 460px à droite.
    panToNodeLeftCenter(node, 500);
  }

  let hoverDim = false;
  function setHoverDim(node) {
    const gd = Graph.graphData();
    if (!node) { if (hoverDim) { gd.nodes.forEach(n => { n._highlighted = true; }); gd.links.forEach(l => { l._highlighted = true; }); } hoverDim = false; return; }
    const nb = new Set([node.id]);
    gd.links.forEach(l => { const s = l.source?.id ?? l.source, t = l.target?.id ?? l.target; if (s === node.id) nb.add(t); if (t === node.id) nb.add(s); });
    gd.nodes.forEach(n => { n._highlighted = nb.has(n.id); });
    gd.links.forEach(l => { const s = l.source?.id ?? l.source, t = l.target?.id ?? l.target; l._highlighted = s === node.id || t === node.id; });
    hoverDim = true;
  }
  function handleHover(node) {
    const tt = document.getElementById('tooltip');
    if (viewMode === 'events' && !focusedNode && !comparedNodes.size) setHoverDim(node);
    if (!node || focusedNode) { tt.style.display='none'; return; }
    tt.style.display = 'block';
    if (node.kind === 'event') { const T0 = window.t || (k => k); tt.innerHTML = `<div class="n">${escapeHtml(node.label)}</div><div class="s">${node.size.toFixed(1)} ${escapeHtml(T0('constellation.ev_points'))}</div><div class="m">${escapeHtml(T0('aune.band.' + node.band))}</div><div class="m">${escapeHtml((node.media || []).join(' · '))}</div>`; return; }
    tt.innerHTML = `<div class="n">${escapeHtml(node.label || node.id)}</div>
      <div class="s">saillance &nbsp;${node.size.toFixed(2)}</div>
      <div class="m">mentions &nbsp;&nbsp;${node.n}</div>
      <div class="m">articles &nbsp;&nbsp;&nbsp;${(node.articles || []).length}</div>`;
  }
  document.addEventListener('mousemove', e => {
    const tt = document.getElementById('tooltip');
    if (tt.style.display === 'block') {
      tt.style.left = Math.min(e.clientX+16, window.innerWidth-240)+'px';
      tt.style.top  = Math.min(e.clientY-10, window.innerHeight-120)+'px';
    }
  });

  function handleClick(node) {
    lastNodeClickTs = Date.now();
    if (focusedNode === node.id) {
      clearFocusAndRecenter();
    } else {
      focusNodeById(node.id);
    }
  }

  // Clic en arrière-plan du graphe: fermer le panneau + recentrer tout.
  graphEl.addEventListener('click', (e) => {
    if (!focusedNode) return;
    if (Date.now() - lastNodeClickTs < 250) return;
    clearFocusAndRecenter();
  });

  // Double-clic sur le fond: recadre le graphe entier (utile pour
  // revenir à la vue d'ensemble après avoir zoomé/pané).
  graphEl.addEventListener('dblclick', () => {
    if (Date.now() - lastNodeClickTs < 250) return;
    fitGraphToView(500);
  });

  // Fermeture explicite du panneau slide-in (bouton × et clic overlay)
  const panelCloseBtn = document.getElementById('object-panel-close');
  const panelOverlay  = document.getElementById('object-overlay');
  if (panelCloseBtn) panelCloseBtn.addEventListener('click', () => clearFocusAndRecenter());
  if (panelOverlay)  panelOverlay.addEventListener('click', () => clearFocusAndRecenter());

  // Initialise les slots à la granularité courante
  buildSlots();

  const slider = document.getElementById('timeline');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  function refreshSliderRange() {
    slider.max = Math.max(0, slots.length - 1);
    slider.value = currentSlotIdx;
    if (prevBtn) prevBtn.disabled = currentSlotIdx <= 0;
    if (nextBtn) nextBtn.disabled = currentSlotIdx >= slots.length - 1;
  }
  refreshSliderRange();
  slider.addEventListener('input', () => {
    currentSlotIdx = +slider.value;
    loadSlot(currentCountry, currentSlotIdx);
    refreshSliderRange();
  });

  function step(delta) {
    const target = Math.max(0, Math.min(slots.length - 1, currentSlotIdx + delta));
    if (target === currentSlotIdx) return;
    currentSlotIdx = target;
    slider.value = currentSlotIdx;
    loadSlot(currentCountry, currentSlotIdx);
    refreshSliderRange();
  }
  if (prevBtn) prevBtn.addEventListener('click', () => step(-1));
  if (nextBtn) nextBtn.addEventListener('click', () => step(+1));

  // Boutons de granularité (Jour/Semaine/Mois/Année)
  document.querySelectorAll('.win-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.gran;
      if (!GRAN_SET.includes(g) || g === rankedGranularity) return;
      rankedGranularity = g;
      document.querySelectorAll('.win-btn').forEach(b => b.classList.toggle('active', b.dataset.gran === g));
      buildSlots();
      refreshSliderRange();
      loadSlot(currentCountry, currentSlotIdx);
    });
    btn.classList.toggle('active', btn.dataset.gran === rankedGranularity);
  });
  // ── Recherche ─────────────────────────────────────────────────────────────
  const searchInput = document.getElementById('search-input');

  // ── Sélection d'un objet à mettre en évidence ────────────────────────────
  // Sélection persistante entre slots (1 objet max), met en évidence
  // l'objet et ses voisins directs dans le graphe, dim le reste.
  const COMPARE_COLORS = ['rgba(120,200,255,0.95)'];
  const comparedNodes = new Map(); // nodeId → 0

  function compareColor(nodeId) {
    return comparedNodes.has(nodeId) ? COMPARE_COLORS[0] : null;
  }

  function toggleCompared(nodeId) {
    if (!nodeId) return;
    if (comparedNodes.has(nodeId)) {
      comparedNodes.delete(nodeId);
    } else {
      // Un seul objet sélectionné à la fois — vider la sélection avant
      comparedNodes.clear();
      comparedNodes.set(nodeId, 0);
    }
    applyComparisonHighlight();
    renderCompareList();
    renderHot10(Graph.graphData(), currentCountry);
  }

  function clearCompared() {
    comparedNodes.clear();
    applyComparisonHighlight();
    renderCompareList();
    renderHot10(Graph.graphData(), currentCountry);
  }

  // Met en évidence les nœuds comparés et leurs voisins directs;
  // dim le reste. Si aucun comparé et pas de focus, tout est highlighté.
  function applyComparisonHighlight() {
    const gd = Graph.graphData();
    if (!comparedNodes.size && !focusedNode) {
      (gd.nodes || []).forEach(n => { n._highlighted = true; });
      (gd.links || []).forEach(l => { l._highlighted = true; });
      return;
    }
    const keep = new Set(comparedNodes.keys());
    if (focusedNode) keep.add(focusedNode);
    // Ajoute les voisins directs
    (gd.links || []).forEach(l => {
      const s = l.source?.id ?? l.source;
      const t = l.target?.id ?? l.target;
      if (keep.has(s)) keep.add(t);
      if (keep.has(t)) keep.add(s);
    });
    (gd.nodes || []).forEach(n => { n._highlighted = keep.has(n.id); });
    (gd.links || []).forEach(l => {
      const s = l.source?.id ?? l.source;
      const t = l.target?.id ?? l.target;
      l._highlighted = (keep.has(s) && keep.has(t)) && (
        comparedNodes.has(s) || comparedNodes.has(t) ||
        focusedNode === s   || focusedNode === t
      );
    });
  }

  function renderCompareList() {
    const list = document.getElementById('compare-list');
    if (!list) return;
    list.innerHTML = '';
    const items = [...comparedNodes.entries()];
    items.forEach(([id, colorIdx]) => {
      const div = document.createElement('div');
      div.className = 'compare-item';
      div.innerHTML =
        `<span class="compare-swatch" style="background:${COMPARE_COLORS[colorIdx]};box-shadow:0 0 6px ${COMPARE_COLORS[colorIdx]}aa;"></span>` +
        `<span class="compare-name">${escapeHtml(id)}</span>` +
        `<button class="compare-rm" type="button" aria-label="Retirer">×</button>`;
      div.querySelector('.compare-rm').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCompared(id);
      });
      list.appendChild(div);
    });
  }

  // ── Search avec dropdown de suggestions (calque evolution.html) ──────────
  // Les suggestions couvrent TOUS les objets vus dans le pays sur la
  // période chargée (toutes périodes 4h confondues), pas seulement le
  // slot courant. Si l'objet sélectionné n'est pas dans le slot actuel,
  // on saute au slot le plus récent où il apparaît, puis on le compare.
  let _searchableCache = { country: null, ids: null };
  function getAllSearchableIds(country) {
    if (_searchableCache.country === country && _searchableCache.ids) {
      return _searchableCache.ids;
    }
    const ids = new Set();
    const cg = graphs[country] || {};
    for (const k in cg) {
      const g = cg[k];
      if (!g || !g.nodes) continue;
      for (const n of g.nodes) ids.add(n.id);
    }
    const list = [...ids].sort();
    _searchableCache = { country, ids: list };
    return list;
  }

  // Trouve le slot le plus récent où l'objet apparaît
  function findSlotIdxWithNode(country, nodeId) {
    for (let i = slots.length - 1; i >= 0; i--) {
      for (const pk of slots[i].periodKeys) {
        const g = graphs[country]?.[pk];
        if (g && (g.nodes || []).some(n => n.id === nodeId)) return i;
      }
    }
    return -1;
  }

  function renderSearchResults(q) {
    const resultsEl = document.getElementById('search-results');
    if (!resultsEl) return;
    resultsEl.innerHTML = '';
    if (!q.trim()) return;
    const ql = q.toLowerCase();
    // Pondère: matches qui commencent par la requête en premier
    const all = getAllSearchableIds(currentCountry);
    const starts = [];
    const contains = [];
    for (const id of all) {
      if (comparedNodes.has(id)) continue;
      const lo = id.toLowerCase();
      if (lo.startsWith(ql)) starts.push(id);
      else if (lo.includes(ql)) contains.push(id);
    }
    const matches = starts.concat(contains).slice(0, 10);

    // IDs présents dans le slot courant pour signaler les autres
    const inCurrentSlot = new Set((Graph.graphData().nodes || []).map(n => n.id));

    matches.forEach(id => {
      const div = document.createElement('div');
      div.className = 'evo-result';
      const inSlot = inCurrentSlot.has(id);
      div.innerHTML = inSlot
        ? escapeHtml(id)
        : `${escapeHtml(id)} <span style="color:rgba(120,160,210,0.5);font-size:9px;">↳ autre créneau</span>`;
      // mousedown au lieu de click: feu avant le blur de l'input
      div.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const input = document.getElementById('search-input');
        if (input) input.value = '';
        renderSearchResults('');
        if (!inSlot) {
          // Saute au slot le plus récent qui contient cet objet
          const targetSlot = findSlotIdxWithNode(currentCountry, id);
          if (targetSlot !== -1 && targetSlot !== currentSlotIdx) {
            currentSlotIdx = targetSlot;
            const sliderEl = document.getElementById('timeline');
            if (sliderEl) sliderEl.value = currentSlotIdx;
            // Pré-ajoute à compared AVANT loadSlot (sélection unique)
            comparedNodes.clear();
            comparedNodes.set(id, 0);
            loadSlot(currentCountry, currentSlotIdx);
            renderCompareList();
            return;
          }
        }
        toggleCompared(id);
      });
      resultsEl.appendChild(div);
    });
  }

  searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchInput.value = ''; renderSearchResults(''); searchInput.blur(); }
    e.stopPropagation();
  });
  // Cache les résultats quand on perd le focus (avec léger délai pour
  // permettre le clic sur une suggestion).
  searchInput.addEventListener('blur', () => {
    setTimeout(() => renderSearchResults(''), 180);
  });

  document.addEventListener('keydown', e => {
    if (document.activeElement === searchInput) return;
    if (e.key === '/') { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
    if      (e.key==='ArrowRight'){ step(+1); }
    else if (e.key==='ArrowLeft') { step(-1); }
    else if (e.key==='Escape')    { if (comparedNodes.size) clearCompared(); else if (searchInput.value) { searchInput.value=''; renderSearchResults(''); } }
  });
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCountry = tab.dataset.country;
      _searchableCache = { country: null, ids: null }; // change de pays → invalide
      comparedNodes.clear();                              // pays différent → reset compare
      applyTimelineHeat(currentCountry);
      loadSlot(currentCountry, currentSlotIdx);
      renderCompareList();
    });
    tab.classList.toggle('active', tab.dataset.country === currentCountry);
  });

  // Événements | Hot 10. Les États-Unis n'ont pas d'événements : le bouton se grise et on passe au Québec.
  let panelMode = 'events';
  function setViewMode(m, noLoad) {
    const prevGraph = viewMode;
    panelMode = m;
    m = m === 'search' ? 'objects' : m; // Recherche = la carte des objets, avec la recherche en avant
    viewMode = m;
    document.body.classList.remove('pm-events', 'pm-objects', 'pm-search');
    document.body.classList.add('pm-' + panelMode);
    if (prevGraph === m && !noLoad) {
      // Hot 10 ↔ Recherche : même carte, seul le panneau change
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === panelMode));
      try { const u = new URL(location.href); u.searchParams.set('mode', panelMode === 'search' ? 'recherche' : 'objets'); history.replaceState(null, '', u.toString()); } catch (e) { /* ignore */ }
      if (panelMode === 'search') { const si = document.getElementById('search-input'); if (si) si.focus(); }
      return;
    }
    const T0 = window.t || (k => k);
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === panelMode));
    const usa = document.querySelector('.tab[data-country="USA"]');
    if (usa) { usa.disabled = m === 'events'; usa.title = m === 'events' ? T0('constellation.no_events_usa') : ''; }
    if (m === 'events' && currentCountry === 'USA') {
      currentCountry = 'QC';
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.country === 'QC'));
      applyTimelineHeat(currentCountry);
    }
    const title = document.getElementById('top10-title');
    if (title) { const key = m === 'events' ? 'constellation.events_list_label' : 'constellation.hot10_label'; title.setAttribute('data-i18n', key); title.textContent = T0(key); }
    comparedNodes.clear(); renderCompareList();
    try { const u = new URL(location.href); u.searchParams.delete('vue'); if (m === 'objects') u.searchParams.set('mode', panelMode === 'search' ? 'recherche' : 'objets'); else u.searchParams.delete('mode'); history.replaceState(null, '', u.toString()); } catch (e) { /* ignore */ }
    if (panelMode === 'search') { const si = document.getElementById('search-input'); if (si) setTimeout(() => si.focus(), 0); }
    if (!noLoad) { Graph.graphData({ nodes: [], links: [] }); loadSlot(currentCountry, currentSlotIdx); }
  }
  document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => { if (b.dataset.mode !== panelMode) setViewMode(b.dataset.mode); }));
  setViewMode(urlModeQ === 'recherche' ? 'search' : viewMode, true); // boutons, légende et adresse alignés sur le mode de départ

  // Loading masqué tout de suite: l'utilisateur voit la simulation
  // placer les nœuds intelligemment dans l'espace, puis onEngineStop
  // cadre le tout dans la zone visible.
  document.getElementById('loading').style.display = 'none';
  applyTimelineHeat(currentCountry);

  // Re-render au changement de langue (textes générés dynamiquement)
  document.addEventListener('i18n:applied', function () {
    if (slots && slots.length) loadSlot(currentCountry, currentSlotIdx);
  });
  loadSlot(currentCountry, currentSlotIdx);

  // ── Lien entrant ?node= ───────────────────────────────────────────────────
  const urlNode = urlParams.get('node');
  if (urlNode) setTimeout(() => {
    // Trouve le 1er match dans le slot courant et l'ajoute en compare
    const ql = String(urlNode).toLowerCase().trim();
    const gd = Graph.graphData();
    const m = (gd.nodes || []).find(n => n.id.toLowerCase().includes(ql));
    if (m) toggleCompared(m.id);
  }, 350);

  } catch(e) {
    document.getElementById('loading-text').textContent = 'ERREUR: ' + e.message;
    console.error(e);
  }
})();
</script>
<script src="./assets/js/shared-ticker.js"></script>
<script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/shared-menu.js"></script>
</body>
