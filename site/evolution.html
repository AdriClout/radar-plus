<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Évolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/shared-menu.css" />
  <link rel="stylesheet" href="./assets/css/shared-ticker.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #00000f; font-family: 'Space Mono', 'SF Mono', monospace; overflow: hidden; height: 100vh; width: 100vw; }
    #graph { display: none; }
    #left-panel {
      position: absolute; top: 0; left: 0; bottom: calc(var(--ticker-height, 44px) + 12px);
      width: 280px;
      display: flex; flex-direction: column; gap: 0;
      padding: 18px 14px 14px;
      background: linear-gradient(to right, rgba(0,0,15,0.96) 80%, transparent);
      z-index: 20; pointer-events: all;
      overflow: hidden;
    }
    #evo-titlebar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 22px;
    }
    #evo-logo {
      flex: 0 0 auto;
      display: inline-flex; align-items: center;
      width: 36px; height: 36px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    #evo-logo:hover { transform: scale(1.06); }
    #evo-logo:focus-visible { outline: 2px solid rgba(120,170,255,0.6); outline-offset: 3px; border-radius: 4px; }
    #evo-logo svg { width: 100%; height: 100%; display: block; }
    #evo-logo .rp-r { fill: rgba(195, 220, 255, 0.92); }
    #evo-logo .rp-plus { fill: #dde64a; animation: rpPulse 1.6s ease-in-out infinite; transform-origin: 70% 30%; }
    @keyframes rpPulse {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px rgba(221,230,74,0.55)); }
      50%      { opacity: 0.45; filter: drop-shadow(0 0 1px rgba(221,230,74,0.10)); }
    }
    #evo-title {
      font-family: 'Orbitron', 'Space Mono', monospace;
      font-size: 22px;
      letter-spacing: 4px;
      color: rgba(195, 220, 255, 0.92);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(90,140,255,0.36), 0 0 26px rgba(70,110,230,0.22);
      line-height: 1.1;
      white-space: nowrap;
    }
    .lpanel-section {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 14px;
    }
    .lpanel-label {
      font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase;
      color: rgba(100,140,200,0.45); padding-left: 1px;
    }
    #country-tabs { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: all; }
    .tab {
      padding: 5px 14px; border: 1px solid rgba(100,150,255,0.3); border-radius: 3px;
      background: rgba(10,20,50,0.6); color: #7090c0; font-size: 11px;
      letter-spacing: 1.5px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .tab:hover  { border-color: rgba(100,150,255,0.7); color: #a0c0ff; }
    .tab.active { background: rgba(40,80,180,0.4); border-color: rgba(120,180,255,0.8); color: #d0e8ff; box-shadow: 0 0 12px rgba(80,130,255,0.3); }
    /* #title supprimé — remplacé par #evo-title dans #left-panel */
    #tooltip {
      position: absolute; pointer-events: none;
      background: rgba(2,4,20,0.96); border: 1px solid rgba(80,120,255,0.35);
      border-radius: 4px; padding: 10px 14px; font-size: 12px; line-height: 1.6;
      display: none; z-index: 20; max-width: 220px;
    }
    #tooltip .n { color: #e8f4ff; font-weight: bold; font-size: 13px; }
    #tooltip .s { color: #6090e0; }
    #tooltip .m { color: #408060; }
    #controls {
      position: absolute; bottom: calc(var(--ticker-height, 44px) + 4px); left: 0; right: 0;
      padding: 10px 24px 16px;
      background: linear-gradient(to top, rgba(0,0,15,0.96) 70%, transparent);
      z-index: 10;
    }
    #slider-row { display: flex; align-items: center; gap: 10px; }
    #period-nav-row {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px; z-index: 20; pointer-events: all;
    }
    #prev-btn, #next-btn {
      background: none; border: 1px solid rgba(100,150,255,0.3); border-radius: 3px;
      color: #6080a0; font-size: 16px; padding: 2px 10px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; line-height: 1.3;
    }
    #prev-btn:hover, #next-btn:hover { border-color: rgba(120,180,255,0.8); color: #b0d0ff; }
    #prev-btn:disabled, #next-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    #period-nav-label {
      font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1px;
      color: rgba(175,208,255,0.92); text-align: center;
      width: 240px; white-space: normal; line-height: 1.35;
    }
    #timeline {
      flex: 1; -webkit-appearance: none; height: 2px;
      appearance: none;
      background: linear-gradient(to right, rgba(60,100,200,0.6), rgba(100,60,200,0.6));
      outline: none; border-radius: 2px; cursor: pointer;
    }
    #timeline::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: #7090ff; box-shadow: 0 0 10px rgba(80,120,255,1), 0 0 20px rgba(80,120,255,0.5); cursor: pointer;
    }
    body.has-shared-menu .menu-discover-hint {
      display: none;
    }
    #top10-country {
      font-size: 11px;
      color: rgba(160, 200, 255, 0.72);
      letter-spacing: 1px;
      font-family: 'Space Mono', monospace;
    }
    #left-hot10-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    #left-hot10-section #ranked-legend-list {
      flex: 1;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
    }
    #left-hot10-section #ranked-search-wrap {
      margin: 2px 0 2px;
    }
    #left-hot10-section .rleg-val { min-width: 26px; }
    #left-hot10-section #ranked-legend-period { flex: none; }
    .rleg-delta.new-entry { color: rgba(255, 220, 60, 0.92); }
    .rleg-delta.ret-entry { color: rgba(120, 200, 255, 0.88); }
    /* #media-panel supprimé */
    /* styles media-panel supprimés */
    /* Article panel — slide-in from right (style HOT 20) */
    #object-overlay {
      position: fixed; inset: 0; background: rgba(0,0,10,0.6);
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    #object-overlay.open { opacity: 1; pointer-events: auto; }
    #object-panel {
      position: fixed; top: 0; right: -440px; width: min(440px, 92vw);
      height: 100vh; z-index: 310;
      background: linear-gradient(175deg, rgba(6,12,38,0.98), rgba(3,6,20,0.99));
      border-left: 1px solid rgba(80,130,255,0.35);
      backdrop-filter: blur(20px);
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto; padding: 0;
    }
    #object-panel.open { right: 0; }
    #object-panel-header {
      position: sticky; top: 0; z-index: 2;
      background: linear-gradient(180deg, rgba(6,12,38,0.99) 80%, transparent);
      padding: 24px 24px 16px;
    }
    #object-panel-close {
      position: absolute; top: 16px; right: 16px;
      background: none; border: 1px solid rgba(80,130,255,0.35); border-radius: 4px;
      color: #cbe0ff; font-size: 18px; width: 32px; height: 32px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    #object-panel-close:hover { border-color: rgba(140,180,255,0.85); color: #fff; }
    #object-panel .h {
      font-family: 'Orbitron', sans-serif; font-size: 16px;
      color: #e8f0ff; text-transform: capitalize;
      letter-spacing: 1px; max-width: calc(100% - 50px);
      margin: 0;
    }
    #object-panel .meta {
      font-size: 11px; color: rgba(140,170,220,0.75); margin-top: 4px;
    }
    #object-panel .panel-links {
      display: flex; gap: 10px; margin-top: 12px;
    }
    #object-panel .panel-link,
    #object-panel .panel-link:link,
    #object-panel .panel-link:visited {
      display: inline-flex; align-items: center;
      font-size: 10px; font-family: 'Orbitron', sans-serif; letter-spacing: 1.5px;
      color: #8ab4f8; text-decoration: none; text-transform: uppercase;
      background: rgba(80,130,255,0.08);
      border: 1px solid rgba(80,130,255,0.35); border-radius: 5px;
      padding: 6px 14px; transition: all 0.2s;
    }
    #object-panel .panel-link:hover,
    #object-panel .panel-link:focus {
      border-color: rgba(120,170,255,0.8); color: #fff;
      background: rgba(80,130,255,0.2); outline: none;
    }
    #object-panel .panel-track-btn {
      margin-top: 12px;
      border: 1px solid rgba(95,140,255,0.4);
      background: rgba(10,20,50,0.55);
      color: #b9d6ff; font-family: 'Space Mono', monospace; font-size: 11px;
      padding: 6px 12px; border-radius: 4px; cursor: pointer;
    }
    #object-panel .panel-track-btn.tracked { border-color: rgba(120,200,255,0.7); color: #d6ecff; }
    #object-panel .panel-track-btn:hover { border-color: rgba(140,180,255,0.85); color: #fff; }
    #object-panel-body { padding: 0 24px 32px; }
    #object-panel .article-item {
      display: block; padding: 14px 0;
      border-bottom: 1px solid rgba(80,130,255,0.1);
      text-decoration: none; color: #cdddf5;
      transition: all 0.2s;
    }
    #object-panel .article-item:hover { color: #fff; padding-left: 6px; }
    #object-panel .article-item-media {
      font-size: 10px; font-weight: 700; color: #8ab4f8;
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px;
    }
    #object-panel .article-item-title { font-size: 13px; line-height: 1.5; }
    #object-panel .article-section-header {
      margin: 20px 0 4px;
      padding: 8px 0 6px;
      border-top: 1px solid rgba(80,130,255,0.18);
      font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px;
      color: rgba(140,170,220,0.65); text-transform: uppercase;
    }
    #object-panel .article-period-label {
      margin: 14px 0 0;
      font-size: 10px; color: rgba(120,160,255,0.55);
      letter-spacing: 0.5px;
    }
    #object-panel .empty {
      color: rgba(140,170,220,0.65); font-size: 12px;
      padding: 20px 0; font-style: italic;
    }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #00000f; z-index: 100; }
    #loading-text { font-size: 11px; letter-spacing: 3px; color: rgba(80,120,255,0.5); text-transform: uppercase; animation: pulse 1.8s ease-in-out infinite; }
    @media (max-width: 1500px) {
      .menu-discover-hint { display: none; }
    }
    @media (max-width: 900px) {
      #left-panel { width: 160px; padding: 12px 10px 10px; }
      #evo-titlebar { gap: 8px; margin-bottom: 14px; }
      #evo-logo { width: 28px; height: 28px; }
      #evo-title { font-size: 16px; letter-spacing: 3px; }
      .side-nav { width: 280px; right: -280px; }
      #object-panel { width: 92vw; right: -92vw; }
      #object-panel-header { padding: 20px 16px 12px; }
      #object-panel-body { padding: 0 16px 24px; }
      #controls { bottom: calc(var(--ticker-height, 44px) + 2px); }
      #period-current { font-size: 11px; letter-spacing: 0.9px; }
      #period-stats { max-width: calc(100vw - 36px); gap: 6px; }
      .period-chip { font-size: 9px; padding: 4px 8px; }
      #ranked-search-wrap {
        width: 100%;
      }
      #ranked-search-input {
        width: 100%;
      }
    }
    @keyframes menuHintFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    /* Mode tabs */
    #mode-tabs { display: flex; flex-direction: column; gap: 4px; pointer-events: all; }
    #mode-tabs-row { display: flex; flex-direction: column; gap: 4px; }
    .mode-tab { padding: 7px 10px; border: 1px solid rgba(100,150,255,0.25); border-radius: 3px; background: rgba(10,20,50,0.5); color: rgba(100,140,200,0.7); font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; text-align: left; width: 100%; }
    .mode-tab:hover { border-color: rgba(100,150,255,0.6); color: #a0c0ff; }
    .mode-tab[data-mode="ranked"].active { background: rgba(40,80,180,0.35); border-color: rgba(120,180,255,0.7); color: #d0e8ff; box-shadow: 0 0 10px rgba(80,130,255,0.25); }
    .mode-tab[data-mode="tracking"].active { background: rgba(20,72,52,0.38); border-color: rgba(80,200,140,0.65); color: rgba(140,230,185,0.95); box-shadow: 0 0 10px rgba(60,180,110,0.22); }
    /* Track button (panneau articles) */
    .track-btn { display: inline-block; margin: 0 0 8px; padding: 4px 10px; border: 1px solid rgba(100,150,255,0.3); border-radius: 3px; background: rgba(10,20,50,0.5); color: rgba(140,180,255,0.8); font-family: 'Space Mono', monospace; font-size: 10px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px; }
    .track-btn:hover { border-color: rgba(140,190,255,0.7); color: #c0d8ff; }
    .track-btn.tracked { border-color: rgba(80,200,110,0.5); color: rgba(100,220,130,0.9); background: rgba(15,50,25,0.3); }
    /* Evolution view */
    #evolution-view { position: absolute; inset: 0; display: none; z-index: 5; }
    #evolution-view.visible { display: block; }
    #evo-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #live-badge {
      position: absolute; pointer-events: none; display: none;
      font-family: 'Space Mono', monospace; font-size: 13px; font-weight: bold;
      letter-spacing: 2.5px; color: rgba(80,220,140,0.95); text-transform: uppercase;
      z-index: 25; white-space: nowrap;
      animation: livePulse 1.5s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .tracked-item { display: flex; align-items: center; gap: 8px; border: 1px solid rgba(90,130,250,0.2); border-radius: 5px; background: rgba(8,18,48,0.55); padding: 6px 9px; }
    .tracked-swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .tracked-name { flex: 1; font-size: 10px; color: rgba(190,215,255,0.95); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tracked-val { font-size: 10px; color: rgba(140,180,255,0.75); flex-shrink: 0; min-width: 36px; text-align: right; }
    .tracked-rm { background: none; border: none; color: rgba(180,80,80,0.65); cursor: pointer; font-size: 14px; padding: 0 3px; line-height: 1; }
    .tracked-rm:hover { color: rgba(255,110,110,0.9); }
    #evo-tooltip { position: fixed; pointer-events: none; display: none; z-index: 30; background: rgba(2,4,20,0.96); border: 1px solid rgba(80,120,255,0.35); border-radius: 4px; padding: 8px 12px; font-size: 11px; line-height: 1.6; }
    #evo-tooltip-period { color: #d0e8ff; font-size: 11px; margin-bottom: 4px; }
    .evo-tt-row { display: flex; align-items: center; gap: 6px; }
    .evo-tt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .evo-tt-name { color: rgba(175,205,255,0.9); flex: 1; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
    .evo-tt-val { color: rgba(160,200,255,0.8); font-size: 10px; }
    /* ── Sélecteur de fenêtre temporelle (dans #left-panel) ─────────────────── */
    #window-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    #window-section { display: none; }
    #window-section.visible { display: flex; }
    .win-btn {
      background: rgba(8,16,44,0.55); border: 1px solid rgba(90,130,250,0.22); border-radius: 3px;
      color: rgba(110,150,210,0.65); font-family: 'Space Mono', monospace; font-size: 11px;
      letter-spacing: 1px; padding: 7px 6px; cursor: pointer; transition: all 0.15s; text-transform: uppercase;
      text-align: center; width: 100%;
    }
    .win-btn:hover { border-color: rgba(120,170,255,0.55); color: rgba(180,210,255,0.9); }
    .win-btn.active { border-color: rgba(120,180,255,0.75); background: rgba(30,60,150,0.40); color: #d0e8ff; box-shadow: 0 0 8px rgba(80,130,255,0.2); }
    #window-granularity { font-size: 9px; letter-spacing: 0.7px; color: rgba(90,130,180,0.50); margin-top: 2px; }

    /* ── Légende classement évolutif ──────────────────────────────────────── */
    #ranked-legend-period {
      font-size: 10px; letter-spacing: 0.7px; color: rgba(120,160,220,0.55); text-transform: uppercase; flex: 1;
      transition: color 0.15s;
    }
    .lpanel-label-row { display: flex; align-items: center; justify-content: space-between; }
    .lpanel-clear-btn {
      background: none; border: 1px solid rgba(100,150,255,0.2); border-radius: 3px;
      color: rgba(120,150,200,0.55); font-family: 'Space Mono', monospace; font-size: 9px;
      letter-spacing: 0.8px; padding: 4px 8px; cursor: pointer; transition: all 0.15s; display: none;
      align-self: flex-start; margin-bottom: 4px;
    }
    .lpanel-clear-btn.visible { display: block; }
    .lpanel-clear-btn:hover { border-color: rgba(200,80,80,0.5); color: rgba(220,100,100,0.9); }
    #ranked-legend-list { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; max-height: none; flex: 1; padding-bottom: 4px; }
    .rleg-item {
      display: flex; align-items: flex-start; gap: 6px;
      border: 1px solid rgba(90,130,250,0.14); border-radius: 5px;
      background: rgba(8,18,48,0.50); padding: 5px 8px;
      cursor: pointer; transition: all 0.15s;
    }
    .rleg-item:hover, .rleg-item.hovered {
      border-color: rgba(145,182,255,0.55); background: rgba(20,36,86,0.65);
    }
    .rleg-item.focused {
      border-color: rgba(186,211,255,0.88); background: rgba(40,70,150,0.40);
      box-shadow: 0 0 8px rgba(90,135,255,0.28);
    }
    .rleg-item.dimmed { opacity: 0.40; }
    .rleg-swatch {
      width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
    }
    .rleg-rank {
      font-size: 11px; color: rgba(110,150,210,0.65); flex-shrink: 0; min-width: 18px; text-align: right;
      padding-top: 1px;
    }
    .rleg-name {
      flex: 1; font-size: 13px; color: rgba(185,215,255,0.92);
      overflow: hidden; white-space: normal; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .rleg-val { font-size: 12px; color: rgba(140,180,255,0.78); flex-shrink: 0; min-width: 38px; text-align: right; padding-top: 1px; }
    .rleg-val.null-val { color: rgba(100,130,180,0.38); }
    .rleg-delta {
      font-size: 11px; flex-shrink: 0; min-width: 44px; text-align: right; letter-spacing: 0.3px; padding-top: 1px;
    }
    .rleg-delta.up   { color: rgba(80,220,140,0.85); }
    .rleg-delta.down { color: rgba(255,100,100,0.80); }
    .rleg-delta.flat { color: rgba(110,150,200,0.50); }

    .tab:focus-visible,
    .mode-tab:focus-visible,
    .win-btn:focus-visible,

    #prev-btn:focus-visible,
    #next-btn:focus-visible {
      outline: 2px solid rgba(170, 205, 255, 0.9);
      outline-offset: 2px;
    }

    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
    #ranked-search-wrap { display: flex; flex-direction: column; gap: 4px; pointer-events: all; width: 100%; margin: 8px 0 6px; }
    #ranked-search-input {
      background: rgba(5,10,35,0.75); border: 1px solid rgba(100,150,255,0.3);
      border-radius: 3px; color: #a0c8f0; font-family: 'Space Mono','SF Mono',monospace;
      font-size: 11px; letter-spacing: 0.8px; outline: none; padding: 5px 10px;
      width: 100%; transition: border-color 0.2s, box-shadow 0.2s;
    }
    #ranked-search-input::placeholder { color: rgba(90,120,180,0.55); }
    #ranked-search-input:focus { border-color: rgba(140,190,255,0.75); box-shadow: 0 0 10px rgba(80,130,255,0.25); color: #d0e8ff; }
    #ranked-search-results { display: flex; flex-direction: column; gap: 3px; max-height: 120px; overflow-y: auto; }
    .evo-result { padding: 5px 8px; border-radius: 3px; background: rgba(8,18,48,0.62); border: 1px solid rgba(90,130,250,0.2); color: rgba(170,200,255,0.9); font-size: 10px; cursor: pointer; transition: all 0.12s; }
    .evo-result:hover { border-color: rgba(145,182,255,0.7); color: #e0f0ff; background: rgba(20,36,86,0.7); }

    #left-tracked-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 170px;
      overflow-y: auto;
    }
    .left-tracked-item {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(90,130,250,0.22);
      border-radius: 4px;
      background: rgba(8,18,48,0.48);
      padding: 5px 7px;
    }
    .left-tracked-item.alert-watch {
      border-color: rgba(212, 188, 88, 0.55);
      background: rgba(72, 58, 20, 0.40);

<script>
(async () => {
  try {
  // ── Données ───────────────────────────────────────────────────────────────
  let tsData;
  let articlesData = null;
  let articlesLoadingPromise = null;
  function ensureArticlesLoaded() {
    if (articlesData) return Promise.resolve(articlesData);
    if (articlesLoadingPromise) return articlesLoadingPromise;
    articlesLoadingPromise = fetch('./articles.json')
      .then(r => r.ok ? r.json() : null)
      .then(d => { articlesData = d; return d; })
      .catch(() => null);
    return articlesLoadingPromise;
  }
  function getArticlesFor(country, periodKey, nodeId, fallbackNodeArticles) {
    const a = articlesData?.articles?.[country]?.[periodKey]?.[nodeId];
    if (Array.isArray(a) && a.length) return a;
    return Array.isArray(fallbackNodeArticles) ? fallbackNodeArticles : [];
  }
  try {
    const tRes = await fetch('./timeseries.json');
    if (!tRes.ok) throw new Error('timeseries.json: ' + tRes.statusText);
    tsData = await tRes.json();
    // Préchargement non-bloquant des articles → panel s'ouvrira instantanément
    // dès qu'ils arrivent (sinon affiche "Chargement…" temporairement).
    ensureArticlesLoaded();
  } catch(e) {
    const loading = document.getElementById('loading-text');
    if (window.location.protocol === 'file:') {
      loading.textContent = 'ouvrir via http://localhost (pas file://) — ex: ./run_chrome.sh';
    } else {
      loading.textContent = 'fichiers introuvables — lancer build_data.R (' + e.message + ')';
    }
    return;
  }
  // Les deux modes (HOT 10 et Suivi personnalisé) utilisent tsData (130 jours).
  // graphData (graph.json) ne couvre que 14 jours et n'est plus utilisé pour le chart.
  let graphs  = tsData.graphs;
  let periods = tsData.meta.periods;
  const countries   = tsData.meta.countries;
  let graphIdx = tsData.meta.periods.length - 1;
  let tsIdx    = tsData.meta.periods.length - 1;

  const MAX_LINKS_NODE = 5;

  // ── Couleurs ──────────────────────────────────────────────────────────────
  // ── Anti-hairball ─────────────────────────────────────────────────────────
  function filterTopLinks(links, max) {
    const m = new Map();
    links.forEach(l => {
      [l.source, l.target].forEach(k => { if (!m.has(k)) m.set(k,[]); m.get(k).push(l); });
    });
    const kept = new Set();
    m.forEach(ls => { ls.sort((a,b)=>b.value-a.value); ls.slice(0,max).forEach(l=>kept.add(l)); });
    return [...kept];
  }


  function getGD(country, key) {
    const g = graphs[country]?.[key];
    if (!g) return { nodes:[], links:[] };
    let nodes = g.nodes.map(n=>({...n}));
    let links = g.links.map(l=>({...l}));


    nodes.sort((a,b)=>b.size-a.size);
    nodes.forEach((n,i)=>{ n._rank=i; });
    return { nodes, links: filterTopLinks(links, MAX_LINKS_NODE) };
  }

  // Retourne le GD d'une winPeriod : agrège les blocs 4h pour les journées (isDay), sinon délègue à getGD.
  function getWinPeriodGD(country, winPeriod) {
    if (!winPeriod) return { nodes: [], links: [] };
    if (winPeriod.isDay && Array.isArray(winPeriod.periodKeys) && winPeriod.periodKeys.length) {
      const sizeMap = new Map();
      const articleMap = new Map();
      const seenUrls = new Map();
      for (const pk of winPeriod.periodKeys) {
        const g = getGD(country, pk);
        for (const n of (g.nodes || [])) {
          sizeMap.set(n.id, (sizeMap.get(n.id) || 0) + (Number(n.size) || 0));
          if (!articleMap.has(n.id)) { articleMap.set(n.id, []); seenUrls.set(n.id, new Set()); }
          for (const a of (n.articles || [])) {
            const key = a.url || a.title;
            if (key && !seenUrls.get(n.id).has(key)) {
              seenUrls.get(n.id).add(key);
              articleMap.get(n.id).push(a);
            }
          }
        }
      }
      const nodes = [...sizeMap.entries()]
        .map(([id, size]) => ({ id, size, articles: articleMap.get(id) || [], n: (articleMap.get(id) || []).length }))
        .sort((a, b) => b.size - a.size);
      nodes.forEach((n, i) => { n._rank = i; });
      return { nodes, links: [] };
    }
    return getGD(country, winPeriod.key);
  }

  function periodConvergenceScore(country, key) {
    const g = graphs[country]?.[key];
    if (!g || !Array.isArray(g.nodes) || !g.nodes.length) return 0;

    const sizes = g.nodes.map(n => Number(n.size) || 0).sort((a, b) => b - a);
    const ultra = sizes.slice(0, 3).reduce((a, b) => a + b, 0);
    const linksStrong = (g.links || []).reduce((acc, l) => acc + Math.max(0, (Number(l.value) || 0) - 1), 0);
    const density = linksStrong / Math.max(1, g.nodes.length);

    // Score synthétique: salience ultra + convergence de cooccurrence.
    return ultra * 0.75 + linksStrong * 0.95 + density * 1.6;
  }

  function heatColor(t) {
    const tt = Math.max(0, Math.min(1, t));
    const r = Math.round(30 + tt * 130);
    const g = Math.round(50 + tt * 165);
    const b = Math.round(115 + tt * 125);
    const a = (0.30 + tt * 0.70).toFixed(2);
    return `rgba(${r},${g},${b},${a})`;
  }

  function applyTimelineNeutral() {
    slider.style.background = 'linear-gradient(to right, rgba(60,100,200,0.6), rgba(100,60,200,0.6))';
    delete slider.dataset.convScores;
  }

  function getRankedSlotConvergenceScores(country) {
    if (!rankedSlots.length) return [];
    return rankedSlots.map(slot => {
      const keys = Array.isArray(slot?.periodKeys) ? slot.periodKeys : [];
      if (!keys.length) return 0;
      const vals = keys.map(k => periodConvergenceScore(country, k));
      return vals.reduce((a, b) => a + b, 0) / vals.length;
    });
  }

  function applyTimelineHeat(country) {
    // En mode Chercher, calculer la convergence par période individuelle
    let scores;
    if (currentMode === 'ranked') {
      scores = rankedSlots.length
        ? getRankedSlotConvergenceScores(country)
        : periods.map(p => periodConvergenceScore(country, p.key));
    } else {
      // tracking : convergence par période 4h (sous-échantillonné pour la perf)
      const step = Math.max(1, Math.floor(periods.length / 120));
      scores = periods.filter((_, i) => i % step === 0).map(p => periodConvergenceScore(country, p.key));
    }
    if (!scores.length) {
      applyTimelineNeutral();
      return;
    }

    const min = Math.min(...scores);
    const max = Math.max(...scores);
    const denom = Math.max(1e-9, max - min);
    const norm = scores.map(s => (s - min) / denom);

    if (periods.length === 1) {
      slider.style.background = `linear-gradient(to right, ${heatColor(norm[0])}, ${heatColor(norm[0])})`;
      slider.dataset.convScores = JSON.stringify(scores);
      return;
    }

    const stops = [];
    for (let i = 0; i < norm.length; i++) {
      const start = i === 0 ? 0 : ((i - 0.5) / (norm.length - 1)) * 100;
      const end = i === norm.length - 1 ? 100 : ((i + 0.5) / (norm.length - 1)) * 100;
      const c = heatColor(norm[i]);
      stops.push(`${c} ${start.toFixed(2)}%`, `${c} ${end.toFixed(2)}%`);
    }
    slider.style.background = `linear-gradient(to right, ${stops.join(',')})`;
    slider.dataset.convScores = JSON.stringify(scores);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>'"]/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  function panelPeriodLabel(period = null) {
    const p = period || panelState?.contextPeriod || periods[currentIdx];
    if (!p) return '';
    if (p.isVeille) return 'Hier (total)';
    if (p.isDay && p.dateKey) return toDayLabel(p.dateKey); // journée agrégée : pas de bloc horaire
    const day = toDayLabel(periodDisplayDate(p));
    const block = blockRangeLabelFromPeriod(p);
    return `${day} · ${block} EDT`;
  }

  function panelLinksFor(nodeId) {
    return {
      constellationUrl: `./constellation.html?country=${encodeURIComponent(currentCountry)}&node=${encodeURIComponent(nodeId)}`,
      radarplusUrl: `./radarplus.html?country=${encodeURIComponent(currentCountry)}&q=${encodeURIComponent(nodeId)}`,
      statsUrl: `./statistiques.html?objet=${encodeURIComponent(nodeId)}&pays=${encodeURIComponent(currentCountry)}`
    };
  }

  function bindPanelTrackButton(nodeId) {
    const btn = document.getElementById('track-btn-panel');
    if (!btn) return;
    btn.addEventListener('click', () => {
      if (trackedObjects.has(nodeId)) {
        removeTracked(nodeId);
        btn.textContent = '+ Suivre';
        btn.classList.remove('tracked');
      } else {
        addTracked(nodeId);
        btn.textContent = '✓ Suivi';
        btn.classList.add('tracked');
        setMode('tracking');
      }
    });
  }

  function normalizeArticle(art) {
    const rec = (art && typeof art === 'object') ? art : {};
    const asText = (v) => (typeof v === 'string' ? v.trim() : '');

    const title = asText(rec.title);
    const url = asText(rec.url);

    let mediaId = asText(rec.media_id);
    if (!mediaId && rec.media_id && typeof rec.media_id === 'object') {
      mediaId = asText(rec.media_id.id || rec.media_id.media_id || rec.media_id.name);
    }

    return {
      title: title || url || 'Article',
      url,
      mediaId,
    };
  }

  function articleItemHtml(art) {
    const normalized = normalizeArticle(art);
    const title = escapeHtml(normalized.title);
    const safeUrl = normalized.url;
    const media = normalized.mediaId
      ? `<div class="article-item-media">${escapeHtml(normalized.mediaId)}</div>`
      : '';
    if (!safeUrl) return `<div class="article-item">${media}<div class="article-item-title">${title}</div></div>`;
    return `<a class="article-item" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">${media}<div class="article-item-title">${title}</div></a>`;
  }

  function closeObjectPanel() {
    panelState.nodeId = null;
    panelState.contextPeriod = null;
    document.getElementById('object-panel')?.classList.remove('open');
    document.getElementById('object-overlay')?.classList.remove('open');
  }

  function renderObjectPanelHeader(nodeId, metaLine) {
    const links = panelLinksFor(nodeId);
    const tracked = trackedObjects.has(nodeId);
    const displayName = nodeId.replace(/(^|\s)\S/g, c => c.toUpperCase());
    return `
      <div id="object-panel-header">
        <button id="object-panel-close" aria-label="Fermer">×</button>
        <div class="h">${escapeHtml(displayName)}</div>
        <div class="meta">${escapeHtml(metaLine)}</div>
        <div class="panel-links">
          <a class="panel-link" href="${links.statsUrl}" target="_blank" rel="noopener noreferrer">Statistiques ↗</a>
          <a class="panel-link" href="${links.constellationUrl}" target="_blank" rel="noopener noreferrer">Constellation ↗</a>
        </div>
        <button class="panel-track-btn ${tracked ? 'tracked' : ''}" id="track-btn-panel">${tracked ? '✓ Suivi' : '+ Suivre'}</button>
      </div>
    `;
  }

  function bindObjectPanelControls(nodeId) {
    const closeBtn = document.getElementById('object-panel-close');
    if (closeBtn) closeBtn.addEventListener('click', closeObjectPanel);
    bindPanelTrackButton(nodeId);
  }

  function openObjectPanelDom() {
    document.getElementById('object-panel')?.classList.add('open');
    document.getElementById('object-overlay')?.classList.add('open');
  }

  // Articles précédents : descend dans periods array, dédupe par URL, groupe par période.
  // Source articles : articlesData (chargé async) avec fallback sur node.articles inline (legacy).
  function buildPreviousArticleGroups(nodeId, currentSeenUrls, contextPeriod) {
    const groups = [];
    const seen = new Set(currentSeenUrls);
    const skipKeys = new Set();
    if (contextPeriod?.isDay && Array.isArray(contextPeriod.periodKeys)) {
      contextPeriod.periodKeys.forEach(k => skipKeys.add(k));
    } else if (contextPeriod?.key) {
      skipKeys.add(contextPeriod.key);
    }
    const allPeriods = tsData?.meta?.periods || periods || [];
    const sourceGraphs = tsData?.graphs?.[currentCountry] || {};
    for (let i = allPeriods.length - 1; i >= 0 && groups.length < 8; i--) {
      const pk = allPeriods[i].key;
      if (skipKeys.has(pk)) continue;
      const inlineNode = sourceGraphs[pk]?.nodes?.find(n => n.id === nodeId);
      const arts = getArticlesFor(currentCountry, pk, nodeId, inlineNode?.articles);
      if (!arts.length) continue;
      const fresh = arts.filter(a => a.url && !seen.has(a.url));
      if (!fresh.length) continue;
      fresh.forEach(a => seen.add(a.url));
      const day = toDayLabel(periodDisplayDate(allPeriods[i]));
      const block = blockRangeLabelFromPeriod(allPeriods[i]);
      groups.push({ label: `${day} · ${block} EDT`, articles: fresh });
    }
    return groups;
  }

  function renderArticlesPanelUnavailable(nodeId, contextPeriod = null) {
    const panel = document.getElementById('object-panel');
    if (!nodeId) { closeObjectPanel(); return; }

    panelState.nodeId = nodeId;
    panelState.contextPeriod = contextPeriod;
    const periodLabel = panelPeriodLabel(contextPeriod);

    panel.innerHTML = `
      ${renderObjectPanelHeader(nodeId, `Bloc: ${periodLabel} · données indisponibles`)}
      <div id="object-panel-body">
        <div class="empty"><strong>Pas d'articles pour cette période.</strong><br>Essayez un autre bloc ou une autre granularité.</div>
      </div>
    `;
    openObjectPanelDom();
    bindObjectPanelControls(nodeId);
  }

  function renderArticlesPanel(node, contextPeriod = null) {
    if (!node) { closeObjectPanel(); return; }

    panelState.nodeId = node.id;
    if (contextPeriod !== null) panelState.contextPeriod = contextPeriod;

    const ctx = panelState.contextPeriod || periods[currentIdx];
    const periodLabel = panelPeriodLabel(ctx);
    const metaLine = `Bloc: ${periodLabel} · Saillance: ${Number(node.size || 0).toFixed(2)} · Mentions: ${Number(node.n || 0)}`;

    // Articles du bloc courant : depuis articlesData (par bloc agrégé ou simple)
    let currentArticles = [];
    const fallbackInline = Array.isArray(node.articles) ? node.articles : [];
    if (ctx?.isDay && Array.isArray(ctx.periodKeys)) {
      const seen = new Set();
      ctx.periodKeys.forEach(pk => {
        getArticlesFor(currentCountry, pk, node.id, null).forEach(a => {
          if (a.url && !seen.has(a.url)) { seen.add(a.url); currentArticles.push(a); }
        });
      });
      if (!currentArticles.length) currentArticles = fallbackInline;
    } else if (ctx?.key) {
      currentArticles = getArticlesFor(currentCountry, ctx.key, node.id, fallbackInline);
    } else {
      currentArticles = fallbackInline;
    }

    const seenUrls = new Set();
    currentArticles.forEach(a => { if (a.url) seenUrls.add(a.url); });

    const articlesLoading = !articlesData;
    const loadingNotice = articlesLoading
      ? '<div class="empty">Chargement de l\'historique des articles…</div>'
      : '';
    const currentItems = currentArticles.length
      ? currentArticles.map(articleItemHtml).join('')
      : (articlesLoading ? '' : '<div class="empty">Aucun article pour cette période.</div>');

    const prevGroups = buildPreviousArticleGroups(node.id, seenUrls, ctx);
    let prevHtml = '';
    if (prevGroups.length > 0) {
      prevHtml = '<div class="article-section-header">Précédemment à la une</div>';
      prevGroups.forEach(g => {
        prevHtml += `<div class="article-period-label">${escapeHtml(g.label)}</div>`;
        prevHtml += g.articles.map(articleItemHtml).join('');
      });
    }

    const panel = document.getElementById('object-panel');
    panel.innerHTML = `
      ${renderObjectPanelHeader(node.id, metaLine)}
      <div id="object-panel-body">${currentItems}${prevHtml}${loadingNotice}</div>
    `;
    openObjectPanelDom();
    bindObjectPanelControls(node.id);

    // Si articles pas encore chargés, re-render dès que prêt
    if (articlesLoading) {
      ensureArticlesLoaded().then(() => {
        if (panelState.nodeId === node.id) renderArticlesPanel(node, panelState.contextPeriod);
      });
    }
  }

  function syncArticlesPanel() {
    if (!panelState.nodeId) return;
    if (currentMode === 'ranked') {
      const slot = rankedSlots[rankedSlotIdx];
      const ctxPeriod = { isDay: true, periodKeys: slot?.periodKeys || [periods[currentIdx]?.key].filter(Boolean), dateKey: slot?.key };
      const gd = getWinPeriodGD(currentCountry, ctxPeriod);
      const node = (gd.nodes || []).find(n => n.id === panelState.nodeId);
      if (node) renderArticlesPanel(node, ctxPeriod);
      else renderArticlesPanelUnavailable(panelState.nodeId, ctxPeriod);
      return;
    }
    const period = periods[currentIdx];
    const gd = getGD(currentCountry, period?.key);
    const node = (gd.nodes || []).find(n => n.id === panelState.nodeId);
    if (node) renderArticlesPanel(node, period);
    else renderArticlesPanelUnavailable(panelState.nodeId, period);
  }

  // ── État ──────────────────────────────────────────────────────────────────
  const urlParams = new URLSearchParams(window.location.search);
  const urlCountry = (urlParams.get('country') || '').toUpperCase();
  let currentCountry = countries.includes(urlCountry) ? urlCountry : (countries.includes('QC') ? 'QC' : countries[0]);
  let currentIdx     = periods.length - 1;
  let focusedNode    = null;

  // ── Suivi Temporel ────────────────────────────────────────────────────────
  const TRACK_COLORS = ['#ff6b6b','#ffd93d','#48dbfb','#ff9ff3','#54a0ff','#00d2d3','#ff9f43','#10ac84','#c7b9ff','#f368e0'];
  let trackedObjects = new Set();
  const trackColorMap = new Map();
  let trackColorSeq = 0;
  let currentMode = 'ranked';
  let evoMaxVal = 1;
  let rankedHoverIdx = null;
  let selectedPeriodIdx = null;
  let hoveredNode = null;
  let rankedGranularity = 'day';
  let rankedSlots = [];
  let rankedSlotIdx = 0;
  const panelState = { nodeId: null, expanded: false, contextPeriod: null };

  const RANKED_GRANULARITIES = {
    day: { topN: 10, emptyLabel: 'Journée' },
    week: { topN: 12, emptyLabel: 'Semaine' },
    month: { topN: 14, emptyLabel: 'Mois' },
    year: { topN: 16, emptyLabel: 'Année' },
  };
  const FR_MONTHS = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  const FR_MONTHS_SHORT = ['janv.', 'fevr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'aout', 'sept.', 'oct.', 'nov.', 'dec.'];
  const FR_WEEKDAYS_SHORT = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  const LOCAL_UTC_OFFSET_HOURS = 4; // EDT, cohérent avec le pipeline actuel
  const EN_MONTHS = { Jan: '01', Feb: '02', Mar: '03', Apr: '04', May: '05', Jun: '06', Jul: '07', Aug: '08', Sep: '09', Oct: '10', Nov: '11', Dec: '12' };

  function periodKeyToDate(key) {
    return String(key || '').split('_')[0];
  }

  function dateToWeekKey(dateStr) {
    // ISO 8601 week
    const d = new Date(`${dateStr}T00:00:00`);
    d.setDate(d.getDate() + 4 - (d.getDay() || 7));
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return `${d.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
  }

  function dateToMonthKey(dateStr) {
    return dateStr.slice(0, 7);
  }

  function dateToYearKey(dateStr) {
    return dateStr.slice(0, 4);
  }

  function periodDisplayDate(period) {
    if (period?.isDay && period.dateKey) return period.dateKey;
    const label = String(period?.label || '');
    const m = label.match(/^([A-Za-z]{3})\s+(\d{1,2})/);
    if (m) {
      const month = EN_MONTHS[m[1]];
      const year = String(period?.key || '').split('_')[0]?.split('-')[0] || '1970';
      if (month) return `${year}-${month}-${String(Number(m[2])).padStart(2, '0')}`;
    }
    return periodKeyToDate(period?.key || '');
  }

  function toDayLabel(dateStr) {
    const [y, m, d] = String(dateStr).split('-').map(Number);
    return `${d} ${FR_MONTHS[Math.max(0, (m || 1) - 1)]} ${y}`;
  }

  function toMonthLabel(monthKey) {
    const [year, month] = monthKey.split('-').map(Number);
    return `${FR_MONTHS[Math.max(0, month - 1)]} ${year}`;
  }

  function toWeekLabel(weekKey) {
    const [year, wk] = weekKey.split('-W');
    return `Semaine ${Number(wk)} · ${year}`;
  }

  function buildRankedSlots(sourcePeriods = periods) {
    if (!sourcePeriods.length) {
      rankedSlots = [];
      rankedSlotIdx = 0;
      return;
    }

    const buckets = new Map();
    sourcePeriods.forEach(p => {
      const dateStr = periodDisplayDate(p);
      let bucketKey = dateStr;
      if (rankedGranularity === 'week') bucketKey = dateToWeekKey(dateStr);
      else if (rankedGranularity === 'month') bucketKey = dateToMonthKey(dateStr);
      else if (rankedGranularity === 'year') bucketKey = dateToYearKey(dateStr);
      if (!buckets.has(bucketKey)) buckets.set(bucketKey, []);
      buckets.get(bucketKey).push(p);
    });

    rankedSlots = [...buckets.entries()].map(([bucketKey, slotPeriods]) => {
      let label = bucketKey;
      if (rankedGranularity === 'day') label = toDayLabel(bucketKey);
      else if (rankedGranularity === 'week') label = toWeekLabel(bucketKey);
      else if (rankedGranularity === 'month') label = toMonthLabel(bucketKey);
      return {
        key: bucketKey,
        label,
        periodKeys: slotPeriods.map(p => p.key),
        periods: slotPeriods
      };
    });
  }

  function syncRankedSlotToCurrentPeriod() {
    const currentKey = periods[currentIdx]?.key;
    if (!rankedSlots.length) { rankedSlotIdx = 0; return; }
    const found = rankedSlots.findIndex(slot => slot.periodKeys.includes(currentKey));
    rankedSlotIdx = found >= 0 ? found : rankedSlots.length - 1;
  }

  function setCurrentPeriodFromRankedSlot() {
    const slot = rankedSlots[rankedSlotIdx];
    if (!slot || !slot.periodKeys.length) return;
    if (rankedGranularity === 'day') {
      const now = new Date();
      const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const isToday = slot.key === todayKey;
      const currentBlockStart = Math.floor(now.getHours() / 4) * 4;

      const eligibleKeys = slot.periodKeys.filter(key => {
        if (!isToday) return true;
        const localStart = localBlockStartFromPeriodKey(key);
        return Number.isFinite(localStart) && localStart <= currentBlockStart;
      });

      const fallbackKey = slot.periodKeys[slot.periodKeys.length - 1];
      const pickedKey = eligibleKeys.length ? eligibleKeys[eligibleKeys.length - 1] : fallbackKey;
      const idx = periods.findIndex(p => p.key === pickedKey);
      if (idx >= 0) currentIdx = idx;
      return;
    }

    const lastKey = slot.periodKeys[slot.periodKeys.length - 1];
    const idx = periods.findIndex(p => p.key === lastKey);
    if (idx >= 0) currentIdx = idx;
  }

  function parsePeriodKey(key) {
    // '2026-04-21_00-04' -> Date du debut du bloc
    const [date, time] = key.split('_');
    const h = (time || '00').split('-')[0].padStart(2, '0');
    return new Date(`${date}T${h}:00:00`);
  }

  function localBlockStartFromPeriodKey(key) {
    const timePart = String(key || '').split('_')[1] || '';
    const utcStartRaw = Number(timePart.split('-')[0]);
    if (!Number.isFinite(utcStartRaw)) return null;
    return (utcStartRaw - LOCAL_UTC_OFFSET_HOURS + 24) % 24;
  }

  function getRankedWindowPeriods() {
    const slot = rankedSlots[rankedSlotIdx];
    if (!slot || !slot.periods.length) {
      const fallback = periods[currentIdx];
      return fallback ? [fallback] : [];
    }
    if (rankedGranularity === 'day') {
      const now = new Date();
      const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const isToday = slot.key === todayKey;
      const currentBlockStart = Math.floor(now.getHours() / 4) * 4;
      // All 6 blocks of the day including Minuit-4h (UTC 04-08 = local 00-04)
      const starts = [0, 4, 8, 12, 16, 20];
      const byStart = new Map();
      slot.periods.forEach(p => {
        const localStart = localBlockStartFromPeriodKey(p.key);
        if (!Number.isFinite(localStart)) return;
        const isFuture = isToday ? localStart > currentBlockStart : false;
        byStart.set(localStart, { ...p, blockStart: localStart, isFuture });
      });

      const dayBlocks = starts.map(start => {
        if (byStart.has(start)) {
          const existing = byStart.get(start);
          if (existing.isFuture) {
            const end = (start + 4) % 24;
            return {
              key: `__synthetic__${slot.key}_${String(start).padStart(2, '0')}-${String(end).padStart(2, '0')}`,
              label: `${slot.label} · ${FR_BLOCK_LONG[start] || (start + 'h')}`,
              blockStart: start,
              isSynthetic: true,
              isFuture: true
            };
          }
          return existing;
        }
        const end = (start + 4) % 24;
        const fakeKey = `__synthetic__${slot.key}_${String(start).padStart(2, '0')}-${String(end).padStart(2, '0')}`;
        return {
          key: fakeKey,
          label: `${slot.label} · ${FR_BLOCK_LONG[start] || (start + 'h')}`,
          blockStart: start,
          isSynthetic: true,
          isFuture: true
        };
      });

      // Veille = Total hier, toujours en premier point d'ancrage
      const prevSlot = rankedSlots[rankedSlotIdx - 1];
      const veilleP = prevSlot?.periodKeys?.length
        ? { key: `__veille__${prevSlot.key}`, label: 'Hier (total)', isDay: true, periodKeys: prevSlot.periodKeys, isVeille: true, isFuture: false }
        : { key: `__veille_empty__${slot.key}`, label: 'Hier (total)', isVeille: true, isFuture: false };
      return [veilleP, ...dayBlocks];
    }

    // Semaine / Mois / Année : agréger par JOUR (pas par bloc 4h)
    const now = new Date();
    const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    const currentBlockStart = Math.floor(now.getHours() / 4) * 4;

    const dayMap = new Map();
    for (const p of slot.periods) {
      const dk = periodKeyToDate(p.key);
      if (!dayMap.has(dk)) dayMap.set(dk, []);
      dayMap.get(dk).push(p);
    }

    const dayPeriods = [];
    for (const [dk, dPeriods] of dayMap.entries()) {
      const isToday = dk === todayKey;
      let eligiblePeriods = dPeriods;
      if (isToday) {
        eligiblePeriods = dPeriods.filter(p => {
          const localStart = localBlockStartFromPeriodKey(p.key);
          return Number.isFinite(localStart) && localStart <= currentBlockStart;
        });
      }
      if (!eligiblePeriods.length) continue; // journée future, pas encore de blocs complétés
      dayPeriods.push({
        key: `__day__${dk}`,
        dateKey: dk,
        label: toDayLabel(dk),
        periodKeys: eligiblePeriods.map(p => p.key),
        isDay: true,
        isFuture: false
      });
    }
    return dayPeriods;
  }

  function getRankedTopN() {
    return (RANKED_GRANULARITIES[rankedGranularity] || RANKED_GRANULARITIES.day).topN;
  }

  function updateWindowUI() {
    const winSection = document.getElementById('window-section');
    const granEl = document.getElementById('window-granularity');
    const visible = true; // Afficher les boutons en mode ranked ET tracking
    if (winSection) winSection.classList.toggle('visible', visible);
    if (!visible) return;
    document.querySelectorAll('.win-btn').forEach(b => b.classList.toggle('active', b.dataset.gran === rankedGranularity));
    if (granEl) {
      const slot = rankedSlots[rankedSlotIdx];
      const wp = getRankedWindowPeriods();
      const head = slot?.label || (RANKED_GRANULARITIES[rankedGranularity] || RANKED_GRANULARITIES.day).emptyLabel;
      const completed = wp.filter(p => !p.isFuture).length;
      if (rankedGranularity === 'day') granEl.textContent = `${head} · ${completed} blocs complétés`;
      else granEl.textContent = `${head} · ${wp.length} jours`;
    }
  }

  function clearFocusAndRecenter() {
    focusedNode = null;
    renderArticlesPanel(null);
  }

  function clearAllTracked() {
    trackedObjects.clear(); trackColorMap.clear(); trackColorSeq = 0; focusedNode = null;
    selectedPeriodIdx = null;
    renderTrackedList();
    renderArticlesPanel(null);
    if (currentMode === 'tracking') {
      renderEvolutionChart();
    } else {
      const gd = getGD(currentCountry, periods[currentIdx]?.key);
      renderRankedChart(gd, rankedHoverIdx);
    }
  }

  function updatePeriodNavLabel() {
    const label = document.getElementById('period-nav-label');
    if (!label) return;
    if (currentMode === 'ranked') {
      const slot = rankedSlots[rankedSlotIdx];
      const activeIdx = selectedPeriodIdx !== null ? selectedPeriodIdx : rankedHoverIdx;
      if (activeIdx !== null && activeIdx >= 0) {
        const wp = getRankedWindowPeriods();
        const period = wp[activeIdx];
        if (period && !period.isSynthetic && !period.isFuture) {
          const blockLabel = rankedGranularity === 'day'
            ? blockRangeLabelFromPeriod(period)
            : period?.isDay ? toDayLabel(period.dateKey) : (period?.label || '');
          label.textContent = `${slot?.label || ''} · ${blockLabel}`;
        } else {
          label.textContent = slot?.label || '';
        }
      } else {
        label.textContent = slot?.label || '';
      }
    } else {
      // Utilise le label du slot ranked (respecte la granularité sélectionnée)
      const slot = rankedSlots[rankedSlotIdx];
      label.textContent = slot?.label || (periods[currentIdx] ? toDayLabel(periodDisplayDate(periods[currentIdx])) : '');
    }
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    if (prevBtn) prevBtn.disabled = currentMode === 'ranked' ? rankedSlotIdx <= 0 : currentIdx <= 0;
    if (nextBtn) nextBtn.disabled = currentMode === 'ranked' ? rankedSlotIdx >= rankedSlots.length - 1 : currentIdx >= periods.length - 1;
  }

  const FR_BLOCK_LONG  = { 0: 'Minuit–4h', 4: '4h–8h', 8: '8h–Midi', 12: 'Midi–16h', 16: '16h–20h', 20: '20h–Minuit' };
  const FR_BLOCK_SHORT = { 0: 'Minuit',    4: '4h',    8: '8h',     12: 'Midi',     16: '16h',     20: '20h'    };

  function blockStartFromPeriod(period) {
    const ex = Number(period?.blockStart);
    if (Number.isFinite(ex)) return ex;
    const ls = localBlockStartFromPeriodKey(period?.key);
    return Number.isFinite(ls) ? ls : 0;
  }

  function blockRangeLabelFromPeriod(period) {
    if (period?.isVeille) return 'Hier (total)';
    const start = blockStartFromPeriod(period);
    return FR_BLOCK_LONG[start] ?? `${String(start).padStart(2,'0')}h–${String((start+4)%24).padStart(2,'0')}h`;
  }

  function updatePeriodSummary(country, idx) {
    // UI de synthese retiree: fonction gardee pour compatibilite des appels existants.
    return;
  }

  function loadPeriod(country, idx) {
    const period = periods[idx];
    if (!period) return;
    const gd = getGD(country, period.key);

    if (focusedNode) {
      const hasFocused = (gd.nodes || []).some(n => n.id === focusedNode);
      if (!hasFocused && !trackedObjects.has(focusedNode)) focusedNode = null;
    }

    updatePeriodSummary(country, idx);
    if (currentMode === 'tracking') { renderTrackedList(); renderEvolutionChart(); }
    else { renderRankedChart(gd, rankedHoverIdx); }
    syncArticlesPanel();
    updatePeriodNavLabel();
  }

  // Etoiles de fond
  const STARS = Array.from({ length: 400 }, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.3 + 0.15,
    a: Math.random() * 0.45 + 0.08,
    tw: Math.random() * Math.PI * 2,
    ts: 0.003 + Math.random() * 0.007
  }));

  window.addEventListener('resize', () => {
    if (currentMode === 'tracking') renderEvolutionChart();
    else {
      const period = periods[currentIdx];
      if (period) renderRankedChart(getGD(currentCountry, period.key));
    }
  });

  function focusNodeById(nodeId) {
    const period = periods[currentIdx];
    const gd = getGD(currentCountry, period?.key);
    const node = (gd.nodes || []).find(n => n.id === nodeId);
    if (!node) {
      renderArticlesPanelUnavailable(nodeId);
      return;
    }

    focusedNode = node.id;
    document.getElementById('tooltip').style.display = 'none';
    renderArticlesPanel(node);
  }

  document.addEventListener('mousemove', e => {
    const tt = document.getElementById('tooltip');
    if (tt.style.display === 'block') {
      tt.style.left = Math.min(e.clientX+16, window.innerWidth-240)+'px';
      tt.style.top  = Math.min(e.clientY-10, window.innerHeight-120)+'px';
    }
  });

  // ── Fonctions mode Évolution ──────────────────────────────────────────────
  function getTrackColor(id) {
    if (!trackColorMap.has(id)) { trackColorMap.set(id, TRACK_COLORS[trackColorSeq % TRACK_COLORS.length]); trackColorSeq++; }
    return trackColorMap.get(id);
  }

  function addTracked(id) {
    if (!id || trackedObjects.has(id)) return;
    trackedObjects.add(id); getTrackColor(id);
    renderTrackedList();
    if (currentMode === 'tracking') {
      updatePeriodSummary(currentCountry, currentIdx);
      renderEvolutionChart();
      // Ouvrir la fiche du dernier bloc où l'objet apparaît
      focusedNode = id;
      for (let i = periods.length - 1; i >= 0; i--) {
        const g = graphs[currentCountry]?.[periods[i]?.key];
        const node = g?.nodes?.find(nd => nd.id === id);
        if (node) { renderArticlesPanel(node); break; }
      }
    } else {
      const gd = getGD(currentCountry, periods[currentIdx]?.key);
      renderRankedChart(gd, rankedHoverIdx);
    }
  }

  function removeTracked(id) {
    trackedObjects.delete(id);
    if (focusedNode === id || trackedObjects.size === 0) {
      focusedNode = null;
      renderArticlesPanel(null);
    }
    renderTrackedList();
    if (currentMode === 'tracking') {
      updatePeriodSummary(currentCountry, currentIdx);
      renderEvolutionChart();
    } else {
      const gd = getGD(currentCountry, periods[currentIdx]?.key);
      renderRankedChart(gd, rankedHoverIdx);
    }
  }

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }

  function getAllObjectIds() {
    const ids = new Set();
    Object.values(graphs[currentCountry] || {}).forEach(g => { (g.nodes || []).forEach(n => ids.add(n.id)); });
    return [...ids].sort();
  }

  function getRankedScopedObjectIds() {
    const ids = new Set();
    const wp = getRankedWindowPeriods();
    wp.forEach(p => {
      if (p.isSynthetic || p.isFuture) return;
      const g = (p.isDay || p.isVeille) ? getWinPeriodGD(currentCountry, p) : getGD(currentCountry, p.key);
      (g.nodes || []).forEach(n => ids.add(n.id));
    });
    return [...ids].sort();
  }

  function renderTrackedList() {
    const leftList = document.getElementById('left-tracked-list');
    const leftClearBtn = document.getElementById('left-tracked-clear');
    if (!leftList) return;
    leftList.innerHTML = '';
    if (leftClearBtn) leftClearBtn.classList.toggle('visible', trackedObjects.size > 0);
    if (!trackedObjects.size) {
      updateTrackedAlertSummary(0, 0);
      leftList.innerHTML = '<div id="left-tracked-empty">Aucun objet suivi.<br>Cliquez un objet du Top 10 ou utilisez la recherche.</div>';
      return;
    }
    let activeAlerts = 0;
    trackedObjects.forEach(id => {
      const alertState = getTrackedAlertState(id);
      if (alertState.active) activeAlerts++;
      const item = document.createElement('div');
      item.className = `left-tracked-item ${alertState.itemClass}`.trim();
      item.innerHTML = `
        <div class="left-track-check">✓</div>
        <div class="left-tracked-body">
          <div class="left-track-name" title="${escapeHtml(id)}">${escapeHtml(id)}</div>
          <div class="left-track-meta">
            <span class="left-track-badge level-${escapeHtml(alertState.level)}">${escapeHtml(alertState.label)}</span>
            ${alertState.scoreText ? `<span class="left-track-score">${escapeHtml(alertState.scoreText)}</span>` : ''}
          </div>
        </div>
        <button class="left-track-rm" title="Retirer">×</button>
      `;
      item.querySelector('.left-track-rm').addEventListener('click', e => { e.stopPropagation(); removeTracked(id); });
      item.addEventListener('click', () => focusNodeById(id));
      leftList.appendChild(item);
    });
    updateTrackedAlertSummary(activeAlerts, trackedObjects.size);
  }


  function addTrackedAndSwitch(id) {
    if (!id) return;
    addTracked(id);
  }

  function getTrackedAlertState(nodeId) {
    const period = periods[currentIdx];
    const gd = getGD(currentCountry, period?.key);
    const node = (gd.nodes || []).find(n => n.id === nodeId);
    if (!node) {
      return {
        level: 'off',
        label: 'Hors radar',
        scoreText: '',
        itemClass: '',
        active: false,
      };
    }

    const score = Number(node.alert_score);
    const scoreText = Number.isFinite(score) ? `z ${score.toFixed(1)}` : '';
    const level = String(node.alert_level || 'none');

    if (level === 'strong') {
      return { level, label: 'Alerte forte', scoreText, itemClass: 'alert-strong', active: true };
    }
    if (level === 'alert') {
      return { level, label: 'Alerte', scoreText, itemClass: 'alert-alert', active: true };
    }
    if (level === 'watch') {
      return { level, label: 'Veille', scoreText, itemClass: 'alert-watch', active: true };
    }
    if (level === 'emerging') {
      return { level, label: 'Émergent', scoreText: node.n ? `${node.n} mentions` : '', itemClass: '', active: false };
    }
    return {
      level: 'normal',
      label: 'Normal',
      scoreText,
      itemClass: '',
      active: false,
    };
  }

  function updateTrackedAlertSummary(activeCount, trackedCount) {
    const summaryEl = document.getElementById('left-alert-summary');
    const countEl = document.getElementById('left-alert-count');
    if (!summaryEl || !countEl) return;

    summaryEl.classList.toggle('has-tracked', trackedCount > 0);
    summaryEl.classList.toggle('has-active', activeCount > 0);
    if (!trackedCount) {
      countEl.textContent = '0 signal';
      return;
    }

    countEl.textContent = `${activeCount} signal${activeCount > 1 ? 's' : ''}`;
  }

  function renderRankedSearchResults(q) {
    const resultsEl = document.getElementById('ranked-search-results');
    if (!resultsEl) return;
    resultsEl.innerHTML = '';
    if (!q.trim()) return;
    const ql = q.toLowerCase();
    const matches = getRankedScopedObjectIds()
      .filter(id => id.toLowerCase().includes(ql))
      .filter(id => !trackedObjects.has(id))
      .slice(0, 7);
    matches.forEach(id => {
      const div = document.createElement('div');
      div.className = 'evo-result';
      div.textContent = id;
      div.addEventListener('click', () => {
        const input = document.getElementById('ranked-search-input');
        if (input) input.value = '';
        renderRankedSearchResults('');
        addTracked(id);
        setMode('tracking');
      });
      resultsEl.appendChild(div);
    });
  }

  function updateRankedLegendHoverState() {
    const list = document.getElementById('ranked-legend-list');
    if (!list) return;
    const items = list.querySelectorAll('.rleg-item');
    let hasAnyState = !!hoveredNode || !!focusedNode;
    if (!hasAnyState) {
      items.forEach(el => {
        if (trackedObjects.has(el.dataset.nodeId)) hasAnyState = true;
      });
    }
    items.forEach(el => {
      const id = el.dataset.nodeId;
      const isFocused = focusedNode === id;
      const isHovered = hoveredNode === id;
      const isTracked = trackedObjects.has(id);
      el.classList.toggle('hovered', isHovered && !isFocused && !isTracked);
      el.classList.toggle('dimmed', hasAnyState && !isFocused && !isHovered && !isTracked);
    });
  }

  function renderRankedLegend(series, hoverIdx) {
    const list = document.getElementById('ranked-legend-list');
    const periodEl = document.getElementById('ranked-legend-period');
    if (!list) return;

    const winPeriods = getRankedWindowPeriods();
    const isHoverBlock = hoverIdx !== null && hoverIdx >= 0;
    const limit = 10;
    const activeSeries = series;
    const currentPKey = periods[currentIdx]?.key;
    const idx = (hoverIdx !== null && hoverIdx >= 0) ? hoverIdx
      : winPeriods.findIndex(p => p.isDay ? (p.periodKeys?.includes(currentPKey)) : p.key === currentPKey);
    const safeIdx = idx >= 0 ? idx : winPeriods.length - 1;
    const period = winPeriods[safeIdx];
    const slotLabel = rankedSlots[rankedSlotIdx]?.label || '';
    if (periodEl) {
      if (isHoverBlock) {
        let blockLabel;
        if (rankedGranularity === 'day') blockLabel = blockRangeLabelFromPeriod(period);
        else if (period?.isDay) blockLabel = toDayLabel(period.dateKey);
        else blockLabel = period?.label || '';
        periodEl.textContent = `↗ Survol · ${blockLabel}`;
        periodEl.style.color = 'rgba(150,210,255,0.88)';
      } else {
        const cumulLabel = rankedGranularity === 'day'
          ? `Total cumulé · ${slotLabel}`
          : `Total cumulé · ${slotLabel}`;
        periodEl.textContent = cumulLabel;
        periodEl.style.color = 'rgba(120,160,220,0.55)';
      }
    }

    let rows = [];
    if (isHoverBlock) {
      const hoverPeriod = winPeriods[safeIdx];
      const gNow = getWinPeriodGD(currentCountry, hoverPeriod);
      const prevPeriod = safeIdx > 0 ? winPeriods[safeIdx - 1] : null;
      const gPrev = prevPeriod ? getWinPeriodGD(currentCountry, prevPeriod) : { nodes: [] };
      const prevRankMap = new Map(
        (gPrev.nodes || []).slice()
          .sort((a, b) => (Number(b.size)||0) - (Number(a.size)||0))
          .map((n, i) => [n.id, i + 1])
      );

      rows = (gNow.nodes || [])
        .slice()
        .sort((a, b) => (Number(b.size) || 0) - (Number(a.size) || 0))
        .slice(0, limit)
        .map((n, i) => {
          const val = Number(n.size) || 0;
          const curRank = i + 1;
          const prevRank = prevRankMap.has(n.id) ? prevRankMap.get(n.id) : null;
          const delta = prevRank !== null ? prevRank - curRank : null;
          const isNew = prevRank === null && safeIdx > 0;
          return {
            id: n.id,
            color: getObjectColor(n.id),
            val,
            displayVal: val,
            delta,
            isNew,
            isReturn: false,
            maxVal: val
          };
        });
    } else {
      const hasVeille = winPeriods.length > 0 && winPeriods[0]?.isVeille;
      // Construire un prevRankMap depuis la veille (JOUR) ou le slot précédent (SEMAINE/MOIS/ANNÉE)
      let prevRankMap = null;
      if (rankedGranularity === 'day' && hasVeille) {
        const veilleScores = activeSeries
          .filter(s => (s.data[0] ?? 0) > 0)
          .map(s => ({ id: s.id, v: s.data[0] }));
        veilleScores.sort((a, b) => b.v - a.v);
        prevRankMap = new Map(veilleScores.map((x, i) => [x.id, i + 1]));
      } else if (rankedGranularity !== 'day' && rankedSlotIdx > 0) {
        const prevSlot = rankedSlots[rankedSlotIdx - 1];
        if (prevSlot?.periodKeys?.length) {
          const sizeMap = new Map();
          for (const pk of prevSlot.periodKeys) {
            const g = getGD(currentCountry, pk);
            for (const n of (g.nodes || [])) {
              sizeMap.set(n.id, (sizeMap.get(n.id) || 0) + (Number(n.size) || 0));
            }
          }
          const sorted = [...sizeMap.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
          prevRankMap = new Map(sorted.map(([id], i) => [id, i + 1]));
        }
      }
      const cumRows = activeSeries.map(s => {
        const cum = s.data.reduce((acc, v, i) => {
          if (hasVeille && i === 0) return acc;
          return acc + (v ?? 0);
        }, 0);
        const isNew = prevRankMap !== null ? !prevRankMap.has(s.id) : rankedSlotIdx > 0;
        return { id: s.id, color: s.color, displayVal: cum, isNew, isReturn: false, maxVal: s.maxVal ?? 0 };
      });
      rows = cumRows
        .sort((a, b) => b.displayVal - a.displayVal)
        .slice(0, limit)
        .map((r, i) => {
          const curRank = i + 1;
          const prevRank = prevRankMap?.get(r.id) ?? null;
          const delta = prevRank !== null ? prevRank - curRank : null;
          return { ...r, val: r.displayVal, delta };
        });
    }

    const hasVisibleFocusedL = focusedNode !== null && rows.some(r => r.id === focusedNode);
    const hasVisibleHoveredL = hoveredNode !== null && rows.some(r => r.id === hoveredNode);
    const hasVisibleTrackedL = rows.some(r => trackedObjects.has(r.id));
    const hasHover = hasVisibleFocusedL || hasVisibleHoveredL || hasVisibleTrackedL;
    // Map id → node pour les badges d'alerte de la période courante
    const curAlertGd = getGD(currentCountry, periods[currentIdx]?.key);
    const nodeAlertMap = new Map((curAlertGd.nodes || []).map(n => [n.id, n]));
    const ALERT_BADGE_LABELS = { strong: 'Fort', alert: 'Alerte', watch: 'Veille', emerging: 'Émerg.' };
    list.innerHTML = '';
    rows.forEach((r, i) => {
      const isFocused  = focusedNode  === r.id;
      const isHovered  = hoveredNode  === r.id;
      const isTracked  = trackedObjects.has(r.id);
      const isDimmed   = hasHover && !isFocused && !isHovered && !isTracked;

      let deltaTxt = '', deltaClass = 'flat';
      const prevPeriodForLabel = isHoverBlock ? (safeIdx > 0 ? winPeriods[safeIdx - 1] : null) : null;
      const prevSlotLabel = !isHoverBlock && rankedGranularity !== 'day' && rankedSlotIdx > 0
        ? (rankedSlots[rankedSlotIdx - 1]?.label || '')
        : '';
      const compLabel = rankedGranularity === 'day'
        ? (prevPeriodForLabel?.isVeille ? 'vs hier (moy./bloc)' : prevPeriodForLabel ? `vs ${blockRangeLabelFromPeriod(prevPeriodForLabel)}` : 'vs hier')
        : (prevSlotLabel ? `vs ${prevSlotLabel}` : ({ week: 'vs sem. passée', month: 'vs mois passé', year: 'vs an passé' }[rankedGranularity] || ''));
      if (r.delta !== null && r.delta !== 0) {
        deltaClass = r.delta > 0 ? 'up' : 'down';
        deltaTxt = `${r.delta > 0 ? '↑' : '↓'}${Math.abs(r.delta)}`;
      } else if (r.delta === 0) {
        deltaTxt = '=';
      } else if (r.isNew) {
        deltaTxt = 'NVX'; deltaClass = 'new-entry';
      } else if (r.isReturn) {
        deltaTxt = 'RET'; deltaClass = 'ret-entry';
      }

      const item = document.createElement('div');
      item.className = 'rleg-item' +
        (isFocused ? ' focused' : '') +
        (isHovered && !isFocused && !isTracked ? ' hovered' : '') +
        (isDimmed ? ' dimmed' : '') +
        (isTracked ? ' tracked' : '');
      item.dataset.nodeId = r.id;
      const curAlertNode = nodeAlertMap.get(r.id);
      const curAlertLevel = curAlertNode?.alert_level;
      const showAlertBadge = curAlertLevel && curAlertLevel !== 'normal' && curAlertLevel !== 'none';
      const alertBadgeHtml = showAlertBadge
        ? `<span class="rleg-alert-badge level-${escapeHtml(curAlertLevel)}">${escapeHtml(ALERT_BADGE_LABELS[curAlertLevel] || curAlertLevel)}</span>`
        : '';
      item.innerHTML = `
        <div class="rleg-swatch" style="background:${r.color};box-shadow:0 0 5px ${r.color}88"></div>
        <span class="rleg-rank">${i + 1}.</span>
        <span class="rleg-name" title="${escapeHtml(r.id)}">${escapeHtml(r.id)}</span>
        ${alertBadgeHtml}
        <span class="rleg-check">${isTracked ? '✓' : ''}</span>
        <span class="rleg-val${r.displayVal === null ? ' null-val' : ''}">${r.displayVal !== null ? r.displayVal.toFixed(1) : '—'}</span>
        <span class="rleg-delta ${deltaClass}" title="${escapeHtml(compLabel)}">${deltaTxt}</span>
      `;

      item.addEventListener('mouseenter', () => {
        hoveredNode = r.id;
        updateRankedLegendHoverState();
        renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), rankedHoverIdx, true);
      });
      item.addEventListener('mouseleave', () => {
        hoveredNode = null;
        updateRankedLegendHoverState();
        renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), rankedHoverIdx, true);
      });
      item.addEventListener('pointerdown', e => {
        e.stopPropagation();
        e.preventDefault();
        // Reclique sur un item déjà focusé → déselection
        if (focusedNode === r.id) {
          focusedNode = null;
          renderArticlesPanel(null);
          if (currentMode === 'ranked') {
            renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), rankedHoverIdx);
            renderRankedLegend(series, rankedHoverIdx);
          } else {
            renderEvolutionChart();
            renderTrackedList();
          }
          return;
        }
        focusedNode = r.id;
        let sourceGraph;
        let sourcePeriod;
        if (isHoverBlock) {
          sourcePeriod = winPeriods[safeIdx];
          sourceGraph = getWinPeriodGD(currentCountry, sourcePeriod);
        } else {
          const slot = rankedSlots[rankedSlotIdx];
          sourcePeriod = { isDay: true, periodKeys: slot?.periodKeys || [], dateKey: slot?.key };
          sourceGraph = getWinPeriodGD(currentCountry, sourcePeriod);
        }
        const sourceNode = (sourceGraph.nodes || []).find(n => n.id === r.id);
        if (sourceNode) renderArticlesPanel(sourceNode, sourcePeriod);
        else renderArticlesPanelUnavailable(r.id, sourcePeriod);
        if (currentMode === 'ranked') {
          renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), rankedHoverIdx);
          renderRankedLegend(series, rankedHoverIdx);
        } else {
          addTracked(r.id);
          renderEvolutionChart();
          renderTrackedList();
        }
      });

      list.appendChild(item);
    });

  }

  const rankedSeriesCache = new Map();

  function getRankedSeriesCacheKey(limit, wp) {
    if (!wp.length) {
      const slotKey = rankedSlots[rankedSlotIdx]?.key || 'noslot';
      return `${currentCountry}|${rankedGranularity}|${slotKey}|empty|${limit}`;
    }
    const first = wp[0].key;
    const last = wp[wp.length - 1].key;
    const slotKey = rankedSlots[rankedSlotIdx]?.key || 'noslot';
    return `${currentCountry}|${rankedGranularity}|${slotKey}|${first}|${last}|${wp.length}|${limit}`;
  }

  function clearRankedSeriesCache() {
    rankedSeriesCache.clear();
    rankedChartSeriesCache.clear();
  }

  function getSeriesColor(i) {
    if (i < TRACK_COLORS.length) return TRACK_COLORS[i];
    const hue = (i * 47) % 360;
    return `hsl(${hue} 78% 62%)`;
  }

  function getObjectColor(id) {
    if (trackColorMap.has(id)) return trackColorMap.get(id);
    let h = 0;
    for (let ci = 0; ci < id.length; ci++) h = (h * 31 + id.charCodeAt(ci)) >>> 0;
    return TRACK_COLORS[h % TRACK_COLORS.length];
  }

  function topIdsForPeriod(periodKey, topN = 10) {
    const g = getGD(currentCountry, periodKey);
    return (g.nodes || [])
      .slice()
      .sort((a, b) => (b.size || 0) - (a.size || 0))
      .slice(0, topN)
      .map(n => n.id);
  }

  function getRankedSeries(gd, limit = Infinity, winPeriods = null) {
    const wp = winPeriods || getRankedWindowPeriods();
    const cacheKey = getRankedSeriesCacheKey(limit, wp);
    if (rankedSeriesCache.has(cacheKey)) return rankedSeriesCache.get(cacheKey);

    // Pré-compute per-period node maps une seule fois (sinon O(topIds × wp × nodes))
    const periodInfo = wp.map(p => {
      if (p.isSynthetic || p.isFuture) return { p, nodes: null, nodeById: null, isReal: false };
      const g = getWinPeriodGD(currentCountry, p);
      const nodes = g.nodes || [];
      const nodeById = new Map(nodes.map(nd => [nd.id, nd]));
      return { p, nodes, nodeById, isReal: true };
    });

    // Union des Top 10 locaux de chaque journée/bloc visible.
    const unionIds = new Set();
    const scoreMap = new Map();
    const hitMap = new Map();
    for (const info of periodInfo) {
      if (!info.isReal) continue;
      const topIds = info.nodes.slice(0, 10).map(n => n.id);
      const veilleNorm = info.p.isVeille ? (Array.isArray(info.p.periodKeys) ? (info.p.periodKeys.length || 1) : 6) : 1;
      for (const id of topIds) {
        unionIds.add(id);
        const val = (Number(info.nodeById.get(id)?.size) || 0) / veilleNorm;
        scoreMap.set(id, (scoreMap.get(id) || 0) + val);
        hitMap.set(id, (hitMap.get(id) || 0) + 1);
      }
    }

    let topIds = [...unionIds]
      .sort((a, b) => {
        const ds = (scoreMap.get(b) || 0) - (scoreMap.get(a) || 0);
        if (Math.abs(ds) > 1e-9) return ds;
        return (hitMap.get(b) || 0) - (hitMap.get(a) || 0);
      });

    if (Number.isFinite(limit)) topIds = topIds.slice(0, Math.max(0, Math.floor(limit)));

    const series = topIds.map((id) => ({
      id,
      color: getObjectColor(id),
      maxVal: 0,
      data: periodInfo.map(info => {
        if (!info.isReal) return null;
        const node = info.nodeById.get(id);
        if (!node) return 0;
        const size = Number(node.size) || 0;
        if (info.p.isVeille && size > 0) {
          const nBlocks = Array.isArray(info.p.periodKeys) ? (info.p.periodKeys.length || 1) : 6;
          return size / nBlocks;
        }
        return size;
      })
    }));
    series.forEach(s => {
      s.maxVal = s.data.reduce((mx, v) => (v !== null ? Math.max(mx, v) : mx), 0);
    });
    rankedSeriesCache.set(cacheKey, series);
    return series;
  }

  const rankedChartSeriesCache = new Map();
  function getRankedChartSeries(gd, winPeriods, hoverPeriod = null) {
    const fullSeries = getRankedSeries(gd, Infinity, winPeriods);
    const topSeries = getRankedSeries(gd, getRankedTopN(), winPeriods);

    // Cache du résultat final basé sur l'état "visible" (mêmes wp + mêmes overlays utilisateur)
    const stableKey = getRankedSeriesCacheKey('chart', winPeriods);
    const overlayKey = `${focusedNode || ''}|${hoveredNode || ''}|${[...trackedObjects].sort().join(',')}|${hoverPeriod?.key || ''}`;
    const cacheKey = `${stableKey}|${overlayKey}`;
    if (rankedChartSeriesCache.has(cacheKey)) return rankedChartSeriesCache.get(cacheKey);

    const byId = new Map(fullSeries.map(s => [s.id, s]));

    const requiredIds = new Set([
      focusedNode,
      hoveredNode,
      ...Array.from(trackedObjects)
    ].filter(Boolean));

    // Inclure en permanence le top 10 de CHAQUE bloc visible (pas juste le cumulé).
    // fullSeries contient déjà tous les unionIds (top 10 de chaque période), donc on
    // peut simplement prendre tous les IDs de fullSeries qui n'auraient pas été inclus
    // dans topSeries (qui slice à getRankedTopN). Évite un nouveau pass sur winPeriods.
    fullSeries.forEach(s => requiredIds.add(s.id));

    const out = [...topSeries];
    requiredIds.forEach(id => {
      if (out.some(s => s.id === id)) return;
      const extra = byId.get(id);
      if (extra) out.push(extra);
    });

    rankedChartSeriesCache.set(cacheKey, out);
    return out;
  }

  function getRankedChartLayout(rect) {
    const W = rect.width;
    const leftPanel = document.getElementById('left-panel');
    const compact = W < 960;
    const leftPanelWidth = leftPanel ? leftPanel.getBoundingClientRect().width : 0;
    const leftPad = Math.max(compact ? 140 : 180, Math.ceil(leftPanelWidth + 22));
    const rightPad = 38;
    let bottomPad = 72;
    const controls = document.getElementById('controls');
    if (controls) {
      const controlsRect = controls.getBoundingClientRect();
      const controlsTop = controlsRect.top - rect.top;
      if (Number.isFinite(controlsTop)) bottomPad = Math.max(bottomPad, rect.height - controlsTop + 38);
    }
    const PAD = { top: compact ? 112 : 94, right: rightPad, bottom: bottomPad, left: leftPad };
    const chartW = Math.max(90, rect.width - PAD.left - PAD.right);
    const chartH = Math.max(80, rect.height - PAD.top - PAD.bottom);
    return { PAD, chartW, chartH };
  }

  function getRightPanelPad(rect, panelIds, fallbackPad = 24) {
    const gap = 20;
    let rightPad = fallbackPad;
    for (const panelId of panelIds) {
      const panel = document.getElementById(panelId);
      if (!panel) continue;
      const style = getComputedStyle(panel);
      if (style.display === 'none' || style.visibility === 'hidden') continue;
      const panelRect = panel.getBoundingClientRect();
      if (panelRect.width <= 0 || panelRect.height <= 0) continue;
      const panelOffsetFromRight = Math.max(0, rect.right - panelRect.right);
      rightPad = Math.max(rightPad, Math.ceil(panelRect.width + panelOffsetFromRight + gap));
    }
    return rightPad;
  }

  // ── Mode Jour : axe X = heures réelles (0h–24h) ─────────────────────────

  function dayBlockHour(p) {
    if (!p || p.isVeille) return 0;
    const s = blockStartFromPeriod(p);
    // End-of-block positioning: Minuit-4h→h=4, 4h-8h→h=8, etc.
    // Veille stays at h=0; each block appears where its 4h window closes.
    return Number.isFinite(s) ? s + 4 : 0;
  }

  function renderDayModeChart(gd, hoverIdx = null, skipLegend = false) {
    const canvas = document.getElementById('evo-canvas');
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width; canvas.height = rect.height;
    const W = canvas.width, H = canvas.height;
    if (!W || !H) return;
    const ctx = canvas.getContext('2d');
    const lb = document.getElementById('live-badge');

    ctx.fillStyle = '#00000f'; ctx.fillRect(0, 0, W, H);
    if (lb) lb.style.display = 'none';
    STARS.forEach(s => {
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,205,255,${(s.a * 0.35).toFixed(2)})`; ctx.fill();
    });

    const { PAD, chartW, chartH } = getRankedChartLayout(rect);
    const xOfHour = h => PAD.left + (h / 24) * chartW;

    const winPeriods = getRankedWindowPeriods();
    const hasPeriodSelectionInit = selectedPeriodIdx !== null;
    const effectiveIdx = hoverIdx !== null && hoverIdx >= 0
      ? hoverIdx
      : (hasPeriodSelectionInit ? selectedPeriodIdx : null);
    const hoverPeriod = (effectiveIdx !== null && effectiveIdx >= 0 && effectiveIdx < winPeriods.length)
      ? winPeriods[effectiveIdx] : null;
    const series = getRankedChartSeries(gd, winPeriods, hoverPeriod);

    const now = new Date();
    const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const slot = rankedSlots[rankedSlotIdx];
    const isToday = slot?.key === todayKey;
    const liveHour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;

    const allVals = series.flatMap(s => s.data.filter(v => v !== null));
    const maxVal = allVals.length ? Math.max(...allVals, 0.1) : 1;
    const yOf = v => PAD.top + chartH - (v / maxVal) * chartH;

    // Y grid horizontal
