    ctx.font = '9px "Space Mono", monospace';
    for (let gi = 0; gi <= 5; gi++) {
      const v = (gi / 5) * maxVal, y = yOf(v);
      ctx.strokeStyle = 'rgba(55,85,175,0.18)'; ctx.lineWidth = 1; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + chartW, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(110,150,215,0.55)'; ctx.textAlign = 'left';
      ctx.fillText(v >= 100 ? v.toFixed(0) : v.toFixed(1), PAD.left + chartW + 5, y + 3);
    }

    // X grid vertical : lignes pâles à 2h, foncées à 4h
    [2, 6, 10, 14, 18, 22].forEach(h => {
      ctx.strokeStyle = 'rgba(38,55,125,0.13)'; ctx.lineWidth = 1; ctx.setLineDash([2, 8]);
      ctx.beginPath(); ctx.moveTo(xOfHour(h), PAD.top); ctx.lineTo(xOfHour(h), PAD.top + chartH); ctx.stroke();
      ctx.setLineDash([]);
    });
    [0, 4, 8, 12, 16, 20, 24].forEach(h => {
      ctx.strokeStyle = 'rgba(55,85,175,0.28)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOfHour(h), PAD.top); ctx.lineTo(xOfHour(h), PAD.top + chartH); ctx.stroke();
    });

    // Axes
    ctx.strokeStyle = 'rgba(75,115,195,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, PAD.top + chartH); ctx.lineTo(PAD.left + chartW, PAD.top + chartH); ctx.stroke();

    // Labels X
    const DAY_LABELS = [
      { h: 0, label: 'Hier', align: 'left' },
      { h: 4, label: '4h', align: 'center' },
      { h: 8, label: '8h', align: 'center' },
      { h: 12, label: 'Midi', align: 'center' },
      { h: 16, label: '16h', align: 'center' },
      { h: 20, label: '20h', align: 'center' },
    ];
    DAY_LABELS.forEach(({ h, label, align }) => {
      const x = xOfHour(h);
      ctx.strokeStyle = 'rgba(55,85,175,0.22)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, PAD.top + chartH); ctx.lineTo(x, PAD.top + chartH + 5); ctx.stroke();
      ctx.font = '11px "Space Mono", monospace'; ctx.textAlign = align;
      ctx.fillStyle = 'rgba(138,176,235,0.85)';
      ctx.fillText(label, x, PAD.top + chartH + 18);
    });

    // Séparateur Hier / Aujourd'hui
    const sepX = (xOfHour(0) + xOfHour(4)) / 2;
    ctx.strokeStyle = 'rgba(80,100,180,0.22)'; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.moveTo(sepX, PAD.top); ctx.lineTo(sepX, PAD.top + chartH); ctx.stroke();
    ctx.setLineDash([]);

    // Zone future (après le dernier bloc réel, aujourd'hui seulement)
    if (isToday) {
      let lastRealH = 0;
      winPeriods.forEach(p => {
        if (!p.isFuture && !p.isSynthetic && !p.isVeille) {
          const h = dayBlockHour(p); if (h > lastRealH) lastRealH = h;
        }
      });
      const futureStartX = xOfHour(lastRealH); // end-of-block: lastRealH is already the block's close
      if (futureStartX < PAD.left + chartW) {
        const grad = ctx.createLinearGradient(futureStartX, 0, PAD.left + chartW, 0);
        grad.addColorStop(0, 'rgba(15,25,70,0.0)'); grad.addColorStop(1, 'rgba(15,25,70,0.24)');
        ctx.fillStyle = grad; ctx.fillRect(futureStartX, PAD.top, PAD.left + chartW - futureStartX, chartH);
      }
    }

    // Dimming
    const hasPeriodSelection = selectedPeriodIdx !== null;
    const hasVisF = focusedNode !== null && series.some(s => s.id === focusedNode);
    const hasVisH = hoveredNode !== null && series.some(s => s.id === hoveredNode);
    const hasVisT = series.some(s => trackedObjects.has(s.id));
    const hasActiveNode = hasVisF || hasVisH || hasVisT;

    // Pre-compute per-series state (so we can do two passes: lines first, dots on top)
    const seriesState = series.map(s => {
      const [r, g, b] = hexToRgb(s.color);
      const isFocused = focusedNode === s.id;
      const isHovS = hoveredNode === s.id;
      const isTracked = trackedObjects.has(s.id);
      const isActive = isFocused || isHovS || isTracked;
      const isDimmed = (hasActiveNode && !isActive) || (hasPeriodSelection && !hasActiveNode);
      const pts = [];
      winPeriods.forEach((p, i) => {
        if ((p.isFuture && !p.isSynthetic) || p.isSynthetic) return;
        if (s.data[i] === null) return;
        pts.push({ h: dayBlockHour(p), v: s.data[i], wi: i });
      });
      return { s, r, g, b, isActive, isDimmed, pts };
    });

    // Pass 1 — Lines (so they don't cover other series' dots)
    seriesState.forEach(({ s, r, g, b, isActive, isDimmed, pts }) => {
      if (!pts.length) return;
      const lineW = isActive ? 3.2 : 2;
      const shadowB = isActive ? 14 : (isDimmed ? 0 : 7);
      ctx.beginPath();
      pts.forEach(({ h, v }, pi) => {
        const x = xOfHour(h), y = yOf(v);
        if (pi === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = isDimmed ? `rgba(${r},${g},${b},0.28)` : s.color;
      ctx.lineWidth = lineW; ctx.shadowColor = s.color; ctx.shadowBlur = shadowB;
      ctx.stroke(); ctx.shadowBlur = 0;

      if (isToday && pts.length) {
        const last = pts[pts.length - 1];
        if (liveHour > last.h) {
          const endH = Math.min(liveHour, 24);
          ctx.beginPath(); ctx.moveTo(xOfHour(last.h), yOf(last.v)); ctx.lineTo(xOfHour(endH), yOf(last.v));
          ctx.strokeStyle = isDimmed ? `rgba(${r},${g},${b},0.20)` : `rgba(${r},${g},${b},0.48)`;
          ctx.lineWidth = lineW * 0.7; ctx.setLineDash([4, 5]);
          ctx.shadowColor = s.color; ctx.shadowBlur = isDimmed ? 0 : 4;
          ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
        }
      }
    });

    // Pass 2 — Dots on top of all lines (so no series' dot is covered by another's line)
    seriesState.forEach(({ s, r, g, b, isActive, isDimmed, pts }) => {
      if (!pts.length) return;
      pts.forEach(({ h, v, wi }) => {
        const x = xOfHour(h), y = yOf(v);
        const isSelected = hasPeriodSelection && selectedPeriodIdx === wi;
        const dotR = isSelected ? 6 : (isActive ? 5.5 : (h === 0 ? 3.5 : 4.5));
        ctx.beginPath(); ctx.arc(x, y, dotR, 0, Math.PI * 2);
        if (isSelected) {
          ctx.fillStyle = `rgba(${r},${g},${b},0.98)`;
          ctx.shadowColor = s.color; ctx.shadowBlur = 16;
        } else {
          ctx.fillStyle = isDimmed ? `rgba(${r},${g},${b},0.42)` : `rgba(${r},${g},${b},${isActive ? 0.98 : 0.88})`;
          if (isActive) { ctx.shadowColor = s.color; ctx.shadowBlur = 12; }
        }
        ctx.fill();
        if (isSelected) { ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5; ctx.stroke(); }
        ctx.shadowBlur = 0;
      });

      if (isToday && pts.length && liveHour > pts[pts.length - 1].h) {
        const lastV = pts[pts.length - 1].v;
        const lx = xOfHour(Math.min(liveHour, 24));
        ctx.beginPath(); ctx.arc(lx, yOf(lastV), isActive ? 4.5 : 4, 0, Math.PI * 2);
        ctx.fillStyle = isDimmed ? `rgba(${r},${g},${b},0.38)` : `rgba(${r},${g},${b},0.78)`;
        if (isActive && !isDimmed) { ctx.shadowColor = s.color; ctx.shadowBlur = 8; }
        ctx.fill(); ctx.shadowBlur = 0;
      }
    });

    // Ligne EN DIRECT + badge
    if (isToday) {
      const lx = xOfHour(Math.min(liveHour, 24));
      ctx.strokeStyle = 'rgba(100,220,160,0.55)'; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(lx, PAD.top); ctx.lineTo(lx, PAD.top + chartH); ctx.stroke();
      ctx.setLineDash([]);
      if (lb) {
        const cr = canvas.getBoundingClientRect();
        lb.style.display = 'block';
        lb.style.left = (cr.left + lx + 6) + 'px';
        lb.style.top = (cr.top + PAD.top + 4) + 'px';
      }
    }

    // Hover overlay
    if (hoverIdx !== null && hoverIdx >= 0 && hoverIdx < winPeriods.length) {
      const hp = winPeriods[hoverIdx];
      if (!hp.isFuture && !hp.isSynthetic) {
        const hx = xOfHour(dayBlockHour(hp));
        if (!hasPeriodSelection || hoverIdx !== selectedPeriodIdx) {
          ctx.strokeStyle = 'rgba(200,220,255,0.18)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
          ctx.beginPath(); ctx.moveTo(hx, PAD.top); ctx.lineTo(hx, PAD.top + chartH); ctx.stroke(); ctx.setLineDash([]);
          series.forEach(s => {
            const v = s.data[hoverIdx]; if (v === null) return;
            ctx.beginPath(); ctx.arc(hx, yOf(v), focusedNode === s.id ? 6.2 : 5, 0, Math.PI * 2);
            ctx.fillStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
          });
        }
      }
    }

    // Sélection persistante
    if (hasPeriodSelection && selectedPeriodIdx >= 0 && selectedPeriodIdx < winPeriods.length) {
      const sp = winPeriods[selectedPeriodIdx];
      if (!sp.isFuture && !sp.isSynthetic) {
        const sx = xOfHour(dayBlockHour(sp));
        ctx.strokeStyle = 'rgba(200,225,255,0.45)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(sx, PAD.top); ctx.lineTo(sx, PAD.top + chartH); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(200,225,255,0.8)';
        ctx.font = '9px "Space Mono", monospace'; ctx.textAlign = 'center';
        ctx.fillText('▼', sx, PAD.top - 10);
      }
    }

    // Aligner le slider
    const sliderRow = document.getElementById('slider-row');
    if (sliderRow) {
      const ctrlPad = 24;
      sliderRow.style.paddingLeft  = `${Math.max(0, PAD.left  - ctrlPad)}px`;
      sliderRow.style.paddingRight = `${Math.max(0, PAD.right - ctrlPad)}px`;
    }

    const effectiveHoverIdx = hasPeriodSelection ? selectedPeriodIdx : hoverIdx;
    if (!skipLegend) {
      requestAnimationFrame(() => renderRankedLegend(series, effectiveHoverIdx));
    }
  }

  function periodTickParts(period) {
    if (rankedGranularity === 'day') {
      if (period?.isVeille) return { major: 'Hier', minor: '' };
      const start = blockStartFromPeriod(period);
      return { major: FR_BLOCK_SHORT[start] ?? (String(start) + 'h'), minor: '' };
    }

    const dateStr = periodDisplayDate(period);
    const [y, m, d] = String(dateStr).split('-').map(Number);
    if (Number.isFinite(y) && Number.isFinite(m) && Number.isFinite(d)) {
      const dt = new Date(`${dateStr}T00:00:00`);
      if (rankedGranularity === 'week') {
        const wd = FR_WEEKDAYS_SHORT[dt.getDay()] || '';
        return { major: `${wd} ${String(d).padStart(2, '0')}`, minor: '' };
      }
      if (rankedGranularity === 'month') {
        return { major: `${String(d).padStart(2, '0')} ${FR_MONTHS_SHORT[Math.max(0, m - 1)] || ''}`.trim(), minor: '' };
      }
      return { major: `${FR_MONTHS_SHORT[Math.max(0, m - 1)] || ''} ${y}`.trim(), minor: '' };
    }
    const label = String(period?.label || '');
    return { major: label, minor: '' };
  }

  function renderRankedChart(gd, hoverIdx = null, skipLegend = false) {
    if (rankedGranularity === 'day') { renderDayModeChart(gd, hoverIdx, skipLegend); return; }
    const canvas = document.getElementById('evo-canvas');
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    const W = canvas.width;
    const H = canvas.height;
    if (!W || !H) return;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#00000f';
    ctx.fillRect(0, 0, W, H);
    // Badge live caché par défaut — réactivé plus bas si journée partielle
    { const lb = document.getElementById('live-badge'); if (lb) lb.style.display = 'none'; }

    STARS.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,205,255,${(s.a * 0.35).toFixed(2)})`;
      ctx.fill();
    });

    const winPeriods = getRankedWindowPeriods();
    const hasPeriodSelectionInit2 = selectedPeriodIdx !== null;
    const effectiveIdx2 = hoverIdx !== null && hoverIdx >= 0
      ? hoverIdx
      : (hasPeriodSelectionInit2 ? selectedPeriodIdx : null);
    const hoverPeriod2 = (effectiveIdx2 !== null && effectiveIdx2 >= 0 && effectiveIdx2 < winPeriods.length)
      ? winPeriods[effectiveIdx2] : null;
    const series = getRankedChartSeries(gd, winPeriods, hoverPeriod2);
    if (!series.length) return;
    const n = winPeriods.length;
    if (!n) return;

    const { PAD, chartW, chartH } = getRankedChartLayout(rect);
    const xOf = i => PAD.left + (n > 1 ? (i / (n - 1)) * chartW : chartW / 2);
    const allVals = series.flatMap(s => s.data.filter(v => v !== null));
    const maxVal = allVals.length ? Math.max(...allVals, 0.1) : 1;
    const yOf = v => PAD.top + chartH - (v / maxVal) * chartH;

    // Grid horizontal
    ctx.font = '9px "Space Mono", monospace';
    for (let gi = 0; gi <= 5; gi++) {
      const v = (gi / 5) * maxVal;
      const y = yOf(v);
      ctx.strokeStyle = 'rgba(55,85,175,0.18)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 6]);
      ctx.beginPath();
      ctx.moveTo(PAD.left, y);
      ctx.lineTo(PAD.left + chartW, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(110,150,215,0.55)';
      ctx.textAlign = 'left';
      ctx.fillText(v >= 100 ? v.toFixed(0) : v.toFixed(1), PAD.left + chartW + 5, y + 3);
    }

    // Axes + X ticks - labels courts, lisibles et adaptes a chaque filtre.
    const tickIndices = (() => {
      if (rankedGranularity === 'day') {
        const xStep = Math.max(1, Math.floor(n / 6));
        const idxs = [];
        for (let i = 0; i < n; i++) {
          if (i % xStep === 0 || i === n - 1) idxs.push(i);
        }
        return idxs;
      }

      const bucketFor = (idx) => {
        const d = periodDisplayDate(winPeriods[idx]);
        return rankedGranularity === 'year' ? d.slice(0, 7) : d;
      };

      const candidateIdxs = [];
      let prevBucket = null;
      for (let i = 0; i < n; i++) {
        const bucket = bucketFor(i);
        if (bucket !== prevBucket) {
          candidateIdxs.push(i);
          prevBucket = bucket;
        }
      }
      if (candidateIdxs[candidateIdxs.length - 1] !== n - 1) {
        const lastCandidateBucket = bucketFor(candidateIdxs[candidateIdxs.length - 1]);
        const lastBucket = bucketFor(n - 1);
        if (lastCandidateBucket !== lastBucket) candidateIdxs.push(n - 1);
      }

      const maxTicks = rankedGranularity === 'year' ? 10 : 8;
      const keepEvery = Math.max(1, Math.ceil(candidateIdxs.length / maxTicks));
      const selected = candidateIdxs.filter((_, idx) => idx % keepEvery === 0);
      if (selected[selected.length - 1] !== n - 1) selected.push(n - 1);
      return selected;
    })();

    tickIndices.forEach(i => {
      const p = winPeriods[i];
      const x = xOf(i);
      ctx.strokeStyle = 'rgba(55,85,175,0.22)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, PAD.top + chartH);
      ctx.lineTo(x, PAD.top + chartH + 5);
      ctx.stroke();
      if (p?.isFuture) return; // les labels futurs sont gérés plus bas
      const parts = periodTickParts(p);
      ctx.font = '11px "Space Mono", monospace';
      ctx.textAlign = 'center';
      const axisLabelY = PAD.top + chartH + 18;
      ctx.fillStyle = 'rgba(138, 176, 235, 0.85)';
      ctx.fillText(parts.major, x, axisLabelY);
    });

    ctx.strokeStyle = 'rgba(75,115,195,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD.left, PAD.top);
    ctx.lineTo(PAD.left, PAD.top + chartH);
    ctx.lineTo(PAD.left + chartW, PAD.top + chartH);
    ctx.stroke();

    // Index de la période courante dans winPeriods
    const currentPKey = periods[currentIdx]?.key;
    const winCurrentIdx = winPeriods.findIndex(p => p.isDay ? (p.periodKeys?.includes(currentPKey)) : p.key === currentPKey);

    // ── Journée en construction : zone future ──────────────────────
    const hasVeillePoint = winPeriods.length > 0 && winPeriods[0]?.isVeille;
    const firstFutureIdx = winPeriods.findIndex(p => p.isFuture);
    const isPartialDay = rankedGranularity === 'day' && firstFutureIdx > 0;
    const liveBadge = document.getElementById('live-badge');

    // Séparateur visuel entre le point "Hier" et les blocs d'aujourd'hui
    if (hasVeillePoint && n > 1) {
      const sepX = (xOf(0) + xOf(1)) / 2;
      ctx.strokeStyle = 'rgba(80,100,180,0.25)';
      ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.moveTo(sepX, PAD.top); ctx.lineTo(sepX, PAD.top + chartH); ctx.stroke();
      ctx.setLineDash([]);
    }

    if (isPartialDay) {
      // Zone future — gradient subtil du bord du dernier bloc complété vers la droite
      const futureX = n > 1
        ? xOf(firstFutureIdx) - (xOf(1) - xOf(0)) * 0.5
        : PAD.left + chartW;
      const grad = ctx.createLinearGradient(futureX, 0, PAD.left + chartW, 0);
      grad.addColorStop(0, 'rgba(15,25,70,0.0)');
      grad.addColorStop(1, 'rgba(15,25,70,0.28)');
      ctx.fillStyle = grad;
      ctx.fillRect(futureX, PAD.top, PAD.left + chartW - futureX, chartH);

      // Labels axes X futurs en plus pâle
      tickIndices.forEach(i => {
        if (!winPeriods[i]?.isFuture) return;
        const x = xOf(i);
        ctx.fillStyle = 'rgba(90,120,200,0.35)';
        ctx.font = '11px "Space Mono", monospace'; ctx.textAlign = 'center';
        ctx.fillText(periodTickParts(winPeriods[i]).major, x, PAD.top + chartH + 18);
      });

      // Fantôme de la veille — uniquement si le point "Hier" n'est pas déjà affiché
      if (!hasVeillePoint) {
        const prevSlot = rankedSlots[rankedSlotIdx - 1];
        if (prevSlot?.periodKeys?.length) {
          const allGhostVals = series.flatMap(s =>
            prevSlot.periodKeys.map(k => graphs[currentCountry]?.[k]?.nodes?.find(nd => nd.id === s.id)?.size ?? null)
              .filter(v => v !== null)
          );
          const ghostMax = allGhostVals.length ? Math.max(...allGhostVals, maxVal) : maxVal;
          const yGhost = v => PAD.top + chartH - (v / ghostMax) * chartH;
          const ghostN = prevSlot.periodKeys.length;
          series.forEach(s => {
            const [r, g2, b] = hexToRgb(s.color);
            const ghostData = prevSlot.periodKeys.map(k =>
              graphs[currentCountry]?.[k]?.nodes?.find(nd => nd.id === s.id)?.size ?? null
            );
            if (ghostData.every(v => v === null)) return;
            ctx.beginPath();
            let gFirst = true;
            ghostData.forEach((v, i) => {
              if (v === null) { gFirst = true; return; }
              const gx = PAD.left + (ghostN > 1 ? (i / (ghostN - 1)) * chartW : chartW / 2);
              const gy = yGhost(v);
              if (gFirst) { ctx.moveTo(gx, gy); gFirst = false; } else ctx.lineTo(gx, gy);
            });
            ctx.strokeStyle = `rgba(${r},${g2},${b},0.13)`;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
          });
        }
      }

      // Ligne verticale et badge "EN DIRECT" au dernier bloc complété
      const liveIdx = firstFutureIdx - 1;
      if (liveIdx >= 0) {
        const lx = xOf(liveIdx);
        ctx.strokeStyle = 'rgba(100,220,160,0.5)';
        ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
        ctx.beginPath(); ctx.moveTo(lx, PAD.top); ctx.lineTo(lx, PAD.top + chartH); ctx.stroke();
        ctx.setLineDash([]);
        if (liveBadge) {
          const canvasRect = canvas.getBoundingClientRect();
          liveBadge.style.display = 'block';
          liveBadge.style.left = (canvasRect.left + lx + 6) + 'px';
          liveBadge.style.top = (canvasRect.top + PAD.top + 4) + 'px';
        }
      }
    } else {
      if (liveBadge) liveBadge.style.display = 'none';
    }

    // Sélection persistante : priorité sur le hover pour les stats et le visuel
    const hasPeriodSelection = selectedPeriodIdx !== null;
    const effectiveHoverIdx  = hasPeriodSelection ? selectedPeriodIdx : hoverIdx;

    // Dimming : objet actif OU sélection de période (sans objet actif)
    const hasVisibleFocused = focusedNode !== null && series.some(s => s.id === focusedNode);
    const hasVisibleHovered = hoveredNode !== null && series.some(s => s.id === hoveredNode);
    const hasVisibleTracked = series.some(s => trackedObjects.has(s.id));
    const hasActiveNode = hasVisibleFocused || hasVisibleHovered || hasVisibleTracked;

    series.forEach(s => {
      const [r, g, b] = hexToRgb(s.color);
      const isFocused = focusedNode === s.id;
      const isHovered = hoveredNode === s.id;
      const isTracked = trackedObjects.has(s.id);
      const isActive  = isFocused || isHovered || isTracked;
      // Lignes atténuées : objet actif (autres atténués) OU sélection de période sans objet actif
      const isDimmed  = (hasActiveNode && !isActive) || (hasPeriodSelection && !hasActiveNode);

      ctx.beginPath();
      let first = true;
      s.data.forEach((v, i) => {
        if (v === null) { first = true; return; }
        const x = xOf(i), y = yOf(v);
        if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = isDimmed ? `rgba(${r},${g},${b},0.28)` : s.color;
      ctx.lineWidth   = isActive ? 3.2 : 2;
      ctx.shadowColor = s.color;
      ctx.shadowBlur  = isActive ? 14 : (isDimmed ? 0 : 7);
      ctx.stroke();
      ctx.shadowBlur = 0;

      s.data.forEach((v, i) => {
        if (v === null) return;
        const x = xOf(i), y = yOf(v);
        const isCurrent  = i === winCurrentIdx;
        const isSelected = hasPeriodSelection && i === selectedPeriodIdx;
        // Points sélectionnés : gros + brillants (même si ligne atténuée)
        const radius = isSelected ? 6 : (isCurrent ? (isActive ? 5 : 4) : 2.2);
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        if (isSelected) {
          ctx.fillStyle = `rgba(${r},${g},${b},0.98)`;
          ctx.shadowColor = s.color; ctx.shadowBlur = 16;
        } else {
          ctx.fillStyle = isDimmed
            ? `rgba(${r},${g},${b},0.15)`
            : (isCurrent ? `rgba(${r},${g},${b},0.98)` : `rgba(${r},${g},${b},0.72)`);
        }
        ctx.fill();
        if (isSelected) {
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5; ctx.stroke();
        }
        ctx.shadowBlur = 0;
      });
    });

    // Appel légende dynamique avec effectiveHoverIdx (hover ou sélection)
    if (!skipLegend) {
      requestAnimationFrame(() => renderRankedLegend(series, effectiveHoverIdx));
    }

    // Marqueur de période courante (discret)
    if (winCurrentIdx >= 0 && !hasPeriodSelection) {
      const cx = xOf(winCurrentIdx);
      ctx.strokeStyle = 'rgba(180,210,255,0.25)';
      ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(cx, PAD.top - 8); ctx.lineTo(cx, PAD.top + chartH); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(180,210,255,0.5)';
      ctx.font = '9px "Space Mono", monospace'; ctx.textAlign = 'center';
      ctx.fillText('▼', cx, PAD.top - 10);
    }

    // Marqueur de période sélectionnée (persistante, plus visible)
    if (hasPeriodSelection && selectedPeriodIdx >= 0 && selectedPeriodIdx < n) {
      const sx = xOf(selectedPeriodIdx);
      ctx.strokeStyle = 'rgba(200,225,255,0.4)';
      ctx.lineWidth = 1.5; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(sx, PAD.top); ctx.lineTo(sx, PAD.top + chartH); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(200,225,255,0.8)';
      ctx.font = '9px "Space Mono", monospace'; ctx.textAlign = 'center';
      ctx.fillText('▼', sx, PAD.top - 10);
    }

    // Marqueur de hover
    if (hoverIdx !== null && hoverIdx >= 0 && hoverIdx < n && hoverIdx !== selectedPeriodIdx) {
      const hx = xOf(hoverIdx);
      if (hasPeriodSelection) {
        // Période sélectionnée active : hover = lueur de colonne très discrète (suggestion de clic)
        const colW = n > 1 ? chartW / (n - 1) : chartW;
        const hg = ctx.createLinearGradient(hx - colW * 0.5, 0, hx + colW * 0.5, 0);
        hg.addColorStop(0, 'rgba(180,210,255,0)');
        hg.addColorStop(0.5, 'rgba(180,210,255,0.06)');
        hg.addColorStop(1, 'rgba(180,210,255,0)');
        ctx.fillStyle = hg;
        ctx.fillRect(hx - colW * 0.5, PAD.top, colW, chartH);
      } else {
        // Pas de sélection : hover normal avec ligne + dots brillants
        ctx.strokeStyle = 'rgba(200,220,255,0.18)';
        ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(hx, PAD.top); ctx.lineTo(hx, PAD.top + chartH); ctx.stroke();
        ctx.setLineDash([]);
        series.forEach(s => {
          const v = s.data[hoverIdx]; if (v === null) return;
          ctx.beginPath();
          ctx.arc(hx, yOf(v), focusedNode === s.id ? 6.2 : 5, 0, Math.PI * 2);
          ctx.fillStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 12; ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
        });
      }
    }

    // Aligner le slider avec les bords du graphe
    const sliderRow = document.getElementById('slider-row');
    if (sliderRow) {
      const ctrlPad = 24;
      sliderRow.style.paddingLeft  = `${Math.max(0, PAD.left  - ctrlPad)}px`;
      sliderRow.style.paddingRight = `${Math.max(0, PAD.right - ctrlPad)}px`;
    }
  }

  function rankedChartHoverAt(clientX, clientY) {
    const canvas = document.getElementById('evo-canvas');
    if (!canvas || currentMode !== 'ranked') return;
    const rect = canvas.getBoundingClientRect();
    const { PAD, chartW } = getRankedChartLayout(rect);
    const winPeriods = getRankedWindowPeriods();
    const n = winPeriods.length;
    const canvasX = clientX - rect.left;

    if (canvasX < PAD.left || canvasX > PAD.left + chartW) {
      rankedHoverIdx = null;
      renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), null);
      return;
    }

    if (rankedGranularity === 'day') {
      const hoverHour = ((canvasX - PAD.left) / chartW) * 24;
      let closest = null, closestDist = Infinity;
      winPeriods.forEach((p, i) => {
        if (p.isFuture) return;
        const d = Math.abs(dayBlockHour(p) - hoverHour);
        if (d < closestDist) { closestDist = d; closest = i; }
      });
      rankedHoverIdx = closest;
      renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), rankedHoverIdx);
      updatePeriodNavLabel();
      return;
    }

    const idx = Math.max(0, Math.min(n - 1, Math.round(((canvasX - PAD.left) / chartW) * (n - 1))));
    rankedHoverIdx = idx;
    const gd = getGD(currentCountry, periods[currentIdx]?.key);
    renderRankedChart(gd, idx);
    updatePeriodNavLabel();
  }

  function getEvolutionChartLayout(rect) {
    const W = rect.width;
    const leftPanel = document.getElementById('left-panel');
    const compact = W < 960;
    const leftPanelWidth = leftPanel ? leftPanel.getBoundingClientRect().width : 0;
    const leftPad = Math.max(compact ? 140 : 180, Math.ceil(leftPanelWidth + 22));
    const fallbackPanelPad = 38;
    const panelW = fallbackPanelPad;
    let bottomPad = 72;
    const controls = document.getElementById('controls');
    if (controls) {
      const controlsRect = controls.getBoundingClientRect();
      const controlsTop = controlsRect.top - rect.top;
      if (Number.isFinite(controlsTop)) {
        bottomPad = Math.max(bottomPad, rect.height - controlsTop + 38);
      }
    }
    const PAD = { top: compact ? 112 : 94, right: panelW, bottom: bottomPad, left: leftPad };
    const chartW = Math.max(100, rect.width - PAD.left - PAD.right);
    const chartH = Math.max(80, rect.height - PAD.top - PAD.bottom);
    return { PAD, panelW, chartW, chartH };
  }

  function renderEvolutionChart(hoverIdx = null) {
    const canvas = document.getElementById('evo-canvas');
    if (!canvas || currentMode !== 'tracking') return;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width; canvas.height = rect.height;
    const W = canvas.width, H = canvas.height;
    if (!W || !H) return;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#00000f'; ctx.fillRect(0, 0, W, H);
    { const lb = document.getElementById('live-badge'); if (lb) lb.style.display = 'none'; }
    STARS.forEach(s => {
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,205,255,${(s.a * 0.35).toFixed(2)})`; ctx.fill();
    });

    const { PAD, chartW, chartH } = getEvolutionChartLayout(rect);
    const displayPeriods = (rankedSlots.length > 0 && rankedSlots[rankedSlotIdx]?.periods?.length)
      ? rankedSlots[rankedSlotIdx].periods
      : periods;
    const n = displayPeriods.length;
    const currentPeriodKey = periods[currentIdx]?.key;
    const displayCurrentIdx = displayPeriods.findIndex(p => p.key === currentPeriodKey);

    if (!trackedObjects.size) {
      ctx.fillStyle = 'rgba(120,160,220,0.35)'; ctx.font = '13px "Space Mono", monospace'; ctx.textAlign = 'center';
      ctx.fillText('Ajoutez des objets pour visualiser leur évolution', PAD.left + chartW / 2, H / 2);
      ctx.fillStyle = 'rgba(80,110,160,0.4)'; ctx.font = '10px "Space Mono", monospace';
      ctx.fillText('Recherchez à droite, ou cliquez "Suivre" sur un objet', PAD.left + chartW / 2, H / 2 + 26);
      return;
    }

    const xOf = i => PAD.left + (n > 1 ? (i / (n - 1)) * chartW : chartW / 2);
    const yOf = (v, mx) => PAD.top + chartH - (v / mx) * chartH;

    const series = [...trackedObjects].map(id => ({
      id, color: getTrackColor(id),
      data: displayPeriods.map(p => { const g = graphs[currentCountry]?.[p.key]; return g?.nodes.find(nd => nd.id === id)?.size ?? null; })
    }));
    const allVals = series.flatMap(s => s.data.filter(v => v !== null));
    const maxVal = allVals.length ? Math.max(...allVals, 0.1) : 1;
    evoMaxVal = maxVal;

    // Grid
    ctx.font = '9px "Space Mono", monospace';
    for (let gi = 0; gi <= 5; gi++) {
      const v = (gi / 5) * maxVal, y = yOf(v, maxVal);
      ctx.strokeStyle = 'rgba(55,85,175,0.18)'; ctx.lineWidth = 1; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + chartW, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(110,150,215,0.55)'; ctx.textAlign = 'right';
      ctx.fillText(v >= 100 ? v.toFixed(0) : v.toFixed(1), PAD.left - 8, y + 3);
    }

    // X ticks - echantillonnage propre pour le mode suivi.
    const tickIndices = (() => {
      const target = 8;
      const step = Math.max(1, Math.ceil(n / target));
      const out = [];
      for (let i = 0; i < n; i += step) out.push(i);
      if (out[out.length - 1] !== n - 1) out.push(n - 1);
      return out;
    })();

    tickIndices.forEach(i => {
      const p = displayPeriods[i];
      const x = xOf(i);
      ctx.strokeStyle = 'rgba(55,85,175,0.22)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, PAD.top + chartH); ctx.lineTo(x, PAD.top + chartH + 5); ctx.stroke();

      const date = periodDisplayDate(p);
      const [y, m, d] = String(date).split('-').map(Number);
      let label = String(p.label || '').slice(0, 10);
      if (Number.isFinite(y) && Number.isFinite(m) && Number.isFinite(d)) {
        label = `${String(d).padStart(2, '0')} ${FR_MONTHS_SHORT[Math.max(0, m - 1)] || ''}`.trim();
      }

      ctx.font = '11px "Space Mono", monospace';
      ctx.textAlign = 'center';
      const axisLabelY = PAD.top + chartH + 18;
      ctx.fillStyle = 'rgba(138, 176, 235, 0.85)';
      ctx.fillText(label, x, axisLabelY);
    });

    // Axes
    ctx.strokeStyle = 'rgba(75,115,195,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, PAD.top + chartH); ctx.lineTo(PAD.left + chartW, PAD.top + chartH); ctx.stroke();

    // Series: area + line + dots
    series.forEach(s => {
      const [r2, g2, b2] = hexToRgb(s.color);
      // Area fill
      ctx.beginPath();
      let first = true, lastX = null;
      s.data.forEach((v, i) => {
        if (v === null) return;
        const x = xOf(i), y = yOf(v, maxVal);
        if (first) { ctx.moveTo(x, PAD.top + chartH); ctx.lineTo(x, y); first = false; } else ctx.lineTo(x, y);
        lastX = x;
      });
      if (lastX !== null) { ctx.lineTo(lastX, PAD.top + chartH); ctx.closePath(); ctx.fillStyle = `rgba(${r2},${g2},${b2},0.07)`; ctx.fill(); }
      // Line
      ctx.beginPath(); first = true;
      s.data.forEach((v, i) => {
        if (v === null) return;
        const x = xOf(i), y = yOf(v, maxVal);
        if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.shadowColor = s.color; ctx.shadowBlur = 7; ctx.stroke(); ctx.shadowBlur = 0;
      // Dots
      s.data.forEach((v, i) => {
        if (v === null) return;
        const isCurr = i === displayCurrentIdx;
        const r3 = isCurr ? 5.5 : 3.5;
        ctx.beginPath(); ctx.arc(xOf(i), yOf(v, maxVal), r3, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        if (isCurr) { ctx.shadowColor = s.color; ctx.shadowBlur = 10; }
        ctx.fill();
        if (isCurr) { ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5; ctx.stroke(); }
      });
    });

    // Hover dots + vertical line
    if (hoverIdx !== null && hoverIdx >= 0 && hoverIdx < n) {
      ctx.strokeStyle = 'rgba(200,220,255,0.18)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(xOf(hoverIdx), PAD.top); ctx.lineTo(xOf(hoverIdx), PAD.top + chartH); ctx.stroke(); ctx.setLineDash([]);
      series.forEach(s => {
        const v = s.data[hoverIdx]; if (v === null) return;
        ctx.beginPath(); ctx.arc(xOf(hoverIdx), yOf(v, maxVal), 7, 0, Math.PI * 2);
        ctx.fillStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 16; ctx.fill(); ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
      });
    }

    // Current period marker
    if (displayCurrentIdx >= 0 && displayCurrentIdx < n) {
      const cx = xOf(displayCurrentIdx);
      ctx.strokeStyle = 'rgba(180,210,255,0.25)'; ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(cx, PAD.top - 8); ctx.lineTo(cx, PAD.top + chartH); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(180,210,255,0.5)'; ctx.font = '9px "Space Mono", monospace'; ctx.textAlign = 'center';
      ctx.fillText('▼', cx, PAD.top - 10);
    }
  }

  function evoChartHoverAt(clientX, clientY) {
    const canvas = document.getElementById('evo-canvas');
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const { PAD, chartW } = getEvolutionChartLayout(rect);
    const displayPeriods = (rankedSlots.length > 0 && rankedSlots[rankedSlotIdx]?.periods?.length)
      ? rankedSlots[rankedSlotIdx].periods
      : periods;
    const n = displayPeriods.length;
    const canvasX = clientX - rect.left;
    if (canvasX < PAD.left || canvasX > PAD.left + chartW) {
      renderEvolutionChart(null);
      document.getElementById('evo-tooltip').style.display = 'none'; return;
    }
    const idx = Math.max(0, Math.min(n - 1, Math.round(((canvasX - PAD.left) / chartW) * (n - 1))));
    renderEvolutionChart(idx);

    const tt = document.getElementById('evo-tooltip');
    const period = displayPeriods[idx];
    const ttDay = period ? toDayLabel(periodDisplayDate(period)) : '';
    const ttBlock = period ? blockRangeLabelFromPeriod(period) : '';
    document.getElementById('evo-tooltip-period').textContent = period ? `${ttDay} · ${ttBlock}` : '';
    const series = [...trackedObjects].map(id => {
      const g = graphs[currentCountry]?.[period?.key];
      return { id, color: getTrackColor(id), val: g?.nodes.find(nd => nd.id === id)?.size ?? null };
    });
    document.getElementById('evo-tooltip-items').innerHTML = series.map(s =>
      `<div class="evo-tt-row"><div class="evo-tt-dot" style="background:${s.color}"></div><div class="evo-tt-name">${escapeHtml(s.id)}</div><div class="evo-tt-val">${s.val !== null ? s.val.toFixed(2) : '—'}</div></div>`
    ).join('');
    let tx = clientX + 16, ty = clientY - 10;
    const ttW = 220, ttH = tt.offsetHeight || 50;
    if (tx + ttW > window.innerWidth) tx = clientX - ttW - 10;
    if (ty + ttH > window.innerHeight) ty = clientY - ttH - 10;
    tt.style.left = tx + 'px'; tt.style.top = ty + 'px'; tt.style.display = 'block';
  }

  function syncRankedNavigationState(sourcePeriods = periods) {
    buildRankedSlots(sourcePeriods);
    syncRankedSlotToCurrentPeriod();
    setCurrentPeriodFromRankedSlot();
    slider.max = Math.max(0, rankedSlots.length - 1);
    slider.value = rankedSlotIdx;
  }

  function getTrackingPeriodsForCurrentFilters(basePeriods = null) {
    const allTsPeriods = basePeriods ? basePeriods.slice() : (tsData?.meta?.periods || []).slice();
    const slot = rankedSlots[rankedSlotIdx];
    if (!slot || !slot.periodKeys?.length) return allTsPeriods;
    const keySet = new Set(slot.periodKeys);
    const filtered = allTsPeriods.filter(p => keySet.has(p.key));
    return filtered.length ? filtered : allTsPeriods;
  }

  function setMode(mode) {
    // Sauvegarder l'index courant avant de changer de mode
    if (currentMode === 'ranked') graphIdx = currentIdx;
    else tsIdx = currentIdx;

    selectedPeriodIdx = null;
    hoveredNode = null;

    currentMode = mode;
    clearRankedSeriesCache();
    document.body.classList.toggle('mode-ranked', mode === 'ranked');
    document.body.classList.toggle('mode-tracking', mode === 'tracking');
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));

    // Swapper les données + slider selon le mode
    if (mode === 'tracking') {
      rankedGranularity = 'year';
      graphs  = tsData.graphs;
      const trackingBasePeriods = (tsData?.meta?.periods || []);
      buildRankedSlots(trackingBasePeriods);
      periods = trackingBasePeriods;
      currentIdx = Math.min(tsIdx, Math.max(0, periods.length - 1));
      syncRankedSlotToCurrentPeriod();
      slider.max = Math.max(0, periods.length - 1);
      slider.value = currentIdx;
    } else {
      // Reset propre au retour en HOT 10
      trackedObjects.clear(); trackColorMap.clear(); trackColorSeq = 0;
      focusedNode = null;
      renderArticlesPanel(null);
      graphs  = tsData.graphs;
      periods = tsData.meta.periods;
      currentIdx = Math.min(graphIdx, periods.length - 1);
      syncRankedNavigationState(periods);
    }

    const evoView = document.getElementById('evolution-view');
    updatePeriodSummary(currentCountry, currentIdx);
    if (mode === 'tracking') {
      evoView.classList.add('visible');
      rankedHoverIdx = null;
      document.getElementById('evo-tooltip').style.display = 'none';
      applyTimelineHeat(currentCountry);
      renderTrackedList(); renderEvolutionChart();
      syncArticlesPanel();
    } else {
      evoView.classList.add('visible');
      applyTimelineHeat(currentCountry);
      loadPeriod(currentCountry, currentIdx);
    }
    updateWindowUI();
    updatePeriodNavLabel();
  }

  // Mode tabs
  document.querySelectorAll('.mode-tab').forEach(tab => tab.addEventListener('click', () => setMode(tab.dataset.mode)));

  // Boutons fenêtre temporelle (mode ranked et tracking)
  document.querySelectorAll('.win-btn').forEach(btn => btn.addEventListener('click', () => {
    rankedGranularity = btn.dataset.gran || 'day';
    rankedHoverIdx = null;
    selectedPeriodIdx = null;

    clearRankedSeriesCache();
    if (currentMode === 'tracking') {
      const trackingBasePeriods = (tsData?.meta?.periods || []);
      buildRankedSlots(trackingBasePeriods);
      periods = trackingBasePeriods;
      syncRankedSlotToCurrentPeriod();
      currentIdx = Math.min(currentIdx, Math.max(0, periods.length - 1));
      slider.max = Math.max(0, periods.length - 1);
      slider.value = currentIdx;
      applyTimelineHeat(currentCountry);
      renderTrackedList();
      renderEvolutionChart();
    } else {
      syncRankedNavigationState(tsData.meta.periods);
      applyTimelineHeat(currentCountry);
      updatePeriodSummary(currentCountry, currentIdx);
      const gd = getGD(currentCountry, periods[currentIdx]?.key);
      renderRankedChart(gd, null);
    }
    updateWindowUI();
    updatePeriodNavLabel();
  }));


  // Evolution canvas events
  const evoCanvas = document.getElementById('evo-canvas');
  evoCanvas.addEventListener('mousemove', e => {
    if (currentMode === 'tracking') evoChartHoverAt(e.clientX, e.clientY);
    else rankedChartHoverAt(e.clientX, e.clientY);
  });
  evoCanvas.addEventListener('mouseleave', () => {
    if (currentMode === 'tracking') renderEvolutionChart(null);
    else {
      rankedHoverIdx = null;
      const period = periods[currentIdx];
      renderRankedChart(getGD(currentCountry, period?.key), null);
      updatePeriodNavLabel();
    }
    document.getElementById('evo-tooltip').style.display = 'none';
  });
  evoCanvas.addEventListener('click', e => {
    if (currentMode === 'ranked') {
      const period = periods[currentIdx];
      const gd = getGD(currentCountry, period?.key);
      const winPeriods = getRankedWindowPeriods();
      const series = getRankedChartSeries(gd, winPeriods);
      const rect = evoCanvas.getBoundingClientRect();
      const { PAD, chartW, chartH } = getRankedChartLayout(rect);
      const n = winPeriods.length;
      const canvasX = e.clientX - rect.left;
      const canvasY = e.clientY - rect.top;

      // Clic hors du graphe : tout désélectionner
      if (canvasX < PAD.left || canvasX > PAD.left + chartW) {
        selectedPeriodIdx = null;
        focusedNode = null;
        renderArticlesPanel(null);
        renderRankedChart(gd, null);
        updatePeriodNavLabel();
        return;
      }

      // Sélectionner la colonne la plus proche
      if (rankedGranularity === 'day') {
        const hoverHour = ((canvasX - PAD.left) / chartW) * 24;
        let closest = 0, closestDist = Infinity;
        winPeriods.forEach((p, i) => {
          if (p.isFuture) return;
          const d = Math.abs(dayBlockHour(p) - hoverHour);
          if (d < closestDist) { closestDist = d; closest = i; }
        });
        selectedPeriodIdx = closest;
      } else {
        selectedPeriodIdx = n > 1
          ? Math.max(0, Math.min(n - 1, Math.round(((canvasX - PAD.left) / chartW) * (n - 1))))
          : 0;
      }

      // Chercher un point proche du clic
      if (series.length) {
        const xOf = i => PAD.left + (n > 1 ? (i / (n - 1)) * chartW : chartW / 2);
        const allVals = series.flatMap(s => s.data.filter(v => v !== null));
        const maxVal = allVals.length ? Math.max(...allVals, 0.1) : 1;
        const yOf = v => PAD.top + chartH - (v / maxVal) * chartH;
        let hitId = null, hitIdx = -1, bestDist = Infinity;
        const HIT_R = 26;
        series.forEach(s => {
          s.data.forEach((v, i) => {
            if (v === null) return;
            const dist = Math.hypot(canvasX - xOf(i), canvasY - yOf(v));
            if (dist < bestDist) { bestDist = dist; hitId = s.id; hitIdx = i; }
          });
        });
        if (hitId && hitIdx >= 0 && bestDist <= HIT_R) {
          const clickedWinPeriod = winPeriods[hitIdx];
          const periodGd = getWinPeriodGD(currentCountry,
            clickedWinPeriod?.isSynthetic
              ? { isDay: true, periodKeys: rankedSlots[rankedSlotIdx]?.periodKeys || [] }
              : clickedWinPeriod
          );
          const articleNode = (periodGd.nodes || []).find(n2 => n2.id === hitId);
          if (articleNode) renderArticlesPanel(articleNode, clickedWinPeriod);
          else renderArticlesPanelUnavailable(hitId, clickedWinPeriod);
        } else {
          renderArticlesPanel(null);
        }
      } else {
        renderArticlesPanel(null);
      }

      renderRankedChart(gd, null);
      updatePeriodNavLabel();
      return;
    }
    const rect = evoCanvas.getBoundingClientRect();
    const { PAD, chartW, chartH } = getEvolutionChartLayout(rect);
    // Use displayPeriods (filtered to current slot) like renderEvolutionChart
    const displayPeriods = (rankedSlots.length > 0 && rankedSlots[rankedSlotIdx]?.periods?.length)
      ? rankedSlots[rankedSlotIdx].periods
      : periods;
    const n = displayPeriods.length;
    const canvasX = e.clientX - rect.left;
    const canvasY = e.clientY - rect.top;
    if (canvasX < PAD.left || canvasX > PAD.left + chartW) { renderArticlesPanel(null); return; }
    const idx = Math.max(0, Math.min(n - 1, Math.round(((canvasX - PAD.left) / chartW) * (n - 1))));

    // Cherche un point proche du clic (rayon 20px, on teste ±1 période)
    const xOf = i => PAD.left + (n > 1 ? (i / (n - 1)) * chartW : chartW / 2);
    const yOf = v => PAD.top + chartH - (v / Math.max(evoMaxVal, 0.1)) * chartH;
    const HIT_R = 20;
    let hitNode = null;
    let hitPi = null;
    outer: for (const id of trackedObjects) {
      for (let di = -1; di <= 1; di++) {
        const pi = idx + di;
        if (pi < 0 || pi >= n) continue;
        // Use getWinPeriodGD to handle day-level aggregated periods (isDay=true)
        const g = getWinPeriodGD(currentCountry, displayPeriods[pi]);
        const node = (g.nodes || []).find(nd => nd.id === id);
        if (!node) continue;
        if (Math.hypot(canvasX - xOf(pi), canvasY - yOf(node.size)) < HIT_R) { hitNode = node; hitPi = pi; break outer; }
      }
    }

    // Map clicked period back to global periods index (only for non-aggregated periods)
    const clickedPeriod = displayPeriods[hitPi !== null ? hitPi : idx];
    if (clickedPeriod && !clickedPeriod.isDay) {
      const realIdx = periods.findIndex(p => p.key === clickedPeriod.key);
      if (realIdx >= 0) {
        currentIdx = realIdx;
        slider.value = currentIdx;
        loadPeriod(currentCountry, currentIdx);
      }
    }
    if (hitNode) renderArticlesPanel(hitNode, clickedPeriod);
    else renderArticlesPanel(null);
  });


  const leftTrackedClear = document.getElementById('left-tracked-clear');
  if (leftTrackedClear) leftTrackedClear.addEventListener('click', clearAllTracked);

  const slider = document.getElementById('timeline');
  slider.max = periods.length-1; slider.value = currentIdx;

  // Tooltip convergence sur le slider
  slider.addEventListener('mousemove', e => {
    const tip = document.getElementById('conv-tooltip');
    if (!tip || currentMode !== 'ranked') { if (tip) tip.style.display = 'none'; return; }
    const scores = (() => { try { return JSON.parse(slider.dataset.convScores || 'null'); } catch { return null; } })();
    if (!scores) { tip.style.display = 'none'; return; }
    const sliderRect = slider.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (e.clientX - sliderRect.left) / sliderRect.width));
    const idx = Math.round(frac * (scores.length - 1));
    const raw = scores[idx] ?? 0;
    const min = Math.min(...scores), max = Math.max(...scores);
    const pct = max > min ? Math.round(((raw - min) / (max - min)) * 100) : 50;
    const slot = rankedSlots[idx];
    const label = slot?.label || `Slot ${idx + 1}`;
    tip.textContent = `${label} · Convergence ${pct} %`;
    const leftPx = e.clientX - document.getElementById('controls').getBoundingClientRect().left;
    tip.style.left = `${leftPx}px`;
    tip.style.display = 'block';
  });
  slider.addEventListener('mouseleave', () => {
    const tip = document.getElementById('conv-tooltip');
    if (tip) tip.style.display = 'none';
  });

  slider.addEventListener('input', () => {
    if (currentMode === 'ranked') {
      selectedPeriodIdx = null;
      rankedSlotIdx = +slider.value;
      setCurrentPeriodFromRankedSlot();
    } else {
      currentIdx = +slider.value;
      syncRankedSlotToCurrentPeriod();
    }
    loadPeriod(currentCountry, currentIdx);
  });

  function navigatePrev() {
    if (currentMode === 'ranked') {
      if (rankedSlotIdx <= 0) return;
      selectedPeriodIdx = null;
      rankedSlotIdx--;
      slider.value = rankedSlotIdx;
      setCurrentPeriodFromRankedSlot();
    } else {
      if (rankedSlotIdx <= 0) return;
      rankedSlotIdx--;
      setCurrentPeriodFromRankedSlot();
      slider.value = currentIdx;
    }
    loadPeriod(currentCountry, currentIdx);
  }
  function navigateNext() {
    if (currentMode === 'ranked') {
      if (rankedSlotIdx >= rankedSlots.length - 1) return;
      selectedPeriodIdx = null;
      rankedSlotIdx++;
      slider.value = rankedSlotIdx;
      setCurrentPeriodFromRankedSlot();
    } else {
      if (rankedSlotIdx >= rankedSlots.length - 1) return;
      rankedSlotIdx++;
      setCurrentPeriodFromRankedSlot();
      slider.value = currentIdx;
    }
    loadPeriod(currentCountry, currentIdx);
  }

  document.getElementById('prev-btn').addEventListener('click', navigatePrev);
  document.getElementById('next-btn').addEventListener('click', navigateNext);

  document.getElementById('ranked-legend-list').addEventListener('mouseleave', () => {
    if (hoveredNode !== null) {
      hoveredNode = null;
      renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), rankedHoverIdx);
    }
  });
  // ── Recherche (panneau gauche) ───────────────────────────────────────────
  const rankedSearchInput = document.getElementById('ranked-search-input');
  rankedSearchInput.addEventListener('input', () => renderRankedSearchResults(rankedSearchInput.value));
  rankedSearchInput.addEventListener('blur', () => { setTimeout(() => { const r = document.getElementById('ranked-search-results'); if (r) r.innerHTML = ''; }, 150); });
  rankedSearchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      rankedSearchInput.value = '';
      renderRankedSearchResults('');
      rankedSearchInput.blur();
    } else if (e.key === 'Enter') {
      const q = rankedSearchInput.value.trim().toLowerCase();
      const id = getRankedScopedObjectIds().find(v => v.toLowerCase().includes(q));
      if (id) {
        rankedSearchInput.value = '';
        renderRankedSearchResults('');
        addTracked(id);
        setMode('tracking');
      }
    }
    e.stopPropagation();
  });

  document.addEventListener('keydown', e => {
    if (document.activeElement === rankedSearchInput) return;
    if (e.key === '/') { e.preventDefault(); rankedSearchInput.focus(); rankedSearchInput.select(); return; }
    if (e.key === 'ArrowRight')    { navigateNext(); }
    else if (e.key === 'ArrowLeft') { navigatePrev(); }
    else if ((e.key==='t'||e.key==='T') && focusedNode) { addTracked(focusedNode); }
    else if (e.key==='Escape')    {
      if(rankedSearchInput.value){rankedSearchInput.value='';renderRankedSearchResults('');}
      else if (panelState.nodeId) { closeObjectPanel(); }
    }
  });
  document.getElementById('object-overlay')?.addEventListener('click', closeObjectPanel);
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      tab.classList.add('active'); currentCountry=tab.dataset.country;
      tab.setAttribute('aria-selected', 'true');
      selectedPeriodIdx = null;
      clearRankedSeriesCache();
      applyTimelineHeat(currentCountry);
      if (currentMode === 'ranked') {
        syncRankedNavigationState(tsData.meta.periods);
      } else {
        const trackingBasePeriods = (tsData?.meta?.periods || []);
        buildRankedSlots(trackingBasePeriods);
        periods = trackingBasePeriods;
        syncRankedSlotToCurrentPeriod();
        currentIdx = Math.min(currentIdx, Math.max(0, periods.length - 1));
        slider.max = Math.max(0, periods.length - 1);
        slider.value = currentIdx;
      }
      loadPeriod(currentCountry,currentIdx);
    });
  });

  document.addEventListener('click', e => {
    const panel = document.getElementById('object-panel');
    const clickOnCanvas = !!e.target.closest('#evo-canvas');
    // Fermer le panneau seulement si clic hors du panneau ET hors du canvas
    // (le canvas gère lui-même l'ouverture/fermeture du panneau)
    if (!clickOnCanvas && panel && panel.classList.contains('visible') &&
        !panel.contains(e.target) && !e.target.closest('.rleg-item') &&
        !e.target.closest('.tracked-item')) {
      renderArticlesPanel(null);
      if (currentMode === 'ranked' && focusedNode !== null) {
        focusedNode = null;
        renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), rankedHoverIdx);
      }
    }
    // Clic hors du canvas : désélectionner la période
    if (currentMode === 'ranked' && selectedPeriodIdx !== null && !clickOnCanvas) {
      selectedPeriodIdx = null;
      const gd = getGD(currentCountry, periods[currentIdx]?.key);
      renderRankedChart(gd, rankedHoverIdx);
      updatePeriodNavLabel();
    }
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.country === currentCountry);
    tab.setAttribute('aria-selected', String(tab.dataset.country === currentCountry));
  });

  document.getElementById('loading').style.display = 'none';
  applyTimelineHeat(currentCountry);
  loadPeriod(currentCountry, currentIdx);

  // Mode par défaut: classement évolutif
  setMode('ranked');
  renderTrackedList();

  // ── Timer live : EN DIRECT avance chaque 30s ─────────────────────────────
  setInterval(() => {
    if (currentMode !== 'ranked' || rankedGranularity !== 'day') return;
    const now = new Date();
    const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    if (rankedSlots[rankedSlotIdx]?.key !== todayKey) return;
    renderRankedChart(getGD(currentCountry, periods[currentIdx]?.key), rankedHoverIdx);
  }, 30000);

  // ── Auto-reload à chaque frontière de bloc UTC (= début de bloc EDT) ─────
  (() => {
    const utcBoundaries = [0, 4, 8, 12, 16, 20]; // heures UTC = fins de blocs EDT
    const now = new Date();
    const curSec = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
    let minDiff = Infinity;
    for (const b of utcBoundaries) {
      const bSec = b * 3600;
      const diff = bSec > curSec ? bSec - curSec : (bSec + 86400) - curSec;
      if (diff < minDiff) minDiff = diff;
    }
    setTimeout(() => window.location.reload(), minDiff * 1000 + 12000);
  })();

  // ── Lien entrant ?node= ───────────────────────────────────────────────────
  // Après l'auto-track, on nettoie l'URL pour qu'un hard-refresh revienne en HOT 10 propre.
  const urlNode = urlParams.get('node');
  if (urlNode) {
    const q = urlNode.toLowerCase();
    let foundId = null;
    for (let i = periods.length - 1; i >= 0 && !foundId; i--) {
      const g = graphs[currentCountry]?.[periods[i].key];
      if (!g) continue;
      const m = (g.nodes || []).find(n => n.id.toLowerCase() === q) ||
                (g.nodes || []).find(n => n.id.toLowerCase().includes(q));
      if (m) foundId = m.id;
    }
    if (foundId) {
      addTracked(foundId);
      setMode('tracking');
    }
    // Retire ?node= (et ?q=) de l'URL sans recharger la page
    try {
      const u = new URL(window.location.href);
      u.searchParams.delete('node');
      u.searchParams.delete('q');
      window.history.replaceState({}, '', u.pathname + (u.search ? u.search : '') + u.hash);
    } catch (_) { /* noop */ }
  }

  } catch(e) {
    document.getElementById('loading-text').textContent = 'ERREUR: ' + e.message;
    console.error(e);
  }
})();
</script>
<script src="./assets/js/shared-ticker.js"></script>
<script src="./assets/js/shared-menu.js"></script>
