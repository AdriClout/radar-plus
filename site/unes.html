<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dans le radar · RADAR+</title>
  <meta name="description" content="Les manchettes captées en continu dans les Unes des grands médias du Québec, du Canada et des États-Unis.">
  <link rel="canonical" href="https://radarplus.org/unes.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RADAR+">
  <meta property="og:locale" content="fr_CA">
  <meta property="og:title" content="Dans le radar · RADAR+">
  <meta property="og:description" content="Les manchettes captées en continu dans les Unes des grands médias du Québec, du Canada et des États-Unis.">
  <meta property="og:url" content="https://radarplus.org/unes.html">
  <meta property="og:image" content="https://radarplus.org/assets/og/og-radarplus.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dans le radar · RADAR+">
  <meta name="twitter:description" content="Les manchettes captées en continu dans les Unes des grands médias du Québec, du Canada et des États-Unis.">
  <meta name="twitter:image" content="https://radarplus.org/assets/og/og-radarplus.png">
  <link rel="icon" href="./assets/favicon/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="./assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#020010">
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/shared-menu.css" />
  <link rel="stylesheet" href="./assets/css/shared-ticker.css" />
  <style>
    /* Tokens : assets/css/tokens.css (design_language.md) */

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow-x: hidden;
    }

    #stars-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .radar-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.58;
    }
    .radar-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(90,140,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90,140,255,0.06) 1px, transparent 1px);
      background-size: 140px 140px;
      opacity: 0.14;
    }
    .radar-core {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 170vmax;
      height: 170vmax;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(90,150,255,0.14) 0%, rgba(90,150,255,0.035) 32%, rgba(90,150,255,0) 68%),
        repeating-radial-gradient(circle, rgba(95,145,255,0.13) 0 1px, rgba(95,145,255,0) 1px 8px);
      opacity: 0.52;
    }
    .radar-sweep {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 170vmax;
      height: 170vmax;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(90,165,255,0) 0deg,
        rgba(90,165,255,0.22) 20deg,
        rgba(90,165,255,0.06) 42deg,
        rgba(90,165,255,0) 70deg
      );
      animation: radarSpin 8.8s linear infinite;
      mix-blend-mode: screen;
    }
    @keyframes radarSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      padding: 8px 12px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .back-link:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .title-wrap h1 {
      font-family: var(--orbitron);
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #e6f0ff;
      line-height: 1.05;
    }
    .title-wrap p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      letter-spacing: 0.4px;
    }

    .controls {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(160deg, rgba(9,18,52,0.78), rgba(6,12,34,0.86));
      backdrop-filter: blur(8px);
      padding: 14px;
      margin-bottom: 18px;
      display: grid;
      gap: 12px;
    }

    /* Onglets de mode — même mécanique que le Classement de l'accueil */
    .mode-tabs { display: flex; gap: 8px; }
    .mode-tab {
      font-family: var(--orbitron); font-size: 11px; letter-spacing: 1.6px;
      text-transform: uppercase;
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 18px; cursor: pointer;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
    }
    .mode-tab:hover { color: var(--text); border-color: rgba(90,140,255,0.45); }
    .mode-tab.active {
      color: #fff; background: rgba(40,70,160,0.55);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(80,130,255,0.25);
    }

    .country-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .country-tab.tab-disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .country-tab.tab-disabled:hover { border-color: var(--border); color: var(--muted); }
    .country-tab {
      border: 1px solid var(--border);
      background: rgba(12,22,58,0.7);
      color: var(--muted);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .country-tab:hover { border-color: rgba(130,175,255,0.65); color: var(--text); }
    .country-tab.active {
      color: #fff;
      border-color: rgba(120,165,255,0.85);
      background: rgba(40,70,160,0.52);
      box-shadow: 0 0 14px rgba(75,120,255,0.24);
    }

    .time-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .time-btn {
      border: 1px solid var(--border);
      background: rgba(12,22,58,0.7);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .time-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .time-btn:disabled { opacity: 0.35; cursor: default; transform: none; }
    .time-label {
      font-size: 13px;
      color: #d7e7ff;
      letter-spacing: 0.3px;
      min-width: 250px;
    }

    .meta-line {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.2px;
    }

    .board {
      display: grid;
      gap: 14px;
    }

    .country-block {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
      overflow: hidden;
    }

    .country-head {
      padding: 10px 12px;
      font-family: var(--orbitron);
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #e7f0ff;
      border-bottom: 1px solid rgba(100,150,255,0.18);
      background: linear-gradient(90deg, rgba(25,45,110,0.48), rgba(11,22,58,0.12));
    }

    .headline-list {
      display: grid;
      gap: 1px;
      background: rgba(82,120,200,0.12);
    }

    .headline-item {
      display: grid;
      grid-template-columns: auto auto 1fr;
      gap: 10px;
      align-items: start;
      background: rgba(6,12,34,0.92);
      padding: 10px 12px;
      text-decoration: none;
      color: #d6e8ff;
      transition: background 0.2s;
    }
    .headline-item:hover { background: rgba(11,22,58,0.96); }

    .h-time {
      font-size: 11px;
      color: rgba(190,210,245,0.9);
      min-width: 45px;
    }
    .h-media {
      font-family: var(--orbitron);
      font-size: 10px;
      color: rgba(110,176,255,0.95);
      min-width: 40px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .h-title {
      font-size: 13px;
      line-height: 1.45;
      color: #e9f2ff;
    }

    /* ===== Mode Événements =====
       L'unité n'est plus la manchette mais l'événement saillant : un même
       fait couvert par plusieurs médias dans le même bloc de 4 h. On montre
       davantage que la Vitrine — le résumé, l'enjeu, la convergence et les
       médias qui l'ont porté — d'où la carte plutôt que la ligne. */
    .event-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      background: rgba(6,12,34,0.92);
      padding: 14px 14px;
    }
    .event-rank {
      font-family: var(--orbitron);
      font-size: 20px;
      line-height: 1;
      color: rgba(120,170,255,0.9);
      min-width: 34px;
      padding-top: 2px;
    }
    .event-body { min-width: 0; }
    .event-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .event-band {
      font-family: var(--orbitron);
      font-size: 9.5px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 3px 7px;
      color: #060d22;
      background: var(--band-moderee);
    }
    .event-band.band-faible { background: var(--band-faible); }
    .event-band.band-moderee { background: var(--band-moderee); }
    .event-band.band-elevee { background: var(--band-elevee); }
    .event-band.band-tres_elevee { background: var(--band-tres-elevee); }
    .event-band.band-extreme { background: var(--band-extreme); color: #fff; }
    .event-index {
      font-family: var(--orbitron);
      font-size: 12px;
      color: #dcebff;
      letter-spacing: 0.6px;
    }
    .event-issue {
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .event-title {
      display: block;
      font-size: 14.5px;
      line-height: 1.4;
      color: #eaf3ff;
      text-decoration: none;
      margin-bottom: 5px;
    }
    .event-title:hover { color: var(--accent-soft); text-decoration: underline; }
    .event-text {
      font-size: 12.5px;
      line-height: 1.55;
      color: rgba(200,220,250,0.88);
      margin-bottom: 7px;
    }
    .event-meta {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }
    .event-media {
      font-family: var(--orbitron);
      font-size: 10px;
      letter-spacing: 0.8px;
      color: rgba(110,176,255,0.95);
    }

    @media (max-width: 740px) {
      .event-item { grid-template-columns: 1fr; }
      .event-rank { display: none; }
    }

    .empty {
      border: 1px dashed rgba(120,160,235,0.35);
      border-radius: 10px;
      color: var(--muted);
      padding: 26px 16px;
      text-align: center;
      font-size: 13px;
      background: rgba(7,13,37,0.78);
    }

    @media (max-width: 740px) {
      .headline-item {
        grid-template-columns: auto 1fr;
      }
      .h-media {
        grid-column: 1 / 2;
      }
      .h-title {
        grid-column: 2 / 3;
      }
    }
  </style>
</head>
<body>
  <canvas id="stars-canvas"></canvas>
  <div class="radar-field" aria-hidden="true">
    <div class="radar-grid"></div>
    <div class="radar-core"></div>
    <div class="radar-sweep"></div>
  </div>

  <main class="page">
    <div class="topbar">
      <a class="back-link" href="./index.html"><span data-i18n="common.back_home">← Retour Accueil</span></a>
      <div class="title-wrap">
        <h1 data-i18n="page_title.unes">Dans le radar</h1>
        <p data-i18n="unes.subtitle">Les événements saillants et les Unes en direct, par région, avec navigation temporelle.</p>
      </div>
    </div>

    <section class="controls">
      <div class="mode-tabs" id="mode-tabs">
        <button class="mode-tab active" data-mode="evenements" data-i18n="hot20.mode_evenements">Événements</button>
        <button class="mode-tab" data-mode="unes" data-i18n="unes.mode_unes">Unes</button>
      </div>

      <div class="country-tabs" id="country-tabs">
        <button class="country-tab active" data-country="ALL" data-i18n="unes.all_countries">Tous</button>
        <button class="country-tab" data-country="QC" data-i18n="country.QC">Québec</button>
        <button class="country-tab" data-country="CAN" data-i18n="country.CAN">Canada</button>
        <button class="country-tab" data-country="USA" data-i18n="country.USA">États-Unis</button>
      </div>

      <div class="time-controls">
        <button class="time-btn" id="time-older" data-i18n="unes.older">← Plus ancien</button>
        <div class="time-label" id="time-label" data-i18n="unes.period_none">Période : --</div>
        <button class="time-btn" id="time-newer" data-i18n="unes.newer">Plus récent →</button>
      </div>

      <div class="meta-line" id="meta-line" data-i18n="common.loading">Chargement…</div>
    </section>

    <section class="board" id="board">
      <div class="empty" data-i18n="unes.loading">Chargement des Unes…</div>
    </section>
  </main>

  <script>
    (function() {
      const c = document.getElementById('stars-canvas');
      const ctx = c.getContext('2d');
      let stars = [];
      function resize() {
        c.width = window.innerWidth;
        c.height = document.documentElement.scrollHeight;
        const count = Math.floor((c.width * c.height) / 2800);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * c.width,
          y: Math.random() * c.height,
          r: Math.random() * 1.2 + 0.3,
          a: Math.random() * 0.55 + 0.2,
          s: Math.random() * 0.003 + 0.001,
          p: Math.random() * Math.PI * 2,
        }));
      }
      let t = 0;
      function draw() {
        ctx.clearRect(0, 0, c.width, c.height);
        t += 0.016;
        for (const s of stars) {
          const a = s.a + Math.sin(t * s.s * 60 + s.p) * 0.16;
          ctx.fillStyle = 'rgba(180,200,255,' + Math.max(0, a) + ')';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      window.addEventListener('resize', resize);
      resize();
      draw();
    })();

    const mediaCountry = {
      TVA: 'QC', RCI: 'QC', LAP: 'QC', LED: 'QC', MG: 'QC', JDM: 'QC',
      GN: 'CAN', TTS: 'CAN', NP: 'CAN', GAM: 'CAN', CTV: 'CAN', VS: 'CAN', CBC: 'CAN',
      CNN: 'USA', FXN: 'USA'
    };
    const countryName = {
      ALL: 'Tous les pays',
      QC: 'Québec',
      CAN: 'Canada',
      USA: 'États-Unis',
      INTL: 'International'
    };
    const displayOrder = ['QC', 'CAN', 'USA', 'INTL'];

    let selectedCountry = 'ALL';
    let buckets = [];
    let currentBucketIdx = 0;
    let meta = null;

    /* ===== MODE ÉVÉNEMENTS =====
       Même bascule que sur le Classement : « Événements » par défaut,
       « Unes » pour le flux brut. Les événements sont découpés en blocs de
       4 h (pas en heures) et ne couvrent que le Québec et le Canada —
       le panel des États-Unis n'est pas suivi par le raffineur. */
    const EVENTS_REGION = { QC: 'QC', CAN: 'ROC' };
    let currentMode = 'evenements';
    let eventsData = null;
    let eventPeriods = [];   // du plus récent au plus ancien
    let currentEventIdx = 0;

    function eventsAvailable() {
      return !!(eventsData && eventsData.blocks && eventPeriods.length);
    }

    /* Libellé français d'un bloc à partir de sa clé « 2026-08-30_15-19 » :
       les bornes de la clé sont en UTC, on les rend en heure locale. */
    function eventBlockLabel(key) {
      const m = /^(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})$/.exec(key || '');
      if (!m) return key || '--';
      const start = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], 0, 0));
      const end = new Date(start.getTime() + 4 * 3600 * 1000);
      const datePart = new Intl.DateTimeFormat(dtLocale(), {
        weekday: 'short', day: '2-digit', month: 'short'
      }).format(start);
      // Un bloc couvre 4 h pleines : les minutes n'apprennent rien.
      const hf = new Intl.DateTimeFormat(dtLocale(), { hour: 'numeric' });
      return datePart + ' · ' + hf.format(start) + ' – ' + hf.format(end) + ' (' + localTzShort() + ')';
    }

    /* Traduit via i18n.js, avec repli sur le texte français si les fichiers
       de langue ne sont pas encore chargés (t() renvoie la clé dans ce cas). */
    function tr(key, params, fallback) {
      const v = window.t ? window.t(key, params) : key;
      return (v === key && fallback !== undefined) ? fallback : v;
    }

    // Les dates et heures suivent aussi la langue de l'interface.
    function dtLocale() { return uiLang() === 'en' ? 'en-CA' : 'fr-CA'; }

    function uiLang() {
      return ((window.__i18n && window.__i18n.currentLang()) ||
        document.documentElement.lang || 'fr').slice(0, 2);
    }

    function bandLabel(bandId) {
      const bands = (eventsData && eventsData.meta && eventsData.meta.bands) || [];
      const b = bands.find((x) => x.id === bandId);
      if (!b) return bandId || '';
      return (uiLang() === 'en' ? b.en : b.fr) || b.fr || bandId;
    }

    // L'enjeu suit la langue de l'interface, comme la bande.
    function issueLabel(ev) {
      return (uiLang() === 'en' ? (ev.issue_en || ev.issue_fr) : (ev.issue_fr || ev.issue_en)) || '';
    }

    function eventsForCountry(country, periodKey) {
      const region = EVENTS_REGION[country];
      if (!region || !eventsData || !eventsData.blocks) return [];
      const byPeriod = eventsData.blocks[region] || {};
      return byPeriod[periodKey] || [];
    }

    // En mode Événements, « CAN » désigne le Canada hors Québec (ROC) :
    // le panel exclut les médias québécois, le titre doit le dire.
    function eventsCountryName(country) {
      if (country === 'CAN') return tr('unes.canada_roc', null, 'Canada (hors Québec)');
      return tr('country.' + country, null, countryName[country] || country);
    }

    function renderEventBlock(country, events) {
      const rows = events.map((ev) => {
        const band = String(ev.band || 'moderee');
        const medias = Array.isArray(ev.media_ids) ? ev.media_ids : [];
        const outlets = ev.outlets || medias.length;
        const bits = [];
        const issue = issueLabel(ev);
        if (issue) bits.push('<span class="event-issue">' + escapeHtml(issue) + '</span>');
        const metaBits = [];
        const outletWord = ' ' + (outlets === 1
          ? tr('unes.outlet', null, 'média') : tr('unes.outlets', null, 'médias'));
        metaBits.push(outlets + outletWord +
          (medias.length ? ' · <span class="event-media">' + escapeHtml(medias.join(' · ')) + '</span>' : ''));
        if (typeof ev.convergence === 'number') {
          metaBits.push(tr('unes.convergence', null, 'convergence') + ' ' + ev.convergence + '%');
        }
        return (
          '<div class="event-item">' +
            '<div class="event-rank">' + escapeHtml(String(ev.rank || '')) + '</div>' +
            '<div class="event-body">' +
              '<div class="event-head">' +
                '<span class="event-band band-' + escapeHtml(band) + '">' + escapeHtml(bandLabel(band)) + '</span>' +
                '<span class="event-index">' + (typeof ev.index === 'number' ? ev.index.toFixed(1) : '--') + '</span>' +
                bits.join('') +
              '</div>' +
              '<a class="event-title" href="' + escapeHtml(ev.url || '#') + '" target="_blank" rel="noopener">' +
                escapeHtml(ev.title || 'Événement') + '</a>' +
              (ev.text ? '<div class="event-text">' + escapeHtml(ev.text) + '</div>' : '') +
              '<div class="event-meta">' + metaBits.join(' · ') + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      return (
        '<article class="country-block">' +
          '<header class="country-head">' + escapeHtml(eventsCountryName(country)) + '</header>' +
          '<div class="headline-list">' + rows + '</div>' +
        '</article>'
      );
    }

    function renderEvents() {
      const board = document.getElementById('board');
      const label = document.getElementById('time-label');
      const olderBtn = document.getElementById('time-older');
      const newerBtn = document.getElementById('time-newer');

      if (!eventsAvailable()) {
        board.innerHTML = '<div class="empty">' +
          escapeHtml(tr('unes.events_unavailable', null, 'Données d\u2019événements indisponibles.')) + '</div>';
        label.textContent = tr('unes.period_none', null, 'Période : --');
        olderBtn.disabled = true;
        newerBtn.disabled = true;
        formatMetaLine();
        return;
      }

      const periodKey = eventPeriods[currentEventIdx];
      label.textContent = eventBlockLabel(periodKey);
      olderBtn.disabled = currentEventIdx >= eventPeriods.length - 1;
      newerBtn.disabled = currentEventIdx <= 0;

      const countries = selectedCountry === 'ALL'
        ? ['QC', 'CAN']
        : (EVENTS_REGION[selectedCountry] ? [selectedCountry] : []);

      const blocks = countries
        .map((c) => ({ c: c, evs: eventsForCountry(c, periodKey) }))
        .filter((x) => x.evs.length)
        .map((x) => renderEventBlock(x.c, x.evs));

      board.innerHTML = blocks.length
        ? blocks.join('')
        : '<div class="empty">' + escapeHtml(tr('unes.empty_events', null,
            'Aucun événement saillant pour ce choix dans ce bloc de 4 h.')) + '</div>';
      formatMetaLine();
    }

    /* Les États-Unis ne sont pas suivis côté événements : on grise l'onglet
       et on bascule sur « Tous » plutôt que d'afficher une page vide. */
    function syncCountryTabs() {
      const evMode = currentMode === 'evenements';
      document.querySelectorAll('.country-tab').forEach((b) => {
        const disabled = evMode && b.dataset.country === 'USA';
        b.classList.toggle('tab-disabled', disabled);
        b.setAttribute('aria-disabled', disabled ? 'true' : 'false');
        if (disabled) b.title = tr('unes.usa_disabled_tip', null,
          'Le suivi des événements couvre le Québec et le Canada.');
        else b.removeAttribute('title');
      });
      if (evMode && selectedCountry === 'USA') {
        selectedCountry = 'ALL';
        document.querySelectorAll('.country-tab').forEach((b) => {
          b.classList.toggle('active', b.dataset.country === 'ALL');
        });
      }
    }

    function localTzShort() {
      try {
        const parts = new Intl.DateTimeFormat(dtLocale(), { timeZoneName: 'short' }).formatToParts(new Date());
        const tz = parts.find((p) => p.type === 'timeZoneName');
        return tz && tz.value ? tz.value : 'locale';
      } catch (e) {
        return 'locale';
      }
    }

    function escapeHtml(str) {
      // Échappe aussi les guillemets : la valeur sert dans des attributs
      const d = document.createElement('div');
      d.textContent = String(str || '');
      return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function normalizeCountry(item) {
      const raw = (item.country_id || '').toUpperCase();
      if (raw === 'QC' || raw === 'CAN' || raw === 'USA') return raw;
      const media = (item.media_id || '').toUpperCase();
      return mediaCountry[media] || 'INTL';
    }

    function toHourBucket(ts) {
      const dt = new Date(ts);
      if (isNaN(dt.getTime())) return null;
      dt.setMinutes(0, 0, 0);
      return dt;
    }

    function formatHourLabel(dt) {
      const datePart = new Intl.DateTimeFormat(dtLocale(), {
        weekday: 'short',
        day: '2-digit',
        month: 'short'
      }).format(dt);
      const timePart = new Intl.DateTimeFormat(dtLocale(), {
        hour: '2-digit',
        minute: '2-digit'
      }).format(dt);
      return datePart + ' · ' + timePart + ' (' + localTzShort() + ')';
    }

    function formatHm(ts) {
      const dt = new Date(ts);
      if (isNaN(dt.getTime())) return '--:--';
      return new Intl.DateTimeFormat(dtLocale(), {
        hour: '2-digit',
        minute: '2-digit'
      }).format(dt);
    }

    function formatMetaLine() {
      const el = document.getElementById('meta-line');
      if (!el) return;

      if (currentMode === 'evenements') {
        if (!eventsAvailable()) {
          el.textContent = tr('unes.events_unavailable', null, 'Données d\u2019événements indisponibles.');
          return;
        }
        const em = eventsData.meta || {};
        const top = em.top_per_region_block || 3;
        const panel = em.panel || {};
        const g2 = new Date(em.generated_at);
        const hm2 = isNaN(g2.getTime()) ? '--:--'
          : new Intl.DateTimeFormat(dtLocale(), { hour: '2-digit', minute: '2-digit' }).format(g2);
        el.textContent = tr('unes.meta_events',
          { hm: hm2, top: top, qc: panel.QC || '--', roc: panel.ROC || '--' });
        return;
      }

      if (!meta || !meta.generated_at) {
        el.textContent = 'Données indisponibles.';
        return;
      }
      const g = new Date(meta.generated_at);
      const hm = isNaN(g.getTime()) ? '--:--' : new Intl.DateTimeFormat(dtLocale(), { hour: '2-digit', minute: '2-digit' }).format(g);
      const lookback = meta.lookback_hours || '--';
      const total = buckets.reduce((acc, b) => acc + b.items.length, 0);
      el.textContent = tr('unes.meta_unes',
        { hm: hm, total: total, lookback: lookback, tz: localTzShort() });
    }

    function render() {
      if (currentMode === 'evenements') {
        renderEvents();
        return;
      }

      const board = document.getElementById('board');
      const label = document.getElementById('time-label');
      const olderBtn = document.getElementById('time-older');
      const newerBtn = document.getElementById('time-newer');

      if (!buckets.length) {
        board.innerHTML = '<div class="empty">' +
          escapeHtml(tr('unes.events_unavailable', null, 'Données indisponibles.')) + '</div>';
        label.textContent = tr('unes.period_none', null, 'Période : --');
        olderBtn.disabled = true;
        newerBtn.disabled = true;
        formatMetaLine();
        return;
      }

      const bucket = buckets[currentBucketIdx];
      label.textContent = formatHourLabel(bucket.date);
      olderBtn.disabled = currentBucketIdx >= buckets.length - 1;
      newerBtn.disabled = currentBucketIdx <= 0;

      const items = bucket.items.filter((it) => selectedCountry === 'ALL' || it.country === selectedCountry);

      if (!items.length) {
        board.innerHTML = '<div class="empty">' + escapeHtml(tr('unes.empty_country', null,
          'Aucune Une pour ce pays dans cette période.')) + '</div>';
        formatMetaLine();
        return;
      }

      if (selectedCountry !== 'ALL') {
        board.innerHTML = renderCountryBlock(selectedCountry, items);
        formatMetaLine();
        return;
      }

      const grouped = {};
      for (const c of displayOrder) grouped[c] = [];
      for (const it of items) {
        if (!grouped[it.country]) grouped[it.country] = [];
        grouped[it.country].push(it);
      }

      board.innerHTML = displayOrder
        .filter((c) => grouped[c] && grouped[c].length)
        .map((c) => renderCountryBlock(c, grouped[c]))
        .join('');
      formatMetaLine();
    }

    function renderCountryBlock(country, items) {
      const sorted = items.slice().sort((a, b) => b.tsMs - a.tsMs);
      const rows = sorted.map((it) => (
        '<a class="headline-item" href="' + escapeHtml(it.url || '#') + '" target="_blank" rel="noopener">' +
          '<div class="h-time">' + formatHm(it.ts_utc) + '</div>' +
          '<div class="h-media">' + escapeHtml(it.media_id || '') + '</div>' +
          '<div class="h-title">' + escapeHtml(it.title || 'Article') + '</div>' +
        '</a>'
      )).join('');

      return (
        '<article class="country-block">' +
          '<header class="country-head">' + escapeHtml(tr('country.' + country, null, countryName[country] || country)) + '</header>' +
          '<div class="headline-list">' + rows + '</div>' +
        '</article>'
      );
    }

    async function loadUnes() {
      try {
        const res = await fetch('./ticker.json');
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        meta = data.meta || null;
        const rawItems = Array.isArray(data.items) ? data.items : [];

        const normalized = rawItems
          .map((it) => {
            const ts = new Date(it.ts_utc);
            if (isNaN(ts.getTime())) return null;
            return {
              ...it,
              country: normalizeCountry(it),
              tsMs: ts.getTime(),
            };
          })
          .filter(Boolean)
          .sort((a, b) => b.tsMs - a.tsMs);

        const map = new Map();
        for (const it of normalized) {
          const b = toHourBucket(it.ts_utc);
          if (!b) continue;
          const key = b.toISOString();
          if (!map.has(key)) map.set(key, { date: b, items: [] });
          map.get(key).items.push(it);
        }

        buckets = Array.from(map.values()).sort((a, b) => b.date.getTime() - a.date.getTime());
        currentBucketIdx = 0;
      } catch (e) {
        buckets = [];
        meta = null;
      }
    }

    async function loadEvents() {
      try {
        const res = await fetch('./events.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('fetch failed');
        eventsData = await res.json();
        const periods = (eventsData.meta && eventsData.meta.periods) || [];
        // du plus récent au plus ancien, comme les buckets des Unes
        eventPeriods = periods.map((p) => p.key).sort().reverse();
        currentEventIdx = 0;
      } catch (e) {
        eventsData = null;
        eventPeriods = [];
      }
    }

    document.getElementById('mode-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-tab');
      if (!btn || btn.classList.contains('active')) return;
      document.querySelectorAll('.mode-tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      syncCountryTabs();
      render();
    });

    document.getElementById('country-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.country-tab');
      if (!btn || btn.classList.contains('tab-disabled')) return;
      document.querySelectorAll('.country-tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCountry = btn.dataset.country;
      render();
    });

    document.getElementById('time-older').addEventListener('click', () => {
      if (currentMode === 'evenements') {
        if (currentEventIdx < eventPeriods.length - 1) { currentEventIdx += 1; render(); }
        return;
      }
      if (currentBucketIdx < buckets.length - 1) {
        currentBucketIdx += 1;
        render();
      }
    });

    document.getElementById('time-newer').addEventListener('click', () => {
      if (currentMode === 'evenements') {
        if (currentEventIdx > 0) { currentEventIdx -= 1; render(); }
        return;
      }
      if (currentBucketIdx > 0) {
        currentBucketIdx -= 1;
        render();
      }
    });

    // Les deux sources se chargent en parallèle : la bascule de mode doit
    // être instantanée, sans nouvel aller-retour réseau.
    Promise.all([loadEvents(), loadUnes()]).then(() => {
      syncCountryTabs();
      // Si les événements manquent, on retombe sur les Unes plutôt que
      // d'accueillir le visiteur avec une page vide.
      if (currentMode === 'evenements' && !eventsAvailable()) {
        currentMode = 'unes';
        document.querySelectorAll('.mode-tab').forEach((b) => {
          b.classList.toggle('active', b.dataset.mode === 'unes');
        });
      }
      render();
    });

    // Les libellés de bandes et la ligne de méta sont construits en JS :
    // un changement de langue doit les reconstruire.
    document.addEventListener('i18n:applied', function () {
      if (eventsData || buckets.length) render();
    });
  </script>
  <section class="ticker-section" id="ticker-section" aria-live="polite">
    <a class="ticker-label ticker-label-link" href="./unes.html" data-i18n-aria-label="ticker.view_aria" aria-label="Voir toutes les dernières Unes">
      <span class="ticker-label-title" data-i18n="ticker.label_arrow">Dans le radar ↗</span>
      <span class="ticker-updated" id="ticker-updated">Les Unes de --:--</span>
      <span class="ticker-radar" aria-hidden="true"></span>
    </a>
    <div class="ticker-viewport">
      <div class="ticker-track" id="ticker-track">
        <span class="ticker-empty" data-i18n="ticker.empty">Chargement des manchettes...</span>
      </div>
    </div>
  </section>
  <script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/shared-menu.js"></script>
  <script src="./assets/js/shared-ticker.js"></script>
</body>
</html>
