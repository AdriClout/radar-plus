<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/radar-data.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RADAR+ · Alertes de saillance</title>
  <meta name="description" content="Les histoires qui ont atteint un niveau de saillance très élevé ou extrême dans les Unes du Québec et du Canada, et les sujets en alerte aux États-Unis." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/shared-menu.css" />
  <link rel="stylesheet" href="./assets/css/shared-ticker.css" />
  <link rel="stylesheet" href="./assets/css/aune.css" />
  <style>
    /* Page des alertes refaite le 1er nov. 2026 sur le modèle du Classement : une alerte est une
       HISTOIRE qui atteint « Saillance très élevée » ou « extrême » dans une édition (comme la barre
       d'alerte du haut) ; aux États-Unis, un objet au-dessus du palier du pays. */
    :root {
      --bg: #020010; --text: #d0e0ff; --muted: rgba(140,170,220,0.6); --accent: #5588ff;
      --card-bg: rgba(10,18,50,0.7); --border: rgba(90,140,255,0.22); --ticker-height: 44px;
      --grotesk: 'Space Grotesk', 'Space Mono', sans-serif;
      --orbitron: 'Space Grotesk', 'Space Mono', sans-serif;
      --mono: 'Space Mono', 'SF Mono', Consolas, monospace;
      --tres: #ff9f43; --ext: #ff4d4d;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-x: clip; }
    body { background: var(--bg); color: var(--text); font-family: var(--grotesk); font-size: 15px; font-variant-numeric: tabular-nums; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #wrap { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: 24px 28px calc(var(--ticker-height) + 60px); }
    .aune-section { height: auto; min-height: 0; padding: 0; display: block; }
    .aune-head h1.aune-title { font-size: clamp(24px, 3.2vw, 37px); }
    .aune-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

    /* ── En ce moment : une carte par région ── */
    .al-now { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 26px 0 8px; }
    .al-now-card { text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); transition: border-color .15s, transform .15s; min-width: 0; }
    .al-now-card:hover { border-color: rgba(140,180,255,0.6); transform: translateY(-1px); }
    .al-now-card.active { box-shadow: 0 0 0 1px rgba(140,180,255,0.55) inset; }
    .al-now-card.lvl-tres_elevee { border-color: rgba(255,159,67,0.55); background: linear-gradient(180deg, rgba(255,159,67,0.10), rgba(10,18,50,0.7)); }
    .al-now-card.lvl-extreme { border-color: rgba(255,77,77,0.65); background: linear-gradient(180deg, rgba(255,77,77,0.13), rgba(10,18,50,0.7)); }
    .al-now-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .al-now-region { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #e8f0ff; }
    .al-now-state { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .al-now-state .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(120,200,150,0.75); }
    .lvl-tres_elevee .al-now-state { color: var(--tres); } .lvl-tres_elevee .al-now-state .dot { background: var(--tres); animation: al-blink 1.6s ease-in-out infinite; }
    .lvl-extreme .al-now-state { color: #ff7a7a; } .lvl-extreme .al-now-state .dot { background: var(--ext); animation: al-blink 1.1s ease-in-out infinite; }
    @keyframes al-blink { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .al-now-state .dot { animation: none !important; } }
    .al-now-items { display: flex; flex-direction: column; gap: 3px; min-height: 2.6em; }
    .al-now-item { font-size: 14px; line-height: 1.3; color: #f1f5ff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .al-now-item b { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 6px; white-space: nowrap; }
    .al-now-calm { font-size: 14px; color: var(--muted); }
    .al-now-when { font-size: 12px; color: var(--muted); }

    /* ── Navigateur de période (celui du Classement) ── */
    .cl-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 26px 0 10px; }
    .cl-nav { display: flex; align-items: center; gap: 10px; margin-right: auto; }
    .cl-nav-block { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 260px; max-width: 460px; text-align: center; }
    .cl-nav-status { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; margin-bottom: 4px; }
    .cl-nav-status.final { color: #ffd98a; border: 1px solid rgba(255,200,87,0.5); }
    .cl-nav-status.live { color: #9dd8ff; border: 1px solid rgba(95,168,255,0.5); }
    .cl-nav-status.live::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5fe08a; margin-right: 6px; vertical-align: middle; animation: al-blink 1.6s ease-in-out infinite; }
    .cl-nav button { font-family: var(--grotesk); font-size: 18px; line-height: 1; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: rgba(10,18,50,0.7); color: #e8f0ff; cursor: pointer; }
    .cl-nav button:hover { border-color: var(--accent); }
    .cl-nav button:disabled { opacity: 0.3; cursor: default; }
    .cl-nav-label { font-family: var(--grotesk); font-size: 15px; font-weight: 600; color: #f1f5ff; white-space: nowrap; }
    .cl-count { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
    .al-sort { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: rgba(10,18,50,0.7); border: 1px solid var(--border); }
    .al-sort button { font: 600 12px var(--grotesk); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    .al-sort button.active { background: rgba(85,136,255,0.22); color: #fff; }
    .al-filter { display: none; align-items: center; gap: 8px; font-size: 12px; color: #e8f0ff; padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(140,180,255,0.5); background: rgba(40,70,160,0.25); }
    .al-filter.on { display: inline-flex; }
    .al-filter button { font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; }

    /* ── Graphique et fil : mêmes colonnes, pour que les traits s'alignent sous les barres ── */
    .al-grid { --c1: minmax(240px, 32%); --c3: 132px; }
    .al-pulse, .al-row { display: grid; grid-template-columns: var(--c1) 1fr var(--c3); gap: 18px; align-items: center; }
    .al-pulse { padding: 14px 16px 6px; border: 1px solid var(--border); border-radius: 12px; background: rgba(8,14,40,0.55); margin-bottom: 10px; }
    .al-pulse-head { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .al-pulse-head strong { display: block; font-size: 14px; color: #e8f0ff; margin-bottom: 6px; }
    .al-legend { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .al-legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; }
    .al-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
    .al-pulse svg, .al-track svg { display: block; width: 100%; overflow: visible; }
    .al-pulse .bar { cursor: pointer; transition: opacity .15s; }
    .al-pulse .bin:hover .bg { fill: rgba(140,180,255,0.10); }
    .al-pulse .bin.sel .bg { fill: rgba(140,180,255,0.18); }
    .al-pulse .tick { font: 10px var(--mono); fill: rgba(150,180,230,0.7); }
    .al-pulse .ylab { font: 10px var(--mono); fill: rgba(150,180,230,0.55); }
    .al-pulse-max { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; }
    .al-list { display: flex; flex-direction: column; }
    .al-row { padding: 12px 16px; border-bottom: 1px solid rgba(90,140,255,0.14); border-left: 3px solid transparent; cursor: pointer; transition: background .15s; }
    .al-row:hover { background: rgba(20,36,90,0.45); }
    .al-row.band-tres_elevee { border-left-color: var(--tres); }
    .al-row.band-extreme { border-left-color: var(--ext); }
    .al-row.focused { background: rgba(40,70,160,0.30); box-shadow: 0 0 0 1px rgba(140,180,255,0.6) inset; }
    .al-row-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .al-row-title { font-size: 15px; font-weight: 600; line-height: 1.3; color: #f1f5ff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .al-row-title a:hover { text-decoration: underline; }
    .al-row-meta { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .al-row .aune-band { align-self: flex-start; font-size: 10px; padding: 2px 8px; }
    .al-track { min-width: 0; }
    .al-peak { text-align: right; }
    .al-peak .num { font-family: var(--mono); font-size: 20px; font-weight: 700; color: #f1f5ff; }
    .al-peak .pts { font-size: 11px; color: var(--muted); margin-left: 4px; }
    .al-peak .when { display: block; font-size: 11px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
    .al-empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 15px; border: 1px dashed var(--border); border-radius: 12px; }
    .al-notice { margin: 0 0 10px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(140,180,255,0.45); background: rgba(40,70,160,0.22); font-size: 14px; }
    .cl-more { text-align: center; margin: 22px 0 8px; }
    .cl-more button { font-family: var(--grotesk); font-size: 15px; font-weight: 700; color: #fff; padding: 10px 22px; border: 1px solid rgba(120,170,255,0.45); border-radius: 8px; background: rgba(40,70,160,0.22); cursor: pointer; }
    .cl-more button:hover { background: rgba(40,70,160,0.4); border-color: var(--accent); }
    .al-tip { position: fixed; z-index: 50; pointer-events: none; display: none; max-width: 300px; padding: 8px 11px; border-radius: 8px; background: rgba(4,8,28,0.96); border: 1px solid rgba(120,170,255,0.45); font-size: 12px; line-height: 1.45; color: #e8f0ff; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
    .al-tip b { font-family: var(--mono); }
    .al-tip .lv { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }

    /* ── Comment naît une alerte ── */
    .al-how { margin-top: 40px; padding: 20px 22px; border: 1px solid var(--border); border-radius: 12px; background: rgba(8,14,40,0.55); max-width: 900px; }
    .al-how h2 { font-size: 18px; font-weight: 700; color: #f1f5ff; margin-bottom: 10px; }
    .al-how p { font-size: 14px; line-height: 1.6; color: rgba(200,215,245,0.9); margin-bottom: 8px; }
    .al-how .chip { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12px; font-weight: 700; color: #1a0d00; }
    .al-how .chip.tres { background: var(--tres); } .al-how .chip.ext { background: var(--ext); color: #fff; }
    .al-how .links { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
    .al-how .links a { color: #9dc0ff; font-weight: 600; }
    .al-how .links a:hover { text-decoration: underline; }
    .al-loading { padding: 40px 0; text-align: center; color: var(--muted); }

    @media (max-width: 960px) {
      .al-now { grid-template-columns: 1fr; }
      .al-pulse, .al-row { grid-template-columns: 1fr; gap: 8px; }
      .al-peak { text-align: left; }
      .al-pulse-max { display: none; }
    }
    @media (max-width: 760px) {
      #wrap { padding: 16px 16px calc(var(--ticker-height) + 40px); }
      .aune-controls { align-items: stretch; width: 100%; }
      .cl-nav { margin-right: 0; width: 100%; justify-content: space-between; }
      .cl-nav-block { min-width: 0; } .cl-nav-label { white-space: normal; }
    }
  </style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="wrap">
<section class="aune-section" id="al">
  <div class="aune-head">
    <div>
      <h1 class="aune-title"><span class="page-sym" data-symbol="alertes"></span><span data-i18n="alertes.p_title">Alertes</span> <span class="accent" data-i18n="alertes.p_title_accent">de saillance</span></h1>
      <p class="aune-lede" id="al-lede"></p>
    </div>
    <div class="aune-controls">
      <div class="country-tabs" id="al-regions">
        <button type="button" class="country-tab active" data-region="QC" data-i18n="country.QC">Québec</button>
        <button type="button" class="country-tab" data-region="CAN" data-i18n="country.CAN">Canada</button>
        <button type="button" class="country-tab" data-region="USA" data-i18n="country.USA">États-Unis</button>
      </div>
      <div class="aune-tabs" id="al-ranges" role="tablist">
        <button type="button" class="aune-tab" data-range="today" data-i18n="aune.range.today">Aujourd'hui</button>
        <button type="button" class="aune-tab active" data-range="week" data-i18n="aune.range.week">Cette semaine</button>
        <button type="button" class="aune-tab" data-range="month" data-i18n="aune.range.month">Ce mois-ci</button>
        <button type="button" class="aune-tab" data-range="year" data-i18n="aune.range.year">Cette année</button>
      </div>
    </div>
  </div>

  <!-- En ce moment : la dernière édition de chaque région, comme la barre d'alerte du haut -->
  <div class="al-now" id="al-now"></div>

  <div class="cl-toolbar">
    <div class="cl-nav">
      <button type="button" id="al-prev" data-i18n-title="homepage.previous_period_btn_title" title="Période précédente">&#8249;</button>
      <div class="cl-nav-block"><span class="cl-nav-status" id="al-status"></span><span class="cl-nav-label" id="al-label"></span><span class="cl-count" id="al-count"></span></div>
      <button type="button" id="al-next" data-i18n-title="homepage.next_period_btn_title" title="Période suivante" disabled>&#8250;</button>
    </div>
    <span class="al-filter" id="al-filter"><span id="al-filter-label"></span><button type="button" id="al-filter-clear" data-i18n="alertes.p_filter_clear">Tout voir</button></span>
    <div class="al-sort" id="al-sort">
      <button type="button" class="active" data-sort="recent" data-i18n="alertes.p_sort_recent">Plus récentes</button>
      <button type="button" data-sort="peak" data-i18n="alertes.p_sort_peak">Plus fortes</button>
    </div>
  </div>

  <div class="al-grid" id="al-grid"><div class="al-loading" data-i18n="alertes.p_loading">Chargement des alertes…</div></div>
  <div class="cl-more" id="al-more" hidden><button type="button"></button></div>

  <div class="al-how" id="al-how"></div>
</section>
</div>
<div class="al-tip" id="al-tip"></div>

<!-- Ticker manchettes -->
<section class="ticker-section" id="ticker-section" aria-label="Manchettes récentes">
  <a class="ticker-label ticker-label-link" href="./unes.html" data-i18n-aria-label="ticker.view_aria" aria-label="Voir les manchettes">
    <span class="ticker-label-title" id="ticker-updated" data-i18n="ticker.label">Les Unes</span>

<script>
  // Ciel étoilé, comme le Classement et la page des indices.
  (function() {
    var canvas = document.getElementById('stars'); if (!canvas) return;
    var ctx = canvas.getContext('2d'), stars = [], tick = 0;
    function resize() {
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      var count = Math.floor((canvas.width * canvas.height) / 3200);
      stars = Array.from({ length: count }, function() { return { x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.1 + 0.25, a: Math.random() * 0.5 + 0.18, s: Math.random() * 0.03 + 0.004, p: Math.random() * Math.PI * 2 }; });
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); tick += 0.016;
      for (var i = 0; i < stars.length; i++) { var st = stars[i], a = st.a + Math.sin(tick * st.s + st.p) * 0.14; ctx.fillStyle = 'rgba(180, 205, 255, ' + Math.max(0, a) + ')'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill(); }
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize); resize(); draw();
  })();
</script>
<script>
(function () {
  'use strict';
  // ── Ce qu'est une alerte (la même règle que la barre d'alerte du haut) ─────────────────
  // Québec et Canada : une HISTOIRE est en alerte dans une édition quand ses points de cette
  // édition atteignent le seuil « Saillance très élevée » de sa région (80e centile des Unes de
  // l'année, events/index.json → thresholds.block) ; « extrême » au-delà du 95e centile.
  // États-Unis : pas d'histoires (deux médias) ; un OBJET est en alerte quand son indice d'une
  // édition dépasse le palier « très élevé » du pays (95e centile des pics, 99e pour extrême).
  var U = window.RadarAune.util;
  var esc = U.escapeHtml;
  var BLOCK = 4 * 3600e3, LAG = 5 * 3600e3;
  var LV_RGB = { tres_elevee: '255,159,67', extreme: '255,77,77' };
  function T(k, p) { return window.t ? window.t(k, p) : k; }
  function lang() { return (document.documentElement.lang || 'fr').slice(0, 2); }
  function loc() { return lang() === 'en' ? 'en-CA' : 'fr-CA'; }
  function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }

  var q = new URLSearchParams(location.search);
  var st = {
    region: ['QC', 'CAN', 'USA'].indexOf((q.get('region') || q.get('country') || '').toUpperCase()) >= 0 ? (q.get('region') || q.get('country')).toUpperCase() : 'QC',
    range: ['today', 'week', 'month', 'year'].indexOf(q.get('range')) >= 0 ? q.get('range') : 'week',
    offset: 0, sort: q.get('tri') === 'forts' ? 'peak' : 'recent', extra: 0, pick: null,
    focus: q.get('evenement') || q.get('objet') || null, focusDone: false
  };
  if (st.focus) st.range = q.get('range') ? st.range : 'year'; // depuis une fiche : toute l'année, la ligne en évidence
  var data = { idx: null, latest: null, graph: null, ts: null, stories: {} };

  // ── Temps : éditions et journées (une journée = les éditions sorties ce jour-là) ──────
  var dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Montreal', year: 'numeric', month: '2-digit', day: '2-digit' });
  function dayKey(t) { return dayFmt.format(new Date(t + LAG)); } // t = début du bloc ; l'édition sort 5 h plus tard
  function edHour(t) { return +new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Montreal', hour: 'numeric', hour12: false }).format(new Date(t + LAG)) % 24; }
  function edWord(h) { return lang() === 'en' ? h + 'h edition' : 'édition de ' + (h === 0 ? 'minuit' : h === 12 ? 'midi' : h + 'h'); }
  function dayShort(t) { return new Intl.DateTimeFormat(loc(), { timeZone: 'America/Montreal', day: 'numeric', month: 'short' }).format(new Date(t + LAG)); }
  function dayLong(t) { return new Intl.DateTimeFormat(loc(), { timeZone: 'America/Montreal', weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(t + LAG)); }
  function edName(t) { return dayShort(t) + ', ' + edWord(edHour(t)); } // « 31 oct., édition de 20h », comme Évolution
  function gridStart(t) { var d = new Date(t), h = d.getUTCHours(), add = ((3 - h % 4) + 4) % 4; var s = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), h) + add * 3600e3; return s < t ? s + BLOCK : s; }

  // ── Données ──────────────────────────────────────────────────────────────────────────
  function years(region) {
    var ds = (data.idx && data.idx.dates && data.idx.dates[region]) || [], ys = {};
    ds.forEach(function (d) { ys[d.slice(0, 4)] = 1; }); return Object.keys(ys).sort();
  }
  function ensureRegion(region) {
    if (region === 'USA') return data.ts ? Promise.resolve() : window.radarData.timeseries().then(function (t) { data.ts = t; }).catch(function () { data.ts = { graphs: {} }; });
    return Promise.all(years(region).filter(function (y) { return !data.stories[region + '/' + y]; }).map(function (y) {
      return window.radarData.eventsStorylines(region, y).then(function (f) { data.stories[region + '/' + y] = f || { storylines: {} }; })
        .catch(function () { data.stories[region + '/' + y] = { storylines: {} }; });
    }));
  }

    b.addEventListener('click', function () { st.sort = b.dataset.sort; st.extra = 0; document.querySelectorAll('#al-sort button').forEach(function (x) { x.classList.toggle('active', x === b); }); syncUrl(); render(); });
  });
  document.getElementById('al-prev').addEventListener('click', function () { st.offset -= 1; st.pick = null; st.extra = 0; render(); });
  document.getElementById('al-next').addEventListener('click', function () { if (st.offset < 0) { st.offset += 1; st.pick = null; st.extra = 0; render(); } });
  document.getElementById('al-filter-clear').addEventListener('click', function () { st.pick = null; render(); });
  document.querySelector('#al-more button').addEventListener('click', function () { st.extra += 20; render(); });
  document.querySelectorAll('#al-regions .country-tab').forEach(function (b) { b.classList.toggle('active', b.dataset.region === st.region); });
  var rt = null; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 150); });
  function lede() { U.setSub(document.getElementById('al-lede'), T('alertes.p_lede')); }
  document.addEventListener('i18n:applied', function () { lede(); renderNow(); renderHow(); if (data.idx) render(); });

  // ── Démarrage ────────────────────────────────────────────────────────────────────────
  lede();
  Promise.all([
    window.radarData.eventsIndex().catch(function () { return null; }),
    window.radarData.eventsLatest().catch(function () { return null; }),
    window.radarData.latestAsGraph().catch(function () { return null; })
  ]).then(function (res) {
    data.idx = res[0]; data.latest = res[1]; data.graph = res[2];
    renderNow(); renderHow(); syncUrl();
    return ensureRegion(st.region);
  }).then(render).catch(function (e) {
    console.error('Alertes :', e);
    document.getElementById('al-grid').innerHTML = '<div class="al-empty">' + esc(T('alertes.p_error')) + '</div>';
  });
})();
</script>
</body>
</html>
