<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RADAR+ · Alertes de saillance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/shared-menu.css" />
  <link rel="stylesheet" href="./assets/css/shared-ticker.css" />
  <style>
    :root {
      --bg: #020010;
      --text: #d0e0ff;
      --muted: rgba(140,170,220,0.6);
      --accent: #5588ff;
      --card-bg: rgba(10,18,50,0.7);
      --border: rgba(90,140,255,0.22);
      --orbitron: 'Orbitron', 'Space Mono', monospace;
      --mono: 'Space Mono', 'SF Mono', Consolas, monospace;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
    }

    #alertes-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 24px 90px;
    }

    /* ── Header ── */
    .alertes-header {
      margin-bottom: 32px;
    }
    .alertes-title {
      font-family: var(--orbitron);
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e8f0ff;
      margin-bottom: 6px;
    }
    .alertes-title span { color: var(--accent); }
    .alertes-subtitle {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.7px;
      margin-bottom: 14px;
    }
    .alertes-live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      background: rgba(255,100,100,0.08);
      border: 1px solid rgba(255,100,100,0.28);
      border-radius: 999px;
      font-size: 9px;
      color: rgba(255,200,200,0.9);
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }
    .alertes-live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,120,120,0.95);
      flex-shrink: 0;
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.72); }
    }

    /* ── Filtres ── */
    #alertes-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
      align-items: center;
    }
    .filter-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
    }
    #alertes-filters select,
    #alertes-filters input {
      background: rgba(10,18,50,0.7);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #alertes-filters select:hover,
    #alertes-filters input:hover { border-color: rgba(90,140,255,0.5); }
    #alertes-filters select:focus,
    #alertes-filters input:focus { border-color: var(--accent); }
    #filter-search { min-width: 180px; cursor: text; }
    #filter-search::placeholder { color: var(--muted); }
    .filter-sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }

    .alertes-methodology {
      margin-bottom: 20px;
      border: 1px solid rgba(90,140,255,0.2);
      border-radius: 6px;
      background: rgba(8,16,42,0.65);
      padding: 10px 14px 12px;
      font-size: 10px;
      color: rgba(180,210,250,0.85);
      line-height: 1.5;
    }
    .alertes-methodology em {
      color: rgba(214,229,255,0.96);
      font-style: normal;
      font-weight: 600;
    }
    .alertes-methodology strong {
      color: rgba(220,234,255,0.98);
    }
    .alertes-methodology-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 10px;
      font-family: var(--orbitron);
      font-size: 8px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(190,220,255,0.92);
      border: 1px solid rgba(120,170,255,0.4);
      border-radius: 999px;
      background: rgba(20,40,90,0.45);
      transition: border-color 0.18s, background 0.18s, color 0.18s;
    }
    .alertes-methodology-link:hover {
      border-color: rgba(160,200,255,0.7);
      background: rgba(30,60,140,0.55);
      color: rgba(230,240,255,1);
    }

    /* ── Groupes de périodes ── */
    .period-group { margin-bottom: 36px; }
    .period-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(90,140,255,0.14);
    }
    .period-header-label {
      font-family: var(--orbitron);
      font-size: 10px;
      letter-spacing: 1.4px;
      color: rgba(160,195,255,0.85);
      text-transform: uppercase;
    }
    .period-header-count {
      font-size: 8px;
      color: var(--muted);
      padding: 2px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .period-header-latest {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,100,100,0.1);
      border: 1px solid rgba(255,100,100,0.3);
      color: rgba(255,190,190,0.85);
    }

    /* ── Grille de cartes ── */
    .alerts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 10px;
    }

    /* ── Carte alerte ── */
    .alert-card {
      position: relative;
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      padding: 12px 14px 10px;
      cursor: default;
      transition: background 0.2s;
    }
    .alert-card.level-strong {
      border-color: rgba(255,110,110,0.45);
      border-left-color: rgba(255,100,100,0.9);
      background: rgba(92,24,28,0.26);
    }
    .alert-card.level-strong:hover { background: rgba(92,24,28,0.42); }
    .alert-card.level-alert {
      border-color: rgba(255,143,92,0.38);
      border-left-color: rgba(255,143,92,0.85);
      background: rgba(86,38,24,0.26);
    }
    .alert-card.level-alert:hover { background: rgba(86,38,24,0.40); }
    .alert-card.level-watch {
      border-color: rgba(212,188,88,0.32);
      border-left-color: rgba(212,188,88,0.8);
      background: rgba(72,58,20,0.26);
    }
    .alert-card.level-watch:hover { background: rgba(72,58,20,0.40); }
    .alert-card.level-emerging {
      border-color: rgba(112,186,245,0.24);
      border-left-color: rgba(112,186,245,0.65);
      background: rgba(18,56,92,0.26);
    }
    .alert-card.level-emerging:hover { background: rgba(18,56,92,0.40); }

    .alert-card-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .alert-card-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 7px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-family: var(--orbitron);
      border: 1px solid;
    }
    .level-strong .alert-card-badge {
      color: rgba(255,196,196,0.98); border-color: rgba(255,110,110,0.64); background: rgba(98,22,28,0.66);
    }
    .level-alert .alert-card-badge {
      color: rgba(255,186,136,0.98); border-color: rgba(255,143,92,0.58); background: rgba(88,40,24,0.60);
    }
    .level-watch .alert-card-badge {
      color: rgba(255,224,112,0.96); border-color: rgba(224,196,88,0.48); background: rgba(74,60,16,0.56);
    }
    .level-emerging .alert-card-badge {
      color: rgba(134,214,255,0.94); border-color: rgba(112,186,245,0.48); background: rgba(18,56,92,0.58);
    }

    .alert-card-name {
      font-size: 13px;
      font-weight: 700;
      color: rgba(220,235,255,0.97);
      text-transform: capitalize;
      line-height: 1.3;
      word-break: break-word;
      flex: 1;
    }
    a.alert-card-name {
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    a.alert-card-name:hover { color: rgba(150,200,255,1); }
    .alert-card-country {
      font-size: 8px;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 3px;
    }

    .alert-card-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 8px;
      font-size: 10px;
      color: var(--muted);
    }
    .alert-card-stat { display: flex; flex-direction: column; gap: 1px; }
    .alert-card-stat-val {
      font-size: 14px;
      font-weight: 700;
      color: rgba(210,228,255,0.92);
      line-height: 1.1;
    }
    .alert-card-stat-lbl {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Articles */
    .alert-card-articles {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(90,140,255,0.12);
      margin-top: 2px;
    }
    .alert-article-link {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 9px;
      color: rgba(160,195,255,0.72);
      text-decoration: none;
      line-height: 1.35;
      transition: color 0.15s;
    }
    .alert-article-link:hover { color: rgba(200,225,255,0.95); }
    .alert-article-media {
      flex-shrink: 0;
      font-size: 7px;
      letter-spacing: 0.7px;
      padding: 1px 4px;
      border: 1px solid rgba(90,140,255,0.22);
      border-radius: 2px;
      color: rgba(140,175,240,0.65);
      text-transform: uppercase;
      margin-top: 1px;
    }
    .alert-article-title {
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .alert-card-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(90,140,255,0.12);
    }
    .alert-card-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--orbitron);
      font-size: 8px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: rgba(160,200,255,0.78);
      text-decoration: none;
      padding: 4px 9px;
      border: 1px solid rgba(90,140,255,0.28);
      border-radius: 999px;
      background: rgba(20,40,90,0.30);
      transition: border-color 0.18s, background 0.18s, color 0.18s;
    }
    .alert-card-nav-link:hover {
      border-color: rgba(150,200,255,0.7);
      background: rgba(30,60,140,0.50);
      color: rgba(220,235,255,1);
    }
    .alert-card-nav-link span[aria-hidden="true"] {
      opacity: 0.7;
      font-size: 9px;
    }

    /* Vide / chargement */
    #alertes-empty, #alertes-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 11px;
    }
    #alertes-loading {
      font-family: var(--orbitron);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      #alertes-wrap { padding: 70px 12px 80px; }
      .alerts-grid { grid-template-columns: 1fr; }
      #alertes-filters { gap: 8px; }
    }

    /* ── CTA "Voir l'évolution" ── */
    .alertes-evo-cta {
      display: flex;
      width: fit-content;
      max-width: 100%;
      align-items: center;
      gap: 12px;
      margin: 14px 0 4px;
      padding: 14px 22px;
      font-family: var(--orbitron);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(220,235,255,0.96);
      background: linear-gradient(120deg, rgba(40,80,180,0.42), rgba(60,120,220,0.32));
      border: 1px solid rgba(120,180,255,0.55);
      border-radius: 6px;
      box-shadow: 0 0 18px rgba(80,130,255,0.20), inset 0 0 12px rgba(80,130,255,0.08);
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .alertes-evo-cta:hover {
      border-color: rgba(150,200,255,0.85);
      box-shadow: 0 0 26px rgba(110,170,255,0.35), inset 0 0 14px rgba(110,170,255,0.12);
      transform: translateY(-1px);
    }
    .alertes-evo-cta-arrow { font-size: 16px; color: rgba(180,215,255,0.95); }
    .alertes-evo-cta-count {
      font-size: 9px;
      letter-spacing: 1.4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(10,28,72,0.65);
      border: 1px solid rgba(120,180,255,0.4);
      color: rgba(190,220,255,0.92);
    }
    .alertes-evo-cta.disabled {
      opacity: 0.45;
      pointer-events: none;
      box-shadow: none;
    }
  </style>
</head>
<body>

<div id="alertes-wrap">
  <div class="alertes-header">
    <div class="alertes-title"><span data-i18n="alertes.title">Alertes de</span> <span data-i18n="alertes.title_accent">saillance</span></div>
    <div class="alertes-subtitle"><span data-i18n="alertes.subtitle">Signaux anormaux détectés dans la couverture médiatique</span> · <span id="alertes-subtitle-window">30 derniers jours</span></div>
    <div class="alertes-live-pill" id="alertes-live-pill">
      <span class="alertes-live-dot"></span>
      <span id="alertes-live-text" data-i18n="common.loading">chargement…</span>
    </div>
    <a id="alertes-evo-cta" class="alertes-evo-cta disabled" href="./evolution.html" data-i18n-aria-label="alertes.evo_cta_aria" aria-label="Voir l'évolution des alertes">
      <span data-i18n="alertes.evo_cta">Voir l'évolution dans le temps</span>
      <span class="alertes-evo-cta-count" id="alertes-evo-cta-count">0</span>
      <span class="alertes-evo-cta-arrow" aria-hidden="true">→</span>
    </a>
  </div>

  <div id="alertes-filters">
    <span class="filter-label" data-i18n="alertes.filter_country">Pays</span>
    <select id="filter-country">
      <option value="all" data-i18n="common.all_countries">Tous</option>
      <option value="CAN" selected data-i18n="country.CAN">Canada</option>
      <option value="QC" data-i18n="country.QC">Québec</option>
      <option value="USA" data-i18n="country.USA">États-Unis</option>
    </select>
    <div class="filter-sep"></div>
    <span class="filter-label" data-i18n="alertes.filter_status">Statut</span>
    <select id="filter-status">
      <option value="current" selected data-i18n="alertes.status_current">En cours</option>
      <option value="ended" data-i18n="alertes.status_ended">Terminées</option>
      <option value="all" data-i18n="alertes.status_all">Toutes</option>
    </select>
    <div class="filter-sep"></div>
    <span class="filter-label" data-i18n="alertes.filter_level">Niveau</span>
    <select id="filter-level">
      <option value="all" selected data-i18n="alertes.level_all">Tous niveaux</option>
      <option value="strong" data-i18n="alertes.level_strong">Alerte forte</option>
      <option value="alert" data-i18n="alertes.level_alert">Alerte</option>
      <option value="watch" data-i18n="alertes.level_watch">Veille</option>
      <option value="emerging" data-i18n="alertes.level_emerging">Émergent</option>
    </select>
    <div class="filter-sep"></div>
    <input type="text" id="filter-search" data-i18n-placeholder="alertes.filter_search_placeholder" placeholder="Filtrer un objet…" autocomplete="off" spellcheck="false" />
  </div>

  <div id="alertes-methodology" class="alertes-methodology"></div>

  <div id="alertes-list"><div id="alertes-loading" data-i18n="common.loading">Chargement des alertes…</div></div>
</div>

<!-- Ticker manchettes -->
<section class="ticker-section" id="ticker-section" aria-label="Manchettes récentes">
  <a class="ticker-label ticker-label-link" href="./unes.html" data-i18n-aria-label="ticker.view_aria" aria-label="Voir les manchettes">
    <span class="ticker-label-title" id="ticker-updated" data-i18n="ticker.label">Les Unes</span>
    <span class="ticker-radar" aria-hidden="true"></span>
  </a>
  <div class="ticker-viewport">
    <div class="ticker-track" id="ticker-track" aria-live="off"></div>
  </div>
</section>

<script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/shared-menu.js"></script>
<script src="./assets/js/shared-ticker.js"></script>
<script>
(function() {
  'use strict';

  const LEVEL_ORDER  = ['strong', 'alert', 'watch', 'emerging'];
  const LEVEL_LABELS = { strong: 'Alerte forte', alert: 'Alerte', watch: 'Veille', emerging: 'Émergent' };
  const COUNTRY_LABELS = { CAN: 'CAN', QC: 'QC', USA: 'USA' };

  let graphData    = null;
  let filterCountry = 'CAN';
  let filterStatus  = 'current';
  let filterLevel   = 'all';
  let filterSearch  = '';

  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>'"]/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  async function loadData() {
    try {
      const res = await fetch('./graph.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      graphData = await res.json();
      render();
    } catch (e) {
      document.getElementById('alertes-list').innerHTML =
        '<div id="alertes-empty">Erreur de chargement des données.</div>';
    }
  }

  function getActiveCountries() {
    if (!graphData) return [];
    return Object.keys(graphData.graphs || {});
  }

  function getLatestPeriodKey() {
    if (!graphData || !graphData.meta || !Array.isArray(graphData.meta.periods)) return null;
    var periods = graphData.meta.periods;
    if (!periods.length) return null;
    return periods[periods.length - 1].key;
  }

  function getLatestActiveMap(countries, latestKey) {
    var out = {};
    if (!latestKey) return out;
    for (var ci = 0; ci < countries.length; ci++) {
      var country = countries[ci];
      var gd = graphData.graphs[country] && graphData.graphs[country][latestKey];
      if (!gd) continue;
      var nodes = gd.nodes || [];
      for (var ni = 0; ni < nodes.length; ni++) {
        var node = nodes[ni];
        var level = String(node.alert_level || 'none');
        if (!node.alert_active) continue;
        if (level === 'none' || level === 'normal' || level === 'emerging') continue;
        out[country + '::' + node.id] = true;
      }
    }
    return out;
  }

  function numOrNull(value) {
    var n = Number(value);
    return isFinite(n) ? n : null;
  }

  function renderMethodology() {
    var box = document.getElementById('alertes-methodology');
    if (!box) return;
    if (!graphData || !graphData.meta) {
      box.innerHTML = '';
      return;
    }

    var thr = graphData.meta.alert_thresholds || {};
    var lookbackDays = numOrNull(thr.lookback_days);
    if (lookbackDays === null) lookbackDays = 30;
    var T = window.t || function(k){ return k; };
    var subtitleEl = document.getElementById('alertes-subtitle-window');
    if (subtitleEl) subtitleEl.textContent = T('alertes.subtitle_window', { days: lookbackDays });

    box.innerHTML = ''
      + '<div class="alertes-methodology-line">'
      + T('alertes.methodology_intro', { days: lookbackDays })
      + '</div>'
      + '<a class="alertes-methodology-link" href="./methodologie.html#alertes">'
      + escapeHtml(T('alertes.methodology_link')) + ' <span aria-hidden="true">→</span>'
      + '</a>';
  }

  function getAlertGroups() {
    if (!graphData) return [];
    const periods   = (graphData.meta && graphData.meta.periods ? graphData.meta.periods : []).slice().reverse();
    const countries = filterCountry === 'all' ? getActiveCountries() : [filterCountry];
    const latestKey = getLatestPeriodKey();
    const latestActiveMap = getLatestActiveMap(countries, latestKey);
    const searchLow = filterSearch.trim().toLowerCase();
    const groups    = [];

    for (var pi = 0; pi < periods.length; pi++) {
      var period = periods[pi];
      var alertsInPeriod = [];

      for (var ci = 0; ci < countries.length; ci++) {
        var country = countries[ci];
        var gd = graphData.graphs[country] && graphData.graphs[country][period.key];
        if (!gd) continue;

        var nodes = gd.nodes || [];
        for (var ni = 0; ni < nodes.length; ni++) {
          var node  = nodes[ni];
          var level = node.alert_level;
          if (!level || level === 'normal' || level === 'none') continue;
          var active = !!node.alert_active;
          var key = country + '::' + node.id;
          var isCurrent = period.key === latestKey && active;
          var isEnded = period.key !== latestKey && active && !latestActiveMap[key];

          if (filterStatus === 'current' && !isCurrent) continue;
          if (filterStatus === 'ended' && !isEnded) continue;

          if ((filterStatus === 'current' || filterStatus === 'ended') && !active) continue;
          if (filterLevel !== 'all' && level !== filterLevel) continue;
          if (searchLow && node.id.toLowerCase().indexOf(searchLow) === -1) continue;

          var score = numOrNull(node.alert_score);
          var delta = numOrNull(node.alert_delta);
          var baseline = numOrNull(node.alert_baseline);
          var peakRatio = numOrNull(node.alert_peak_ratio);
          var yearPeak  = numOrNull(node.alert_year_peak);
          var topShare  = numOrNull(node.alert_top_share);
          alertsInPeriod.push({
            id:       node.id,
            level:    level,
            score:    score,
            delta:    delta,
            baseline: baseline,
            peakRatio: peakRatio,
            yearPeak:  yearPeak,
            topShare:  topShare,
            n:        node.n || 0,
            active:   active,
            status:   isCurrent ? 'current' : (isEnded ? 'ended' : 'other'),
            articles: Array.isArray(node.articles) ? node.articles : [],
            country:  country,
          });
        }
      }

      if (!alertsInPeriod.length) continue;

      alertsInPeriod.sort(function(a, b) {
        var lo = LEVEL_ORDER.indexOf(a.level) - LEVEL_ORDER.indexOf(b.level);
        if (lo !== 0) return lo;
        return (b.score || 0) - (a.score || 0);
      });

      groups.push({ period: period, alerts: alertsInPeriod, isFirst: groups.length === 0 });
    }
    return groups;
  }

  function renderCard(alert) {
    var T = window.t || function(k){ return k; };
    var levelLabel = T('alertes.level_' + alert.level) || alert.level;
    var scoreStr   = alert.score !== null ? alert.score.toFixed(1) + '\u00d7' : '\u2014';
    var deltaStr   = alert.delta !== null ? (alert.delta >= 0 ? '+' : '') + alert.delta.toFixed(1) : '\u2014';
    var baselineStr = alert.baseline !== null ? alert.baseline.toFixed(2) : '\u2014';
    var peakRatioStr = alert.peakRatio !== null ? Math.round(alert.peakRatio * 100) + '%' : '\u2014';
    var peakTitle = alert.yearPeak !== null
      ? T('alertes.card_peak_tip_year', { value: alert.yearPeak.toFixed(2) })
      : T('alertes.card_peak_tip_none');
    var topShareStr = alert.topShare !== null ? Math.round(alert.topShare * 100) + '%' : '\u2014';
    var topShareTitle = T('alertes.card_top_share_tip');
    var countryStr = T('country.' + alert.country) || alert.country;

    var articlesHtml = '';
    var arts = alert.articles.slice(0, 3);
    for (var i = 0; i < arts.length; i++) {
      var a = arts[i];
      var url   = (typeof a.url   === 'string' && a.url)   ? escapeHtml(a.url)   : '#';
      var title = (typeof a.title === 'string' && a.title) ? escapeHtml(a.title) : 'Article';
      var media = (typeof a.media_id === 'string')         ? escapeHtml(a.media_id) : '';
      articlesHtml += '<a class="alert-article-link" href="' + url + '" target="_blank" rel="noopener">'
        + (media ? '<span class="alert-article-media">' + media + '</span>' : '')
        + '<span class="alert-article-title">' + title + '</span>'
        + '</a>';
    }

    var qNode    = encodeURIComponent(alert.id);
    var qCountry = encodeURIComponent(alert.country);
    var evoUrl   = './evolution.html?country=' + qCountry + '&node=' + qNode + '&mode=tracking&gran=week';
    var cstUrl   = './constellation.html?country=' + qCountry + '&node=' + qNode;
    var statsUrl = './statistiques.html?pays=' + qCountry + '&objet=' + qNode;

    return '<div class="alert-card level-' + escapeHtml(alert.level) + '">'
      + '<div class="alert-card-top">'
      +   '<span class="alert-card-badge">' + escapeHtml(levelLabel) + '</span>'
      +   '<a class="alert-card-name" href="' + escapeHtml(evoUrl) + '" data-i18n-aria-label="alertes.card_name_aria" aria-label="Voir l\'évolution de ' + escapeHtml(alert.id) + '">'
      +     escapeHtml(alert.id)
      +   '</a>'
      +   '<span class="alert-card-country">' + escapeHtml(countryStr) + '</span>'
      + '</div>'
      + '<div class="alert-card-stats">'
      +   '<div class="alert-card-stat"><span class="alert-card-stat-val">' + escapeHtml(scoreStr) + '</span><span class="alert-card-stat-lbl">' + escapeHtml(T('alertes.card_score')) + '</span></div>'
      +   '<div class="alert-card-stat"><span class="alert-card-stat-val" title="' + escapeHtml(topShareTitle) + '">' + escapeHtml(topShareStr) + '</span><span class="alert-card-stat-lbl">' + escapeHtml(T('alertes.card_top_share')) + '</span></div>'
      +   '<div class="alert-card-stat"><span class="alert-card-stat-val" title="' + escapeHtml(peakTitle) + '">' + escapeHtml(peakRatioStr) + '</span><span class="alert-card-stat-lbl">' + escapeHtml(T('alertes.card_peak_ratio')) + '</span></div>'
      +   '<div class="alert-card-stat"><span class="alert-card-stat-val">' + escapeHtml(deltaStr) + '</span><span class="alert-card-stat-lbl">' + escapeHtml(T('alertes.card_delta')) + '</span></div>'
      +   '<div class="alert-card-stat"><span class="alert-card-stat-val">' + escapeHtml(String(alert.n)) + '</span><span class="alert-card-stat-lbl">' + escapeHtml(T('alertes.card_mentions')) + '</span></div>'
      + '</div>'
      + (articlesHtml ? '<div class="alert-card-articles">' + articlesHtml + '</div>' : '')
      + '<div class="alert-card-nav">'
      +   '<a class="alert-card-nav-link" href="' + escapeHtml(evoUrl) + '">' + escapeHtml(T('alertes.nav_evolution')) + ' <span aria-hidden="true">→</span></a>'
      +   '<a class="alert-card-nav-link" href="' + escapeHtml(cstUrl) + '">' + escapeHtml(T('alertes.nav_constellation')) + ' <span aria-hidden="true">→</span></a>'
      +   '<a class="alert-card-nav-link" href="' + escapeHtml(statsUrl) + '">' + escapeHtml(T('alertes.nav_stats')) + ' <span aria-hidden="true">→</span></a>'
      + '</div>'
      + '</div>';
  }

  function updateLivePill(groups) {
    var text = document.getElementById('alertes-live-text');
    if (!text) return;
    var T0 = window.t || function(k){ return k; };
    if (!groups.length) {
      if (filterStatus === 'ended')      text.textContent = T0('alertes_pill.none_ended');
      else if (filterStatus === 'all')   text.textContent = T0('alertes_pill.none_filters');
      else                                text.textContent = T0('alertes_pill.none_active');
      return;
    }

    var T = window.t || function(k){ return k; };
    var totalSignals = groups.reduce(function(acc, g) { return acc + g.alerts.length; }, 0);
    var latestLbl = groups[0].period.label || groups[0].period.key;
    if (filterStatus === 'ended') {
      text.textContent = T('alertes_pill.ended_count', { n: totalSignals, last: latestLbl });
      return;
    }
    if (filterStatus === 'all') {
      text.textContent = T('alertes_pill.signals_count', { n: totalSignals, last: latestLbl });
      return;
    }
    var latestActive = groups.reduce(function(acc, g) {
      return acc + (g.alerts || []).filter(function(a) { return a.status === 'current'; }).length;
    }, 0);
    text.textContent = T('alertes_pill.active_count', { n: latestActive, last: latestLbl });
  }

  function updateEvolutionCta(groups) {
    var cta = document.getElementById('alertes-evo-cta');
    var countEl = document.getElementById('alertes-evo-cta-count');
    if (!cta || !countEl) return;

    // Pays cible: filtre courant si spécifique, sinon celui qui a le plus
    // d'alertes visibles (evolution.html est mono-pays).
    var perCountry = {}; // country -> array of unique node ids
    for (var gi = 0; gi < groups.length; gi++) {
      var alerts = groups[gi].alerts;
      for (var ai = 0; ai < alerts.length; ai++) {
        var a = alerts[ai];
        if (!perCountry[a.country]) perCountry[a.country] = [];
        if (perCountry[a.country].indexOf(a.id) === -1) perCountry[a.country].push(a.id);
      }
    }

    var country = filterCountry;
    if (country === 'all') {
      var best = null, bestN = -1;
      for (var c in perCountry) {
        if (perCountry[c].length > bestN) { best = c; bestN = perCountry[c].length; }
      }
      country = best;
    }

    var nodes = country && perCountry[country] ? perCountry[country] : [];
    if (!nodes.length) {
      cta.classList.add('disabled');
      cta.setAttribute('aria-disabled', 'true');
      cta.removeAttribute('href');
      countEl.textContent = '0';
      return;
    }

    cta.classList.remove('disabled');
    cta.setAttribute('aria-disabled', 'false');
    countEl.textContent = String(nodes.length);
    var url = './evolution.html?country=' + encodeURIComponent(country)
      + '&mode=tracking&gran=month'
      + '&nodes=' + encodeURIComponent(nodes.join(','));
    cta.setAttribute('href', url);
  }

  function render() {
    var container = document.getElementById('alertes-list');
    if (!container) return;
    var groups = getAlertGroups();
    renderMethodology();
    updateLivePill(groups);
    updateEvolutionCta(groups);

    if (!groups.length) {
      var Tc = window.t || function(k){ return k; };
      var key = filterStatus === 'ended' ? 'alertes.no_alerts_ended'
              : filterStatus === 'current' ? 'alertes.no_alerts_current'
              : 'alertes.no_alerts_all';
      container.innerHTML = '<div id="alertes-empty">' + escapeHtml(Tc(key)) + '</div>';
      return;
    }

    var html = '';
    for (var gi = 0; gi < groups.length; gi++) {
      var g       = groups[gi];
      var count   = g.alerts.length;
      var latest = '';
      var Th = window.t || function(k){ return k; };
      if (filterStatus === 'current' && g.isFirst) {
        latest = '<span class="period-header-latest">' + Th('common.in_progress') + '</span>';
      } else if (filterStatus === 'ended') {
        latest = '<span class="period-header-latest">' + Th('common.ended') + '</span>';
      }
      var cards   = g.alerts.map(renderCard).join('');
      html += '<div class="period-group">'
        + '<div class="period-header">'
        +   '<span class="period-header-label">' + escapeHtml(g.period.label || g.period.key) + '</span>'
        +   '<span class="period-header-count">'  + escapeHtml(String(count)) + ' ' + escapeHtml((window.t||function(k){return k;})(count > 1 ? 'alertes.signal_many' : 'alertes.signal_one')) + '</span>'
        +   latest
        + '</div>'
        + '<div class="alerts-grid">' + cards + '</div>'
        + '</div>';
    }
    container.innerHTML = html;
  }

  document.getElementById('filter-country').addEventListener('change', function() { filterCountry = this.value; render(); });
  document.getElementById('filter-status').addEventListener('change',  function() { filterStatus  = this.value; render(); });
  document.getElementById('filter-level').addEventListener('change',   function() { filterLevel   = this.value; render(); });
  document.getElementById('filter-search').addEventListener('input',   function() { filterSearch  = this.value; render(); });

  // Re-render au changement de langue (textes générés dynamiquement)
  document.addEventListener('i18n:applied', function () {
    if (graphData) render();
  });

  loadData();
})();
</script>
