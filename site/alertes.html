<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RADAR+ · Alertes médiatiques</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/shared-menu.css" />
  <link rel="stylesheet" href="./assets/css/shared-ticker.css" />
  <style>
    :root {
      --bg: #020010;
      --text: #d0e0ff;
      --muted: rgba(140,170,220,0.6);
      --accent: #5588ff;
      --card-bg: rgba(10,18,50,0.7);
      --border: rgba(90,140,255,0.22);
      --orbitron: 'Orbitron', 'Space Mono', monospace;
      --mono: 'Space Mono', 'SF Mono', Consolas, monospace;

      /* Tier palette — 7 tiers */
      --tsunami:   #d0a0ff;
      --tsunami-d: #6e2bb0;
      --eclipse:   #a070e0;
      --eclipse-d: #4a2580;
      --tempete:   #ff6e6e;
      --tempete-d: #8a1d1d;
      --forte:     #ffa050;
      --forte-d:   #8a4818;
      --alerte:    #f2cd50;
      --alerte-d:  #7a6420;
      --veille:    #d8b830;
      --veille-d:  #6a5520;
      --emergence: #8aa8d8;
      --emergence-d: #2a4570;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    #wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* ── Header ────────────────────────────────────────────── */
    .page-header { margin-bottom: 26px; }
    .page-title {
      font-family: var(--orbitron);
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 700;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: #e8f0ff;
      margin-bottom: 6px;
    }
    .page-title span.accent { color: var(--accent); }
    .page-subtitle {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }
    .page-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    .filter-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
    }
    .page-filters select {
      background: rgba(10,18,50,0.7);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .page-filters select:hover { border-color: rgba(90,140,255,0.5); }
    .page-filters select:focus { border-color: var(--accent); }
    .page-methodo-link {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.8px;
      color: rgba(150,190,240,0.78);
      transition: color 0.15s;
    }
    .page-methodo-link:hover { color: rgba(220,235,255,1); }

    /* ── KPIs ───────────────────────────────────────────────── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 28px;
    }
    @media (max-width: 1100px) {
      .kpi-row { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 700px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .kpi-mark {
      width: 14px; height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .kpi-mark.lvl-tsunami    { background: var(--tsunami);   box-shadow: 0 0 8px rgba(208,160,255,0.45); }
    .kpi-mark.lvl-eclipse    { background: var(--eclipse); }
    .kpi-mark.lvl-tempete    { background: var(--tempete); }
    .kpi-mark.lvl-forte      { background: var(--forte); }
    .kpi-mark.lvl-alerte     { background: var(--alerte); }
    .kpi-mark.lvl-veille     { background: var(--veille); opacity: 0.9; }
    .kpi-mark.lvl-emergence  { background: var(--emergence); opacity: 0.85; }
    .kpi-val {
      font-family: var(--orbitron);
      font-size: 22px;
      font-weight: 700;
      color: #e8f0ff;
      line-height: 1;
    }
    .kpi-lbl {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 9.5px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: rgba(180,210,255,0.78);
    }
    .kpi-lbl-sub {
      font-size: 8px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: none;
    }

    /* ── Sections ─────────────────────────────────────────── */
    .section {
      margin-bottom: 36px;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-family: var(--orbitron);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #e8f0ff;
    }
    .section-sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.6px;
    }

    .section-empty {
      padding: 26px 18px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 6px;
    }

    /* ── Vue Maintenant — cartes ──────────────────────────── */
    .now-tier-group {
      margin-bottom: 16px;
    }
    .now-tier-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(200,225,255,0.8);
    }
    .now-tier-head .now-tier-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
    }
    .now-tier-head .now-tier-count {
      margin-left: auto;
      font-size: 9px;
      color: var(--muted);
    }

    .alert-card {
      display: block;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 4px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      cursor: pointer;
    }
    .alert-card:hover { background: rgba(18,30,72,0.85); transform: translateX(2px); }
    .alert-card.level-tsunami   { border-left-color: var(--tsunami);   background: linear-gradient(90deg, rgba(110,43,176,0.28), rgba(10,18,50,0.7) 50%); }
    .alert-card.level-eclipse   { border-left-color: var(--eclipse);   background: linear-gradient(90deg, rgba(74,37,128,0.25), rgba(10,18,50,0.7) 50%); }
    .alert-card.level-tempete   { border-left-color: var(--tempete);   background: linear-gradient(90deg, rgba(138,29,29,0.22), rgba(10,18,50,0.7) 50%); }
    .alert-card.level-forte     { border-left-color: var(--forte);     background: linear-gradient(90deg, rgba(138,72,24,0.22), rgba(10,18,50,0.7) 50%); }
    .alert-card.level-alerte    { border-left-color: var(--alerte);    background: linear-gradient(90deg, rgba(122,100,32,0.18), rgba(10,18,50,0.65) 50%); }
    .alert-card.level-veille    { border-left-color: var(--veille);    background: rgba(10,18,50,0.6); }
    .alert-card.level-emergence { border-left-color: var(--emergence); background: rgba(10,18,50,0.6); }

    .alert-card-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .alert-card-tier {
      font-size: 9px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 2px;
      font-family: var(--orbitron);
      font-weight: 600;
    }
    .alert-card-tier.lvl-tsunami    { color: rgba(245,220,255,1);  background: rgba(110,43,176,0.55); border: 1px solid rgba(208,160,255,0.6); }
    .alert-card-tier.lvl-eclipse    { color: rgba(230,200,255,0.98); background: rgba(74,37,128,0.55); border: 1px solid rgba(160,112,224,0.55); }
    .alert-card-tier.lvl-tempete    { color: rgba(255,196,196,0.98); background: rgba(138,29,29,0.45); border: 1px solid rgba(255,110,110,0.55); }
    .alert-card-tier.lvl-forte      { color: rgba(255,200,150,0.98); background: rgba(138,72,24,0.45); border: 1px solid rgba(255,160,80,0.55); }
    .alert-card-tier.lvl-alerte     { color: rgba(250,225,140,0.98); background: rgba(122,100,32,0.45); border: 1px solid rgba(242,205,80,0.55); }
    .alert-card-tier.lvl-veille     { color: rgba(240,220,140,0.95); background: rgba(106,85,32,0.40); border: 1px solid rgba(216,184,48,0.50); }
    .alert-card-tier.lvl-emergence  { color: rgba(200,220,250,0.95); background: rgba(42,69,112,0.50); border: 1px solid rgba(138,168,216,0.50); }

    .alert-card-name {
      font-family: var(--orbitron);
      font-size: 13px;
      font-weight: 600;
      color: #e8f0ff;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      flex: 1;
      min-width: 0;
    }
    .alert-card-country {
      font-size: 9px;
      letter-spacing: 0.7px;
      color: rgba(180,210,255,0.7);
      padding: 2px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .alert-card-status {
      font-size: 9px;
      letter-spacing: 0.6px;
      color: var(--muted);
    }
    .alert-card-status.is-active {
      color: rgba(150,255,180,0.9);
    }

    .alert-card-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 10px;
      color: rgba(190,215,240,0.85);
    }
    .alert-card-metric b {
      color: #e8f0ff;
      font-weight: 700;
    }

    .alert-card-cluster {
      margin-top: 6px;
      font-size: 9.5px;
      color: rgba(170,200,235,0.75);
    }
    .alert-card-cluster b { color: rgba(220,235,255,0.92); font-weight: 600; }

    /* Émergences dépliable */
    .emergence-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 10px;
      letter-spacing: 0.8px;
      color: rgba(200,180,90,0.95);
      background: rgba(106,90,24,0.18);
      border: 1px solid rgba(200,176,72,0.35);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .emergence-toggle:hover { background: rgba(106,90,24,0.30); }
    .emergence-section { margin-top: 8px; display: none; }
    .emergence-section.is-open { display: block; }
    .emergence-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      margin-bottom: 4px;
      background: rgba(10,18,50,0.45);
      border-left: 2px solid var(--emergence);
      border-radius: 3px;
      font-size: 10.5px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .emergence-row:hover { background: rgba(20,30,72,0.6); }
    .emergence-row-name {
      font-family: var(--orbitron);
      font-weight: 500;
      color: rgba(230,240,255,0.95);
      flex: 1;
      min-width: 0;
      letter-spacing: 0.4px;
    }
    .emergence-row-country {
      font-size: 8.5px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .emergence-row-metric {
      font-size: 9px;
      color: rgba(180,210,255,0.7);
    }

    /* ── Chronique 130j ──────────────────────────────────── */
    .chronique-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .zoom-btn {
      padding: 5px 12px;
      background: rgba(10,18,50,0.7);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: rgba(180,210,255,0.78);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .zoom-btn:hover { color: rgba(220,235,255,0.95); border-color: rgba(90,140,255,0.5); }
    .zoom-btn.is-active {
      background: rgba(85,136,255,0.15);
      border-color: var(--accent);
      color: rgba(230,240,255,0.98);
    }

    .legend-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.6px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .legend-block {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
    }
    .legend-block.lvl-tsunami   { background: var(--tsunami);   box-shadow: 0 0 6px rgba(208,160,255,0.35); }
    .legend-block.lvl-eclipse   { background: var(--eclipse); }
    .legend-block.lvl-tempete   { background: var(--tempete); }
    .legend-block.lvl-forte     { background: var(--forte); }
    .legend-block.lvl-alerte    { background: var(--alerte); }
    .legend-block.lvl-veille    { background: var(--veille); opacity: 0.85; }
    .legend-block.lvl-emergence { background: var(--emergence); opacity: 0.85; }

    #chronique-svg-wrap {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 14px 6px;
    }
    #chronique-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .swimlane-bg { fill: rgba(20,30,60,0.4); }
    .swimlane-divider { stroke: rgba(90,140,255,0.12); stroke-width: 1; }
    .swimlane-label {
      font-family: var(--orbitron);
      font-size: 10px;
      fill: rgba(200,225,255,0.85);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .month-tick { stroke: rgba(90,140,255,0.18); stroke-width: 1; stroke-dasharray: 2,3; }
    .month-label {
      font-family: var(--mono);
      font-size: 9px;
      fill: var(--muted);
      letter-spacing: 0.4px;
    }
    .now-line {
      stroke: rgba(120,255,160,0.7);
      stroke-width: 1.5;
      stroke-dasharray: 3,3;
    }
    .now-label {
      font-family: var(--mono);
      font-size: 8px;
      fill: rgba(140,255,180,0.9);
      letter-spacing: 0.6px;
    }
    .episode-block {
      cursor: pointer;
      transition: filter 0.15s, stroke-width 0.15s;
      stroke: rgba(0,0,0,0.4);
      stroke-width: 0.5;
    }
    .episode-block:hover {
      filter: brightness(1.25);
      stroke-width: 1.5;
      stroke: rgba(255,255,255,0.6);
    }
    .episode-block.selected {
      stroke: #fff;
      stroke-width: 1.5;
      filter: brightness(1.3);
    }
    .episode-icon {
      font-size: 9px;
      fill: rgba(255,255,255,0.85);
      text-anchor: middle;
      pointer-events: none;
      font-family: var(--mono);
    }

    /* ── Tooltip ──────────────────────────────────────────── */
    #chronique-tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(8,14,38,0.96);
      border: 1px solid rgba(90,140,255,0.4);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 10px;
      color: rgba(220,235,255,0.95);
      letter-spacing: 0.3px;
      max-width: 240px;
      display: none;
      z-index: 100;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }
    #chronique-tooltip .tt-title {
      font-family: var(--orbitron);
      font-size: 10px;
      font-weight: 600;
      color: #e8f0ff;
      margin-bottom: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    #chronique-tooltip .tt-meta {
      color: var(--muted);
      font-size: 9px;
    }

    /* ── Side panel ──────────────────────────────────────── */
    #side-panel {
      position: fixed;
      top: 0; right: 0;
      width: 420px;
      max-width: 100vw;
      height: 100vh;
      background: rgba(6,12,32,0.98);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 200;
      overflow-y: auto;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    #side-panel.is-open { transform: translateX(0); }
    .panel-head {
      position: sticky; top: 0;
      background: rgba(6,12,32,0.98);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-tier-badge {
      font-family: var(--orbitron);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      border-radius: 3px;
    }
    .panel-tier-badge.lvl-tsunami   { background: rgba(110,43,176,0.65); color: rgba(245,220,255,1); }
    .panel-tier-badge.lvl-eclipse   { background: rgba(74,37,128,0.65); color: rgba(230,200,255,0.98); }
    .panel-tier-badge.lvl-tempete   { background: rgba(138,29,29,0.55); color: rgba(255,196,196,0.98); }
    .panel-tier-badge.lvl-forte     { background: rgba(138,72,24,0.55); color: rgba(255,200,150,0.98); }
    .panel-tier-badge.lvl-alerte    { background: rgba(122,100,32,0.55); color: rgba(250,225,140,0.98); }
    .panel-tier-badge.lvl-veille    { background: rgba(106,85,32,0.50); color: rgba(240,220,140,0.95); }
    .panel-tier-badge.lvl-emergence { background: rgba(42,69,112,0.55); color: rgba(200,220,250,0.95); }

    .panel-country {
      font-size: 10px;
      color: rgba(180,210,255,0.8);
      letter-spacing: 0.8px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .panel-close {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: rgba(200,225,255,0.7);
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 0.15s;
    }
    .panel-close:hover { color: #fff; border-color: rgba(200,225,255,0.7); background: rgba(200,225,255,0.08); }

    .panel-body {
      padding: 16px 20px 32px;
    }
    .panel-title {
      font-family: var(--orbitron);
      font-size: 17px;
      font-weight: 700;
      color: #e8f0ff;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .panel-period {
      font-size: 10.5px;
      color: rgba(200,225,255,0.78);
      margin-bottom: 4px;
    }
    .panel-status {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .panel-status.is-active {
      color: rgba(140,255,180,0.95);
      border-color: rgba(120,200,150,0.4);
      background: rgba(60,140,90,0.12);
    }

    .panel-section {
      margin-top: 22px;
    }
    .panel-section-title {
      font-size: 9px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(180,210,255,0.65);
      margin-bottom: 8px;
    }
    .panel-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      font-size: 11px;
    }
    .panel-metric {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .panel-metric-val {
      font-family: var(--orbitron);
      font-size: 14px;
      color: #e8f0ff;
      font-weight: 600;
    }
    .panel-metric-lbl {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    .panel-member {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: rgba(10,18,50,0.5);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 10.5px;
    }
    .panel-member-name {
      font-family: var(--orbitron);
      font-size: 10.5px;
      letter-spacing: 0.4px;
      color: rgba(230,240,255,0.92);
      flex: 1;
      min-width: 0;
    }

<script>
(function() {
  'use strict';

  // ─── Constantes ────────────────────────────────────────────────
  const TIERS = ['tsunami', 'eclipse', 'tempete', 'forte', 'alerte', 'veille', 'emergence'];
  // MAIN_TIERS = ce qui s'affiche en cartes pleines dans "Maintenant"
  // (les 4 du haut + alerte). Veille/émergence vont dans le sous-bloc dépliable.
  const MAIN_TIERS = ['tsunami', 'eclipse', 'tempete', 'forte', 'alerte'];
  const MINOR_TIERS = ['veille', 'emergence'];
  const TIER_RANK = { tsunami: 0, eclipse: 1, tempete: 2, forte: 3, alerte: 4, veille: 5, emergence: 6, none: 99 };
  // Hauteur du bloc dans le swimlane (proportionnel à la magnitude)
  const TIER_HEIGHT_PCT = { tsunami: 1.0, eclipse: 1.0, tempete: 0.85, forte: 0.85, alerte: 0.6, veille: 0.45, emergence: 0.32 };
  const TIER_ICON = { tsunami: '🌊', eclipse: '🌑', tempete: '⛈', forte: '⚡', alerte: '📍', veille: '▾', emergence: '◦' };
  const COUNTRY_ORDER = ['QC', 'CAN', 'USA'];

  const FR_MONTHS_SHORT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const EN_MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ─── État ──────────────────────────────────────────────────────
  let graphData = null;
  let timeseriesData = null;
  let filterCountry = 'all';
  let filterMinLevel = 'alerte';
  let zoomDays = 130;
  let isEmergenceOpen = false;
  let selectedEpisodeKey = null;

  // ─── Helpers ───────────────────────────────────────────────────
  function T(key, fallback) {
    var v = window.t ? window.t(key) : null;
    if (typeof v === 'string' && v !== key) return v;
    return fallback !== undefined ? fallback : key;
  }
  function lang() {
    return (window.__i18n && window.__i18n.currentLang) ? window.__i18n.currentLang() : 'fr';
  }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>'"]/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function tierRank(t) { return TIER_RANK[t] != null ? TIER_RANK[t] : 99; }
  function tierLabel(t) { return T('alertes.level_' + t, t); }
  function tierShort(t) {
    var s = window.t ? window.t('alertes.level_short.' + t) : null;
    if (s && s !== 'alertes.level_short.' + t) return s;
    return t;
  }
  function countryLabel(c) { return T('country.' + c, c); }
  function passesFilter(tier, country) {
    if (filterCountry !== 'all' && country !== filterCountry) return false;
    if (tierRank(tier) > tierRank(filterMinLevel)) return false;
    return true;
  }
  function fmtDay(d) {
    if (!d) return '';
    var p = String(d).split('-');
    if (p.length !== 3) return d;
    var dd = parseInt(p[2], 10);
    var mm = parseInt(p[1], 10) - 1;
    var months = lang() === 'fr' ? FR_MONTHS_SHORT : EN_MONTHS_SHORT;
    return dd + ' ' + months[mm];
  }
  function dayDiff(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }
  function daysAgo(dateStr) {
    var today = new Date(); today.setUTCHours(0,0,0,0);
    var d = new Date(dateStr);
    return Math.round((today - d) / 86400000);
  }
  function getCountries() {
    var src = graphData || timeseriesData;
    if (!src || !src.graphs) return [];
    var out = [];
    COUNTRY_ORDER.forEach(function(c) { if (src.graphs[c]) out.push(c); });
    Object.keys(src.graphs).forEach(function(c) { if (out.indexOf(c) === -1) out.push(c); });
    return out;
  }
  function getSalienceTier(country, size) {
    if (!graphData || !graphData.meta || !graphData.meta.salience_tiers) return null;
    var tiers = graphData.meta.salience_tiers[country];
    if (!tiers || typeof size !== 'number') return null;
    if (size >= tiers.extreme)   return 'extreme';
    if (size >= tiers.very_high) return 'very_high';
    if (size >= tiers.high)      return 'high';
    if (size >= tiers.moderate)  return 'moderate';
    return null;
  }
  function fmtPeakWithTier(country, size) {
    if (typeof size !== 'number') return '—';
    var tiers = graphData && graphData.meta && graphData.meta.salience_tiers
      ? graphData.meta.salience_tiers[country] : null;
    var lbl = size.toFixed(1);
    if (!tiers) return lbl;
    var tier = getSalienceTier(country, size);
    if (tier) {
      var thr = tiers[tier];
      if (typeof thr === 'number' && thr > 0) {
        lbl += ' (' + (tier === 'extreme' ? 'ext' : tier === 'very_high' ? 'vhi' : tier) + ' ×' + (size / thr).toFixed(1) + ')';
      }
    }
    return lbl;
  }

  // ─── Chargement ────────────────────────────────────────────────
  async function loadData() {
    try {
      var [g, t] = await Promise.all([
        fetch('./graph.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null),
        fetch('./timeseries.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null)
      ]);
      graphData = g;
      timeseriesData = t;
      render();
    } catch (e) {
      console.error('Erreur chargement:', e);
      document.getElementById('now-content').innerHTML =
        '<div class="section-empty">Erreur de chargement.</div>';
    }
  }

  // ─── Construction des données ──────────────────────────────────
  // Pour la chronique : reconstruire les épisodes depuis timeseries.json
  // en groupant par alert_episode_id (per-objet).
  function buildEpisodesFromTimeseries() {
    var out = [];
    if (!timeseriesData || !timeseriesData.graphs) return out;
    var byEp = {};
    Object.keys(timeseriesData.graphs).forEach(function(country) {
      var periods = timeseriesData.graphs[country];
      Object.keys(periods).forEach(function(pk) {
        var gd = periods[pk];
        if (!gd || !gd.nodes) return;
        gd.nodes.forEach(function(n) {
          if (!n.alert_episode_id || !n.alert_level || n.alert_level === 'none') return;
          var key = n.alert_episode_id;
          if (!byEp[key]) {
            byEp[key] = {
              key: key,
              country: country,
              id: n.id,
              tier: n.alert_level,
              first_day: n.alert_episode_first_day,
              last_day: n.alert_episode_last_day,
              n_days: n.alert_episode_n_days,
              peak: n.alert_episode_peak,
              status: n.alert_episode_status,
              max_top_share: n.alert_top_share || 0,
              max_score: n.alert_score || 0
            };
          } else {
            // Update tier if encountered better
            if (tierRank(n.alert_level) < tierRank(byEp[key].tier)) byEp[key].tier = n.alert_level;
            if ((n.alert_top_share || 0) > byEp[key].max_top_share) byEp[key].max_top_share = n.alert_top_share;
            if ((n.alert_score || 0) > byEp[key].max_score) byEp[key].max_score = n.alert_score;
          }
        });
      });
    });
    Object.keys(byEp).forEach(function(k) { out.push(byEp[k]); });
    return out;
  }

  // Pour le "Maintenant" : prendre la dernière période graph.json
  function buildNowItems() {
    var items = [];
    if (!graphData || !graphData.meta || !graphData.meta.periods) return items;
    var periods = graphData.meta.periods;
    if (!periods.length) return items;
    var latestKey = periods[periods.length - 1].key;

    getCountries().forEach(function(country) {
      var gd = graphData.graphs[country] && graphData.graphs[country][latestKey];
      if (!gd) return;
      var inCluster = {};
      var events = gd.events || [];

      events.forEach(function(e) {
        if (e.pivot && e.pivot.id) inCluster[e.pivot.id] = true;
        (e.members || []).forEach(function(m) { inCluster[m.id] = true; });
      });

      // Cards-événements (clusters)
      events.forEach(function(e) {
        if (!e.pivot || !Array.isArray(e.members) || !e.members.length) return;
        var lvls = (e.members || []).map(function(m) { return m.alert_level; });
        if (e.pivot.alert_active && e.pivot.alert_level) lvls.push(e.pivot.alert_level);
        var topLvl = 'emergence';
        for (var i = 0; i < TIERS.length; i++) {
          if (lvls.indexOf(TIERS[i]) !== -1) { topLvl = TIERS[i]; break; }
        }
        if (!passesFilter(topLvl, country)) return;
        items.push({
          kind: 'event',
          country: country,
          tier: topLvl,
          pivot: e.pivot,
          members: e.members,
          shared_articles: e.shared_articles || [],
          shared_count: e.shared_articles_count || 0
        });
      });

      // Cards standalone (alertes hors cluster)
      (gd.nodes || []).forEach(function(n) {
        if (!n.alert_active || !n.alert_level || n.alert_level === 'none') return;
        if (inCluster[n.id]) return;
        if (!passesFilter(n.alert_level, country)) return;
        items.push({
          kind: 'alert',
          country: country,
          tier: n.alert_level,
          node: n
        });
      });
    });

    // Tri par tier puis par score
    items.sort(function(a, b) {
      var r = tierRank(a.tier) - tierRank(b.tier);
      if (r !== 0) return r;
      var sa = a.kind === 'event' ? (a.pivot.alert_score || 0) : (a.node.alert_score || 0);
      var sb = b.kind === 'event' ? (b.pivot.alert_score || 0) : (b.node.alert_score || 0);
      return sb - sa;
    });
    return items;
  }

  // ─── Render header / KPIs ─────────────────────────────────────
  function renderKPIs() {
    var el = document.getElementById('kpi-row');
    if (!el) return;
    var episodes = buildEpisodesFromTimeseries();
    var counts = { tsunami: 0, eclipse: 0, tempete: 0, poussee: 0, emergence: 0 };
    episodes.forEach(function(e) {
      if (filterCountry !== 'all' && e.country !== filterCountry) return;
      counts[e.tier] = (counts[e.tier] || 0) + 1;
    });
    var html = '';
    TIERS.forEach(function(tier) {
      html += '<div class="kpi">'
        + '<span class="kpi-mark lvl-' + tier + '"></span>'
        + '<span class="kpi-val">' + (counts[tier] || 0) + '</span>'
        + '<span class="kpi-lbl">' + esc(tierLabel(tier))
        +   '<span class="kpi-lbl-sub">130 j</span>'
        + '</span></div>';
    });
    el.innerHTML = html;
  }

  // ─── Render "Maintenant" ──────────────────────────────────────
  function renderNow() {
    var container = document.getElementById('now-content');
    var periodEl = document.getElementById('section-now-period');
    if (!container) return;

    var periods = (graphData && graphData.meta && graphData.meta.periods) || [];
    if (periods.length && periodEl) {
      var lbl = periods[periods.length - 1].label || '';
      periodEl.textContent = lbl;
    }

    var items = buildNowItems();
    if (!items.length) {
      container.innerHTML = '<div class="section-empty">' + esc(T('alertes.no_alerts_current', 'Agenda calme — aucun signal actif.')) + '</div>';
      return;
    }

    // Grouper par tier
    var groups = { tsunami: [], eclipse: [], tempete: [], forte: [], alerte: [], veille: [], emergence: [] };
    items.forEach(function(it) {
      (groups[it.tier] || []).push(it);
    });

    var html = '';
    MAIN_TIERS.forEach(function(tier) {
      if (!groups[tier].length) return;
      html += '<div class="now-tier-group">'
        + '<div class="now-tier-head">'
        +   '<span class="now-tier-dot legend-block lvl-' + tier + '"></span>'
        +   '<span>' + esc(tierLabel(tier)) + '</span>'
        +   '<span class="now-tier-count">' + groups[tier].length + '</span>'
        + '</div>'
        + groups[tier].map(renderCard).join('')
        + '</div>';
    });

    // Sous-bloc dépliable pour Veille + Émergence (signaux faibles)
    var minorItems = MINOR_TIERS.reduce(function(acc, t) {
      return acc.concat(groups[t] || []);
    }, []);
    if (minorItems.length) {
      var label = minorItems.length === 1
        ? T('alertes.emergence_expand_one', 'Voir 1 signal faible')
        : T('alertes.emergence_expand_many', 'Voir {n} signaux faibles').replace('{n}', minorItems.length);
      html += '<button type="button" class="emergence-toggle" id="emergence-toggle">'
        + '<span class="legend-block lvl-veille"></span>'
        + '<span id="emergence-toggle-label">' + esc(isEmergenceOpen ? T('alertes.emergence_collapse', 'Masquer les signaux faibles') : label) + '</span>'
        + '</button>'
        + '<div class="emergence-section' + (isEmergenceOpen ? ' is-open' : '') + '" id="emergence-section">'
        + minorItems.map(renderEmergenceRow).join('')
        + '</div>';
    }

    container.innerHTML = html;

    // Hooks
    var toggle = document.getElementById('emergence-toggle');
    if (toggle) {
      toggle.addEventListener('click', function() {
        isEmergenceOpen = !isEmergenceOpen;
        renderNow();
      });
    }
  }

  function renderCard(item) {
    var country = item.country;
    var tier = item.tier;
    var nKey, name, periodHint, metrics, clusterInfo = '';

    if (item.kind === 'event') {
      var pivotId = item.pivot.id;
      nKey = 'now-event-' + country + '-' + pivotId;
      name = pivotId;
      var totalMentions = (item.pivot.n || 0)
        + (item.members || []).reduce(function(s, m) { return s + (m.n || 0); }, 0);
      var maxScore = item.pivot.alert_score || 0;
      (item.members || []).forEach(function(m) {
        if ((m.alert_score || 0) > maxScore) maxScore = m.alert_score;
      });
      var memberNames = (item.members || []).slice(0, 4).map(function(m) { return m.id; }).join(' · ');
      if ((item.members || []).length > 4) memberNames += ' +' + ((item.members || []).length - 4);
      clusterInfo = '<div class="alert-card-cluster">'
        + '<b>' + (item.members || []).length + '</b> ' + esc(T('alertes.event_entities', 'entités liées'))
        + ' · <b>' + item.shared_count + '</b> ' + esc(T('alertes.event_shared_short', 'articles partagés'))
        + ' · ' + esc(memberNames)
        + '</div>';
      metrics = renderMetricsRow({
        peak: item.pivot.size,
        topShare: item.pivot.alert_top_share,
        score: maxScore,
        mentions: totalMentions
      }, country);
      periodHint = renderDayOffset(item.pivot);
    } else {
      var n = item.node;
      nKey = 'now-alert-' + country + '-' + n.id;
      name = n.id;
      metrics = renderMetricsRow({
        peak: n.size,
        topShare: n.alert_top_share,
        score: n.alert_score,
        mentions: n.n
      }, country);
      periodHint = renderDayOffset(n);
    }

    return '<div class="alert-card level-' + tier + '" data-key="' + esc(nKey) + '" data-kind="' + esc(item.kind) + '">'
      + '<div class="alert-card-top">'
      +   '<span class="alert-card-tier lvl-' + tier + '">' + esc(tierLabel(tier)) + '</span>'
      +   '<span class="alert-card-name">' + esc(name) + '</span>'
      +   periodHint
      +   '<span class="alert-card-country">' + esc(countryLabel(country)) + '</span>'
      + '</div>'
      + metrics
      + clusterInfo
      + '</div>';
  }

  function renderDayOffset(node) {
    if (!node || !node.alert_episode_first_day || !node.alert_episode_n_days) return '';
    var n = node.alert_episode_n_days;
    var lbl = n === 1
      ? T('alertes.day_label_first', 'Jour 1')
      : T('alertes.day_label_n', 'Jour {n}').replace('{n}', n);
    var statusClass = node.alert_episode_status === 'active' ? ' is-active' : '';
    return '<span class="alert-card-status' + statusClass + '">· ' + esc(lbl) + '</span>';
  }

  function renderMetricsRow(m, country) {
    var parts = [];
    if (typeof m.peak === 'number') {
      parts.push('<span class="alert-card-metric">'
        + esc(T('alertes.card_peak_size', 'pic')) + ' <b>' + esc(fmtPeakWithTier(country, m.peak)) + '</b></span>');
    }
    if (typeof m.topShare === 'number') {
      parts.push('<span class="alert-card-metric">'
        + esc(T('alertes.card_top_share', 'dominance')) + ' <b>' + Math.round(m.topShare * 100) + '%</b></span>');
    }
    if (typeof m.score === 'number' && m.score > 0) {
      parts.push('<span class="alert-card-metric">'
        + esc(T('alertes.card_score', 'z')) + ' <b>' + m.score.toFixed(1) + '×</b></span>');
    }
    if (typeof m.mentions === 'number' && m.mentions > 0) {
      parts.push('<span class="alert-card-metric">'
        + '<b>' + m.mentions + '</b> ' + esc(T('alertes.card_mentions', 'mentions')) + '</span>');
    }
    return '<div class="alert-card-metrics">' + parts.join('') + '</div>';
  }

  function renderEmergenceRow(item) {
    var n = item.node || item.pivot || {};
    var country = item.country;
    var key = 'now-emerg-' + country + '-' + n.id;
    var size = typeof n.size === 'number' ? n.size.toFixed(1) : '—';
    var streak = n.alert_streak ? n.alert_streak : 0;
    return '<div class="emergence-row" data-key="' + esc(key) + '" data-kind="alert">'
      + '<span class="emergence-row-name">' + esc(n.id || '') + '</span>'
      + '<span class="emergence-row-metric">' + esc(T('alertes.card_peak_size', 'pic')) + ' ' + size + '</span>'
      + '<span class="emergence-row-metric">' + streak + ' blocs</span>'
      + '<span class="emergence-row-country">' + esc(countryLabel(country)) + '</span>'
      + '</div>';
  }

  // ─── Render CHRONIQUE (SVG swimlanes) ─────────────────────────
  function renderChronique() {
    var wrap = document.getElementById('chronique-svg-wrap');
    var svg  = document.getElementById('chronique-svg');
    var winEl = document.getElementById('section-chronique-window');
    if (!svg || !wrap) return;

    if (winEl) {
      winEl.textContent = T('alertes.section_chronique_window', '{days} derniers jours').replace('{days}', zoomDays);
    }

    var episodes = buildEpisodesFromTimeseries();
    var countries = filterCountry === 'all' ? ['QC','CAN','USA'].filter(function(c) {
      return getCountries().indexOf(c) !== -1;
    }) : [filterCountry];

    // Filtre par fenêtre temporelle + tier min
    var today = new Date(); today.setUTCHours(0,0,0,0);
    var windowStart = new Date(today.getTime() - zoomDays * 86400000);

    var filtered = episodes.filter(function(e) {
      if (countries.indexOf(e.country) === -1) return false;
      if (tierRank(e.tier) > tierRank(filterMinLevel)) return false;
      var last = new Date(e.last_day);
      if (last < windowStart) return false;
      return true;
    });

    // Layout
    var width = wrap.clientWidth - 28;
    if (width < 320) width = 320;
    var laneCount = countries.length;
    var labelW = 50;
    var rightPad = 12;
    var chartW = Math.max(120, width - labelW - rightPad);
    var laneH = 56;
    var laneGap = 10;
    var topPad = 22;   // pour les ticks de mois
    var bottomPad = 4;
    var height = topPad + laneCount * (laneH + laneGap) - laneGap + bottomPad;

    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('width',  width);
    svg.setAttribute('height', height);

    // Helper position
    function xForDate(dateStr) {
      var d = new Date(dateStr);
      var offset = Math.max(0, (d - windowStart) / 86400000);
      return labelW + (offset / zoomDays) * chartW;
    }
    function widthForDays(nDays) {
      return Math.max(2, (nDays / zoomDays) * chartW);
    }

    var parts = [];

    // Background lanes
    countries.forEach(function(country, idx) {
      var y = topPad + idx * (laneH + laneGap);
      parts.push('<rect class="swimlane-bg" x="' + labelW + '" y="' + y + '" width="' + chartW + '" height="' + laneH + '" rx="3" />');
      parts.push('<text class="swimlane-label" x="' + (labelW - 8) + '" y="' + (y + laneH/2 + 4) + '" text-anchor="end">' + esc(country) + '</text>');
    });

    // Month ticks
    var months = computeMonthTicks(windowStart, today);
    months.forEach(function(m) {
      var x = xForDate(m.date);
      if (x < labelW || x > labelW + chartW) return;
      parts.push('<line class="month-tick" x1="' + x + '" y1="' + topPad + '" x2="' + x + '" y2="' + height + '" />');
      parts.push('<text class="month-label" x="' + (x + 3) + '" y="' + (topPad - 6) + '">' + esc(m.label) + '</text>');
    });

    // Episodes (sorted: tsunami/eclipse last so they paint on top)
    var sorted = filtered.slice().sort(function(a, b) {
      return tierRank(b.tier) - tierRank(a.tier);
    });
    sorted.forEach(function(e) {
      var laneIdx = countries.indexOf(e.country);
      if (laneIdx === -1) return;
      var y0 = topPad + laneIdx * (laneH + laneGap);
      var pct = TIER_HEIGHT_PCT[e.tier] || 0.5;
      var blockH = Math.round(laneH * pct);
      var yBlock = y0 + (laneH - blockH);   // align à la base
      var x = xForDate(e.first_day);
      var w = widthForDays(e.n_days);
      if (x + w < labelW || x > labelW + chartW) return;
      var selectedCls = selectedEpisodeKey === e.key ? ' selected' : '';
      parts.push('<g>'
        + '<rect class="episode-block lvl-' + e.tier + selectedCls + '" '
        +   'x="' + x.toFixed(1) + '" y="' + yBlock + '" width="' + w.toFixed(1) + '" height="' + blockH + '" rx="1.5" '
        +   'fill="var(--' + e.tier + ')" '
        +   'data-key="' + esc(e.key) + '" />'
        + (w >= 16 && (e.tier === 'tsunami' || e.tier === 'eclipse')
            ? '<text class="episode-icon" x="' + (x + w/2).toFixed(1) + '" y="' + (yBlock + blockH/2 + 3) + '">' + TIER_ICON[e.tier] + '</text>'
            : '')
        + '</g>');
    });

    // Now line
    var nowX = labelW + chartW;
    parts.push('<line class="now-line" x1="' + nowX + '" y1="' + topPad + '" x2="' + nowX + '" y2="' + height + '" />');
    parts.push('<text class="now-label" x="' + (nowX - 4) + '" y="' + (topPad - 6) + '" text-anchor="end">NOW</text>');

    svg.innerHTML = parts.join('');

    // Click handlers + tooltip
    svg.querySelectorAll('.episode-block').forEach(function(rect) {
      rect.addEventListener('click', function() {
        var key = rect.getAttribute('data-key');
        openEpisodePanel(key);
      });
      rect.addEventListener('mouseenter', function(ev) {
        var key = rect.getAttribute('data-key');
        var ep = filtered.find(function(e) { return e.key === key; });
        if (!ep) return;
        showTooltip(ev, ep);
      });
      rect.addEventListener('mousemove', moveTooltip);
      rect.addEventListener('mouseleave', hideTooltip);
    });
  }

  function computeMonthTicks(start, end) {
    var ticks = [];
    var cur = new Date(start);
    cur.setUTCDate(1);
    while (cur <= end) {
      var months = lang() === 'fr' ? FR_MONTHS_SHORT : EN_MONTHS_SHORT;
      ticks.push({
        date: cur.toISOString().slice(0, 10),
        label: months[cur.getUTCMonth()]
      });
      cur.setUTCMonth(cur.getUTCMonth() + 1);
    }
    return ticks;
  }

  function showTooltip(ev, ep) {
    var tt = document.getElementById('chronique-tooltip');
    if (!tt) return;
    tt.style.display = 'block';
    tt.innerHTML = '<div class="tt-title">' + TIER_ICON[ep.tier] + ' ' + esc(tierLabel(ep.tier)) + '</div>'
      + '<div>' + esc(ep.id) + '</div>'
      + '<div class="tt-meta">' + esc(fmtDay(ep.first_day))
      + (ep.first_day !== ep.last_day ? ' → ' + esc(fmtDay(ep.last_day)) : '')
      + ' · ' + ep.n_days + ' ' + (ep.n_days > 1 ? T('alertes.days', 'jours') : T('alertes.day', 'jour'))
      + '</div>';
    moveTooltip(ev);
  }
  function moveTooltip(ev) {
    var tt = document.getElementById('chronique-tooltip');
    var wrap = document.getElementById('chronique-svg-wrap');
    if (!tt || !wrap) return;
    var rect = wrap.getBoundingClientRect();
    var x = ev.clientX - rect.left + 12;
    var y = ev.clientY - rect.top - 8;
    if (x + 250 > wrap.clientWidth) x = wrap.clientWidth - 250;
    tt.style.left = x + 'px';
    tt.style.top  = Math.max(0, y - 40) + 'px';
  }
  function hideTooltip() {
    var tt = document.getElementById('chronique-tooltip');
    if (tt) tt.style.display = 'none';
  }

  // ─── Side panel ──────────────────────────────────────────────
  function openEpisodePanel(episodeKey) {
    selectedEpisodeKey = episodeKey;
    var episodes = buildEpisodesFromTimeseries();
    var ep = episodes.find(function(e) { return e.key === episodeKey; });
    if (!ep) return;
    renderSidePanel(ep);
    renderChronique();  // re-render to update "selected" visual
  }

  function renderSidePanel(ep) {
    var panel = document.getElementById('side-panel');
    var badge = document.getElementById('panel-tier-badge');
    var country = document.getElementById('panel-country');
    var body  = document.getElementById('panel-body');
    if (!panel || !body) return;

    badge.className = 'panel-tier-badge lvl-' + ep.tier;
    badge.textContent = tierLabel(ep.tier);
    country.textContent = countryLabel(ep.country);

    var statusCls = ep.status === 'active' ? ' is-active' : '';
    var statusLbl = ep.status === 'active'
      ? T('alertes.status_active_label', 'En cours')
      : T('alertes.status_ended_label', 'Terminé');
    var dateRange = fmtDay(ep.first_day) + (ep.first_day !== ep.last_day ? ' → ' + fmtDay(ep.last_day) : '');
    var durationStr = ep.n_days + ' ' + (ep.n_days > 1 ? T('alertes.days', 'jours') : T('alertes.day', 'jour'));

    // Metrics (peak, top_share, score)
    var peakStr = typeof ep.peak === 'number' ? fmtPeakWithTier(ep.country, ep.peak) : '—';
    var tsStr = ep.max_top_share ? Math.round(ep.max_top_share * 100) + '%' : '—';
    var scoreStr = ep.max_score ? ep.max_score.toFixed(1) + '×' : '—';

    // Try to find articles + cluster info from latest period (only if episode is active)
    var clusterHTML = '', articlesHTML = '';
    if (ep.status === 'active' && graphData) {
      var periods = graphData.meta && graphData.meta.periods;
      if (periods && periods.length) {
        var latestKey = periods[periods.length - 1].key;
        var gd = graphData.graphs[ep.country] && graphData.graphs[ep.country][latestKey];
        if (gd) {
          // Find this object in latest period to get articles
          var node = (gd.nodes || []).find(function(n) { return n.id === ep.id; });

          // Find if object is in any event cluster
          var ev = (gd.events || []).find(function(e) {
            if (e.pivot && e.pivot.id === ep.id) return true;
            return (e.members || []).some(function(m) { return m.id === ep.id; });
          });

          if (ev) {
            var rows = [];
            var pivotIsThisObj = ev.pivot && ev.pivot.id === ep.id;
            // Pivot first
            rows.push('<div class="panel-member">'
              + '<span class="panel-member-name">' + esc(ev.pivot.id) + '</span>'
              + (pivotIsThisObj ? '' : '<span class="panel-member-meta">' + (ev.pivot.alert_active ? esc(tierLabel(ev.pivot.alert_level)) : 'pivot') + '</span>')
              + '<span class="panel-member-pivot">pivot</span>'
              + '</div>');
            (ev.members || []).forEach(function(m) {
              rows.push('<div class="panel-member">'
                + '<span class="panel-member-name">' + esc(m.id) + '</span>'
                + '<span class="panel-member-meta">' + esc(tierLabel(m.alert_level)) + ' · ' + Math.round((m.containment || 0) * 100) + '%</span>'
                + '</div>');
            });
            clusterHTML = '<div class="panel-section">'
              + '<div class="panel-section-title">' + esc(T('alertes.detail_cluster_members', 'Membres du cluster')) + '</div>'
              + rows.join('')
              + '</div>';
            // Shared articles
            var arts = ev.shared_articles || [];
            if (arts.length) {
              articlesHTML = '<div class="panel-section">'
                + '<div class="panel-section-title">' + esc(T('alertes.detail_articles', 'Articles partagés')) + ' (' + (ev.shared_articles_count || arts.length) + ')</div>'
                + arts.slice(0, 5).map(renderArticle).join('')
                + (arts.length > 5
                    ? '<div class="panel-article">' + esc(T('alertes.detail_more_articles', '+{n} →').replace('{n}', arts.length - 5)) + '</div>'
                    : '')
                + '</div>';
            }
          } else if (node && node.articles && node.articles.length) {
            articlesHTML = '<div class="panel-section">'
              + '<div class="panel-section-title">' + esc(T('alertes.detail_articles', 'Articles partagés')) + '</div>'
              + node.articles.slice(0, 5).map(renderArticle).join('')
              + '</div>';
          }
        }
      }
    }
    if (!articlesHTML && ep.status === 'ended') {
      articlesHTML = '<div class="panel-section">'
        + '<div class="panel-section-title">' + esc(T('alertes.detail_articles', 'Articles partagés')) + '</div>'
        + '<div style="font-size:10px;color:var(--muted);">' + esc(T('alertes.detail_no_articles', 'Pas d\'articles disponibles (épisode terminé).')) + '</div>'
        + '</div>';
    }

    // Links
    var qC = encodeURIComponent(ep.country);
    var qN = encodeURIComponent(ep.id);
    var evoUrl = './evolution.html?country=' + qC + '&node=' + qN + '&mode=tracking&gran=week';
    var cstUrl = './constellation.html?country=' + qC + '&node=' + qN;
    var statsUrl = './statistiques.html?pays=' + qC + '&objet=' + qN;

    body.innerHTML =
        '<div class="panel-title">' + esc(ep.id) + '</div>'
      + '<div class="panel-period">' + esc(dateRange) + ' · ' + esc(durationStr) + '</div>'
      + '<span class="panel-status' + statusCls + '">' + esc(statusLbl) + '</span>'
      + '<div class="panel-section">'
      +   '<div class="panel-section-title">' + esc(T('alertes.detail_metrics', 'Métriques')) + '</div>'
      +   '<div class="panel-metrics">'
      +     '<div class="panel-metric"><span class="panel-metric-val">' + esc(peakStr) + '</span><span class="panel-metric-lbl">' + esc(T('alertes.detail_peak_salience', 'Pic saillance')) + '</span></div>'
      +     '<div class="panel-metric"><span class="panel-metric-val">' + esc(tsStr) + '</span><span class="panel-metric-lbl">' + esc(T('alertes.detail_top_share_peak', 'Dominance')) + '</span></div>'
      +     '<div class="panel-metric"><span class="panel-metric-val">' + esc(scoreStr) + '</span><span class="panel-metric-lbl">' + esc(T('alertes.card_score', 'Score z')) + '</span></div>'
      +     '<div class="panel-metric"><span class="panel-metric-val">' + ep.n_days + '</span><span class="panel-metric-lbl">' + esc(T('alertes.detail_duration', 'Durée')) + '</span></div>'
      +   '</div>'
      + '</div>'
      + clusterHTML
      + articlesHTML
      + '<div class="panel-section">'
      +   '<div class="panel-section-title">' + esc(T('alertes.detail_see_in', 'Voir ailleurs')) + '</div>'
      +   '<div class="panel-links">'
      +     '<a class="panel-link-btn" href="' + esc(evoUrl) + '">' + esc(T('alertes.detail_nav_evolution', 'Évolution')) + ' →</a>'
      +     '<a class="panel-link-btn" href="' + esc(cstUrl) + '">' + esc(T('alertes.detail_nav_constellation', 'Constellation')) + ' →</a>'
      +     '<a class="panel-link-btn" href="' + esc(statsUrl) + '">' + esc(T('alertes.detail_nav_stats', 'Statistiques')) + ' →</a>'
      +   '</div>'
      + '</div>';

    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
  }

  function renderArticle(a) {
    var url = (typeof a.url === 'string' && a.url) ? a.url : '#';
    var title = (typeof a.title === 'string' && a.title) ? a.title : url;
    var media = (typeof a.media_id === 'string' && a.media_id) ? a.media_id : '';
    return '<a class="panel-article" href="' + esc(url) + '" target="_blank" rel="noopener">'
      + (media ? '<span class="panel-article-media">' + esc(media) + '</span>' : '')
      + esc(title)
      + '</a>';
  }

  function closeSidePanel() {
    var panel = document.getElementById('side-panel');
    if (!panel) return;
    panel.classList.remove('is-open');
    panel.setAttribute('aria-hidden', 'true');
    selectedEpisodeKey = null;
    renderChronique();
  }

  // ─── Table complète ──────────────────────────────────────────
  function renderEpisodesTable() {
    var wrap = document.getElementById('episodes-table-wrap');
    if (!wrap) return;
    var episodes = buildEpisodesFromTimeseries().filter(function(e) {
      if (filterCountry !== 'all' && e.country !== filterCountry) return false;
      if (tierRank(e.tier) > tierRank(filterMinLevel)) return false;
      return true;
    });
    if (!episodes.length) {
      wrap.innerHTML = '<div class="section-empty">' + esc(T('alertes.no_recent_events', 'Aucun épisode.')) + '</div>';
      return;
    }
    episodes.sort(function(a, b) {
      var r = tierRank(a.tier) - tierRank(b.tier);
      if (r !== 0) return r;
      return b.n_days - a.n_days;
    });
    var html = '<table class="episodes-table"><thead><tr>'
      + '<th>' + esc(T('alertes.table_col_subject', 'Sujet')) + '</th>'
      + '<th>' + esc(T('alertes.table_col_country', 'Pays')) + '</th>'
      + '<th>' + esc(T('alertes.table_col_start', 'Début')) + '</th>'
      + '<th>' + esc(T('alertes.table_col_end', 'Fin')) + '</th>'
      + '<th>' + esc(T('alertes.table_col_duration', 'Durée')) + '</th>'
      + '<th>' + esc(T('alertes.table_col_max_level', 'Niveau')) + '</th>'
      + '<th>' + esc(T('alertes.table_col_peak_salience', 'Pic')) + '</th>'
      + '<th>' + esc(T('alertes.table_col_top_share_max', 'Dominance max')) + '</th>'
      + '</tr></thead><tbody>';
    episodes.forEach(function(e) {
      html += '<tr data-key="' + esc(e.key) + '">'
        + '<td>' + esc(e.id) + '</td>'
        + '<td>' + esc(countryLabel(e.country)) + '</td>'
        + '<td>' + esc(fmtDay(e.first_day)) + '</td>'
        + '<td>' + esc(fmtDay(e.last_day)) + '</td>'
        + '<td>' + e.n_days + ' ' + esc(T('alertes.day', 'j').charAt(0)) + '</td>'
        + '<td><span class="ep-tier lvl-' + e.tier + '">' + esc(tierLabel(e.tier)) + '</span></td>'
        + '<td>' + esc(fmtPeakWithTier(e.country, e.peak)) + '</td>'
        + '<td>' + (e.max_top_share ? Math.round(e.max_top_share * 100) + '%' : '—') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('tr[data-key]').forEach(function(tr) {
      tr.addEventListener('click', function() {
        openEpisodePanel(tr.getAttribute('data-key'));
      });
    });
  }

  // ─── Render global ───────────────────────────────────────────
  function render() {
    if (!graphData || !timeseriesData) return;
    renderKPIs();
    renderNow();
    renderChronique();
    var ep = document.getElementById('episodes-collapsible');
    if (ep && ep.open) renderEpisodesTable();
  }

  // ─── Hooks ───────────────────────────────────────────────────
  document.getElementById('filter-country').addEventListener('change', function() {
    filterCountry = this.value;
    render();
  });
  document.getElementById('filter-min-level').addEventListener('change', function() {
    filterMinLevel = this.value;
    render();
  });
  document.querySelectorAll('.zoom-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.zoom-btn').forEach(function(b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      zoomDays = parseInt(btn.getAttribute('data-zoom'), 10);
      renderChronique();
    });
  });
  var ep = document.getElementById('episodes-collapsible');
  if (ep) {
    ep.addEventListener('toggle', function() {
      if (ep.open) renderEpisodesTable();
    });
  }
  document.getElementById('panel-close').addEventListener('click', closeSidePanel);
  document.addEventListener('keydown', function(ev) {
    if (ev.key === 'Escape') closeSidePanel();
  });
  document.addEventListener('i18n:applied', function() {
    if (graphData && timeseriesData) render();
  });

  // Re-render chronique on resize
  var resizeTO;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTO);
    resizeTO = setTimeout(function() {
      if (graphData && timeseriesData) renderChronique();
    }, 120);
  });

  loadData();
})();
</script>
</body>
</html>
