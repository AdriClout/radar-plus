<html lang="fr">
<head>

  <link rel="stylesheet" href="./assets/css/shared-ticker.css" />
  <style>
    :root {
      --bg: #020010;
      --text: #d0e0ff;
      --muted: rgba(140,170,220,0.6);
      --accent: #5588ff;
      --card-bg: rgba(10,18,50,0.7);
      --border: rgba(90,140,255,0.22);
      --orbitron: 'Orbitron', 'Space Mono', monospace;
      --mono: 'Space Mono', 'SF Mono', Consolas, monospace;

      /* Palette 3 niveaux — dérivée du pic */
      --extreme:      #ff5050;
      --extreme-d:    #8a1d1d;
      --tres-eleve:   #ffa050;
      --tres-eleve-d: #8a4818;
      --eleve:        #f2cd50;
      --eleve-d:      #7a6420;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    #wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* ── Header ────────────────────────────────────────────── */
    .page-header { margin-bottom: 22px; }
    .page-title {
      font-family: var(--orbitron);
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 700;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: #e8f0ff;
      margin-bottom: 6px;
    }
    .page-title span.accent { color: var(--accent); }
    .page-subtitle {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.8px;
      margin-bottom: 18px;
    }
    .page-methodo-link {
      font-size: 10px;
      letter-spacing: 0.8px;
      color: rgba(150,190,240,0.78);
      transition: color 0.15s;
    }
    .page-methodo-link:hover { color: rgba(220,235,255,1); }

    /* ── Barre de filtres ─────────────────────────────────── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      margin-bottom: 14px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-bar > .filter-group:nth-child(2) {
      flex-basis: 100%;
      margin-top: 4px;
    }
    .filter-label-txt {
      font-size: 9px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 4px;
    }
    .pill-btn {
      padding: 6px 12px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.6px;
      color: rgba(180,210,255,0.78);
      background: rgba(10,18,50,0.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .pill-btn:hover {
      color: rgba(230,240,255,0.95);
      border-color: rgba(120,170,255,0.45);
      background: rgba(20,32,72,0.75);
    }
    .pill-btn.is-active {
      background: rgba(85,136,255,0.20);
      border-color: var(--accent);
      color: rgba(240,245,255,1);
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
      max-width: 280px;
    }
    .search-input {
      width: 100%;
      padding: 7px 30px 7px 12px;
      background: rgba(10,18,50,0.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.3px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: rgba(140,170,220,0.55); }
    .search-input:focus { border-color: var(--accent); }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      border: none;
      background: transparent;
      color: rgba(180,210,255,0.6);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      display: none;
    }
    .search-clear:hover { color: rgba(255,200,200,0.95); }
    .search-input.has-value + .search-clear { display: block; }
    .methodo-link-wrap { margin-left: auto; }

    /* ── KPIs ───────────────────────────────────────────────── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 6px;
    }
    @media (max-width: 700px) { .kpi-row { grid-template-columns: 1fr; } }
    .kpi-hint {
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: 0.4px;
      margin: 0 0 18px;
      text-align: center;
    }
    .kpi {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      user-select: none;
    }
    .kpi:hover { background: rgba(20,32,72,0.85); border-color: rgba(120,170,255,0.55); transform: translateY(-1px); }
    .kpi.is-active { border-color: var(--accent); background: rgba(85,136,255,0.10); }
    .kpi.is-dim { opacity: 0.42; }
    .kpi-mark {
      width: 16px; height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .kpi-mark.lvl-extreme    { background: var(--extreme);    box-shadow: 0 0 10px rgba(255,80,80,0.55); }
    .kpi-mark.lvl-tres-eleve { background: var(--tres-eleve); box-shadow: 0 0 8px rgba(255,160,80,0.45); }
    .kpi-mark.lvl-eleve      { background: var(--eleve);      box-shadow: 0 0 6px rgba(242,205,80,0.35); }
    .kpi-val {
      font-family: var(--orbitron);
      font-size: 24px;
      font-weight: 700;
      color: #e8f0ff;
      line-height: 1;
    }
    .kpi-lbl {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 10px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: rgba(180,210,255,0.85);
    }
    .kpi-lbl-sub {
      font-size: 8.5px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: none;
    }

    /* ── Section ─────────────────────────────────────────── */
    .section { margin-bottom: 24px; }
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-family: var(--orbitron);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #e8f0ff;
    }
    .section-sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.6px;
    }
    .section-empty {
      padding: 26px 18px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 6px;
    }

    /* ── Period nav ──────────────────────────────────────── */
    .period-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 10px;
    }
    .period-nav.is-hidden { display: none; }
    .period-nav-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: rgba(180,210,255,0.85);
      border-radius: 6px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .period-nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: #fff;
      background: rgba(20,32,72,0.85);
    }
    .period-nav-btn:disabled { opacity: 0.3; cursor: default; }
    .period-nav-label {
      font-family: var(--orbitron);
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #e8f0ff;
      min-width: 220px;
      text-align: center;
    }

    /* ── Heatmap ──────────────────────────────────────────── */
    .heatmap-wrap {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      overflow-x: auto;
    }
    .heatmap-cell {
      stroke: rgba(8,14,38,0.4);
      stroke-width: 0.4;
      cursor: pointer;
      transition: stroke 0.12s, stroke-width 0.12s;
    }
    .heatmap-cell:hover {
      stroke: rgba(255,255,255,0.92);
      stroke-width: 1.4;
    }
    .heatmap-cell.is-selected {
      stroke: #fff;
      stroke-width: 1.8;
    }
    .heatmap-row-label {
      font-family: var(--orbitron);
      font-size: 10.5px;
      fill: rgba(210,225,250,0.88);
      letter-spacing: 0.4px;
      cursor: pointer;
    }
    .heatmap-row-label:hover { fill: #fff; }
    .heatmap-row-label.is-member {
      fill: rgba(184,206,244,0.8);
      font-size: 9.5px;
    }
    .heatmap-event-label {
      font-family: var(--orbitron);
      font-size: 10.5px;
      font-weight: 700;
      fill: rgba(236,242,255,0.98);
      letter-spacing: 0.35px;
    }
    .heatmap-event-meta {
      fill: rgba(140,170,220,0.72);
      font-size: 9px;
    }
    .heatmap-event-line {
      stroke: rgba(120,170,255,0.28);
      stroke-width: 1;
    }
    .heatmap-solo-label {
      font-family: var(--orbitron);
      font-size: 10.5px;
      font-weight: 700;
      fill: rgba(236,242,255,0.98);
      letter-spacing: 0.35px;
      cursor: pointer;
    }
    .heatmap-solo-label:hover { fill: #fff; }
    .heatmap-solo-line {
      stroke: rgba(120,170,255,0.22);
      stroke-width: 1;
    }
    .month-tick { stroke: rgba(90,140,255,0.18); stroke-width: 1; stroke-dasharray: 2,3; }
    .month-label {
      font-family: var(--mono);
      font-size: 9px;
      fill: var(--muted);
      letter-spacing: 0.4px;
    }
    .day-label {
      font-family: var(--mono);
      font-size: 9px;
      fill: rgba(160,190,235,0.7);
      letter-spacing: 0.3px;
    }
    .now-line {
      stroke: rgba(120,255,160,0.7);
      stroke-width: 1.5;
      stroke-dasharray: 3,3;
    }
    .now-label {
      font-family: var(--mono);
      font-size: 8px;
      fill: rgba(140,255,180,0.9);
      letter-spacing: 0.6px;
    }

    /* ── Tooltip ──────────────────────────────────────────── */
    .ttip {
      position: absolute;
      pointer-events: none;
      background: rgba(8,14,38,0.96);
      border: 1px solid rgba(90,140,255,0.4);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 10px;
      color: rgba(220,235,255,0.95);
      letter-spacing: 0.3px;
      max-width: 280px;
      display: none;
      z-index: 100;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }
    .ttip .tt-title {
      font-family: var(--orbitron);
      font-size: 10px;
      font-weight: 600;
      color: #e8f0ff;
      margin-bottom: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .ttip .tt-meta { color: var(--muted); font-size: 9px; }

    /* ── Side panel ──────────────────────────────────────── */
    #panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,10,0.55);
      z-index: 190;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #panel-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    #side-panel {
      position: fixed;
      top: 0; right: 0;
      width: 420px;
      max-width: 100vw;
      height: 100vh;
      background: rgba(6,12,32,0.98);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 200;
      overflow-y: auto;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    #side-panel.is-open { transform: translateX(0); }
    .panel-head {
      position: sticky; top: 0;
      background: rgba(6,12,32,0.98);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-tier-badge {
      font-family: var(--orbitron);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      border-radius: 3px;
    }
    .panel-tier-badge.lvl-extreme    { background: rgba(138,29,29,0.6);  color: rgba(255,210,210,1); }
    .panel-tier-badge.lvl-tres-eleve { background: rgba(138,72,24,0.55); color: rgba(255,210,170,1); }
    .panel-tier-badge.lvl-eleve      { background: rgba(122,100,32,0.50); color: rgba(250,230,150,0.98); }
    .panel-country {
      font-size: 10px;
      color: rgba(180,210,255,0.8);
      letter-spacing: 0.8px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .panel-close {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: rgba(200,225,255,0.7);
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 0.15s;
    }
    .panel-close:hover { color: #fff; border-color: rgba(200,225,255,0.7); background: rgba(200,225,255,0.08); }
    .panel-body { padding: 16px 20px 32px; }
    .panel-title {
      font-family: var(--orbitron);
      font-size: 17px;
      font-weight: 700;
      color: #e8f0ff;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .panel-period {
      font-size: 10.5px;
      color: rgba(200,225,255,0.78);
      margin-bottom: 4px;
    }
    .panel-section { margin-top: 22px; }
    .panel-section-title {
      font-size: 9px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(180,210,255,0.65);
      margin-bottom: 8px;
    }
    .panel-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      font-size: 11px;
    }
    .panel-metric { display: flex; flex-direction: column; gap: 2px; }
    .panel-metric-val {
      font-family: var(--orbitron);
      font-size: 14px;
      color: #e8f0ff;
      font-weight: 600;
    }
    .panel-metric-lbl {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }
    .panel-member {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: rgba(10,18,50,0.5);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 10.5px;
    }
    .panel-member-name {
      font-family: var(--orbitron);
      font-size: 10.5px;
      letter-spacing: 0.4px;
      color: rgba(230,240,255,0.92);
      flex: 1;
      min-width: 0;
    }
    .panel-member-meta { font-size: 9px; color: var(--muted); }
    .panel-article {
      display: block;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: rgba(10,18,50,0.5);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .panel-article:hover { border-color: var(--accent); background: rgba(20,32,72,0.85); }
    .panel-article-media {
      display: inline-block;
      font-family: var(--orbitron);
      font-size: 9px;
      letter-spacing: 0.8px;
      color: rgba(110,176,255,0.95);
      margin-right: 8px;
      text-transform: uppercase;
    }
    .panel-article-title {
      font-size: 11.5px;
      line-height: 1.4;
      color: rgba(230,240,255,0.92);
    }
    .panel-empty {
      padding: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 4px;
    }
    .panel-tier-mini {
      font-size: 8px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
      font-family: var(--orbitron);
      font-weight: 600;
    }
    .panel-tier-mini.lvl-extreme    { color: rgba(255,210,210,1);   background: rgba(138,29,29,0.55); border: 1px solid rgba(255,90,90,0.6); }
    .panel-tier-mini.lvl-tres-eleve { color: rgba(255,210,170,1);   background: rgba(138,72,24,0.55); border: 1px solid rgba(255,160,80,0.6); }
    .panel-tier-mini.lvl-eleve      { color: rgba(250,230,150,0.98); background: rgba(122,100,32,0.50); border: 1px solid rgba(242,205,80,0.6); }
    .panel-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .panel-link-btn {
      padding: 8px 12px;
      background: rgba(85,136,255,0.10);
      border: 1px solid rgba(85,136,255,0.35);
      border-radius: 3px;
      font-size: 10px;
      letter-spacing: 0.6px;
      color: rgba(200,225,255,0.9);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .panel-link-btn:hover {
      background: rgba(85,136,255,0.22);
      border-color: rgba(85,136,255,0.6);
      color: #fff;
    }

    /* ── Légende ─────────────────────────────────────────── */
    .legend-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.6px;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-block {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
    }
    .legend-block.lvl-extreme    { background: var(--extreme); }
    .legend-block.lvl-tres-eleve { background: var(--tres-eleve); }
    .legend-block.lvl-eleve      { background: var(--eleve); }

    /* ── Ticker restore badge ────────────────────────────── */
    .ticker-restore {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: rgba(200,225,255,0.85);
      background: rgba(85,136,255,0.18);
      border: 1px solid rgba(85,136,255,0.4);
      border-radius: 999px;
      cursor: pointer;
      margin-left: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .ticker-restore.is-visible { display: inline-flex; }
    .ticker-restore:hover { background: rgba(85,136,255,0.32); border-color: rgba(120,170,255,0.7); }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 900px) {
      #side-panel { width: 100vw; }
    }
  </style>
</head>
<body>

<div id="wrap">
  <header class="page-header">
    <h1 class="page-title">
      <span data-i18n="alertes.title">Alertes</span>

<script>
(function() {
  'use strict';

  // ─── Constantes ────────────────────────────────────────────────
  const TIERS = ['extreme', 'tres_eleve', 'eleve'];
  const TIER_RANK = { extreme: 0, tres_eleve: 1, eleve: 2, none: 99 };
  const TIER_CSS = { extreme: 'extreme', tres_eleve: 'tres-eleve', eleve: 'eleve' };
  const COUNTRY_ORDER = ['QC', 'CAN', 'USA'];
  const FR_MONTHS_SHORT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const EN_MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ─── État ──────────────────────────────────────────────────────
  let graphData = null;
  let timeseriesData = null;
  let articlesData = null;
  let articlesLoadPromise = null;
  let filterCountry = 'QC';
  let granularity = 'total';
  let periodOffset = 0;
  const DATA_DAYS = 130;
  let searchQuery = '';
  let kpiTiersHidden = new Set();
  let selectedCell = null;  // { country, id, date }

  // ─── Helpers ───────────────────────────────────────────────────
  function T(key, fallback) {
    var v = window.t ? window.t(key) : null;
    if (typeof v === 'string' && v !== key) return v;
    return fallback !== undefined ? fallback : key;
  }
  function lang() {
    return (window.__i18n && window.__i18n.currentLang) ? window.__i18n.currentLang() : 'fr';
  }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>'"]/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function tierRank(t) { return TIER_RANK[t] != null ? TIER_RANK[t] : 99; }
  function tierLabel(t) { return T('alertes.level_' + t, t); }
  function tierCss(t) { return TIER_CSS[t] || t; }
  function tierVar(t) { return 'var(--' + tierCss(t) + ')'; }
  function countryLabel(c) { return T('country.' + c, c); }
  function fmtDay(d) {
    if (!d) return '';
    var p = String(d).split('-');
    if (p.length !== 3) return d;
    var dd = parseInt(p[2], 10);
    var mm = parseInt(p[1], 10) - 1;
    var months = lang() === 'fr' ? FR_MONTHS_SHORT : EN_MONTHS_SHORT;
    return dd + ' ' + months[mm];
  }
  function getCountries() {
    var src = graphData || timeseriesData;
    if (!src || !src.graphs) return [];
    var out = [];
    COUNTRY_ORDER.forEach(function(c) { if (src.graphs[c]) out.push(c); });
    Object.keys(src.graphs).forEach(function(c) { if (out.indexOf(c) === -1) out.push(c); });
    return out;
  }

  // Dérive le niveau à partir du pic + des seuils du pays (canonique).
  function deriveLevel(country, size) {
    if (typeof size !== 'number' || !isFinite(size)) return 'none';
    var tiers = graphData && graphData.meta && graphData.meta.salience_tiers
      ? graphData.meta.salience_tiers[country] : null;
    if (!tiers) return 'none';
    if (typeof tiers.extreme === 'number' && size >= tiers.extreme) return 'extreme';
    if (typeof tiers.very_high === 'number' && size >= tiers.very_high) return 'tres_eleve';
    if (typeof tiers.high === 'number' && size >= tiers.high) return 'eleve';
    return 'none';
  }

  function fmtPeakWithTier(country, size) {
    if (typeof size !== 'number') return '—';
    var tiers = graphData && graphData.meta && graphData.meta.salience_tiers
      ? graphData.meta.salience_tiers[country] : null;
    var lbl = size.toFixed(1);
    if (!tiers) return lbl;
    var lvl = deriveLevel(country, size);
    if (lvl !== 'none') {
      var thrKey = lvl === 'extreme' ? 'extreme' : lvl === 'tres_eleve' ? 'very_high' : 'high';
      var thr = tiers[thrKey];
      if (typeof thr === 'number' && thr > 0) {
        var short = lvl === 'extreme' ? 'ext' : lvl === 'tres_eleve' ? 'vhi' : 'hi';
        lbl += ' (' + short + ' ×' + (size / thr).toFixed(1) + ')';
      }
    }
    return lbl;
  }

  // ─── Chargement ────────────────────────────────────────────────
  async function loadData() {
    try {
      var [g, t] = await Promise.all([
        fetch('./graph.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null),
        fetch('./timeseries.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null)
      ]);
      graphData = g;
      timeseriesData = t;
      render();
    } catch (e) {
      console.error('Erreur chargement:', e);
      var hw = document.getElementById('heatmap-wrap');
      if (hw) hw.innerHTML = '<div class="section-empty">Erreur de chargement.</div>';
    }
  }

  function loadArticles() {
    if (articlesData) return Promise.resolve(articlesData);
    if (articlesLoadPromise) return articlesLoadPromise;
    articlesLoadPromise = fetch('./articles.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(j => { articlesData = j; return j; })
      .catch(e => { console.error('Erreur articles.json:', e); return null; });
    return articlesLoadPromise;
  }

  // ─── Calcul de la période courante ─────────────────────────────
  function getPeriodRange() {
    var today = new Date(); today.setUTCHours(0,0,0,0);
    var dataMin = new Date(today.getTime() - (DATA_DAYS - 1) * 86400000);
    var start, end;
    if (granularity === 'day') {
      end = new Date(today.getTime() + periodOffset * 86400000);
      start = new Date(end);
    } else if (granularity === 'week') {
      end = new Date(today.getTime() + periodOffset * 7 * 86400000);
      start = new Date(end.getTime() - 6 * 86400000);
    } else if (granularity === 'month') {
      var anchor = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth() + periodOffset, 1));
      start = anchor;
      end = new Date(Date.UTC(anchor.getUTCFullYear(), anchor.getUTCMonth() + 1, 0));
    } else { // total
      start = dataMin;
      end = today;
    }
    var days = Math.round((end - start) / 86400000) + 1;
    var canNext = periodOffset < 0;
    var canPrev = granularity !== 'total' && start > dataMin;
    return { start: start, end: end, days: days, canPrev: canPrev, canNext: canNext, dataMin: dataMin, today: today };
  }

  function formatPeriodLabel(range) {
    var months = lang() === 'fr' ? FR_MONTHS_SHORT : EN_MONTHS_SHORT;
    if (granularity === 'day') {
      var d = range.start;
      return d.getUTCDate() + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    }
    if (granularity === 'week') {
      var s = range.start, e = range.end;
      if (s.getUTCMonth() === e.getUTCMonth()) {
        return s.getUTCDate() + '–' + e.getUTCDate() + ' ' + months[s.getUTCMonth()] + ' ' + s.getUTCFullYear();
      }
      return s.getUTCDate() + ' ' + months[s.getUTCMonth()] + ' – ' + e.getUTCDate() + ' ' + months[e.getUTCMonth()] + ' ' + e.getUTCFullYear();
    }
    if (granularity === 'month') {
      return months[range.start.getUTCMonth()] + ' ' + range.start.getUTCFullYear();
    }
    return T('period.total', 'Total');
  }

  // ─── Construction des épisodes (pour KPI compte) ──────────────
  function buildEpisodesFromTimeseries() {
    var out = [];
    if (!timeseriesData || !timeseriesData.graphs) return out;
    var range = getPeriodRange();
    var windowStart = range.start;
    var windowEnd = range.end;
    var byEp = {};
    Object.keys(timeseriesData.graphs).forEach(function(country) {
      if (filterCountry !== 'all' && country !== filterCountry) return;
      var periods = timeseriesData.graphs[country];
      Object.keys(periods).forEach(function(pk) {
        var gd = periods[pk];
        if (!gd || !gd.nodes) return;
        gd.nodes.forEach(function(n) {
          if (!n.alert_episode_id) return;
          var peak = typeof n.alert_episode_peak === 'number' ? n.alert_episode_peak : null;
          if (peak == null) return;
          var derived = deriveLevel(country, peak);
          if (derived === 'none') return;
          // Filtre période : on garde l'épisode si sa plage chevauche la fenêtre
          var epEnd = n.alert_episode_last_day ? new Date(n.alert_episode_last_day) : null;
          var epStart = n.alert_episode_first_day ? new Date(n.alert_episode_first_day) : null;
          if (epEnd && epEnd < windowStart) return;
          if (epStart && epStart > windowEnd) return;
          var key = n.alert_episode_id;
          if (byEp[key]) return;
          byEp[key] = {
            key: key, country: country, id: n.id, tier: derived,
            first_day: n.alert_episode_first_day,
            last_day: n.alert_episode_last_day,
            peak: peak
          };
        });
      });
    });
    Object.keys(byEp).forEach(function(k) { out.push(byEp[k]); });
    return out;
  }

  // ─── Render KPIs ──────────────────────────────────────────────
  function renderKPIs() {
    var el = document.getElementById('kpi-row');
    if (!el) return;
    var eps = buildEpisodesFromTimeseries();
    var counts = { extreme: 0, tres_eleve: 0, eleve: 0 };
    eps.forEach(function(e) { counts[e.tier] = (counts[e.tier] || 0) + 1; });
    var subLbl = formatPeriodLabel(getPeriodRange());
    var html = '';
    TIERS.forEach(function(tier) {
      var hidden = kpiTiersHidden.has(tier);
      var cls = 'kpi' + (hidden ? ' is-dim' : ' is-active');
      html += '<div class="' + cls + '" data-tier="' + tier + '" role="button" tabindex="0" aria-pressed="' + (!hidden) + '">'
        + '<span class="kpi-mark lvl-' + tierCss(tier) + '"></span>'
        + '<span class="kpi-val">' + (counts[tier] || 0) + '</span>'
        + '<span class="kpi-lbl">' + esc(tierLabel(tier))
        +   '<span class="kpi-lbl-sub">' + esc(T('alertes.kpi_episodes_lbl', 'épisodes')) + ' · ' + subLbl + '</span>'
        + '</span></div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('.kpi').forEach(function(node) {
      var tier = node.getAttribute('data-tier');
      node.addEventListener('click', function() { toggleKpiFilter(tier); });
      node.addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggleKpiFilter(tier); }
      });
    });
  }

  function toggleKpiFilter(tier) {
    if (kpiTiersHidden.has(tier)) kpiTiersHidden.delete(tier);
    else kpiTiersHidden.add(tier);
    render();
  }

  // ─── Outils SVG partagés ──────────────────────────────────────
  function computeMonthTicks(start, end) {
    var ticks = [];
    var cur = new Date(start);
    cur.setUTCDate(1);
    while (cur <= end) {
      var months = lang() === 'fr' ? FR_MONTHS_SHORT : EN_MONTHS_SHORT;
      ticks.push({ date: cur.toISOString().slice(0, 10), label: months[cur.getUTCMonth()] });
      cur.setUTCMonth(cur.getUTCMonth() + 1);
    }
    return ticks;
  }

  function moveTooltip(ev, wrap, ttip) {
    if (!ttip || !wrap) return;
    var rect = wrap.getBoundingClientRect();
    var x = ev.clientX - rect.left + 12;
    var y = ev.clientY - rect.top - 8;
    if (x + 280 > wrap.clientWidth) x = wrap.clientWidth - 280;
    ttip.style.left = x + 'px';
    ttip.style.top  = Math.max(0, y - 40) + 'px';
  }

  function truncate(s, n) {
    if (!s) return '';
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }

  function compareHeatmapRows(a, b) {
    var d = b.lastDate.localeCompare(a.lastDate);
    if (d !== 0) return d;
    var r = a.topRank - b.topRank;
    if (r !== 0) return r;
    return b.maxPeak - a.maxPeak;
  }

  function compareHeatmapEntries(a, b) {
    var d = b.lastDate.localeCompare(a.lastDate);
    if (d !== 0) return d;
    var r = a.topRank - b.topRank;
    if (r !== 0) return r;
    return (b.maxPeak || 0) - (a.maxPeak || 0);
  }

  function buildHeatmapObjectRows(range) {
    var byObj = {};
    var contextByCluster = {};
    if (!timeseriesData || !timeseriesData.graphs) return { rows: [], contextByCluster: contextByCluster };

    Object.keys(timeseriesData.graphs).forEach(function(country) {
      if (filterCountry !== 'all' && country !== filterCountry) return;
      var periods = timeseriesData.graphs[country];
      Object.keys(periods).forEach(function(pk) {
        var gd = periods[pk];
        if (!gd || !gd.nodes) return;
        var date = pk.split('_')[0];
        var dd = new Date(date);
        if (dd < range.start || dd > range.end) return;
        gd.nodes.forEach(function(n) {
          if (searchQuery && n.id.toLowerCase().indexOf(searchQuery) === -1) return;
          // Membres contextuels : alert_cluster_id défini mais aucun tier
          // (objet sous-seuil absorbé par le pivot). On les collecte par
          // cluster pour les afficher en métadonnées sous l'événement.
          if (n.alert_cluster_context === true && n.alert_cluster_id) {
            var ckey = n.alert_cluster_id;
            if (!contextByCluster[ckey]) contextByCluster[ckey] = {};
            if (!contextByCluster[ckey][n.id]) contextByCluster[ckey][n.id] = true;
          }
          var size = typeof n.size === 'number' ? n.size : 0;
          var lvl = deriveLevel(country, size);
          if (lvl === 'none' || kpiTiersHidden.has(lvl)) return;
          var key = country + '|' + n.id;
          if (!byObj[key]) {
            byObj[key] = {
              country: country,
              id: n.id,
              days: {},
              lastDate: '',
              topRank: 99,
              topTier: 'none',
              maxPeak: 0,
              clusterStats: {}
            };
          }
          var prev = byObj[key].days[date];
          if (!prev || tierRank(lvl) < tierRank(prev.tier) || (tierRank(lvl) === tierRank(prev.tier) && size > prev.size)) {
            byObj[key].days[date] = { tier: lvl, size: size };
          }
          if (date > byObj[key].lastDate) byObj[key].lastDate = date;
          if (tierRank(lvl) < byObj[key].topRank) {
            byObj[key].topRank = tierRank(lvl);
            byObj[key].topTier = lvl;
          }
          if (size > byObj[key].maxPeak) byObj[key].maxPeak = size;

          if (n.alert_cluster_id) {
            if (!byObj[key].clusterStats[n.alert_cluster_id]) {
              byObj[key].clusterStats[n.alert_cluster_id] = {
                clusterId: n.alert_cluster_id,
                lastDate: date,
                count: 0,
                isPivot: false,
                clusterSize: 0,
                topRank: 99
              };
            }
            var cs = byObj[key].clusterStats[n.alert_cluster_id];
            cs.count += 1;
            if (date > cs.lastDate) cs.lastDate = date;
            if (n.alert_cluster_pivot) cs.isPivot = true;
            if (typeof n.alert_cluster_size === 'number' && n.alert_cluster_size > cs.clusterSize) cs.clusterSize = n.alert_cluster_size;
            if (tierRank(lvl) < cs.topRank) cs.topRank = tierRank(lvl);
          }
        });
      });
    });

    return {
      rows: Object.keys(byObj).map(function(key) { return byObj[key]; }),
      contextByCluster: contextByCluster
    };
  }

  function buildHeatmapClusterGrouping(rowByKey) {
    var assignments = {};
    var groupsById = {};

    Object.keys(rowByKey).forEach(function(objectKey) {
      var row = rowByKey[objectKey];
      var statsList = Object.keys(row.clusterStats || {}).map(function(clusterId) {
        return row.clusterStats[clusterId];
      });
      if (!statsList.length) return;

      statsList.sort(function(a, b) {
        var d = b.lastDate.localeCompare(a.lastDate);
        if (d !== 0) return d;
        if (a.topRank !== b.topRank) return a.topRank - b.topRank;
        return b.count - a.count;
      });

      var best = statsList[0];
      assignments[objectKey] = {
        clusterId: best.clusterId,
        lastDate: best.lastDate,
        topRank: best.topRank
      };

      if (!groupsById[best.clusterId]) {
        groupsById[best.clusterId] = {
          clusterId: best.clusterId,
          country: row.country,
          lastDate: best.lastDate,
          topRank: best.topRank,
          objectKeys: [],
          pivotKey: null,
          declaredSize: best.clusterSize || 0
        };
      }
      var group = groupsById[best.clusterId];
      group.objectKeys.push(objectKey);
      if (best.lastDate > group.lastDate) group.lastDate = best.lastDate;
      if (best.topRank < group.topRank) group.topRank = best.topRank;
      if ((best.clusterSize || 0) > group.declaredSize) group.declaredSize = best.clusterSize || 0;
      if (best.isPivot) group.pivotKey = objectKey;
    });

    var groups = Object.keys(groupsById).map(function(clusterId) {
      return groupsById[clusterId];
    }).filter(function(group) {
      return group.objectKeys.length > 0;
    });

    groups.sort(function(a, b) {
      var d = b.lastDate.localeCompare(a.lastDate);
      if (d !== 0) return d;
      return a.topRank - b.topRank;
    });

    return { groups: groups, assignments: assignments };
  }

  function buildHeatmapRows(range) {
    var built = buildHeatmapObjectRows(range);
    var objectRows = built.rows;
    var contextByCluster = built.contextByCluster || {};
    objectRows.sort(compareHeatmapRows);
    var MAX_ROWS = 80;
    if (objectRows.length > MAX_ROWS) objectRows = objectRows.slice(0, MAX_ROWS);

    var rowByKey = {};
    objectRows.forEach(function(row) {
      rowByKey[row.country + '|' + row.id] = row;
    });

    var grouping = buildHeatmapClusterGrouping(rowByKey);
    var groupedClusters = {};
    var entries = [];

    grouping.groups.forEach(function(group) {
      var members = group.objectKeys
        .map(function(objectKey) { return rowByKey[objectKey]; })
        .filter(Boolean)
        .sort(compareHeatmapRows);
      if (members.length < 2) return;

      groupedClusters[group.clusterId] = true;
      var pivotRow = group.pivotKey && rowByKey[group.pivotKey] ? rowByKey[group.pivotKey] : members[0];
      var ctxIds = contextByCluster[group.clusterId]
        ? Object.keys(contextByCluster[group.clusterId])
        : [];
      entries.push({
        kind: 'event',
        eventId: group.clusterId,
        country: group.country,
        id: pivotRow ? pivotRow.id : members[0].id,
        label: pivotRow ? pivotRow.id : members[0].id,
        lastDate: group.lastDate,
        topRank: group.topRank,
        topTier: pivotRow ? pivotRow.topTier : members[0].topTier,
        objectCount: members.length,
        maxPeak: members.reduce(function(acc, member) {
          return Math.max(acc, member.maxPeak || 0);
        }, 0),
        members: members,
        contextIds: ctxIds
      });
    });

    // Debug clustering stats
    var soloCount = 0;
    var noClusterCount = 0;
    var groupedCount = 0;
    var groupedMembers = 0;

    objectRows.forEach(function(row) {
      var assignment = grouping.assignments[row.country + '|' + row.id];
      if (assignment && groupedClusters[assignment.clusterId]) {
        groupedMembers++;
        return;
      }
      if (!assignment || Object.keys(row.clusterStats || {}).length === 0) {
        noClusterCount++;
      } else {
        soloCount++;
      }
      // Solo cluster_id pour récupérer le contexte (un événement « solo »
      // peut quand même avoir des objets contextuels absorbés autour du
      // pivot — ex: iran solo + nabatiyé).
      var soloCid = assignment ? assignment.clusterId : null;
      var soloCtx = soloCid && contextByCluster[soloCid]
        ? Object.keys(contextByCluster[soloCid])
        : [];
      entries.push({
        kind: 'object',
        country: row.country,
        id: row.id,
        lastDate: row.lastDate,
        topRank: row.topRank,
        maxPeak: row.maxPeak,
        row: row,
        contextIds: soloCtx
      });
    });

    groupedCount = Object.keys(groupedClusters).length;
    console.log('CLUSTERING STATS [' + (granularity || 'all') + ']:', {
      totalObjects: objectRows.length,
      grouped: {count: groupedCount, members: groupedMembers},
      solo: soloCount,
      noCluster: noClusterCount,
      entriesCount: entries.length
    });

    entries.sort(compareHeatmapEntries);

    var rows = [];
    entries.forEach(function(entry) {
      if (entry.kind === 'event') {
        rows.push(entry);
        entry.members.forEach(function(member) {
          member.kind = 'object';
          member.isMember = true;
          member.parentEventId = entry.eventId;
          rows.push(member);
        });
        return;
      }

      entry.row.kind = 'object';
      entry.row.isMember = false;
      entry.row.isSolo = true;
      entry.row.parentEventId = null;
      entry.row.contextIds = entry.contextIds || [];
      rows.push(entry.row);
    });

    return rows;
  }

  // ─── Render Heatmap ──────────────────────────────────────────
  function renderHeatmap() {
    var svg = document.getElementById('heatmap-svg');
    var wrap = document.getElementById('heatmap-wrap');
    if (!svg || !wrap) return;

    var range = getPeriodRange();
    var today = range.today;
    var windowStart = range.start;
    var windowEnd = range.end;

    var rows = buildHeatmapRows(range);

    if (!rows.length) {
      svg.innerHTML = '';
      wrap.querySelectorAll('.no-data-msg').forEach(function(n) { n.remove(); });
      var msg = document.createElement('div');
      msg.className = 'section-empty no-data-msg';
      msg.style.marginTop = '8px';
      msg.textContent = searchQuery
        ? T('alertes.no_heatmap_search', 'Aucun objet ne correspond à la recherche.')
        : T('alertes.no_heatmap', 'Aucune donnée pour les filtres.');
      wrap.appendChild(msg);
      return;
    } else {
      wrap.querySelectorAll('.no-data-msg').forEach(function(n) { n.remove(); });
    }

    var DAYS = range.days;
    var labelW = 228;
    var topPad = 22;
    var bottomPad = 22;
    var rowH = 18;
    var width = wrap.clientWidth - 28;
    if (width < 480) width = 480;
    var rightPad = 10;
    var gridW = Math.max(260, width - labelW - rightPad);
    var cellW = gridW / DAYS;
    var height = topPad + rows.length * rowH + bottomPad;

    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('width',  width);
    svg.setAttribute('height', height);

    var parts = [];

    rows.forEach(function(r, idx) {
      var y = topPad + idx * rowH;
      if (r.kind === 'event') {
        parts.push('<line class="heatmap-event-line" x1="8" y1="' + (y + rowH - 2) + '" x2="' + (width - rightPad) + '" y2="' + (y + rowH - 2) + '" />');
        parts.push('<text class="heatmap-event-label" x="8" y="' + (y + rowH/2 + 4) + '">' + esc(truncate(r.label, 22))
          + ' <tspan class="heatmap-event-meta">' + esc(r.country) + ' · ' + esc(String(r.objectCount)) + ' ' + esc(T('alertes.event_objects_count', 'objets')) + '</tspan></text>');
        return;
      }

      if (r.isSolo) {
        parts.push('<line class="heatmap-solo-line" x1="8" y1="' + (y + rowH - 2) + '" x2="' + (width - rightPad) + '" y2="' + (y + rowH - 2) + '" />');
        parts.push('<text class="heatmap-solo-label" x="8" y="' + (y + rowH/2 + 4) + '" data-country="' + esc(r.country) + '" data-id="' + esc(r.id) + '">'
          + esc(truncate(r.id, 22)) + ' <tspan fill="rgba(140,170,220,0.7)" font-size="9">' + esc(r.country) + '</tspan></text>');
      } else {
        var labelCls = 'heatmap-row-label' + (r.isMember ? ' is-member' : '');
        var labelX = r.isMember ? 28 : 8;
        parts.push('<text class="' + labelCls + '" x="' + labelX + '" y="' + (y + rowH/2 + 4) + '" data-country="' + esc(r.country) + '" data-id="' + esc(r.id) + '">'
          + esc(truncate(r.id, r.isMember ? 22 : 22))
          + (r.isMember ? '' : ' <tspan fill="rgba(140,170,220,0.55)" font-size="9">' + esc(r.country) + '</tspan>')
          + '</text>');
      }
      for (var i = 0; i < DAYS; i++) {
        var date = new Date(windowStart.getTime() + i * 86400000);
        var dateStr = date.toISOString().slice(0, 10);
        var info = r.days[dateStr];
        if (!info) continue;
        var x = labelW + i * cellW;
        var sel = (selectedCell && selectedCell.country === r.country && selectedCell.id === r.id && selectedCell.date === dateStr);
        parts.push('<rect class="heatmap-cell' + (sel ? ' is-selected' : '') + '" x="' + x.toFixed(1) + '" y="' + (y + 1) + '" width="' + cellW.toFixed(2) + '" height="' + (rowH - 2) + '" fill="' + tierVar(info.tier) + '" '
          + 'data-country="' + esc(r.country) + '" data-id="' + esc(r.id) + '" data-date="' + esc(dateStr) + '" data-tier="' + esc(info.tier) + '" data-size="' + info.size.toFixed(1) + '" />');
      }
    });

    // Month ticks
    var months = computeMonthTicks(windowStart, windowEnd);
    months.forEach(function(m) {
      var d = new Date(m.date);
      var dayIdx = Math.round((d - windowStart) / 86400000);
      if (dayIdx < 0 || dayIdx > DAYS) return;
      var x = labelW + dayIdx * cellW;
      parts.push('<line class="month-tick" x1="' + x.toFixed(1) + '" y1="' + topPad + '" x2="' + x.toFixed(1) + '" y2="' + (height - bottomPad) + '" />');
      parts.push('<text class="month-label" x="' + (x + 3).toFixed(1) + '" y="' + (topPad - 6) + '">' + esc(m.label) + '</text>');
    });

    // Day labels along x-axis (bottom)
    var monthsShort = lang() === 'fr' ? FR_MONTHS_SHORT : EN_MONTHS_SHORT;
    var labelStep = Math.max(1, Math.ceil(48 / cellW));
    var labelY = height - bottomPad + 14;
    for (var di = 0; di < DAYS; di += labelStep) {
      var dDate = new Date(windowStart.getTime() + di * 86400000);
      var dLbl = String(dDate.getUTCDate()).padStart(2, '0') + ' ' + monthsShort[dDate.getUTCMonth()];
      var dX = labelW + (di + 0.5) * cellW;
      parts.push('<text class="day-label" x="' + dX.toFixed(1) + '" y="' + labelY + '" text-anchor="middle">' + esc(dLbl) + '</text>');
    }

    // Now line — vertical marker at today's column (only when today falls in window)
    if (today >= windowStart && today <= windowEnd) {
      var todayIdx = Math.round((today - windowStart) / 86400000);
      var nowX = labelW + (todayIdx + 1) * cellW;
      parts.push('<line class="now-line" x1="' + nowX.toFixed(1) + '" y1="' + topPad + '" x2="' + nowX.toFixed(1) + '" y2="' + (height - bottomPad) + '" />');
      parts.push('<text class="now-label" x="' + (nowX - 3).toFixed(1) + '" y="' + (topPad - 6) + '" text-anchor="end">' + esc(T('common.now', 'Maintenant')) + '</text>');
    }

    svg.innerHTML = parts.join('');

    var ttip = document.getElementById('ttip-heatmap');
    svg.querySelectorAll('.heatmap-cell').forEach(function(cell) {
      cell.addEventListener('click', function() {
        var country = cell.getAttribute('data-country');
        var id = cell.getAttribute('data-id');
        var date = cell.getAttribute('data-date');
        var tier = cell.getAttribute('data-tier');
        var size = parseFloat(cell.getAttribute('data-size')) || 0;
        selectedCell = { country: country, id: id, date: date };
        renderHeatmap();  // refresh selection state
        openDayPanel(country, id, date, tier, size);
        showDayArticlesInTicker(country, id, date);
      });
      cell.addEventListener('mouseenter', function(ev) {
        if (!ttip) return;
        var tier = cell.getAttribute('data-tier');
        var size = cell.getAttribute('data-size');
        ttip.style.display = 'block';
        ttip.innerHTML = '<div class="tt-title">' + esc(cell.getAttribute('data-id')) + '</div>'
          + '<div class="tt-meta">' + esc(countryLabel(cell.getAttribute('data-country'))) + ' · ' + esc(fmtDay(cell.getAttribute('data-date'))) + '</div>'
          + '<div class="tt-meta" style="color:' + tierVar(tier) + ';"><b>' + esc(tierLabel(tier)) + '</b> · pic ' + esc(size) + '</div>'
          + '<div class="tt-meta" style="margin-top:3px;">' + esc(T('alertes.click_for_articles', 'Clic = articles du jour')) + '</div>';
        moveTooltip(ev, wrap, ttip);
      });
      cell.addEventListener('mousemove', function(ev) { moveTooltip(ev, wrap, ttip); });
      cell.addEventListener('mouseleave', function() { if (ttip) ttip.style.display = 'none'; });
    });
    svg.querySelectorAll('.heatmap-row-label').forEach(function(lbl) {
      lbl.addEventListener('click', function() {
        openObjectPanel(lbl.getAttribute('data-country'), lbl.getAttribute('data-id'));
      });
    });
  }

  // ─── Ticker : injection d'articles d'un jour ─────────────────
  // Le ticker partagé charge tickerData via shared-ticker.js. On override
  // le contenu visible (track + label) pour montrer les articles cliqués.
  function setTickerContent(items, label) {
    var track = document.getElementById('ticker-track');
    var updatedEl = document.getElementById('ticker-updated');
    if (!track) return;
    if (updatedEl && label) updatedEl.textContent = label;
    if (!Array.isArray(items) || !items.length) {
      track.innerHTML = '<span class="ticker-empty">' + esc(T('alertes.ticker_no_articles', 'Aucun article disponible.')) + '</span>';
      return;
    }
    var payload = items.map(function(item) {
      var media = esc(item.media_id || '');
      var title = esc(item.title || 'Article');
      var url = esc(item.url || '#');
      return '<a class="ticker-item" href="' + url + '" target="_blank" rel="noopener"><span class="ticker-media">' + media + '</span>' + title + '</a>';
    }).join('<span class="ticker-sep">&bull;</span>');
    track.innerHTML = '<div class="ticker-strip">' + payload + '</div><div class="ticker-strip" aria-hidden="true">' + payload + '</div>';
    window.requestAnimationFrame(function() {
      var firstStrip = track.querySelector('.ticker-strip');
      var px = firstStrip ? firstStrip.scrollWidth : 1600;
      var duration = Math.max(35, Math.round(px / 70));
      track.style.setProperty('--ticker-duration', duration + 's');
    });
  }

  function showDayArticlesInTicker(country, id, date) {
    var updatedEl = document.getElementById('ticker-updated');
    var restoreBtn = document.getElementById('ticker-restore');
    if (updatedEl) updatedEl.textContent = T('alertes.ticker_loading', 'Chargement…');
    if (restoreBtn) restoreBtn.classList.add('is-visible');
    loadArticles().then(function(data) {
      var arts = [];
      if (data && data.articles && data.articles[country]) {
        var seenUrls = {};
        Object.keys(data.articles[country]).forEach(function(pk) {
          if (pk.split('_')[0] !== date) return;
          var byObj = data.articles[country][pk];
          if (byObj && byObj[id] && Array.isArray(byObj[id])) {
            byObj[id].forEach(function(a) {
              if (!a || !a.url || seenUrls[a.url]) return;
              seenUrls[a.url] = true;
              arts.push(a);
            });
          }
        });
      }
      var label = esc(id.toUpperCase()) + ' · ' + esc(fmtDay(date));
      setTickerContent(arts, label);
    });
  }

  function restoreTicker() {
    selectedCell = null;
    renderHeatmap();
    var restoreBtn = document.getElementById('ticker-restore');
    if (restoreBtn) restoreBtn.classList.remove('is-visible');
    // Réinitialise le ticker en relançant le script partagé
    var section = document.getElementById('ticker-section');
    if (section) {
      delete section.dataset.tickerInitialized;
      section.classList.remove('ready');
    }
    if (window.__initSharedTicker) {
      window.__initSharedTicker();
    } else {
      // Fallback : reload via fetch
      fetch('./ticker.json?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(function(j) {
          if (j && j.items) {
            var lbl = j.generated_at ? T('ticker.label', 'Les Unes') : T('ticker.label', 'Les Unes');
            setTickerContent(j.items, lbl);
          }
        });
    }
  }

    var body = document.getElementById('panel-body');

    countryEl.textContent = countryLabel(country);

    var headHTML = '<div class="panel-title">' + esc(id) + '</div>'
      + '<div class="panel-period">' + esc(fmtDay(date)) + ' · ' + esc(T('alertes.panel_peak', 'pic')) + ' ' + size.toFixed(1) + '</div>';

    body.innerHTML = headHTML
      + '<div class="panel-section">'
      +   '<div class="panel-section-title">' + esc(T('alertes.panel_articles_section', 'Articles du jour')) + '</div>'

      + '</div>';

        var seen = {};

          if (pk.split('_')[0] !== date) return;
          var byObj = data.articles[country][pk];
          if (byObj && byObj[id] && Array.isArray(byObj[id])) {
            byObj[id].forEach(function(a) {
              if (!a || !a.url || seen[a.url]) return;
              seen[a.url] = true;
              arts.push(a);
            });
          }
        });

      var qC = encodeURIComponent(country);

        +   '<div class="panel-section-title">' + esc(T('alertes.detail_see_in', 'Voir ailleurs')) + '</div>'

  // ─── Side panel — version "objet" ─────────────────────────────
  function openObjectPanel(country, objectId) {
    var allEpisodes = [];
    if (timeseriesData && timeseriesData.graphs && timeseriesData.graphs[country]) {
      var periods = timeseriesData.graphs[country];
      var seen = {};
      Object.keys(periods).forEach(function(pk) {
        var gd = periods[pk];
        if (!gd || !gd.nodes) return;
        gd.nodes.forEach(function(n) {
          if (n.id !== objectId) return;
          if (!n.alert_episode_id || seen[n.alert_episode_id]) return;
          var peak = typeof n.alert_episode_peak === 'number' ? n.alert_episode_peak : null;
          if (peak == null) return;
          var derived = deriveLevel(country, peak);
          if (derived === 'none') return;
          seen[n.alert_episode_id] = true;
          allEpisodes.push({
            key: n.alert_episode_id, tier: derived,
            first_day: n.alert_episode_first_day,
            last_day: n.alert_episode_last_day,
            n_days: n.alert_episode_n_days, peak: peak,
            status: n.alert_episode_status
          });
        });
      });
    }

    var panel = document.getElementById('side-panel');
    var badge = document.getElementById('panel-tier-badge');
    var countryEl = document.getElementById('panel-country');
    var body = document.getElementById('panel-body');
    if (!panel || !body) return;

    var maxTier = allEpisodes.length ? 'eleve' : 'none';
    allEpisodes.forEach(function(e) {
      if (tierRank(e.tier) < tierRank(maxTier)) maxTier = e.tier;
    });
    badge.className = 'panel-tier-badge lvl-' + tierCss(maxTier);
    badge.textContent = maxTier === 'none' ? '—' : tierLabel(maxTier);
    countryEl.textContent = countryLabel(country);

    allEpisodes.sort(function(a, b) { return new Date(b.first_day) - new Date(a.first_day); });
    var anyActive = allEpisodes.some(function(e) { return e.status === 'active'; });

    var maxPeak = 0, totalDays = 0;
    allEpisodes.forEach(function(e) {
      if ((e.peak || 0) > maxPeak) maxPeak = e.peak;
      totalDays += (e.n_days || 0);
    });
    var peakStr = maxPeak > 0 ? fmtPeakWithTier(country, maxPeak) : '—';

    var episodesHTML = allEpisodes.map(function(e) {
      var dateRange = fmtDay(e.first_day) + (e.first_day !== e.last_day ? ' → ' + fmtDay(e.last_day) : '');
      return '<div class="panel-member">'
        + '<span class="panel-member-name"><span class="panel-tier-mini lvl-' + tierCss(e.tier) + '" style="margin-right:6px;">' + esc(tierLabel(e.tier)) + '</span>' + esc(dateRange) + '</span>'
        + '<span class="panel-member-meta">' + e.n_days + 'j · pic ' + (e.peak || 0).toFixed(1) + '</span>'
        + '</div>';
    }).join('');

    var qC = encodeURIComponent(country);
    var qN = encodeURIComponent(objectId);
    var evoUrl = './evolution.html?country=' + qC + '&node=' + qN + '&mode=tracking&gran=week';
    var cstUrl = './constellation.html?country=' + qC + '&node=' + qN;
    var statsUrl = './statistiques.html?pays=' + qC + '&objet=' + qN;

    body.innerHTML =
        '<div class="panel-title">' + esc(objectId) + '</div>'
      + '<div class="panel-period">' + allEpisodes.length + ' ' + esc(T('alertes.episodes_cumul', 'épisode(s)')) + ' · ' + totalDays + ' ' + esc(T('alertes.total_days', 'jours cumulés')) + (anyActive ? ' · <span style="color:rgba(140,255,180,0.95);">' + esc(T('alertes.status_active_label', 'En cours')) + '</span>' : '') + '</div>'
      + '<div class="panel-section">'
      +   '<div class="panel-section-title">' + esc(T('alertes.detail_metrics', 'Métriques')) + '</div>'
      +   '<div class="panel-metrics">'
      +     '<div class="panel-metric"><span class="panel-metric-val">' + esc(peakStr) + '</span><span class="panel-metric-lbl">' + esc(T('alertes.detail_peak_salience', 'Pic saillance')) + '</span></div>'
      +     '<div class="panel-metric"><span class="panel-metric-val">' + allEpisodes.length + '</span><span class="panel-metric-lbl">' + esc(T('alertes.detail_episodes', 'Épisodes')) + '</span></div>'
      +     '<div class="panel-metric"><span class="panel-metric-val">' + totalDays + '</span><span class="panel-metric-lbl">' + esc(T('alertes.detail_total_days', 'Jours cumulés')) + '</span></div>'
      +     '<div class="panel-metric"><span class="panel-metric-val">' + (anyActive ? '✓' : '—') + '</span><span class="panel-metric-lbl">' + esc(T('alertes.detail_active', 'Actif')) + '</span></div>'
      +   '</div>'
      + '</div>'
      + '<div class="panel-section">'
      +   '<div class="panel-section-title">' + esc(T('alertes.detail_history', 'Historique')) + ' (' + allEpisodes.length + ')</div>'
      +   episodesHTML
      + '</div>'
      + '<div class="panel-section">'
      +   '<div class="panel-section-title">' + esc(T('alertes.detail_see_in', 'Voir ailleurs')) + '</div>'
      +   '<div class="panel-links">'
      +     '<a class="panel-link-btn" href="' + esc(evoUrl) + '">' + esc(T('alertes.detail_nav_evolution', 'Évolution')) + ' →</a>'
      +     '<a class="panel-link-btn" href="' + esc(cstUrl) + '">' + esc(T('alertes.detail_nav_constellation', 'Constellation')) + ' →</a>'
      +     '<a class="panel-link-btn" href="' + esc(statsUrl) + '">' + esc(T('alertes.detail_nav_stats', 'Statistiques')) + ' →</a>'
      +   '</div>'
      + '</div>';

    showSidePanel();
  }

  function closeSidePanel() {
    var panel = document.getElementById('side-panel');
    var overlay = document.getElementById('panel-overlay');
    if (panel) {
      panel.classList.remove('is-open');
      panel.setAttribute('aria-hidden', 'true');
    }
    if (overlay) {
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
    }
    if (selectedCell) {
      selectedCell = null;
      renderHeatmap();
    }
  }

  function showSidePanel() {
    var panel = document.getElementById('side-panel');
    var overlay = document.getElementById('panel-overlay');
    if (panel) {
      panel.classList.add('is-open');
      panel.setAttribute('aria-hidden', 'false');
    }
    if (overlay) {
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
    }
  }

  // ─── Render période nav (flèches + label) ─────────────────────
  function renderPeriodNav() {
    var nav = document.getElementById('period-nav');
    var label = document.getElementById('period-nav-label');
    var prev = document.getElementById('period-prev');
    var next = document.getElementById('period-next');
    if (!nav || !label || !prev || !next) return;
    nav.classList.remove('is-hidden');
    var range = getPeriodRange();
    label.textContent = formatPeriodLabel(range);
    prev.disabled = !range.canPrev;
    next.disabled = !range.canNext;
  }

  // ─── Render global ───────────────────────────────────────────
  function render() {
    if (!graphData || !timeseriesData) return;
    renderPeriodNav();
    renderKPIs();
    renderHeatmap();
  }

  // ─── Hooks ───────────────────────────────────────────────────
  // Filtres pays (pills)
  document.querySelectorAll('[data-country]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      filterCountry = btn.getAttribute('data-country');
      document.querySelectorAll('[data-country]').forEach(function(b) {
        var active = b === btn;
        b.classList.toggle('is-active', active);
        b.setAttribute('aria-checked', active ? 'true' : 'false');
      });
      render();
    });
  });
  // Filtres période (pills)
  document.querySelectorAll('[data-gran]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      granularity = btn.getAttribute('data-gran') || 'month';
      periodOffset = 0;
      document.querySelectorAll('[data-gran]').forEach(function(b) {
        var active = b === btn;
        b.classList.toggle('is-active', active);
        b.setAttribute('aria-checked', active ? 'true' : 'false');
      });
      render();
    });
  });
  // Navigation période (flèches)
  var prevBtn = document.getElementById('period-prev');
  var nextBtn = document.getElementById('period-next');
  if (prevBtn) prevBtn.addEventListener('click', function() {
    if (prevBtn.disabled) return;
    periodOffset -= 1;
    render();
  });
  if (nextBtn) nextBtn.addEventListener('click', function() {
    if (nextBtn.disabled) return;
    periodOffset += 1;
    render();
  });
  // Recherche
  var searchInput = document.getElementById('search-input');
  var searchClear = document.getElementById('search-clear');
  if (searchInput) {
    var searchTO;
    searchInput.addEventListener('input', function() {
      var v = searchInput.value.trim().toLowerCase();
      searchInput.classList.toggle('has-value', v.length > 0);
      clearTimeout(searchTO);
      searchTO = setTimeout(function() {
        searchQuery = v;
        renderHeatmap();
      }, 140);
    });
  }
  if (searchClear) {
    searchClear.addEventListener('click', function() {
      searchInput.value = '';
      searchInput.classList.remove('has-value');
      searchQuery = '';
      renderHeatmap();
      searchInput.focus();
    });
  }
  // Ticker restore
  var restoreBtn = document.getElementById('ticker-restore');
  if (restoreBtn) restoreBtn.addEventListener('click', restoreTicker);
  // Side panel
  document.getElementById('panel-close').addEventListener('click', closeSidePanel);
  document.getElementById('panel-overlay').addEventListener('click', closeSidePanel);
  document.addEventListener('keydown', function(ev) {
    if (ev.key === 'Escape') closeSidePanel();
  });
  document.addEventListener('i18n:applied', function() {
    if (graphData && timeseriesData) render();
  });
  // Resize
  var resizeTO;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTO);
    resizeTO = setTimeout(function() { if (graphData && timeseriesData) renderHeatmap(); }, 120);
  });

  loadData();
})();
</script>
</body>
</html>
